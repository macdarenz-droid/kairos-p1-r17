name: P7.8R1 Dependency Lock Repair Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-p7-8r1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use locked Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Extract authoritative P7.8 PASS base
        run: |
          rm -rf _p78r1
          mkdir _p78r1
          unzip -q KAIROS_P7_8_ACTIVATION_AUTHORITY_SOURCE_CANDIDATE_2026-09-01.zip -d _p78r1
          test -f _p78r1/kairos_p76/package.json
          test -f _p78r1/kairos_p76/package-lock.json

      - name: Repair package lock only
        working-directory: _p78r1/kairos_p76
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.packages[''].dependencies?.dexie !== p.dependencies.dexie) process.exit(1); if(l.packages[''].devDependencies?.['fake-indexeddb'] !== p.devDependencies['fake-indexeddb']) process.exit(1);"

      - name: Prove clean deterministic install
        working-directory: _p78r1/kairos_p76
        run: npm ci

      - name: Build
        working-directory: _p78r1/kairos_p76
        run: npm run build

      - name: Full P1 regression
        working-directory: _p78r1/kairos_p76
        run: npm run release:p1

      - name: P2 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p2:design-system
          npm run verify:p2:primitives
          npm run verify:p2:accessibility

      - name: P3 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p3:theme-engine
          npm run verify:p3:active-themes
          npm run verify:p3:theme-canary
          npm run verify:p3:theme-preference
          npm run verify:p3:chart-theme-adapter

      - name: P4 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p4:manifest
          npm run verify:p4:service-worker
          npm run verify:p4:storage-durability

      - name: P5 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p5:database-kernel
          npm run verify:p5:repositories
          npm run verify:p5:migrations
          npm run verify:p5:integrity
          npm run verify:p5:transactions

      - name: P6 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p6:backup-envelope
          npm run verify:p6:backup-snapshot
          npm run verify:p6:restore-preflight
          npm run verify:p6:restore-replacement
          npm run verify:p6:restore-verification

      - name: P7 regression
        working-directory: _p78r1/kairos_p76
        run: |
          npm run verify:p7:activation-contract
          npm run verify:p7:activation-persistence
          npm run verify:p7:remote-activation
          npm run verify:p7:receipt-proof
          npm run verify:p7:activation-coordinator
          npm run verify:p7:activation-gate
          npm run verify:p7:activation-deployment
          npm run verify:p7:activation-backend-source

      - name: Confirm patch scope is lockfile only
        run: |
          unzip -p KAIROS_P7_8_ACTIVATION_AUTHORITY_SOURCE_CANDIDATE_2026-09-01.zip kairos_p76/package.json > /tmp/original-package.json
          cmp /tmp/original-package.json _p78r1/kairos_p76/package.json

      - name: Package P7.8R1 candidate
        run: |
          rm -rf _release
          mkdir _release
          cp -a _p78r1/kairos_p76 _release/kairos_p76
          rm -rf _release/kairos_p76/node_modules _release/kairos_p76/dist
          cd _release
          zip -qr ../KAIROS_P7_8R1_DEPENDENCY_LOCK_FIX_CANDIDATE_2026-09-01.zip kairos_p76
          cd ..
          sha256sum KAIROS_P7_8R1_DEPENDENCY_LOCK_FIX_CANDIDATE_2026-09-01.zip > KAIROS_P7_8R1_SHA256.txt

      - name: Upload P7.8R1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: P7_8R1_CANDIDATE
          path: |
            KAIROS_P7_8R1_DEPENDENCY_LOCK_FIX_CANDIDATE_2026-09-01.zip
            KAIROS_P7_8R1_SHA256.txt
          if-no-files-found: error

      - name: Upload repaired package lock
        uses: actions/upload-artifact@v4
        with:
          name: P7_8R1_PACKAGE_LOCK
          path: _p78r1/kairos_p76/package-lock.json
          if-no-files-found: error
