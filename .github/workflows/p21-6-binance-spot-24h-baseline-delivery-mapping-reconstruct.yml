name: Kairos P21.6 Binance Spot 24h Baseline Delivery Mapping Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-6-binance-spot-24h-baseline-delivery-mapping-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_5_BINANCE_SPOT_24H_SUMMARY_FACT_MAPPING_FOUNDATION_CANDIDATE_2026-09-07.zip
      OUT_ZIP: KAIROS_P21_6_BINANCE_SPOT_24H_BASELINE_DELIVERY_MAPPING_FOUNDATION_CANDIDATE_2026-09-07.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.6 from canonical P21.5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hSummaryFact.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryBaselineAcquisitionSemantics.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryDeliverySemantics.ts"
          test -f "$ROOT/src/services/market-data/index.ts"

          cat > "$ROOT/src/services/market-data/providers/binance/binanceSpot24hBaselineDelivery.ts" <<'TS'
          import { validateLiveMarketSummaryBaselineSuccess } from '../../liveMarketSummaryBaselineAcquisitionSemantics';
          import type {
            LiveMarketSummaryCompleteForScopeDelivery,
            MarketDataInstrument,
          } from '../../marketDataTypes';
          import { mapBinanceSpot24hSummaryFact } from './binanceSpot24hSummaryFact';

          export type BinanceSpot24hBaselineDeliveryResult =
            | { readonly ok: true; readonly delivery: LiveMarketSummaryCompleteForScopeDelivery }
            | {
                readonly ok: false;
                readonly reason:
                  | 'payload-invalid'
                  | 'fact-mapping-failed'
                  | 'delivery-invalid'
                  | 'requested-scope-mismatch';
              };

          function normalizeTickerEntries(payload: unknown): readonly unknown[] | null {
            if (Array.isArray(payload)) return payload;
            if (typeof payload === 'object' && payload !== null) return [payload];
            return null;
          }

          /**
           * Purely composes a decoded Binance Spot 24h ticker payload into a canonical
           * P21.3 complete-for-scope baseline for an explicit caller-owned scope.
           * Query shape, batching and transport remain outside this mapper.
           */
          export function mapBinanceSpot24hBaselineDelivery(
            scope: readonly MarketDataInstrument[],
            payload: unknown,
            observedAt: string,
          ): BinanceSpot24hBaselineDeliveryResult {
            const entries = normalizeTickerEntries(payload);
            if (entries === null) return { ok: false, reason: 'payload-invalid' };

            const facts = [];
            for (const entry of entries) {
              const mapped = mapBinanceSpot24hSummaryFact(entry, observedAt);
              if (!mapped.ok) return { ok: false, reason: 'fact-mapping-failed' };
              facts.push(mapped.fact);
            }

            const delivery: LiveMarketSummaryCompleteForScopeDelivery = {
              completeness: 'complete-for-scope',
              scope,
              facts,
            };
            const validated = validateLiveMarketSummaryBaselineSuccess(scope, delivery);
            if (!validated.ok) return { ok: false, reason: validated.reason };
            return { ok: true, delivery: validated.delivery };
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          anchor="export * from './providers/binance/binanceSpot24hSummaryFact';\n"
          addition="export * from './providers/binance/binanceSpot24hBaselineDelivery';\n"
          if anchor not in s: raise SystemExit('P21.5 Binance summary fact export anchor not found')
          p.write_text(s.replace(anchor, anchor+addition, 1))
          PY

          cat > "$ROOT/tests/binance-spot-24h-baseline-delivery.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import { mapBinanceSpot24hBaselineDelivery } from '../src/services/market-data';

          const observedAt = '2023-01-01T00:03:02.200Z';
          const btc = {
            symbol: 'BTCUSDT',
            openPrice: '62000.00000000',
            highPrice: '65000.00000000',
            lowPrice: '61000.00000000',
            lastPrice: '64000.50000000',
            volume: '1234.50000000',
            quoteVolume: '78000000.25000000',
            closeTime: 1672515782136,
          };
          const eth = {
            symbol: 'ETHUSDT',
            openPrice: '2400.00',
            highPrice: '2600.00',
            lowPrice: '2300.00',
            lastPrice: '2500.10',
            volume: '5000.00',
            quoteVolume: '12500000.00',
            closeTime: 1672515782136,
          };

          describe('P21.6 Binance Spot 24h baseline delivery mapping foundation', () => {
            it('composes one decoded entry into a complete baseline for an explicit one-instrument scope', () => {
              const scope = [{ venue: 'binance-spot', symbol: 'BTCUSDT' }] as const;
              const result = mapBinanceSpot24hBaselineDelivery(scope, btc, observedAt);
              expect(result.ok).toBe(true);
              if (result.ok) {
                expect(result.delivery.completeness).toBe('complete-for-scope');
                expect(result.delivery.scope).toEqual(scope);
                expect(result.delivery.facts.map((fact) => fact.instrument.symbol)).toEqual(['BTCUSDT']);
              }
            });

            it('composes an entry array through the P21.5 mapper without making response order authoritative', () => {
              const scope = [
                { venue: 'binance-spot', symbol: 'BTCUSDT' },
                { venue: 'binance-spot', symbol: 'ETHUSDT' },
              ] as const;
              const result = mapBinanceSpot24hBaselineDelivery(scope, [eth, btc], observedAt);
              expect(result.ok).toBe(true);
              if (result.ok) {
                expect(new Set(result.delivery.facts.map((fact) => fact.instrument.symbol)))
                  .toEqual(new Set(['BTCUSDT', 'ETHUSDT']));
              }
            });

            it('rejects invalid decoded payload shapes and invalid provider entries', () => {
              const scope = [{ venue: 'binance-spot', symbol: 'BTCUSDT' }] as const;
              expect(mapBinanceSpot24hBaselineDelivery(scope, 'not-a-ticker', observedAt))
                .toEqual({ ok: false, reason: 'payload-invalid' });
              expect(mapBinanceSpot24hBaselineDelivery(scope, { ...btc, lastPrice: '0' }, observedAt))
                .toEqual({ ok: false, reason: 'fact-mapping-failed' });
            });

            it('rejects missing, duplicate, and out-of-scope facts instead of inferring completeness', () => {
              const two = [
                { venue: 'binance-spot', symbol: 'BTCUSDT' },
                { venue: 'binance-spot', symbol: 'ETHUSDT' },
              ] as const;
              expect(mapBinanceSpot24hBaselineDelivery(two, [btc], observedAt))
                .toEqual({ ok: false, reason: 'delivery-invalid' });
              expect(mapBinanceSpot24hBaselineDelivery(two, [btc, btc], observedAt))
                .toEqual({ ok: false, reason: 'delivery-invalid' });
              const btcOnly = [{ venue: 'binance-spot', symbol: 'BTCUSDT' }] as const;
              expect(mapBinanceSpot24hBaselineDelivery(btcOnly, [btc, eth], observedAt))
                .toEqual({ ok: false, reason: 'delivery-invalid' });
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_6_BINANCE_SPOT_24H_BASELINE_DELIVERY_MAPPING_FOUNDATION_REPORT_2026-09-07.md" <<'MD'
          # KAIROS P21.6 — Binance Spot 24h Baseline Delivery Mapping Foundation

          ## Authority
          Base: canonical P21.5 Binance Spot 24h Summary Fact Mapping Foundation, `Kairos Controlled Roadmap Gate` #290 / run `34074736949`.

          ## Responsibility
          P21.4 requires an explicit caller-provided scope and a validated P21.3 `complete-for-scope` delivery. P21.5 maps one decoded Binance Spot 24h ticker entry into one canonical P21.2 fact. P21.6 adds only the missing pure provider-composition seam: explicit caller scope + decoded single-entry or entry-array payload + caller-owned `observedAt` -> P21.5 per-entry mapping -> P21.3 complete-for-scope composition -> P21.4 success validation.

          Invalid payload shapes, invalid mapped entries, duplicate facts, out-of-scope facts or missing requested-scope facts reject rather than infer completeness. Provider response order is not promoted into ranking or universe truth.

          ## Explicit non-scope
          - No HTTP/fetch/browser transport, REST host/path/query construction, endpoint selection, or `symbol` versus `symbols` query policy.
          - No symbol batching, request-weight, rate-limit, credential, retry, polling, subscription or reconnect policy.
          - No concrete P21.4 acquisition-port adapter orchestration and no market-universe selection/ranking.
          - No accumulator/state/order/freshness/reset ownership.
          - No Bubble Map sizing/color/grouping/filtering/geometry/interactions or Home wiring.
          - No persistence, journal/Your-Trades semantics, direct IndexedDB UI access, or dashboard transition motion.
          MD

          cat > "$ROOT/scripts/verify-p21-6-binance-spot-24h-baseline-delivery-mapping-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const mapper = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hBaselineDelivery.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_6_BINANCE_SPOT_24H_BASELINE_DELIVERY_MAPPING_FOUNDATION_REPORT_2026-09-07.md', import.meta.url), 'utf8');
          for (const token of [
            'export type BinanceSpot24hBaselineDeliveryResult =',
            'export function mapBinanceSpot24hBaselineDelivery(',
            'mapBinanceSpot24hSummaryFact(entry, observedAt)',
            "completeness: 'complete-for-scope'",
            'validateLiveMarketSummaryBaselineSuccess(scope, delivery)',
          ]) if (!mapper.includes(token)) throw new Error(`P21.6 mapping evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpot24hBaselineDelivery';")) throw new Error('P21.6 mapper barrel export missing');
          for (const forbidden of ['fetch(', 'WebSocket', 'EventSource', 'indexedDB', '/api/v3/', 'acquireBaseline(', 'createChart(', 'bubbleSize', 'marketCap', 'URLSearchParams']) {
            if (mapper.includes(forbidden)) throw new Error(`P21.6 broadened into forbidden implementation scope: ${forbidden}`);
          }
          for (const token of ['# KAIROS P21.6 — Binance Spot 24h Baseline Delivery Mapping Foundation', 'No HTTP/fetch/browser transport', 'No symbol batching', 'No concrete P21.4 acquisition-port adapter', 'No Bubble Map sizing', 'No persistence']) {
            if (!report.includes(token)) throw new Error(`P21.6 report evidence missing: ${token}`);
          }
          console.log('P21.6 Binance Spot 24h baseline delivery mapping verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:6-binance-spot-24h-baseline-delivery-mapping-foundation']='node scripts/verify-p21-6-binance-spot-24h-baseline-delivery-mapping-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_6_BINANCE_SPOT_24H_BASELINE_DELIVERY_MAPPING_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-6-binance-spot-24h-baseline-delivery-mapping-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpot24hBaselineDelivery.ts',
            'tests/binance-spot-24h-baseline-delivery.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.6 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:6-binance-spot-24h-baseline-delivery-mapping-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .p21package
          mkdir .p21package
          cp -a "$ROOT" .p21package/kairos_p76
          rm -f "$OUT_ZIP"
          (cd .p21package && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | head -n1 | cut -d/ -f1)" = "kairos_p76"
          git config user.name 'kairos-p21-6-helper'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git diff --cached --quiet && exit 0
          git commit -m 'Package P21.6 Binance Spot 24h baseline delivery mapping candidate'
          git push origin HEAD:main
