name: P2.3 Accessibility Interaction Foundation Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-p2-3:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract P2.3 candidate
        run: |
          unzip -o KAIROS_P2_3_ACCESSIBILITY_INTERACTION_FOUNDATION_CANDIDATE_2026-08-31.zip -d _extracted
          SRC_DIR=$(find _extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n1)
          test -n "$SRC_DIR"
          shopt -s dotglob
          cp -r "$SRC_DIR"/* .
          rm -rf _extracted

      - name: Use locked Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Re-run authoritative P1 regression gate
        run: npm run release:p1

      - name: Re-run P2.1 design-system contract
        run: npm run verify:p2:design-system

      - name: Re-run P2.2 primitive typography contract
        run: npm run verify:p2:primitives

      - name: Run P2.3 accessibility interaction contract
        run: npm run verify:p2:accessibility

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P2_3_REGRESSION_EVIDENCE
          path: P1_GATE_EVIDENCE.json

      - name: Upload verified package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P2_3_PACKAGE_LOCK
          path: package-lock.json
