name: P1 Project Shell Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract R18 candidate
        run: |
          unzip -o KAIROS_P1_PROJECT_SHELL_CANDIDATE_R18_2026-08-31.zip -d _extracted
          SRC_DIR=$(find _extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n1)
          shopt -s dotglob
          cp -r "$SRC_DIR"/* .
          rm -rf _extracted

      - name: Use the locked P1 Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Run the authoritative P1 gate
        run: npm run release:p1

      - name: Upload P1 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1_GATE_EVIDENCE
          path: P1_GATE_EVIDENCE.json

      - name: Upload generated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1_PACKAGE_LOCK
          path: package-lock.json
