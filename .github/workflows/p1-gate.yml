name: P1 Project Shell Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract R17 candidate
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d _extracted
            SRC_DIR=$(find _extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n1)
            shopt -s dotglob
            cp -r "$SRC_DIR"/* .
            rm -rf _extracted "$ZIP_FILE"
          fi

      - name: Use the locked P1 Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Run the authoritative P1 gate
        run: npm run release:p1
