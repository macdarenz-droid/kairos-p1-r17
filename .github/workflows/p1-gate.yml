name: P7.8 Activation Authority Source Foundation Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-p7-8:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract P7.8 candidate
        run: |
          unzip -o KAIROS_P7_8_ACTIVATION_AUTHORITY_SOURCE_CANDIDATE_2026-09-01.zip -d _extracted
          SRC_DIR=$(find _extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n1)
          test -n "$SRC_DIR"
          shopt -s dotglob
          cp -r "$SRC_DIR"/* .
          rm -rf _extracted

      - name: Use locked Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Re-run authoritative P1 regression gate
        run: npm run release:p1

      - name: Re-run P2.1 design-system contract
        run: npm run verify:p2:design-system

      - name: Re-run P2.2 primitive typography contract
        run: npm run verify:p2:primitives

      - name: Re-run P2.3 accessibility interaction contract
        run: npm run verify:p2:accessibility

      - name: Re-run P3.1 theme-engine contract
        run: npm run verify:p3:theme-engine

      - name: Re-run P3.2 active-theme registry contract
        run: npm run verify:p3:active-themes

      - name: Re-run P3.3 active-theme canary contract
        run: npm run verify:p3:theme-canary

      - name: Re-run P3.4 persistent-theme preference contract
        run: npm run verify:p3:theme-preference

      - name: Re-run P3.5 chart-theme adapter contract
        run: npm run verify:p3:chart-theme-adapter

      - name: Re-run P4.1 manifest install-identity contract
        run: npm run verify:p4:manifest

      - name: Re-run P4.2 service-worker app-shell contract
        run: npm run verify:p4:service-worker

      - name: Re-run P4.3 storage-durability contract
        run: npm run verify:p4:storage-durability

      - name: Re-run P5.1 database-kernel contract
        run: npm run verify:p5:database-kernel

      - name: Re-run P5.2 repository-ownership contract
        run: npm run verify:p5:repositories

      - name: Re-run P5.3 migration-harness contract
        run: npm run verify:p5:migrations

      - name: Re-run P5.4 database-integrity contract
        run: npm run verify:p5:integrity

      - name: Re-run P5.5 transaction-foundation contract
        run: npm run verify:p5:transactions

      - name: Re-run P6.1 backup-envelope contract
        run: npm run verify:p6:backup-envelope

      - name: Re-run P6.2 database-snapshot contract
        run: npm run verify:p6:backup-snapshot

      - name: Re-run P6.3 restore-preflight recovery contract
        run: npm run verify:p6:restore-preflight

      - name: Re-run P6.4 transactional-restore contract
        run: npm run verify:p6:restore-replacement

      - name: Re-run P6.5 restore-verification contract
        run: npm run verify:p6:restore-verification

      - name: Re-run P7.1 activation-contract contract
        run: npm run verify:p7:activation-contract

      - name: Re-run P7.2 activation-persistence contract
        run: npm run verify:p7:activation-persistence

      - name: Re-run P7.3 remote-activation adapter contract
        run: npm run verify:p7:remote-activation

      - name: Re-run P7.4 activation-receipt proof contract
        run: npm run verify:p7:receipt-proof

      - name: Re-run P7.5 activation-coordinator contract
        run: npm run verify:p7:activation-coordinator

      - name: Re-run P7.6 activation-gate contract
        run: npm run verify:p7:activation-gate

      - name: Re-run P7.7 activation-deployment contract
        run: npm run verify:p7:activation-deployment

      - name: Run P7.8 activation-authority source contract
        run: npm run verify:p7:activation-backend-source

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P7_8_REGRESSION_EVIDENCE
          path: P1_GATE_EVIDENCE.json
          if-no-files-found: warn

      - name: Upload verified package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P7_8_PACKAGE_LOCK
          path: package-lock.json
          if-no-files-found: warn
