name: P3.5 Chart Theme Adapter Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-p3-5:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract P3.5 candidate
        run: |
          unzip -o KAIROS_P3_5_CHART_THEME_ADAPTER_CANDIDATE_2026-08-31.zip -d _extracted
          SRC_DIR=$(find _extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n1)
          test -n "$SRC_DIR"
          shopt -s dotglob
          cp -r "$SRC_DIR"/* .
          rm -rf _extracted

      - name: Use locked Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Re-run authoritative P1 regression gate
        run: npm run release:p1

      - name: Re-run P2.1 design-system contract
        run: npm run verify:p2:design-system

      - name: Re-run P2.2 primitive typography contract
        run: npm run verify:p2:primitives

      - name: Re-run P2.3 accessibility interaction contract
        run: npm run verify:p2:accessibility

      - name: Re-run P3.1 theme-engine contract
        run: npm run verify:p3:theme-engine

      - name: Re-run P3.2 active-theme registry contract
        run: npm run verify:p3:active-themes

      - name: Re-run P3.3 active-theme canary contract
        run: npm run verify:p3:theme-canary

      - name: Re-run P3.4 persistent-theme preference contract
        run: npm run verify:p3:theme-preference

      - name: Run P3.5 chart-theme adapter contract
        run: npm run verify:p3:chart-theme-adapter

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3_5_REGRESSION_EVIDENCE
          path: P1_GATE_EVIDENCE.json
          if-no-files-found: warn

      - name: Upload verified package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3_5_PACKAGE_LOCK
          path: package-lock.json
          if-no-files-found: warn
