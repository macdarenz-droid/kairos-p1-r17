name: Kairos P20.1 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-1-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P20.1 from canonical P19.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20base .p20candidate
          mkdir .p20base .p20candidate
          unzip -q "$BASE_ZIP" -d .p20base
          cp -a .p20base/. .p20candidate/
          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/riskRewardChartPlacementProjection.ts"
          test -f "$ROOT/src/application/risk-reward/riskRewardAnalysisContract.ts"
          test -f "$ROOT/src/features/chart/chartDrawingContract.ts"
          test -f "$ROOT/src/features/chart/chartRenderContract.ts"

          cat > "$ROOT/src/app/savedAnalysisContract.ts" <<'TS'
          import type { RiskRewardAnalysis } from '../application/risk-reward';
          import type { ChartDrawing, ChartMarketReference } from '../features/chart';
          import type { RiskRewardChartTimeExtent } from './riskRewardChartPlacementProjection';

          export type SavedAnalysisId = string;

          export interface SavedRiskRewardAnalysis {
            readonly analysis: RiskRewardAnalysis;
            readonly extent: RiskRewardChartTimeExtent;
          }

          export interface SavedAnalysis {
            readonly id: SavedAnalysisId;
            readonly market: ChartMarketReference;
            readonly drawings: readonly ChartDrawing[];
            readonly riskRewards: readonly SavedRiskRewardAnalysis[];
          }

          export function defineSavedAnalysis(analysis: SavedAnalysis): SavedAnalysis {
            return analysis;
          }
          TS

          cat > "$ROOT/src/app/savedAnalysisIdentity.ts" <<'TS'
          import type { SavedAnalysisId } from './savedAnalysisContract';

          /**
           * P20.1 Saved Analysis identity owner.
           *
           * This boundary is the sole allocator for fresh SavedAnalysisId values.
           * It uses the same platform UUID mechanism already established for other
           * stable Kairos identities while remaining independent of drawing and
           * Risk/Reward identities.
           */
          export function createSavedAnalysisId(): SavedAnalysisId {
            return crypto.randomUUID();
          }
          TS

          cat > "$ROOT/scripts/verify-p20-1-saved-analysis-contract-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const contract = readFileSync(new URL('../src/app/savedAnalysisContract.ts', import.meta.url), 'utf8');
          const identity = readFileSync(new URL('../src/app/savedAnalysisIdentity.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_REPORT_2026-09-06.md', import.meta.url), 'utf8');

          for (const token of [
            "import type { RiskRewardAnalysis } from '../application/risk-reward'",
            "import type { ChartDrawing, ChartMarketReference } from '../features/chart'",
            "import type { RiskRewardChartTimeExtent } from './riskRewardChartPlacementProjection'",
            'export type SavedAnalysisId = string',
            'readonly analysis: RiskRewardAnalysis',
            'readonly extent: RiskRewardChartTimeExtent',
            'readonly market: ChartMarketReference',
            'readonly drawings: readonly ChartDrawing[]',
            'readonly riskRewards: readonly SavedRiskRewardAnalysis[]',
          ]) {
            if (!contract.includes(token)) throw new Error(`P20.1 Saved Analysis contract evidence missing: ${token}`);
          }

          for (const token of [
            'export function createSavedAnalysisId()',
            'return crypto.randomUUID()',
          ]) {
            if (!identity.includes(token)) throw new Error(`P20.1 Saved Analysis identity evidence missing: ${token}`);
          }

          for (const forbidden of [
            'timeframe:',
            'tradeId:',
            'createdAt:',
            'updatedAt:',
            'pixel',
            'LightweightCharts',
            'KairosDatabase',
          ]) {
            if (contract.includes(forbidden)) throw new Error(`P20.1 contract contains forbidden unowned field/dependency: ${forbidden}`);
          }

          for (const token of [
            '# KAIROS P20.1 — Saved Analysis Contract Foundation',
            'P19.7 Risk/Reward Tool System Closure',
            'contract-only',
            'empty drawing and Risk/Reward collections remain representable',
            'No database schema, migration, repository, transaction, backup/restore, UI, provider, or pixel work',
          ]) {
            if (!report.includes(token)) throw new Error(`P20.1 report evidence missing: ${token}`);
          }

          console.log('P20.1 Saved Analysis contract foundation verification passed.');
          JS

          cat > "$ROOT/KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P20.1 — Saved Analysis Contract Foundation

          ## Authority
          Base: canonical P19.7 Risk/Reward Tool System Closure, `Kairos Controlled Roadmap Gate` run #280 / `34021672747`.

          ## Result
          P20.1 establishes only the provider-neutral Saved Analysis aggregate contract and its independent stable identity allocator. The contract composes existing owners instead of copying them: P17 `ChartMarketReference`, P18 committed `ChartDrawing` snapshots, P19 `RiskRewardAnalysis`, and the P19.5 logical `RiskRewardChartTimeExtent`.

          The aggregate is contract-only. Its readonly drawing and Risk/Reward arrays intentionally preserve the existing ability for either collection to be empty; empty drawing and Risk/Reward collections remain representable without inventing additional business rules.

          ## Ownership
          P20 owns only the Saved Analysis aggregate identity/composition boundary introduced here. P17 retains market-reference truth. P18 retains drawing identities, logical anchors, committed drawing behavior, provider machinery, interaction, and presentation. P19 retains Risk/Reward semantics and logical placement. Derived P19 style/object projections remain derived and are not duplicated as Saved Analysis truth.

          ## Non-scope
          No database schema, migration, repository, transaction, backup/restore, UI, provider, or pixel work. No timeframe, display-name, trade relation, creation/update timestamp, persistence index, renderer state, semantic-token output, or provider resource is introduced.

          ## Next dependency boundary
          Later P20 persistence work must consume this contract and evolve the established persistence + full backup/restore system coherently. This patch does not preselect that storage shape.

          ## Canonical requirement
          This contract becomes authoritative only after the exact P20.1 candidate receives a full `Kairos Controlled Roadmap Gate` PASS with canonical artifacts.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p20candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p20:1-saved-analysis-contract-foundation']='node scripts/verify-p20-1-saved-analysis-contract-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p20base/kairos_p76'))):p.read_bytes() for p in Path('.p20base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p20candidate/kairos_p76'))):p.read_bytes() for p in Path('.p20candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p20-1-saved-analysis-contract-foundation.mjs',
            'src/app/savedAnalysisContract.ts',
            'src/app/savedAnalysisIdentity.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P20.1 before packaging
        working-directory: .p20candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run typecheck
          npm run build
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p19:6-risk-reward-chart-logical-object-projection
          npm run verify:p19:5-risk-reward-chart-logical-placement-projection
          npm run verify:p19:4-risk-reward-chart-semantic-style-projection
          npm run verify:p19:3-risk-reward-chart-composition-semantic-contract
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1
          npx vitest run

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p20base/kairos_p76'))):p.read_bytes() for p in Path('.p20base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p20candidate/kairos_p76'))):p.read_bytes() for p in Path('.p20candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p20-1-saved-analysis-contract-foundation.mjs',
            'src/app/savedAnalysisContract.ts',
            'src/app/savedAnalysisIdentity.ts',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p20candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P20.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.1 Saved Analysis contract foundation candidate'
          git push
