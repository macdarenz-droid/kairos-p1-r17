name: Kairos P21.15 Binance Spot 24h Browser Public REST Baseline Acquisition Binding Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_14_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_CONNECTOR_FOUNDATION_CANDIDATE_2026-09-07.zip
      OUT_ZIP: KAIROS_P21_15_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-07.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.15 from canonical P21.14
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          BINDING="$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/LiveMarketSummaryBaselineAcquisitionPort.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineAcquisitionAdapter.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineConnector.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotBrowserPublicTradeSubscription.ts"
          test -f "$INDEX"

          cat > "$BINDING" <<'TS'
          import type { LiveMarketSummaryBaselineAcquisitionPort } from '../../LiveMarketSummaryBaselineAcquisitionPort';
          import {
            createBinanceSpot24hPublicRestBaselineAcquisitionPort,
            type BinanceSpot24hPublicRestBaselineObservedAtSource,
          } from './binanceSpot24hPublicRestBaselineAcquisitionAdapter';
          import {
            connectBinanceSpot24hBrowserPublicRestBaselineRequest,
          } from './binanceSpot24hBrowserPublicRestBaselineConnector';

          /**
           * Browser-ready binding for the released P21.13 acquisition adapter and
           * P21.14 browser connector. Observation time stays caller-owned so this
           * binding does not become a clock, freshness, scheduling, or state owner.
           */
          export function createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
          ): LiveMarketSummaryBaselineAcquisitionPort {
            return createBinanceSpot24hPublicRestBaselineAcquisitionPort(
              connectBinanceSpot24hBrowserPublicRestBaselineRequest,
              readObservedAt,
            );
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding';\n"
          if line not in s:
              anchor="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineConnector';\n"
              if anchor not in s: raise SystemExit('P21.14 browser connector export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/binance-spot-24h-browser-public-rest-baseline-acquisition-binding.test.ts" <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import {
            createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort,
          } from '../src/services/market-data';

          const originalFetch = globalThis.fetch;
          const scope = [{ venue: 'binance-spot', symbol: 'BTCUSDT' }] as const;
          const observedAt = '2026-09-07T12:16:00.000Z';
          const payload = JSON.stringify({
            symbol: 'BTCUSDT', openPrice: '62000', highPrice: '65000', lowPrice: '61000',
            lastPrice: '64000', volume: '1234', quoteVolume: '78000000', closeTime: 1770000000000,
          });

          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.restoreAllMocks();
          });

          describe('P21.15 Binance Spot browser public REST baseline acquisition binding foundation', () => {
            it('binds released P21.13 acquisition to released P21.14 browser transport without new ownership', async () => {
              const text = vi.fn(async () => payload);
              const fetchMock = vi.fn(async () => ({ text })) as unknown as typeof fetch;
              globalThis.fetch = fetchMock;
              const readObservedAt = vi.fn(() => observedAt);
              const port = createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt);

              const result = await port.acquireBaseline(scope);

              expect(result.ok).toBe(true);
              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(text).toHaveBeenCalledTimes(1);
              expect(readObservedAt).toHaveBeenCalledTimes(1);
              if (result.ok) {
                expect(result.delivery.scope).toEqual(scope);
                expect(result.delivery.completeness).toBe('complete-for-scope');
                expect(result.delivery.facts[0]?.observedAt).toBe(observedAt);
              }
            });

            it('preserves caller-owned cancellation through the bound P21.13/P21.14 chain', async () => {
              const controller = new AbortController();
              const fetchMock = vi.fn(async () => ({ text: async () => payload })) as unknown as typeof fetch;
              globalThis.fetch = fetchMock;
              const port = createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(() => observedAt);

              await expect(port.acquireBaseline(scope, { signal: controller.signal })).resolves.toMatchObject({ ok: true });
              expect(fetchMock).toHaveBeenCalledTimes(1);
              const [, init] = fetchMock.mock.calls[0] ?? [];
              expect(init?.signal).toBe(controller.signal);
            });

            it('keeps existing P21.13 acquisition-failed mapping for native browser rejection', async () => {
              globalThis.fetch = vi.fn(async () => { throw new Error('native-fetch-failure'); }) as unknown as typeof fetch;
              const port = createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(() => observedAt);
              await expect(port.acquireBaseline(scope)).resolves.toEqual({ ok: false, reason: 'acquisition-failed' });
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_15_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-07.md" <<'MD'
          # KAIROS P21.15 — Binance Spot 24h Browser Public REST Baseline Acquisition Binding Foundation

          ## Authority
          Base: canonical P21.14 browser public REST baseline connector, canonical gate #299 / run `34118010684`.

          ## Source-proven responsibility
          Canonical P21.13 implements the provider-neutral P21.4 baseline acquisition port but deliberately receives its P21.8 connector from the caller. Canonical P21.14 supplies the missing concrete browser P21.8 connector but deliberately does not compose or own acquisition. Existing P16.16 demonstrates the released project pattern for a narrow browser-ready provider entry point that composes an already-released concrete browser connector with an already-released provider application seam while keeping clocks and lifecycle policy injected. Therefore the smallest dependency-safe next responsibility is one browser-ready P21.13/P21.14 binding, with observation time still caller-owned.

          ## Contract
          - Export one factory returning the existing `LiveMarketSummaryBaselineAcquisitionPort`.
          - Compose only released `createBinanceSpot24hPublicRestBaselineAcquisitionPort` with released `connectBinanceSpot24hBrowserPublicRestBaselineRequest`.
          - Keep `readObservedAt` mandatory and externally supplied; this binding reads no clock itself.
          - Preserve P21.4 caller cancellation and all P21.13/P21.14 result/rejection behavior unchanged.
          - Add no second request, transport, decode, validation, completeness, state, or UI owner.

          ## Explicit non-scope
          - No endpoint/path/query/symbol-selection policy and no additional fetch/XHR/WebSocket transport.
          - No HTTP status/header interpretation, response taxonomy, retry/backoff/throttle/rate-limit/request-weight, credentials/auth, timeout or AbortController policy.
          - No `Date.now`, `new Date`, observation-time acquisition, freshness TTL, polling, reconnect, scheduling or randomness.
          - No JSON/provider payload decode, ticker validation, completeness or acquisition validation changes.
          - No universe/ranking/batching/chunking, market state accumulator, persistence or direct IndexedDB access.
          - No Live Crypto Bubble Map sizing/color/grouping/filtering/geometry/Home wiring.
          - No Your Trades Bubble Map, journal reads, Saved Analysis or dashboard transitions.
          MD

          cat > "$ROOT/scripts/verify-p21-15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const binding = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_15_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-07.md', import.meta.url), 'utf8');
          for (const token of [
            'createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(',
            'LiveMarketSummaryBaselineAcquisitionPort',
            'createBinanceSpot24hPublicRestBaselineAcquisitionPort(',
            'connectBinanceSpot24hBrowserPublicRestBaselineRequest,',
            'readObservedAt,',
          ]) if (!binding.includes(token)) throw new Error(`P21.15 binding evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding';")) throw new Error('P21.15 binding export missing');
          for (const forbidden of [
            'globalThis.fetch(', 'fetch(', 'XMLHttpRequest', 'WebSocket(', 'Response(', 'JSON.parse(',
            'Date.now(', 'new Date(', 'new AbortController(', 'AbortSignal.any(', 'AbortSignal.timeout(',
            'setTimeout(', 'setInterval(', 'indexedDB', 'createChart(',
          ]) if (binding.includes(forbidden)) throw new Error(`P21.15 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'Canonical P21.13 implements the provider-neutral P21.4 baseline acquisition port',
            'Canonical P21.14 supplies the missing concrete browser P21.8 connector',
            'Existing P16.16 demonstrates the released project pattern for a narrow browser-ready provider entry point',
            'Keep `readObservedAt` mandatory and externally supplied',
            'No `Date.now`, `new Date`',
            'No Live Crypto Bubble Map sizing',
            'No Your Trades Bubble Map',
          ]) if (!report.includes(token)) throw new Error(`P21.15 report evidence missing: ${token}`);
          console.log('P21.15 Binance Spot browser baseline acquisition binding verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation']='node scripts/verify-p21-15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_15_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding.ts',
            'tests/binance-spot-24h-browser-public-rest-baseline-acquisition-binding.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.15 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .packagecheck
          mkdir .packagecheck
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -q "$OUT_ZIP" -d .packagecheck
          test -d .packagecheck/kairos_p76
          test ! -e .packagecheck/kairos_p76/node_modules
          test ! -e .packagecheck/kairos_p76/dist
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git add "$OUT_ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add P21.15 Binance Spot browser baseline acquisition binding candidate'
          git push
