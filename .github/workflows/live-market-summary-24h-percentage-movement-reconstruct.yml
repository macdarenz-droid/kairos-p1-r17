name: Kairos Live Market Summary 24h Percentage Movement Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-summary-24h-percentage-movement-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-live-market-summary-24h-percentage-movement-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify 24h percentage movement from Gate341 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip
          OUT_ZIP=KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_FOUNDATION_CANDIDATE_2026-09-10.zip
          PAYLOAD=.github/kairos-helper-payloads/live-market-summary-24h-percentage-movement-overlay.b64
          WORK="$RUNNER_TEMP/live-market-summary-24h-percentage-movement-work"
          BASE="$RUNNER_TEMP/live-market-summary-24h-percentage-movement-base"
          OVERLAY="$RUNNER_TEMP/live-market-summary-24h-percentage-movement-overlay.tar.gz"
          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1585557"
          echo "88b17a1b9a6cbcdbe37d33cad1908934718d9bfb293d06d63cf2e1a9da836e05  $BASE_ZIP" | sha256sum -c -
          test -f "$PAYLOAD"
          base64 -d "$PAYLOAD" > "$OVERLAY"
          echo "103395584bfa157a7366558823e05ddd200632e6b0dcb0c24596c275f45c68b6  $OVERLAY" | sha256sum -c -
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFactSemantics.ts"
          test -f "$ROOT/src/domain/calculations/decimalKernel.ts"
          test -f "$ROOT/src/domain/calculations/percentageCalculator.ts"
          test ! -e "$ROOT/src/services/market-data/liveMarketSummary24hPercentageMovement.ts"
          tar -xzf "$OVERLAY" -C "$ROOT"

          cd "$ROOT"
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:live-market-summary-24h-percentage-movement-foundation
          npm run verify:p21:2-live-market-summary-fact-contract-foundation
          npm run verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation
          npm run typecheck
          npm run build
          npx vitest run \
            tests/live-market-summary-24h-percentage-movement-foundation.test.ts \
            tests/live-market-summary-fact-contract.test.ts \
            tests/percentage-calculator.test.ts \
            tests/decimal-kernel.test.ts \
            tests/binance-home-dashboard-live-market-observed-runtime-composition-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:live-market-summary-24h-percentage-movement-foundation',
            'verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation',
            'verify:live-market-summary-freshness-evaluation-projection-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_FOUNDATION_REPORT_2026-09-10.md',
            'package.json',
            'scripts/verify-live-market-summary-24h-percentage-movement-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/liveMarketSummary24hPercentageMovement.ts',
            'tests/live-market-summary-24h-percentage-movement-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_FOUNDATION_CANDIDATE_2026-09-10.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          ROOT: ${{ runner.temp }}/live-market-summary-24h-percentage-movement-work/kairos_p76
          BASE: ${{ runner.temp }}/live-market-summary-24h-percentage-movement-base
          WORK: ${{ runner.temp }}/live-market-summary-24h-percentage-movement-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_CANDIDATE
          path: KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_FOUNDATION_CANDIDATE_2026-09-10.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add KAIROS_LIVE_MARKET_SUMMARY_24H_PERCENTAGE_MOVEMENT_FOUNDATION_CANDIDATE_2026-09-10.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Live Market Summary 24h percentage movement'
          git push origin HEAD:main
