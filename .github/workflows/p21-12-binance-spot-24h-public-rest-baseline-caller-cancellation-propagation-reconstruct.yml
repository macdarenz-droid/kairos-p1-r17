name: Kairos P21.12 Binance Spot 24h Public REST Baseline Caller Cancellation Propagation Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_11_BINANCE_SPOT_24H_PUBLIC_REST_BASELINE_ROUND_TRIP_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-07.zip
      OUT_ZIP: KAIROS_P21_12_BINANCE_SPOT_24H_PUBLIC_REST_BASELINE_CALLER_CANCELLATION_PROPAGATION_FOUNDATION_CANDIDATE_2026-09-07.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.12 from canonical P21.11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          EXEC="$ROOT/src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRequestExecution.ts"
          ROUND="$ROOT/src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRoundTrip.ts"
          test -f "$EXEC"
          test -f "$ROUND"
          test -f "$ROOT/src/services/market-data/LiveMarketSummaryBaselineAcquisitionPort.ts"

          cat > "$EXEC" <<'TS'
          import type { BinanceSpot24hPublicRestBaselineRequestDescriptor } from './binanceSpot24hPublicRestBaselineRequest';

          export interface BinanceSpot24hPublicRestBaselineExecutionOptions {
            readonly signal?: AbortSignal;
          }

          /**
           * Injected execution seam only. Concrete network and response representation
           * remain owned by the caller-supplied connector. Optional caller cancellation
           * is forwarded unchanged; this owner does not create or interpret it.
           */
          export type BinanceSpot24hPublicRestBaselineRequestConnector<TResult> = (
            request: BinanceSpot24hPublicRestBaselineRequestDescriptor,
            options?: BinanceSpot24hPublicRestBaselineExecutionOptions,
          ) => Promise<TResult>;

          /**
           * Executes exactly one already-described request. Existing no-options callers
           * retain the exact one-argument connector call; supplied options are forwarded
           * unchanged so a later concrete connector can honor caller cancellation.
           */
          export function executeBinanceSpot24hPublicRestBaselineRequest<TResult>(
            request: BinanceSpot24hPublicRestBaselineRequestDescriptor,
            connect: BinanceSpot24hPublicRestBaselineRequestConnector<TResult>,
            options?: BinanceSpot24hPublicRestBaselineExecutionOptions,
          ): Promise<TResult> {
            if (options === undefined) return connect(request);
            return connect(request, options);
          }
          TS

          # Deterministically rewrite the whole canonical P21.11 round-trip owner rather
          # than relying on indentation-sensitive string substitution.
          cat > "$ROUND" <<'TS'
          import type { MarketDataInstrument } from '../../marketDataTypes';
          import {
            describeBinanceSpot24hPublicRestBaselineRequest,
            type BinanceSpot24hPublicRestBaselineRequestResult,
          } from './binanceSpot24hPublicRestBaselineRequest';
          import {
            executeBinanceSpot24hPublicRestBaselineRequest,
            type BinanceSpot24hPublicRestBaselineExecutionOptions,
            type BinanceSpot24hPublicRestBaselineRequestConnector,
          } from './binanceSpot24hPublicRestBaselineRequestExecution';
          import {
            mapBinanceSpot24hPublicRestBaselineResponseDelivery,
            type BinanceSpot24hPublicRestBaselineResponseDeliveryResult,
          } from './binanceSpot24hPublicRestBaselineResponseDelivery';

          type RequestFailureReason = Extract<
            BinanceSpot24hPublicRestBaselineRequestResult,
            { readonly ok: false }
          >['reason'];

          type ResponseFailureReason = Extract<
            BinanceSpot24hPublicRestBaselineResponseDeliveryResult,
            { readonly ok: false }
          >['reason'];

          export type BinanceSpot24hPublicRestBaselineRoundTripResult =
            | Extract<BinanceSpot24hPublicRestBaselineResponseDeliveryResult, { readonly ok: true }>
            | { readonly ok: false; readonly reason: RequestFailureReason | ResponseFailureReason };

          /**
           * Composes the canonical REST baseline seams for one round trip. Optional
           * caller-owned execution options are propagated only; connector rejection,
           * cancellation policy, concrete transport and P21.4 orchestration remain outside.
           */
          export async function composeBinanceSpot24hPublicRestBaselineRoundTrip(
            scope: readonly MarketDataInstrument[],
            observedAt: string,
            connect: BinanceSpot24hPublicRestBaselineRequestConnector<unknown>,
            options?: BinanceSpot24hPublicRestBaselineExecutionOptions,
          ): Promise<BinanceSpot24hPublicRestBaselineRoundTripResult> {
            const described = describeBinanceSpot24hPublicRestBaselineRequest(scope);
            if (!described.ok) return described;
            const data = await executeBinanceSpot24hPublicRestBaselineRequest(described.request, connect, options);
            return mapBinanceSpot24hPublicRestBaselineResponseDelivery(scope, data, observedAt);
          }
          TS

          cat > "$ROOT/tests/binance-spot-24h-public-rest-baseline-caller-cancellation-propagation.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import {
            composeBinanceSpot24hPublicRestBaselineRoundTrip,
            describeBinanceSpot24hPublicRestBaselineRequest,
            executeBinanceSpot24hPublicRestBaselineRequest,
          } from '../src/services/market-data';

          const scope = [{ venue: 'binance-spot', symbol: 'BTCUSDT' }] as const;
          const observedAt = '2026-09-07T08:55:00.000Z';
          const payload = JSON.stringify({
            symbol: 'BTCUSDT', openPrice: '62000', highPrice: '65000', lowPrice: '61000',
            lastPrice: '64000', volume: '1234', quoteVolume: '78000000', closeTime: 1770000000000,
          });

          describe('P21.12 caller cancellation propagation foundation', () => {
            it('forwards the exact caller-owned signal unchanged through the P21.8 execution boundary', async () => {
              const described = describeBinanceSpot24hPublicRestBaselineRequest(scope);
              expect(described.ok).toBe(true);
              if (!described.ok) return;
              const controller = new AbortController();
              const options = { signal: controller.signal } as const;
              const connect = vi.fn(async () => payload);
              await executeBinanceSpot24hPublicRestBaselineRequest(described.request, connect, options);
              expect(connect).toHaveBeenCalledTimes(1);
              expect(connect).toHaveBeenCalledWith(described.request, options);
            });

            it('propagates the same signal through the P21.11 round trip without creating cancellation policy', async () => {
              const controller = new AbortController();
              const options = { signal: controller.signal } as const;
              const connect = vi.fn(async (_request: unknown, received?: { readonly signal?: AbortSignal }) => {
                expect(received).toBe(options);
                expect(received?.signal).toBe(controller.signal);
                return payload;
              });
              const result = await composeBinanceSpot24hPublicRestBaselineRoundTrip(scope, observedAt, connect, options);
              expect(result.ok).toBe(true);
              expect(connect).toHaveBeenCalledTimes(1);
            });

            it('preserves exact one-argument connector invocation for existing no-options callers', async () => {
              const described = describeBinanceSpot24hPublicRestBaselineRequest(scope);
              expect(described.ok).toBe(true);
              if (!described.ok) return;
              const connect = vi.fn(async () => payload);
              await executeBinanceSpot24hPublicRestBaselineRequest(described.request, connect);
              expect(connect).toHaveBeenCalledWith(described.request);
              expect(connect.mock.calls[0]).toHaveLength(1);
            });

            it('preserves connector rejection behavior', async () => {
              const failure = new Error('connector-owned-failure');
              await expect(composeBinanceSpot24hPublicRestBaselineRoundTrip(scope, observedAt, async () => { throw failure; }))
                .rejects.toBe(failure);
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_12_BINANCE_SPOT_24H_PUBLIC_REST_BASELINE_CALLER_CANCELLATION_PROPAGATION_FOUNDATION_REPORT_2026-09-07.md" <<'MD'
          # KAIROS P21.12 — Binance Spot 24h Public REST Baseline Caller Cancellation Propagation Foundation

          ## Authority
          Base: canonical P21.11 round-trip composition, canonical gate #296 / run `34100573164`.

          ## Source-proven responsibility
          P21.4 already exposes optional caller cancellation through `AbortSignal`, but canonical P21.8/P21.11 cannot carry that signal to an injected connector. The smallest dependency-safe prerequisite before a concrete P21.4 adapter is propagation only: accept optional caller-owned execution options and forward the exact signal unchanged across P21.8 and P21.11.

          Current Fetch API behavior supports request cancellation by passing an `AbortSignal` as the request `signal`; concrete fetch remains outside this slice.

          ## Contract
          - Existing calls without options preserve their exact one-argument connector invocation.
          - Supplied P21.8 execution options are forwarded unchanged to the injected connector exactly once.
          - P21.11 forwards the same options into P21.8.
          - Connector result/rejection behavior remains unchanged.

          ## Explicit non-scope
          - No concrete fetch/XHR/WebSocket/browser transport and no `Response`/status/header/body acquisition.
          - No `AbortController` creation, signal combination, timeout, abort interpretation, or error translation.
          - No concrete P21.4 acquisition-port implementation yet.
          - No retry/backoff/throttle/rate-limit/request-weight/credentials/polling/reconnect.
          - No new request/decode/ticker/completeness algorithm, scope selection/ranking, state, Bubble/Your-Trades/Home/persistence/transitions.
          MD

          cat > "$ROOT/scripts/verify-p21-12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const exec = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRequestExecution.ts', import.meta.url), 'utf8');
          const round = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRoundTrip.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_12_BINANCE_SPOT_24H_PUBLIC_REST_BASELINE_CALLER_CANCELLATION_PROPAGATION_FOUNDATION_REPORT_2026-09-07.md', import.meta.url), 'utf8');
          for (const token of [
            'BinanceSpot24hPublicRestBaselineExecutionOptions',
            'readonly signal?: AbortSignal',
            'if (options === undefined) return connect(request);',
            'return connect(request, options);',
          ]) if (!exec.includes(token)) throw new Error(`P21.12 execution propagation evidence missing: ${token}`);
          for (const token of [
            'options?: BinanceSpot24hPublicRestBaselineExecutionOptions',
            'executeBinanceSpot24hPublicRestBaselineRequest(described.request, connect, options)',
          ]) if (!round.includes(token)) throw new Error(`P21.12 round-trip propagation evidence missing: ${token}`);
          for (const source of [exec, round]) for (const forbidden of [
            'fetch(', 'XMLHttpRequest', 'WebSocket(', 'new Response(', 'new AbortController(',
            'AbortSignal.any(', 'AbortSignal.timeout(', 'setTimeout(', 'acquireBaseline(', 'indexedDB',
          ]) if (source.includes(forbidden)) throw new Error(`P21.12 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'No concrete fetch/XHR/WebSocket/browser transport',
            'No `AbortController` creation',
            'No concrete P21.4 acquisition-port implementation yet',
            'No retry/backoff/throttle/rate-limit',
            'No new request/decode/ticker/completeness algorithm',
          ]) if (!report.includes(token)) throw new Error(`P21.12 report evidence missing: ${token}`);
          console.log('P21.12 caller cancellation propagation verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation']='node scripts/verify-p21-12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_12_BINANCE_SPOT_24H_PUBLIC_REST_BASELINE_CALLER_CANCELLATION_PROPAGATION_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation.mjs',
            'src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRequestExecution.ts',
            'src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRoundTrip.ts',
            'tests/binance-spot-24h-public-rest-baseline-caller-cancellation-propagation.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.12 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .p21package
          mkdir .p21package
          cp -a "$ROOT" .p21package/kairos_p76
          rm -f "$OUT_ZIP"
          (cd .p21package && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | head -n1 | cut -d/ -f1)" = "kairos_p76"
          git add "$OUT_ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package P21.12 caller cancellation propagation candidate"
          git push
