name: Kairos P21.18 Binance Spot 24h Browser Public REST Baseline State Binding Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-18-binance-spot-24h-browser-public-rest-baseline-state-binding-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_17_LIVE_MARKET_SUMMARY_BASELINE_STATE_ORCHESTRATION_FOUNDATION_CANDIDATE_2026-09-08.zip
      OUT_ZIP: KAIROS_P21_18_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_STATE_BINDING_FOUNDATION_CANDIDATE_2026-09-08.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.18 from canonical P21.17
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          BINDING="$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryBaselineStateOrchestration.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryDeliveryState.ts"
          test -f "$INDEX"

          cat > "$BINDING" <<'TS'
          import type { MarketDataInstrument } from '../../marketDataTypes';
          import type { LiveMarketSummaryDeliveryState } from '../../liveMarketSummaryDeliveryState';
          import {
            acquireLiveMarketSummaryBaselineIntoState,
            type LiveMarketSummaryBaselineStateOrchestrationResult,
          } from '../../liveMarketSummaryBaselineStateOrchestration';
          import type { BinanceSpot24hPublicRestBaselineObservedAtSource } from './binanceSpot24hPublicRestBaselineAcquisitionAdapter';
          import { createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort } from './binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding';

          /**
           * Browser-ready one-shot binding of released P21.15 acquisition composition
           * to released P21.17 state orchestration. Scope, observation time,
           * cancellation, lifecycle, freshness, ranking, persistence, and UI remain
           * caller/upstream ownership.
           */
          export function acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(
            state: LiveMarketSummaryDeliveryState,
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
            scope: readonly MarketDataInstrument[],
            options?: { readonly signal?: AbortSignal },
          ): Promise<LiveMarketSummaryBaselineStateOrchestrationResult> {
            const acquisitionPort = createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt);
            return acquireLiveMarketSummaryBaselineIntoState(state, acquisitionPort, scope, options);
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding';\n"
          if line not in s:
              anchor="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding';\n"
              if anchor not in s: raise SystemExit('P21.15 browser acquisition binding export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/binance-spot-24h-browser-public-rest-baseline-state-binding-foundation.test.ts" <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { parsePositiveDecimalString } from '../src/domain/trades';
          import type { DecimalString } from '../src/domain/trades';
          import {
            acquireBinanceSpot24hBrowserPublicRestBaselineIntoState,
            applyLiveMarketSummaryDeliveryState,
            createLiveMarketSummaryDeliveryState,
            getLiveMarketSummaryDeliveryStateFact,
            type LiveMarketSummaryFact,
            type MarketDataInstrument,
          } from '../src/services/market-data';

          function positive(value: string): DecimalString {
            const parsed = parsePositiveDecimalString(value);
            if (!parsed.ok) throw new Error(`Invalid positive DecimalString fixture: ${value}`);
            return parsed.value;
          }

          const originalFetch = globalThis.fetch;
          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const sol: MarketDataInstrument = { venue: 'binance-spot', symbol: 'SOLUSDT' };
          const scope = [btc] as const;
          const observedAt = '2026-09-08T02:48:00.000Z';
          const payload = JSON.stringify({
            symbol: 'BTCUSDT', openPrice: '62000', highPrice: '65000', lowPrice: '61000',
            lastPrice: '64000', volume: '1234', quoteVolume: '78000000', closeTime: 1770000000000,
          });

          function fact(instrument: MarketDataInstrument, lastPrice: string): LiveMarketSummaryFact {
            return {
              instrument,
              lastPrice: positive(lastPrice),
              open24h: positive('1'),
              high24h: positive('2'),
              low24h: positive('0.5'),
              baseVolume24h: '10' as DecimalString,
              quoteVolume24h: '20' as DecimalString,
              observedAt: '2026-09-08T00:00:00.000Z',
              sourceTimestamp: '2026-09-07T23:59:59.900Z',
            };
          }

          function withIncrementalFact(instrument: MarketDataInstrument, lastPrice: string) {
            const initial = createLiveMarketSummaryDeliveryState();
            const applied = applyLiveMarketSummaryDeliveryState(initial, {
              completeness: 'incremental',
              facts: [fact(instrument, lastPrice)],
            });
            if (!applied.ok) throw new Error('Expected fixture delivery to apply');
            return applied.state;
          }

          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.restoreAllMocks();
          });

          describe('P21.18 Binance Spot browser public REST baseline state binding foundation', () => {
            it('composes released P21.15 browser acquisition with released P21.17 state orchestration and preserves out-of-scope state', async () => {
              const prior = withIncrementalFact(sol, '140');
              const text = vi.fn(async () => payload);
              const fetchMock = vi.fn(async () => ({ text }));
              globalThis.fetch = fetchMock as unknown as typeof fetch;
              const readObservedAt = vi.fn(() => observedAt);

              const result = await acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(
                prior,
                readObservedAt,
                scope,
              );

              expect(result.ok).toBe(true);
              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(text).toHaveBeenCalledTimes(1);
              expect(readObservedAt).toHaveBeenCalledTimes(1);
              if (result.ok) {
                expect(getLiveMarketSummaryDeliveryStateFact(result.state, btc)?.lastPrice).toBe(positive('64000'));
                expect(getLiveMarketSummaryDeliveryStateFact(result.state, btc)?.observedAt).toBe(observedAt);
                expect(getLiveMarketSummaryDeliveryStateFact(result.state, sol)?.lastPrice).toBe(positive('140'));
              }
            });

            it('forwards caller-owned cancellation through released P21.15 and P21.17 unchanged', async () => {
              const prior = createLiveMarketSummaryDeliveryState();
              const controller = new AbortController();
              const options = { signal: controller.signal } as const;
              const fetchMock = vi.fn(async (_input: URL | RequestInfo, init?: RequestInit) => ({
                text: async () => payload,
                init,
              }));
              globalThis.fetch = fetchMock as unknown as typeof fetch;

              await expect(acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(
                prior,
                () => observedAt,
                scope,
                options,
              )).resolves.toMatchObject({ ok: true });

              expect(fetchMock).toHaveBeenCalledTimes(1);
              const [, init] = fetchMock.mock.calls[0] ?? [];
              expect(init?.signal).toBe(controller.signal);
            });

            it('preserves released acquisition-failed semantics and returns the exact prior state unchanged', async () => {
              const prior = withIncrementalFact(sol, '140');
              globalThis.fetch = vi.fn(async () => { throw new Error('native-fetch-failure'); }) as unknown as typeof fetch;

              const result = await acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(
                prior,
                () => observedAt,
                scope,
              );

              expect(result).toEqual({ ok: false, reason: 'acquisition-failed', state: prior });
              expect(result.state).toBe(prior);
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_18_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_STATE_BINDING_FOUNDATION_REPORT_2026-09-08.md" <<'MD'
          # KAIROS P21.18 — Binance Spot 24h Browser Public REST Baseline State Binding Foundation

          ## Authority
          Base: canonical P21.17 Live Market Summary Baseline State Orchestration Foundation, canonical gate #302 / run `34140732046`.

          ## Source-proven responsibility
          Canonical P21.15 exposes `createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt)` as the browser-ready P21.4 acquisition-port binding while deliberately owning no current-summary state. Canonical P21.17 exposes `acquireLiveMarketSummaryBaselineIntoState(state, acquisitionPort, scope, options?)` as provider-neutral one-shot acquisition-to-P21.16-state orchestration while deliberately requiring an already-created acquisition port. Exact current source search finds no production owner composing these released seams, and P21.17's verifier explicitly forbids the P21.15 browser acquisition factory inside the provider-neutral orchestration module. The smallest dependency-safe next responsibility is therefore one browser-ready state-binding entry point that composes only P21.15 and P21.17.

          ## Contract
          - Accept an existing `LiveMarketSummaryDeliveryState`, caller-owned `readObservedAt`, explicit caller-owned scope, and optional caller-owned acquisition options.
          - Create the acquisition port only through released `createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt)`.
          - Delegate acquisition and state application only through released `acquireLiveMarketSummaryBaselineIntoState`.
          - Preserve released `acquisition-failed`, `delivery-invalid`, cancellation/options forwarding, and exact-prior-state semantics unchanged.
          - Add no new transport, provider decode, validation, state store, lifecycle, freshness, ranking, persistence, or UI owner.

          ## Explicit non-scope
          - No market-universe/scope selection, ranking, filtering, grouping, sorting, Bubble metric/color/geometry/interaction, or Home wiring.
          - No new fetch/XHR/WebSocket/Response ownership, endpoint/query/provider mapping, HTTP status/header/error/retry/rate-limit/credentials/timeout policy.
          - No `Date.now`, `new Date`, observation-time acquisition, timestamp arbitration, freshness TTL, stale eviction, polling, reconnect, scheduling, or randomness.
          - No new delivery completeness, decode, ticker, validation, or instrument-identity semantics.
          - No state store, persistence, repository/schema/backup, direct IndexedDB, journal, Your Trades Bubble Map, Saved Analysis, chart, or transition ownership.
          MD

          cat > "$ROOT/scripts/verify-p21-18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const binding = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_18_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_STATE_BINDING_FOUNDATION_REPORT_2026-09-08.md', import.meta.url), 'utf8');
          for (const token of [
            'acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(',
            'LiveMarketSummaryDeliveryState',
            'BinanceSpot24hPublicRestBaselineObservedAtSource',
            'createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt)',
            'acquireLiveMarketSummaryBaselineIntoState(state, acquisitionPort, scope, options)',
            'LiveMarketSummaryBaselineStateOrchestrationResult',
          ]) if (!binding.includes(token)) throw new Error(`P21.18 binding evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding';")) throw new Error('P21.18 browser baseline state binding export missing');
          for (const forbidden of [
            'globalThis.fetch(', 'fetch(', 'XMLHttpRequest', 'WebSocket(', 'Response(', 'JSON.parse(',
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'indexedDB', '.sort(', 'createChart(',
            'connectBinanceSpot24hBrowserPublicRestBaselineRequest(',
            'createBinanceSpot24hPublicRestBaselineAcquisitionPort(',
            'applyLiveMarketSummaryDeliveryState(',
          ]) if (binding.includes(forbidden)) throw new Error(`P21.18 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'Canonical P21.15 exposes `createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt)`',
            'Canonical P21.17 exposes `acquireLiveMarketSummaryBaselineIntoState(state, acquisitionPort, scope, options?)`',
            'no production owner composing these released seams',
            'Create the acquisition port only through released',
            'Delegate acquisition and state application only through released',
            'Preserve released `acquisition-failed`, `delivery-invalid`, cancellation/options forwarding, and exact-prior-state semantics unchanged',
            'No market-universe/scope selection, ranking, filtering, grouping, sorting',
            'No state store, persistence, repository/schema/backup, direct IndexedDB',
          ]) if (!report.includes(token)) throw new Error(`P21.18 report evidence missing: ${token}`);
          console.log('P21.18 Binance Spot browser public REST baseline state binding verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation']='node scripts/verify-p21-18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_18_BINANCE_SPOT_24H_BROWSER_PUBLIC_REST_BASELINE_STATE_BINDING_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-p21-18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding.ts',
            'tests/binance-spot-24h-browser-public-rest-baseline-state-binding-foundation.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.18 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .packagecheck
          mkdir .packagecheck
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -q "$OUT_ZIP" -d .packagecheck
          test -d .packagecheck/kairos_p76
          test ! -e .packagecheck/kairos_p76/node_modules
          test ! -e .packagecheck/kairos_p76/dist
          test "$(find .packagecheck -mindepth 1 -maxdepth 1 -printf '%f\n')" = "kairos_p76"
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git add "$OUT_ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add P21.18 Binance Spot browser baseline state binding candidate'
          git push
