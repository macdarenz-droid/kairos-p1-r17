name: Kairos Home Dashboard Live Market Summary Browser Lifecycle Adapter Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-market-summary-browser-lifecycle-adapter-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_ACQUISITION_LIFECYCLE_SCHEDULER_FOUNDATION_CANDIDATE_2026-09-09.zip
  CANDIDATE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_BROWSER_LIFECYCLE_ADAPTER_FOUNDATION_CANDIDATE_2026-09-09.zip
  HELPER_PATH: .github/workflows/home-dashboard-live-market-summary-browser-lifecycle-adapter-reconstruct.yml

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct browser lifecycle adapter candidate directly from Gate331 GOLDEN
        run: |
          set -euo pipefail
          test -f "$BASE_ZIP"
          test "$(git hash-object "$BASE_ZIP")" = "8209abafd6d6234e2f3de6b59b2d26c300d0c090"
          test "$(wc -c < "$BASE_ZIP" | tr -d ' ')" = "1543568"
          rm -rf .browser-life-work .browser-life-base
          mkdir -p .browser-life-work .browser-life-base
          unzip -q "$BASE_ZIP" -d .browser-life-work
          unzip -q "$BASE_ZIP" -d .browser-life-base
          ROOT=.browser-life-work/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionLifecycleScheduler.ts"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort.ts"

          cat > "$ROOT/src/app/homeDashboardLiveMarketSummaryBrowserLifecycleAdapter.ts" <<'TS'
          import {
            createHomeDashboardLiveMarketSummaryAcquisitionLifecycle,
            type HomeDashboardLiveMarketSummaryAcquisitionLifecycleObserver,
            type HomeDashboardLiveMarketSummaryAcquisitionLifecycleSchedulerClock,
          } from '../application/dashboard/homeDashboardLiveMarketSummaryAcquisitionLifecycleScheduler';
          import type { HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort } from '../application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort';
          import type { MarketDataInstrument } from '../services/market-data/marketDataTypes';

          export interface HomeDashboardLiveMarketSummaryBrowserVisibilityDocument {
            readonly visibilityState: DocumentVisibilityState;
            readonly addEventListener: (
              type: 'visibilitychange',
              listener: () => void,
            ) => void;
            readonly removeEventListener: (
              type: 'visibilitychange',
              listener: () => void,
            ) => void;
          }

          export interface HomeDashboardLiveMarketSummaryBrowserTimer {
            readonly schedule: (callback: () => void, delayMs: number) => unknown;
            readonly cancel: (handle: unknown) => void;
          }

          export interface HomeDashboardLiveMarketSummaryBrowserLifecycleAdapter {
            readonly close: () => void;
          }

          export interface HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions {
            readonly document?: HomeDashboardLiveMarketSummaryBrowserVisibilityDocument;
            readonly timer?: HomeDashboardLiveMarketSummaryBrowserTimer;
            readonly observer?: HomeDashboardLiveMarketSummaryAcquisitionLifecycleObserver;
          }

          const browserTimer: HomeDashboardLiveMarketSummaryBrowserTimer = {
            schedule(callback, delayMs) {
              return globalThis.setTimeout(callback, delayMs);
            },
            cancel(handle) {
              globalThis.clearTimeout(handle as ReturnType<typeof globalThis.setTimeout>);
            },
          };

          function readVisibility(
            browserDocument: HomeDashboardLiveMarketSummaryBrowserVisibilityDocument,
          ): 'visible' | 'hidden' {
            return browserDocument.visibilityState === 'hidden' ? 'hidden' : 'visible';
          }

          export function createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(
            port: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort,
            scope: readonly MarketDataInstrument[],
            options: HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions = {},
          ): HomeDashboardLiveMarketSummaryBrowserLifecycleAdapter {
            const browserDocument = options.document ?? document;
            const timer = options.timer ?? browserTimer;
            const scheduler: HomeDashboardLiveMarketSummaryAcquisitionLifecycleSchedulerClock = {
              schedule: timer.schedule,
              cancel: timer.cancel,
            };
            const lifecycle = createHomeDashboardLiveMarketSummaryAcquisitionLifecycle(
              port,
              scope,
              scheduler,
              options.observer,
              readVisibility(browserDocument),
            );

            let closed = false;
            const onVisibilityChange = () => {
              lifecycle.setVisibility(readVisibility(browserDocument));
            };

            browserDocument.addEventListener('visibilitychange', onVisibilityChange);
            lifecycle.enter();

            return {
              close() {
                if (closed) return;
                closed = true;
                browserDocument.removeEventListener('visibilitychange', onVisibilityChange);
                lifecycle.close();
              },
            };
          }
          TS

          cat > "$ROOT/tests/home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import {
            createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter,
            type HomeDashboardLiveMarketSummaryBrowserTimer,
            type HomeDashboardLiveMarketSummaryBrowserVisibilityDocument,
          } from '../src/app/homeDashboardLiveMarketSummaryBrowserLifecycleAdapter';
          import type { HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort } from '../src/application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort';
          import type { MarketDataInstrument } from '../src/services/market-data/marketDataTypes';

          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };

          function createBrowserDocument(initial: DocumentVisibilityState = 'visible') {
            let listener: (() => void) | null = null;
            const state = { visibilityState: initial };
            const addEventListener = vi.fn((_type: 'visibilitychange', next: () => void) => {
              listener = next;
            });
            const removeEventListener = vi.fn((_type: 'visibilitychange', next: () => void) => {
              if (listener === next) listener = null;
            });
            const browserDocument = {
              get visibilityState() {
                return state.visibilityState;
              },
              addEventListener,
              removeEventListener,
            } as HomeDashboardLiveMarketSummaryBrowserVisibilityDocument;
            return {
              browserDocument,
              addEventListener,
              removeEventListener,
              setVisibility(next: DocumentVisibilityState) {
                state.visibilityState = next;
                listener?.();
              },
            };
          }

          function createTimer() {
            let callback: (() => void) | null = null;
            let nextHandle = 0;
            const schedule = vi.fn((next: () => void, _delayMs: number) => {
              callback = next;
              nextHandle += 1;
              return nextHandle;
            });
            const cancel = vi.fn();
            const timer: HomeDashboardLiveMarketSummaryBrowserTimer = { schedule, cancel };
            return {
              timer,
              schedule,
              cancel,
              fire() {
                const current = callback;
                callback = null;
                current?.();
              },
            };
          }

          function createPendingPort() {
            const signals: AbortSignal[] = [];
            const acquire = vi.fn((_scope: readonly MarketDataInstrument[], options?: { signal?: AbortSignal }) => {
              signals.push(options!.signal!);
              return new Promise<never>(() => {});
            });
            return {
              port: { acquire } as HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort,
              acquire,
              signals,
            };
          }

          describe('Home Dashboard live-market browser lifecycle adapter', () => {
            it('maps visible browser entry into Gate331 immediate acquisition and released five-second scheduling', () => {
              const page = createBrowserDocument('visible');
              const timer = createTimer();
              const pending = createPendingPort();

              const adapter = createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(
                pending.port,
                [btc],
                { document: page.browserDocument, timer: timer.timer },
              );

              expect(page.addEventListener).toHaveBeenCalledTimes(1);
              expect(page.addEventListener).toHaveBeenCalledWith('visibilitychange', expect.any(Function));
              expect(pending.acquire).toHaveBeenCalledTimes(1);
              expect(timer.schedule).toHaveBeenCalledTimes(1);
              expect(timer.schedule.mock.calls[0]?.[1]).toBe(5000);
              adapter.close();
            });

            it('maps browser hidden state to suspension and visible resume to immediate reacquisition', () => {
              const page = createBrowserDocument('visible');
              const timer = createTimer();
              const pending = createPendingPort();
              const adapter = createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(
                pending.port,
                [btc],
                { document: page.browserDocument, timer: timer.timer },
              );
              const firstSignal = pending.signals[0]!;

              page.setVisibility('hidden');
              expect(firstSignal.aborted).toBe(true);
              expect(timer.cancel).toHaveBeenCalledTimes(1);
              expect(pending.acquire).toHaveBeenCalledTimes(1);

              page.setVisibility('visible');
              expect(pending.acquire).toHaveBeenCalledTimes(2);
              expect(timer.schedule).toHaveBeenCalledTimes(2);
              expect(timer.schedule.mock.calls[1]?.[1]).toBe(5000);
              adapter.close();
            });

            it('does not acquire while initially hidden and starts immediately when the page becomes visible', () => {
              const page = createBrowserDocument('hidden');
              const timer = createTimer();
              const pending = createPendingPort();
              const adapter = createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(
                pending.port,
                [btc],
                { document: page.browserDocument, timer: timer.timer },
              );

              expect(pending.acquire).not.toHaveBeenCalled();
              expect(timer.schedule).not.toHaveBeenCalled();
              page.setVisibility('visible');
              expect(pending.acquire).toHaveBeenCalledTimes(1);
              expect(timer.schedule.mock.calls[0]?.[1]).toBe(5000);
              adapter.close();
            });

            it('removes exactly its visibility listener and closes lifecycle work idempotently', () => {
              const page = createBrowserDocument('visible');
              const timer = createTimer();
              const pending = createPendingPort();
              const adapter = createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(
                pending.port,
                [btc],
                { document: page.browserDocument, timer: timer.timer },
              );
              const signal = pending.signals[0]!;

              adapter.close();
              adapter.close();

              expect(page.removeEventListener).toHaveBeenCalledTimes(1);
              expect(page.removeEventListener.mock.calls[0]?.[0]).toBe('visibilitychange');
              expect(signal.aborted).toBe(true);
              expect(timer.cancel).toHaveBeenCalledTimes(1);
              page.setVisibility('hidden');
              page.setVisibility('visible');
              timer.fire();
              expect(pending.acquire).toHaveBeenCalledTimes(1);
            });
          });
          TS

          cat > "$ROOT/scripts/verify-home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('src/app/homeDashboardLiveMarketSummaryBrowserLifecycleAdapter.ts', 'utf8');
          const test = readFileSync('tests/home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.test.ts', 'utf8');

          for (const token of [
            'createHomeDashboardLiveMarketSummaryAcquisitionLifecycle',
            "visibilityState === 'hidden'",
            "addEventListener('visibilitychange'",
            "removeEventListener('visibilitychange'",
            'globalThis.setTimeout',
            'globalThis.clearTimeout',
            'lifecycle.setVisibility',
            'lifecycle.enter()',
            'lifecycle.close()',
          ]) {
            if (!source.includes(token)) throw new Error(`missing browser lifecycle adapter evidence: ${token}`);
          }

          for (const forbidden of [
            '5000', 'fetch(', 'WebSocket', 'Binance', 'quoteVolume24h', 'stablecoin', 'TopN',
            'FRESH', 'STALE', 'EXPIRED', 'createLiveMarketSummaryStateSession', 'indexedDB',
            'React', 'useEffect(', 'useState(', 'createChart(',
          ]) {
            if (source.includes(forbidden)) throw new Error(`browser lifecycle adapter leaked forbidden ownership: ${forbidden}`);
          }

          for (const token of [
            "createBrowserDocument('visible')",
            "createBrowserDocument('hidden')",
            "setVisibility('hidden')",
            "setVisibility('visible')",
            'toBe(5000)',
            'removeEventListener',
            'signal.aborted',
          ]) {
            if (!test.includes(token)) throw new Error(`missing browser lifecycle adapter regression evidence: ${token}`);
          }

          console.log('Home Dashboard live-market browser lifecycle adapter verification passed.');
          JS

          cat > "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_BROWSER_LIFECYCLE_ADAPTER_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # KAIROS Home Dashboard Live Market Summary Browser Lifecycle Adapter Foundation

          ## Authority
          Base: canonical Gate331 Home Dashboard live-market acquisition lifecycle/scheduler orchestration GOLDEN.

          ## Source-proven responsibility
          Gate331 deliberately owns provider-neutral lifecycle/scheduler orchestration but forbids concrete DOM/Page Visibility listeners and concrete timer APIs. Fresh repository search found no production Home/live-market Page Visibility owner. Existing browser/provider acquisition composition owns transport composition only. Current Kairos application bootstrap composes browser-facing infrastructure while browser APIs remain environment-edge concerns.

          ## Contract
          This slice owns only the browser environment adaptation required to drive released Gate331:
          - map current browser `document.visibilityState` to released visible/hidden lifecycle input;
          - subscribe to `visibilitychange` and forward only visibility changes to Gate331;
          - implement Gate331's injected one-shot scheduler through browser timeout APIs;
          - enter the released lifecycle exactly once when the adapter is created;
          - remove the exact listener and close released lifecycle work idempotently.

          The adapter does not own the 5000ms product cadence, lifecycle race/cancellation policy, provider selection/transport, state-session construction, observedAt/freshness, universe filtering/order/Top-N, persistence, React/Home rendering, bubble geometry/color, navigation, or transitions.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.browser-life-work/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation']='node scripts/verify-home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.browser-life-base/kairos_p76'); c=Path('.browser-life-work/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_BROWSER_LIFECYCLE_ADAPTER_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.mjs',
            'src/app/homeDashboardLiveMarketSummaryBrowserLifecycleAdapter.ts',
            'tests/home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.test.ts',
          }
          if changed != expected:
            print('browser lifecycle adapter exact scope mismatch',file=sys.stderr)
            print('Unexpected:',sorted(changed-expected),file=sys.stderr)
            print('Missing:',sorted(expected-changed),file=sys.stderr)
            sys.exit(1)
          PY

      - name: Install candidate deterministically
        working-directory: .browser-life-work/kairos_p76
        run: npm ci

      - name: Prove pinned toolchain dependency
        working-directory: .browser-life-work/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

      - name: Dedicated browser lifecycle adapter verification
        working-directory: .browser-life-work/kairos_p76
        run: npm run verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation

      - name: Focused browser lifecycle dependency regression
        working-directory: .browser-life-work/kairos_p76
        run: |
          npx vitest run tests/home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.test.ts tests/home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation.test.ts
          npm run verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation
          npm run verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation
          npm run verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation
          npm run verify:p21:23-live-market-summary-browser-state-session-scoped-snapshot-acquisition-composition-foundation

      - name: Production TypeScript compilation
        working-directory: .browser-life-work/kairos_p76
        run: npm run typecheck

      - name: Production build
        working-directory: .browser-life-work/kairos_p76
        run: npm run build

      - name: Full unit regression
        working-directory: .browser-life-work/kairos_p76
        run: npm test

      - name: Full registered verifier regression
        working-directory: .browser-life-work/kairos_p76
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=require('./package.json');
          const names=Object.keys(p.scripts||{}).filter(k=>k.startsWith('verify:')).sort();
          if(!names.length) throw new Error('no registered verifiers found');
          fs.writeFileSync('/tmp/kairos-verifiers',names.join('\n')+'\n');
          console.log(`registered verifiers: ${names.length}`);
          NODE
          while IFS= read -r script; do npm run "$script"; done < /tmp/kairos-verifiers

      - name: Clean package and verify archive integrity
        run: |
          set -euo pipefail
          ROOT=.browser-life-work/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$CANDIDATE_ZIP"
          (cd .browser-life-work && zip -qr "../$CANDIDATE_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile,os
          p=Path(os.environ['CANDIDATE_ZIP']); data=p.read_bytes()
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}
            names=[i.filename for i in z.infolist()]
            for forbidden in ('node_modules/','dist/','coverage/','.vite/'):
              assert not any(forbidden in n for n in names), forbidden
            for i in z.infolist():
              parts=PurePosixPath(i.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
          print('candidate bytes',len(data))
          print('candidate sha256',hashlib.sha256(data).hexdigest())
          PY

      - name: Upload noncanonical helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_LIVE_MARKET_BROWSER_LIFECYCLE_ADAPTER_CANDIDATE_NONCANONICAL
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error

      - name: Place verified candidate at repository root
        run: |
          set -euo pipefail
          git config user.name 'kairos-helper'
          git config user.email 'kairos-helper@users.noreply.github.com'
          git add "$CANDIDATE_ZIP"
          git commit -m 'candidate: place verified Home live market browser lifecycle adapter'
          git push origin HEAD:main

      - name: Self-clean helper definition
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm "$HELPER_PATH"
          git commit -m 'chore: remove browser lifecycle reconstruction helper'
          git push origin HEAD:main
