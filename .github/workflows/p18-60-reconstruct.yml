name: Kairos P18.60 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p18-60-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P18_59_LIGHTWEIGHT_CHARTS_V5_TREND_LINE_EDIT_CLICK_EXECUTION_LIFECYCLE_COMPOSITION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P18_60_DRAWING_TOOLS_SYSTEM_CLOSURE_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Reconstruct closure from canonical P18.59
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p18base .p18candidate
          mkdir .p18base .p18candidate
          unzip -q "$BASE_ZIP" -d .p18base
          cp -a .p18base/. .p18candidate/
          ROOT=.p18candidate/kairos_p76
          test -f "$ROOT/package.json"
          cat .kairos-p18-60/ARCH_APPEND.md >> "$ROOT/docs/KAIROS_ARCHITECTURE_MAP.md"
          cp .kairos-p18-60/verify-p18-60-drawing-tools-system-closure.mjs "$ROOT/scripts/verify-p18-60-drawing-tools-system-closure.mjs"
          cp .kairos-p18-60/KAIROS_P18_60_DRAWING_TOOLS_SYSTEM_CLOSURE_REPORT_2026-09-06.md "$ROOT/KAIROS_P18_60_DRAWING_TOOLS_SYSTEM_CLOSURE_REPORT_2026-09-06.md"
          node -e "const fs=require('node:fs');const p='$ROOT/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.scripts||={};j.scripts['verify:p18:60-drawing-tools-system-closure']='node scripts/verify-p18-60-drawing-tools-system-closure.mjs';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          python -c "from pathlib import Path; a={str(p.relative_to(Path('.p18base/kairos_p76'))):p.read_bytes() for p in Path('.p18base/kairos_p76').rglob('*') if p.is_file()}; b={str(p.relative_to(Path('.p18candidate/kairos_p76'))):p.read_bytes() for p in Path('.p18candidate/kairos_p76').rglob('*') if p.is_file()}; changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}; expected={'KAIROS_P18_60_DRAWING_TOOLS_SYSTEM_CLOSURE_REPORT_2026-09-06.md','docs/KAIROS_ARCHITECTURE_MAP.md','package.json','scripts/verify-p18-60-drawing-tools-system-closure.mjs'}; print('\\n'.join(sorted(changed))); assert changed==expected,(sorted(changed-expected),sorted(expected-changed))"
      - name: Verify reconstructed candidate before packaging
        working-directory: .p18candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run build
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p18:59-lightweight-charts-v5-trend-line-edit-click-execution-lifecycle-composition
          npm run verify:p18:58-lightweight-charts-v5-trend-line-edit-endpoint-click-lifecycle-composition
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p1
      - name: Package integrity check and replace corrupt candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p18candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Repair P18.60 candidate by deterministic reconstruction from canonical P18.59'
          git push
