name: Kairos P19.3 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-3-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_2_RISK_REWARD_ZONE_SEMANTICS_PROJECTION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P19_3_RISK_REWARD_CHART_COMPOSITION_SEMANTIC_CONTRACT_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P19.3 from canonical P19.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p19base .p19candidate
          mkdir .p19base .p19candidate
          unzip -q "$BASE_ZIP" -d .p19base
          cp -a .p19base/. .p19candidate/
          ROOT=.p19candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/risk-reward/riskRewardAnalysisContract.ts"
          test -f "$ROOT/src/application/risk-reward/riskRewardZoneSemantics.ts"

          cat > "$ROOT/src/application/risk-reward/riskRewardChartSemantics.ts" <<'TS'
          import type { DecimalString, TradeSide } from '../../domain/trades';
          import type {
            RiskRewardAnalysis,
            RiskRewardAnalysisId,
          } from './riskRewardAnalysisContract';
          import {
            projectRiskRewardZoneSemantics,
            type RiskRewardZoneSemantics,
          } from './riskRewardZoneSemantics';

          export type RiskRewardChartLevelRole = 'entry' | 'stop' | 'target';

          export interface RiskRewardChartSemanticPriceLevel {
            readonly role: RiskRewardChartLevelRole;
            readonly price: DecimalString;
          }

          export interface RiskRewardChartSemanticLevels {
            readonly entry: RiskRewardChartSemanticPriceLevel;
            readonly stop: RiskRewardChartSemanticPriceLevel;
            readonly target: RiskRewardChartSemanticPriceLevel;
          }

          export interface RiskRewardChartSemantics {
            readonly id: RiskRewardAnalysisId;
            readonly side: TradeSide;
            readonly levels: RiskRewardChartSemanticLevels;
            readonly zones: RiskRewardZoneSemantics;
          }

          export function projectRiskRewardChartSemantics(
            analysis: RiskRewardAnalysis,
          ): RiskRewardChartSemantics {
            return {
              id: analysis.id,
              side: analysis.side,
              levels: {
                entry: { role: 'entry', price: analysis.levels.entry },
                stop: { role: 'stop', price: analysis.levels.stop },
                target: { role: 'target', price: analysis.levels.target },
              },
              zones: projectRiskRewardZoneSemantics(analysis),
            };
          }
          TS

          cat > "$ROOT/src/application/risk-reward/index.ts" <<'TS'
          export * from './riskRewardAnalysisContract';
          export * from './riskRewardZoneSemantics';
          export * from './riskRewardChartSemantics';
          TS

          cat > "$ROOT/tests/risk-reward-chart-semantics.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import {
            projectRiskRewardChartSemantics,
            type RiskRewardAnalysis,
          } from '../src/application/risk-reward';
          import { parsePositiveDecimalString } from '../src/domain/trades';

          function decimal(value: string) {
            const parsed = parsePositiveDecimalString(value);
            if (!parsed.ok) throw new Error(`invalid test decimal: ${value}`);
            return parsed.value;
          }

          function analysis(side: 'long' | 'short', entry: string, stop: string, target: string): RiskRewardAnalysis {
            return {
              id: `risk-reward-chart-${side}`,
              side,
              levels: {
                entry: decimal(entry),
                stop: decimal(stop),
                target: decimal(target),
              },
            };
          }

          describe('P19.3 Risk/Reward chart composition semantic contract', () => {
            it('composes identity, side, three semantic price levels, and P19.2 zones without rendering ownership', () => {
              expect(projectRiskRewardChartSemantics(analysis('long', '100', '90', '120'))).toEqual({
                id: 'risk-reward-chart-long',
                side: 'long',
                levels: {
                  entry: { role: 'entry', price: decimal('100') },
                  stop: { role: 'stop', price: decimal('90') },
                  target: { role: 'target', price: decimal('120') },
                },
                zones: {
                  risk: { role: 'risk', from: decimal('100'), to: decimal('90') },
                  reward: { role: 'reward', from: decimal('100'), to: decimal('120') },
                },
              });
            });

            it('preserves short-side source price ordering and semantic roles without normalization', () => {
              expect(projectRiskRewardChartSemantics(analysis('short', '100', '110', '80'))).toEqual({
                id: 'risk-reward-chart-short',
                side: 'short',
                levels: {
                  entry: { role: 'entry', price: decimal('100') },
                  stop: { role: 'stop', price: decimal('110') },
                  target: { role: 'target', price: decimal('80') },
                },
                zones: {
                  risk: { role: 'risk', from: decimal('100'), to: decimal('110') },
                  reward: { role: 'reward', from: decimal('100'), to: decimal('80') },
                },
              });
            });
          });
          TS

          cat > "$ROOT/scripts/verify-p19-3-risk-reward-chart-composition-semantic-contract.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../src/application/risk-reward/riskRewardChartSemantics.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/application/risk-reward/index.ts', import.meta.url), 'utf8');
          const test = readFileSync(new URL('../tests/risk-reward-chart-semantics.test.ts', import.meta.url), 'utf8');

          for (const token of [
            "export type RiskRewardChartLevelRole = 'entry' | 'stop' | 'target'",
            'export interface RiskRewardChartSemanticPriceLevel',
            'readonly price: DecimalString',
            'export interface RiskRewardChartSemanticLevels',
            'readonly entry: RiskRewardChartSemanticPriceLevel',
            'readonly stop: RiskRewardChartSemanticPriceLevel',
            'readonly target: RiskRewardChartSemanticPriceLevel',
            'export interface RiskRewardChartSemantics',
            'readonly id: RiskRewardAnalysisId',
            'readonly side: TradeSide',
            'readonly zones: RiskRewardZoneSemantics',
            'export function projectRiskRewardChartSemantics',
            'id: analysis.id',
            'side: analysis.side',
            "entry: { role: 'entry', price: analysis.levels.entry }",
            "stop: { role: 'stop', price: analysis.levels.stop }",
            "target: { role: 'target', price: analysis.levels.target }",
            'zones: projectRiskRewardZoneSemantics(analysis)',
          ]) {
            if (!source.includes(token)) throw new Error(`P19.3 chart semantics missing: ${token}`);
          }
          for (const forbidden of [
            'lightweight-charts', 'ChartDrawing', 'IndexedDB', 'Dexie', 'localStorage',
            'fetch(', 'WebSocket', 'calculateTradeMetrics', 'calculateRisk', 'calculateRMultiple',
            'Decimal(', 'Math.min', 'Math.max', 'TradeExecutionRecord', 'TradePlanRecord',
            'TradeRecord', 'timestamp', 'time:', 'color:', 'fill:', 'style:', 'document.', 'window.',
          ]) {
            if (source.includes(forbidden)) throw new Error(`P19.3 chart semantics owns forbidden concern: ${forbidden}`);
          }
          if (!index.includes("from './riskRewardChartSemantics'")) throw new Error('P19.3 risk-reward barrel does not export chart semantics');
          for (const token of [
            "analysis('long', '100', '90', '120')",
            "entry: { role: 'entry'",
            "stop: { role: 'stop'",
            "target: { role: 'target'",
            "risk: { role: 'risk'",
            "reward: { role: 'reward'",
            "analysis('short', '100', '110', '80')",
            'without normalization',
          ]) {
            if (!test.includes(token)) throw new Error(`P19.3 focused test missing: ${token}`);
          }
          console.log('P19.3 Risk/Reward chart composition semantic contract verification passed.');
          JS

          cat > "$ROOT/KAIROS_P19_3_RISK_REWARD_CHART_COMPOSITION_SEMANTIC_CONTRACT_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P19.3 — Risk/Reward Chart Composition Semantic Contract

          ## Authority
          Base: canonical P19.2 Risk/Reward Zone Semantics Projection, `Kairos Controlled Roadmap Gate` run #275 / `34012163133`.

          ## Scope
          Adds one provider-neutral P19-owned chart-composition semantic projection. It preserves the Risk/Reward analysis identity and side, exposes three semantic price levels (`entry`, `stop`, `target`), and composes the already-authoritative P19.2 semantic zones (`risk`, `reward`) into one immutable RR-specific chart semantic model.

          Semantic roles only are owned here. P2/P3 remain styling/token/color owners.

          ## Non-scope
          No ratio/R math, price-order or side validation, price normalization, chart timestamp/span/screen geometry, provider or Lightweight Charts APIs, P18 `ChartDrawing` widening, DOM/UI/tool controls, edit/drag/delete lifecycle, P20 persistence, P14 journal/execution writes, hard-coded visual colors, or P11 calculation duplication.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p19candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p19:3-risk-reward-chart-composition-semantic-contract']='node scripts/verify-p19-3-risk-reward-chart-composition-semantic-contract.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_3_RISK_REWARD_CHART_COMPOSITION_SEMANTIC_CONTRACT_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-3-risk-reward-chart-composition-semantic-contract.mjs',
            'src/application/risk-reward/index.ts',
            'src/application/risk-reward/riskRewardChartSemantics.ts',
            'tests/risk-reward-chart-semantics.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P19.3 before packaging
        working-directory: .p19candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p19:3-risk-reward-chart-composition-semantic-contract
          npx vitest run tests/risk-reward-chart-semantics.test.ts tests/risk-reward-zone-semantics.test.ts tests/risk-reward-analysis-contract.test.ts
          npm run typecheck
          npm run build
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p19candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_3_RISK_REWARD_CHART_COMPOSITION_SEMANTIC_CONTRACT_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-3-risk-reward-chart-composition-semantic-contract.mjs',
            'src/application/risk-reward/index.ts',
            'src/application/risk-reward/riskRewardChartSemantics.ts',
            'tests/risk-reward-chart-semantics.test.ts',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p19candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P19.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p19candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P19.3 Risk Reward chart composition semantic contract candidate'
          git push
