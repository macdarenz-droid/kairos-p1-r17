name: Kairos Ordering Helper JSON Transfer Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ordering-helper-json-transfer.yml'

permissions:
  contents: write

concurrency:
  group: kairos-ordering-helper-json-transfer-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair transfer parser and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/live-market-universe-quote-volume-ordering-policy-reconstruct.yml')
          s=p.read_text()
          old="payload=json.loads(os.environ['PAYLOAD_JSON'])"
          new="payload=json.loads(os.environ['PAYLOAD_JSON'], strict=False)"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one transfer parser occurrence, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          rm .github/workflows/repair-ordering-helper-json-transfer.yml
          git config user.name 'kairos-automation'
          git config user.email 'kairos-automation@users.noreply.github.com'
          git add .github/workflows/live-market-universe-quote-volume-ordering-policy-reconstruct.yml .github/workflows/repair-ordering-helper-json-transfer.yml
          git diff --cached --check
          git commit -m 'helper: repair ordering reconstruction JSON transfer parser'
          git push origin HEAD:main
