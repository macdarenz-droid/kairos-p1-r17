name: Kairos Binance Spot Exchange Info Public REST Round Trip Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-spot-exchange-info-public-rest-round-trip-reconstruct.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_RESPONSE_DELIVERY_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-09.zip
      OUT_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_ROUND_TRIP_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-09.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Reconstruct exact round-trip composition
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .base .candidate
          mkdir .base .candidate
          unzip -q "$BASE_ZIP" -d .base
          cp -a .base/. .candidate/
          ROOT=.candidate/kairos_p76
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequest.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestResponseDelivery.ts"
          cat > "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRoundTrip.ts" <<'TS'
          import {
            describeBinanceSpotExchangeInfoPublicRestRequest,
          } from './binanceSpotExchangeInfoPublicRestRequest';
          import {
            executeBinanceSpotExchangeInfoPublicRestRequest,
            type BinanceSpotExchangeInfoPublicRestRequestConnector,
            type BinanceSpotExchangeInfoPublicRestExecutionOptions,
          } from './binanceSpotExchangeInfoPublicRestRequestExecution';
          import {
            mapBinanceSpotExchangeInfoPublicRestResponseDelivery,
          } from './binanceSpotExchangeInfoPublicRestResponseDelivery';

          export async function composeBinanceSpotExchangeInfoPublicRestRoundTrip(
            connect: BinanceSpotExchangeInfoPublicRestRequestConnector<unknown>,
            options?: BinanceSpotExchangeInfoPublicRestExecutionOptions,
          ) {
            const request = describeBinanceSpotExchangeInfoPublicRestRequest();
            const data = options === undefined
              ? await executeBinanceSpotExchangeInfoPublicRestRequest(request, connect)
              : await executeBinanceSpotExchangeInfoPublicRestRequest(request, connect, options);
            return mapBinanceSpotExchangeInfoPublicRestResponseDelivery(data);
          }
          TS
          python - <<'PY'
          from pathlib import Path
          p=Path('.candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          anchor="export * from './providers/binance/binanceSpotExchangeInfoPublicRestResponseDelivery';\n"
          addition="export * from './providers/binance/binanceSpotExchangeInfoPublicRestRoundTrip';\n"
          if anchor not in s: raise SystemExit('response-delivery export anchor missing')
          if addition not in s: s=s.replace(anchor, anchor+addition, 1)
          p.write_text(s)
          PY
          cat > "$ROOT/tests/binance-spot-exchange-info-public-rest-round-trip.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import { composeBinanceSpotExchangeInfoPublicRestRoundTrip } from '../src/services/market-data';

          describe('Binance Spot exchangeInfo public REST round-trip composition foundation', () => {
            it('composes descriptor, exactly one injected execution and released response delivery', async () => {
              const connect = vi.fn(async (request: { readonly url: string }) => {
                expect(request.url).toBe('https://data-api.binance.vision/api/v3/exchangeInfo');
                return JSON.stringify({ symbols: [{ symbol: 'BTCUSDT', status: 'TRADING', baseAsset: 'BTC', quoteAsset: 'USDT' }] });
              });
              const result = await composeBinanceSpotExchangeInfoPublicRestRoundTrip(connect);
              expect(connect).toHaveBeenCalledTimes(1);
              expect(result.ok).toBe(true);
            });

            it('forwards caller-owned execution options without owning cancellation policy', async () => {
              const controller = new AbortController();
              const connect = vi.fn(async (_request: unknown, options?: { readonly signal?: AbortSignal }) => {
                expect(options?.signal).toBe(controller.signal);
                return JSON.stringify({ symbols: [] });
              });
              await composeBinanceSpotExchangeInfoPublicRestRoundTrip(connect, { signal: controller.signal });
              expect(connect).toHaveBeenCalledTimes(1);
            });

            it('preserves connector rejection unchanged', async () => {
              const failure = new Error('connector-owned-failure');
              const connect = vi.fn(async () => { throw failure; });
              await expect(composeBinanceSpotExchangeInfoPublicRestRoundTrip(connect)).rejects.toBe(failure);
              expect(connect).toHaveBeenCalledTimes(1);
            });

            it('passes through released response-delivery failures', async () => {
              await expect(composeBinanceSpotExchangeInfoPublicRestRoundTrip(async () => '{"symbols":'))
                .resolves.toEqual({ ok: false, reason: 'invalid-json' });
            });
          });
          TS
          cat > "$ROOT/KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_ROUND_TRIP_COMPOSITION_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # Binance Spot Exchange Information Public REST Round Trip Composition Foundation

          Base: canonical Gate #320 response-delivery composition GOLDEN.

          Responsibility: compose the already-released unconditional exchangeInfo request descriptor, injected execution seam and response-delivery seam for one round trip. Caller-owned execution options are forwarded only through the released execution owner. Connector rejection propagates unchanged.

          Non-scope: concrete transport/HTTP Response semantics, retry/backoff/rate policy, acquisition adapter/polling/resume, universe filtering/stablecoin exclusion/ranking/Top-N, freshness, Home/Bubble UI, Your Trades, persistence/chart/navigation/transitions.
          MD
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.candidate/kairos_p76/package.json')
          d=json.loads(p.read_text())
          d.setdefault('scripts',{})['verify:binance-spot-exchange-info-public-rest-round-trip']='node scripts/verify-binance-spot-exchange-info-public-rest-round-trip.mjs'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          cat > "$ROOT/scripts/verify-binance-spot-exchange-info-public-rest-round-trip.mjs" <<'JS'
          import fs from 'node:fs';
          const read=(p)=>fs.readFileSync(new URL(`../${p}`, import.meta.url),'utf8');
          const src=read('src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRoundTrip.ts');
          const idx=read('src/services/market-data/index.ts');
          if(!src.includes('const request = describeBinanceSpotExchangeInfoPublicRestRequest();')) throw new Error('unconditional descriptor composition missing');
          if(src.includes('described.ok') || src.includes('described.request')) throw new Error('round trip incorrectly treats unconditional exchangeInfo descriptor as a fallible request result');
          if(!src.includes('executeBinanceSpotExchangeInfoPublicRestRequest(request, connect)')) throw new Error('execution composition missing');
          if(!src.includes('executeBinanceSpotExchangeInfoPublicRestRequest(request, connect, options)')) throw new Error('execution options forwarding missing');
          if(!src.includes('mapBinanceSpotExchangeInfoPublicRestResponseDelivery(data)')) throw new Error('response delivery composition missing');
          if(!idx.includes("export * from './providers/binance/binanceSpotExchangeInfoPublicRestRoundTrip';")) throw new Error('index export missing');
          for (const forbidden of ['fetch(', 'XMLHttpRequest', 'WebSocket(', 'setTimeout(', 'setInterval(', 'indexedDB']) {
            if (src.includes(forbidden)) throw new Error(`round trip broadened into forbidden scope: ${forbidden}`);
          }
          console.log('exchangeInfo public REST round-trip verifier PASS');
          JS
      - name: Verify reconstructed round trip before packaging
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.candidate/kairos_p76
          cd "$ROOT"
          npm ci
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
          node -e "const p=require('./node_modules/lightweight-charts/package.json'); if(p.version!=='5.2.1') process.exit(1)"
          npm run verify:binance-spot-exchange-info-public-rest-round-trip
          npx vitest run tests/binance-spot-exchange-info-public-rest-round-trip.test.ts
          npm run typecheck
          npm run build
          npm test -- --run
      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -name '*.tsbuildinfo' -delete
          (cd .candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP" >/dev/null
          test "$(unzip -Z1 "$OUT_ZIP" | head -1)" = "kairos_p76/"
          sha256sum "$OUT_ZIP"
          git add "$OUT_ZIP"
          git config user.name 'kairos-autonomous'
          git config user.email 'kairos-autonomous@users.noreply.github.com'
          git commit -m 'candidate: exchangeInfo public REST round trip composition'
          git push origin HEAD:main
