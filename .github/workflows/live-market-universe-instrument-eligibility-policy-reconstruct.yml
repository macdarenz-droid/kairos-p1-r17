name: Kairos Live Market Universe Instrument Eligibility Policy Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-universe-instrument-eligibility-policy-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_INSTRUMENT_METADATA_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip
      OUT_ZIP: KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct instrument eligibility policy from canonical Gate325
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .eligibilitybase .eligibilitycandidate
          mkdir .eligibilitybase .eligibilitycandidate
          unzip -q "$BASE_ZIP" -d .eligibilitybase
          cp -a .eligibilitybase/. .eligibilitycandidate/
          ROOT=.eligibilitycandidate/kairos_p76
          SOURCE="$ROOT/src/services/market-data/liveMarketUniverseInstrumentEligibilityPolicy.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          REPORT="$ROOT/KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_REPORT_2026-09-09.md"
          TEST="$ROOT/tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts"
          VERIFY="$ROOT/scripts/verify-live-market-universe-instrument-eligibility-policy-foundation.mjs"

          test -f "$ROOT/src/services/market-data/liveMarketUniverseInstrumentMetadataFact.ts"
          test -f "$INDEX"

          cat > "$SOURCE" <<'TS'
          import type { LiveMarketUniverseInstrumentMetadataFact } from './liveMarketUniverseInstrumentMetadataFact';

          export interface LiveMarketUniverseInstrumentEligibilityPolicyOptions {
            readonly excludedStablecoinBaseAssets: ReadonlySet<string>;
          }

          /**
           * Deterministic product policy for Live Crypto V1 instrument eligibility only.
           * Ranking, limiting, freshness/cadence, state and presentation remain separate owners.
           */
          export function isLiveMarketUniverseInstrumentEligible(
            fact: LiveMarketUniverseInstrumentMetadataFact,
            options: LiveMarketUniverseInstrumentEligibilityPolicyOptions,
          ): boolean {
            return fact.tradingEnabled
              && fact.quoteAsset === 'USDT'
              && !options.excludedStablecoinBaseAssets.has(fact.baseAsset);
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.eligibilitycandidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './liveMarketUniverseInstrumentEligibilityPolicy';\n"
          if line not in s:
              anchor="export * from './liveMarketUniverseInstrumentMetadataFact';\n"
              if anchor not in s: raise SystemExit('canonical metadata-fact export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$TEST" <<'TS'
          import { describe, expect, it } from 'vitest';
          import {
            isLiveMarketUniverseInstrumentEligible,
            type LiveMarketUniverseInstrumentMetadataFact,
          } from '../src/services/market-data';

          const fact: LiveMarketUniverseInstrumentMetadataFact = {
            instrument: { venue: 'binance-spot', symbol: 'BTCUSDT' },
            baseAsset: 'BTC',
            quoteAsset: 'USDT',
            tradingEnabled: true,
          };

          describe('Live Market Universe instrument eligibility policy foundation', () => {
            it('accepts an actively tradable USDT-quoted instrument not in the configured stablecoin exclusion set', () => {
              expect(isLiveMarketUniverseInstrumentEligible(fact, {
                excludedStablecoinBaseAssets: new Set(['USDC', 'USDT']),
              })).toBe(true);
            });

            it('rejects metadata facts that are not currently trading', () => {
              expect(isLiveMarketUniverseInstrumentEligible({ ...fact, tradingEnabled: false }, {
                excludedStablecoinBaseAssets: new Set(),
              })).toBe(false);
            });

            it('rejects non-USDT quote assets without inferring eligibility from symbol suffixes', () => {
              expect(isLiveMarketUniverseInstrumentEligible({
                ...fact,
                instrument: { venue: 'binance-spot', symbol: 'BTCUSDT' },
                quoteAsset: 'FDUSD',
              }, {
                excludedStablecoinBaseAssets: new Set(),
              })).toBe(false);
            });

            it('applies only the explicit caller-configured stablecoin base-asset exclusion set', () => {
              const usdc = {
                ...fact,
                instrument: { venue: 'binance-spot', symbol: 'USDCUSDT' },
                baseAsset: 'USDC',
              };
              expect(isLiveMarketUniverseInstrumentEligible(usdc, {
                excludedStablecoinBaseAssets: new Set(['USDC']),
              })).toBe(false);
              expect(isLiveMarketUniverseInstrumentEligible(usdc, {
                excludedStablecoinBaseAssets: new Set(),
              })).toBe(true);
            });
          });
          TS

          cat > "$REPORT" <<'MD'
          # KAIROS — Live Market Universe Instrument Eligibility Policy Foundation

          ## Authority
          Base: exact canonical Gate #325 Binance Spot exchangeInfo Browser Instrument Metadata Acquisition Binding Foundation, run `34289145300`.

          ## Source-proven responsibility
          Released `LiveMarketUniverseInstrumentMetadataFact` carries authoritative `instrument`, `baseAsset`, `quoteAsset`, and `tradingEnabled` truth specifically for later caller-owned universe policy. Canonical exchangeInfo acquisition layers deliberately exclude USDT eligibility and stablecoin exclusion. The user-approved Live Crypto V1 contract requires actively tradable Binance Spot instruments quoted in USDT with an explicit configurable stablecoin-exclusion set.

          ## Contract
          - Consume only a released `LiveMarketUniverseInstrumentMetadataFact` plus caller-owned policy options.
          - Eligible requires `tradingEnabled === true`.
          - Eligible requires exact authoritative `quoteAsset === 'USDT'`.
          - Eligible requires the authoritative `baseAsset` not be present in the explicit caller-configured `excludedStablecoinBaseAssets` set.
          - Return a deterministic boolean only; do not mutate facts or configuration.

          ## Explicit non-scope
          - No 24h quote-volume ranking or sorting.
          - No equal-volume symbol tie-break.
          - No Top-N or Top-30 selection/limiting.
          - No market-summary joins, provider requests, transport, decode or mapping.
          - No observedAt/freshness thresholds, cadence, polling, visibility/resume/session lifecycle or state.
          - No persistence, Home/Live Crypto Bubble Map UI, Your Trades/journal, chart, navigation or transitions.
          MD

          cat > "$VERIFY" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/liveMarketUniverseInstrumentEligibilityPolicy.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_REPORT_2026-09-09.md', import.meta.url), 'utf8');

          for (const token of [
            'LiveMarketUniverseInstrumentMetadataFact',
            'excludedStablecoinBaseAssets: ReadonlySet<string>',
            'isLiveMarketUniverseInstrumentEligible(',
            'fact.tradingEnabled',
            "fact.quoteAsset === 'USDT'",
            '!options.excludedStablecoinBaseAssets.has(fact.baseAsset)',
          ]) if (!source.includes(token)) throw new Error(`eligibility policy evidence missing: ${token}`);

          if (!index.includes("export * from './liveMarketUniverseInstrumentEligibilityPolicy';")) throw new Error('eligibility policy public export missing');

          for (const forbidden of [
            '.sort(', 'quoteVolume24h', 'Top 30', 'slice(', 'Date.now(', 'new Date(',
            'setInterval(', 'setTimeout(', 'fetch(', 'XMLHttpRequest', 'WebSocket(',
            'JSON.parse(', 'indexedDB', 'createChart(', 'React', 'useEffect',
          ]) if (source.includes(forbidden)) throw new Error(`eligibility policy broadened into forbidden scope: ${forbidden}`);

          for (const token of [
            'Gate #325',
            'actively tradable Binance Spot instruments quoted in USDT',
            'explicit configurable stablecoin-exclusion set',
            'No 24h quote-volume ranking or sorting',
            'No Top-N or Top-30 selection/limiting',
            'No observedAt/freshness thresholds',
          ]) if (!report.includes(token)) throw new Error(`eligibility report evidence missing: ${token}`);

          console.log('Live Market Universe instrument eligibility policy verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.eligibilitycandidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:live-market-universe-instrument-eligibility-policy-foundation']='node scripts/verify-live-market-universe-instrument-eligibility-policy-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.eligibilitybase/kairos_p76'))):p.read_bytes() for p in Path('.eligibilitybase/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.eligibilitycandidate/kairos_p76'))):p.read_bytes() for p in Path('.eligibilitycandidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-live-market-universe-instrument-eligibility-policy-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/liveMarketUniverseInstrumentEligibilityPolicy.ts',
            'tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts',
          }
          print('Gate325 -> instrument eligibility policy changed files:', *sorted(changed), sep='\n- ')
          if changed != expected: raise SystemExit(f'exact eligibility-policy scope mismatch: {sorted(changed ^ expected)}')
          PY

      - name: Verify reconstructed eligibility policy before packaging
        working-directory: .eligibilitycandidate/kairos_p76
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:live-market-universe-instrument-eligibility-policy-foundation
          npx vitest run tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts tests/live-market-universe-instrument-metadata-fact-contract-foundation.test.ts
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const name of scripts){
            const r=spawnSync('npm',['run',name],{stdio:'inherit'});
            if(r.status!==0) process.exit(r.status||1);
          }
          NODE

      - name: Restore clean package boundary, package candidate, and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.eligibilitycandidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .eligibilitycheck
          mkdir .eligibilitycheck
          (cd .eligibilitycandidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          unzip -q "$OUT_ZIP" -d .eligibilitycheck
          test -d .eligibilitycheck/kairos_p76
          test ! -e .eligibilitycheck/kairos_p76/node_modules
          test ! -e .eligibilitycheck/kairos_p76/dist
          node .eligibilitycheck/kairos_p76/scripts/verify-live-market-universe-instrument-eligibility-policy-foundation.mjs
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          p=Path('KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip')
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}
            for i in z.infolist():
              parts=PurePosixPath(i.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          PY
          sha256sum "$OUT_ZIP"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_ZIP"
          git rm --ignore-unmatch .github/workflows/live-market-universe-instrument-eligibility-policy-reconstruct.yml
          git commit -m 'Add Live Market Universe instrument eligibility policy candidate'
          git push
