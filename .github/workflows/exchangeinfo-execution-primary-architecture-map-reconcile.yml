name: Kairos ExchangeInfo Execution Primary Architecture Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exchangeinfo-execution-primary-architecture-map-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify exact canonical ancestry and append-only architecture update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "c1e44fdaaa028fe4031f4923a802f7e035ef77e7"
          test "$(git diff --name-only HEAD^^ HEAD)" = ".github/workflows/exchangeinfo-execution-primary-architecture-map-reconcile.yml"
          map='docs/KAIROS_ARCHITECTURE_MAP.md'
          cp "$map" /tmp/KAIROS_ARCHITECTURE_MAP.before.md
          ! grep -Fq 'Canonical Binance Spot exchangeInfo public REST request execution-boundary checkpoint — gate #315' "$map"
          printf '%s' '' | base64 --decode >> "$map"
          python3 -c "from pathlib import Path; b=Path('/tmp/KAIROS_ARCHITECTURE_MAP.before.md').read_bytes(); a=Path('docs/KAIROS_ARCHITECTURE_MAP.md').read_bytes(); assert a.startswith(b) and len(a)>len(b)"
          test "$(git diff --name-only)" = "$map"
          added=$(git diff --numstat -- "$map" | awk '{print $1}')
          deleted=$(git diff --numstat -- "$map" | awk '{print $2}')
          test -n "$added"
          test "$deleted" = "0"
          grep -Fq 'binanceSpotExchangeInfoPublicRestRequestExecution.ts' "$map"
          grep -Fq 'a861e0525b4d8ffb34dbed13a3cc270d4e18be9170bdb9de3f1e3db1f25c8a42' "$map"

      - name: Commit reconciled architecture map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/KAIROS_ARCHITECTURE_MAP.md
          git commit -m 'docs: reconcile exchangeInfo execution boundary canonical ownership'
          git push origin HEAD:main
