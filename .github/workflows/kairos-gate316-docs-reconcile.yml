name: Kairos Gate 316 Living Docs Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kairos-gate316-docs-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append canonical gate 316 architecture checkpoint
        env:
          CHECKPOINT_B64: 
        run: |
          python -c "import base64,os,pathlib; p=pathlib.Path('docs/KAIROS_ARCHITECTURE_MAP.md'); marker='## Canonical Binance Spot exchangeInfo public REST response decode checkpoint — gate #316'; text=p.read_text(); section=base64.b64decode(os.environ['CHECKPOINT_B64']).decode(); p.write_text(text if marker in text else text.rstrip()+'\\n\\n'+section)"
          git config user.name kairos-docs-bot
          git config user.email actions@users.noreply.github.com
          git add docs/KAIROS_ARCHITECTURE_MAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: record canonical gate 316 response decode'
          git push origin HEAD:main
