name: Kairos Gate 316 Living Docs Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kairos-gate316-docs-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append canonical gate 316 architecture checkpoint
        shell: bash
        run: |
          set -euo pipefail
          marker='## Canonical Binance Spot exchangeInfo public REST response decode checkpoint — gate #316'
          if grep -Fq "$marker" docs/KAIROS_ARCHITECTURE_MAP.md; then
            echo 'Gate 316 checkpoint already present.'
            exit 0
          fi
          printf '\n\n' >> docs/KAIROS_ARCHITECTURE_MAP.md
          cat .github/kairos-tmp/gate316-architecture-checkpoint.md >> docs/KAIROS_ARCHITECTURE_MAP.md
          git config user.name kairos-docs-bot
          git config user.email actions@users.noreply.github.com
          git add docs/KAIROS_ARCHITECTURE_MAP.md
          git commit -m 'docs: record canonical gate 316 response decode'
          git push origin HEAD:main
