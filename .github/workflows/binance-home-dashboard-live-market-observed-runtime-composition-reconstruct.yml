name: Kairos Binance Home Dashboard Live Market Observed Runtime Composition Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-home-dashboard-live-market-observed-runtime-composition-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-binance-home-dashboard-live-market-observed-runtime-composition-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify observed-runtime composition from Gate340 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip
          OUT_ZIP=KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip
          WORK="$RUNNER_TEMP/observed-runtime-composition-work"
          BASE="$RUNNER_TEMP/observed-runtime-composition-base"
          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1580635"
          echo "04b95a7cc3103fae230153af07e53fa12fea566f9990c3b090a1c99055f2e117  $BASE_ZIP" | sha256sum -c -
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/binanceHomeDashboardLiveMarketRuntimeBootstrap.ts"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge.ts"
          test ! -e "$ROOT/src/app/binanceHomeDashboardLiveMarketObservedRuntimeComposition.ts"

          cat > "$ROOT/src/app/binanceHomeDashboardLiveMarketObservedRuntimeComposition.ts" <<'TS'
          import type { BinanceSpot24hPublicRestBaselineObservedAtSource } from '../services/market-data';
          import {
            createHomeDashboardLiveMarketSummaryFreshnessObservationObserver,
            type HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource,
            type HomeDashboardLiveMarketSummaryFreshnessObservationSink,
          } from '../application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge';
          import {
            startBinanceHomeDashboardLiveMarketRuntime,
            type BinanceHomeDashboardLiveMarketRuntimeBootstrapOptions,
            type BinanceHomeDashboardLiveMarketRuntimeBootstrapResult,
          } from './binanceHomeDashboardLiveMarketRuntimeBootstrap';
          import type { HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions } from './homeDashboardLiveMarketSummaryBrowserLifecycleAdapter';

          export interface BinanceHomeDashboardLiveMarketObservedRuntimeCompositionOptions
            extends Omit<BinanceHomeDashboardLiveMarketRuntimeBootstrapOptions, 'lifecycle'> {
            readonly lifecycle?: Omit<HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions, 'observer'>;
            readonly observationSink?: HomeDashboardLiveMarketSummaryFreshnessObservationSink;
          }

          /**
           * App-level, non-presentation composition that gives this boundary sole
           * ownership of the Home lifecycle observer slot while preserving all
           * released acquisition, universe, browser lifecycle, and close semantics.
           */
          export function startBinanceHomeDashboardLiveMarketObservedRuntime(
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
            readEvaluationTimeMs: HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource,
            options: BinanceHomeDashboardLiveMarketObservedRuntimeCompositionOptions,
          ): Promise<BinanceHomeDashboardLiveMarketRuntimeBootstrapResult> {
            const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
              readEvaluationTimeMs,
              options.observationSink,
            );
            const lifecycle: HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions = {
              ...options.lifecycle,
              observer,
            };
            return startBinanceHomeDashboardLiveMarketRuntime(readObservedAt, {
              universe: options.universe,
              lifecycle,
            });
          }
          TS

          cat > "$ROOT/tests/binance-home-dashboard-live-market-observed-runtime-composition-foundation.test.ts" <<'TS'
          import { beforeEach, describe, expect, it, vi } from 'vitest';

          const mocks = vi.hoisted(() => {
            const observer = { onResult: vi.fn(), onError: vi.fn() };
            return {
              observer,
              createObserver: vi.fn(() => observer),
              startRuntime: vi.fn(),
            };
          });

          vi.mock('../src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge', () => ({
            createHomeDashboardLiveMarketSummaryFreshnessObservationObserver: mocks.createObserver,
          }));

          vi.mock('../src/app/binanceHomeDashboardLiveMarketRuntimeBootstrap', () => ({
            startBinanceHomeDashboardLiveMarketRuntime: mocks.startRuntime,
          }));

          import { startBinanceHomeDashboardLiveMarketObservedRuntime } from '../src/app/binanceHomeDashboardLiveMarketObservedRuntimeComposition';

          describe('Binance Home Dashboard Live Market Observed Runtime Composition Foundation', () => {
            beforeEach(() => {
              mocks.createObserver.mockClear();
              mocks.startRuntime.mockReset();
            });

            it('creates exactly one freshness observer and delegates once while preserving caller options by reference', async () => {
              const runtimeResult = { ok: true, runtime: { instruments: [], close: vi.fn() } } as const;
              mocks.startRuntime.mockResolvedValue(runtimeResult);
              const readObservedAt = vi.fn(() => '2026-09-10T00:00:00.000Z');
              const readEvaluationTimeMs = vi.fn(() => Date.parse('2026-09-10T00:00:01.000Z'));
              const observationSink = { onObservation: vi.fn(), onError: vi.fn() };
              const browserDocument = {} as never;
              const timer = {} as never;
              const universe = { excludedStablecoinBaseAssets: new Set<string>(), topCount: 30 } as never;

              const result = await startBinanceHomeDashboardLiveMarketObservedRuntime(
                readObservedAt,
                readEvaluationTimeMs,
                {
                  universe,
                  lifecycle: { document: browserDocument, timer },
                  observationSink,
                },
              );

              expect(mocks.createObserver).toHaveBeenCalledTimes(1);
              expect(mocks.createObserver).toHaveBeenCalledWith(readEvaluationTimeMs, observationSink);
              expect(mocks.startRuntime).toHaveBeenCalledTimes(1);
              expect(mocks.startRuntime).toHaveBeenCalledWith(readObservedAt, {
                universe,
                lifecycle: {
                  document: browserDocument,
                  timer,
                  observer: mocks.observer,
                },
              });
              expect(readObservedAt).not.toHaveBeenCalled();
              expect(readEvaluationTimeMs).not.toHaveBeenCalled();
              expect(result).toBe(runtimeResult);
            });

            it('owns the observer slot even when no document/timer overrides are supplied and preserves a failed bootstrap result unchanged', async () => {
              const runtimeResult = { ok: false, reason: 'acquisition-failed' } as const;
              mocks.startRuntime.mockResolvedValue(runtimeResult);
              const readObservedAt = vi.fn(() => '2026-09-10T00:00:00.000Z');
              const readEvaluationTimeMs = vi.fn(() => 0);
              const universe = {} as never;

              const result = await startBinanceHomeDashboardLiveMarketObservedRuntime(
                readObservedAt,
                readEvaluationTimeMs,
                { universe },
              );

              expect(mocks.createObserver).toHaveBeenCalledTimes(1);
              expect(mocks.startRuntime).toHaveBeenCalledWith(readObservedAt, {
                universe,
                lifecycle: { observer: mocks.observer },
              });
              expect(result).toBe(runtimeResult);
            });
          });
          TS

          cat > "$ROOT/KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_REPORT_2026-09-10.md" <<'MD'
          # Binance Home Dashboard Live Market Observed Runtime Composition Foundation

          ## Authority
          Base: exact canonical Gate340 Home lifecycle-result freshness-observation bridge candidate, promoted by `Kairos Controlled Roadmap Gate` #340 / run `34414358508`.

          ## Source-proven responsibility
          Gate337 already owns the one-shot Binance Home universe bootstrap, summary-state session, scoped-snapshot port and browser lifecycle adapter. Gate340 separately owns construction of the provider-neutral freshness-observation lifecycle observer. The released Gate337 bootstrap accepts the lifecycle observer slot but no app-level owner yet composes the two.

          This slice adds only that app-level non-presentation composition. It accepts the caller-owned acquisition observation-time source and the separate caller-owned freshness evaluation-time source. Its options preserve the released universe options and allow only document/timer lifecycle overrides; the lifecycle `observer` field is deliberately omitted from the public options type so this composition owns that slot unambiguously. It creates exactly one Gate340 observer, forwards the optional Gate340 observation sink unchanged, builds one lifecycle options object preserving caller document/timer references, delegates exactly once to Gate337, and returns Gate337's bootstrap result unchanged.

          ## Preserved edge behavior
          Because all execution delegates to Gate337 unchanged, initial universe `acquisition-failed` remains unchanged before any lifecycle result exists; an authoritative empty selected scope remains Gate337's successful idle runtime and therefore emits no lifecycle observation; a non-empty scope continues to use the existing browser lifecycle; and `close` remains Gate337/lifecycle ownership. Observer construction itself reads neither caller-owned time source.

          ## Explicit non-scope
          No React/Home/Bubble rendering or state; no stale/expired visual treatment; no bubble geometry/size/color/interactions; no provider transport/decode/mapping; no active-USDT/stablecoin/ranking/Top-N policy; no new clock or freshness thresholds; no acquisition cadence, visibility scheduling, retry/backoff or universe refresh; no persistence/IndexedDB; no navigation, Your Trades, journal, chart, Risk/Reward, Calculation Brain, Saved Analysis or transition ownership.
          MD

          cat > "$ROOT/scripts/verify-binance-home-dashboard-live-market-observed-runtime-composition-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/app/binanceHomeDashboardLiveMarketObservedRuntimeComposition.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_REPORT_2026-09-10.md', import.meta.url), 'utf8');

          for (const token of [
            'startBinanceHomeDashboardLiveMarketObservedRuntime',
            "extends Omit<BinanceHomeDashboardLiveMarketRuntimeBootstrapOptions, 'lifecycle'>",
            "Omit<HomeDashboardLiveMarketSummaryBrowserLifecycleAdapterOptions, 'observer'>",
            'createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(',
            'readEvaluationTimeMs,',
            'options.observationSink,',
            '...options.lifecycle,',
            'observer,',
            'startBinanceHomeDashboardLiveMarketRuntime(readObservedAt, {',
            'universe: options.universe,',
            'lifecycle,',
          ]) if (!source.includes(token)) throw new Error(`observed-runtime composition evidence missing: ${token}`);

          for (const forbidden of [
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'fetch(', 'XMLHttpRequest', 'WebSocket(',
            'document.', 'visibilityState', 'indexedDB', 'useEffect', 'useState', 'React',
            '.sort(', '.filter(', '.reduce(', '15_000', '60_000', 'freshMaxAgeMs', 'staleMaxAgeMs',
            'acquireBinanceSpotBrowserLiveMarketUniverseOnce', 'createLiveMarketSummaryStateSession',
            'createBinanceHomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort',
            'createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter(',
          ]) if (source.includes(forbidden)) throw new Error(`observed-runtime composition broadened ownership: ${forbidden}`);

          for (const token of [
            'app-level non-presentation composition',
            'lifecycle `observer` field is deliberately omitted',
            'creates exactly one Gate340 observer',
            "returns Gate337's bootstrap result unchanged",
            'No React/Home/Bubble rendering',
          ]) if (!report.includes(token)) throw new Error(`observed-runtime composition report evidence missing: ${token}`);

          console.log('Binance Home Dashboard Live Market Observed Runtime Composition Foundation verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.env.ROOT+'/package.json','utf8'));
          p.scripts ||= {};
          p.scripts['verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation']='node scripts/verify-binance-home-dashboard-live-market-observed-runtime-composition-foundation.mjs';
          fs.writeFileSync(process.env.ROOT+'/package.json', JSON.stringify(p,null,2)+'\n');
          NODE

          cd "$ROOT"
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation
          npm run verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation
          npm run verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation
          npm run typecheck
          npm run build
          npx vitest run \
            tests/binance-home-dashboard-live-market-observed-runtime-composition-foundation.test.ts \
            tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts \
            tests/binance-home-dashboard-live-market-runtime-bootstrap-foundation.test.ts \
            tests/home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation.test.ts \
            tests/home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation',
            'verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_REPORT_2026-09-10.md',
            'package.json',
            'scripts/verify-binance-home-dashboard-live-market-observed-runtime-composition-foundation.mjs',
            'src/app/binanceHomeDashboardLiveMarketObservedRuntimeComposition.ts',
            'tests/binance-home-dashboard-live-market-observed-runtime-composition-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          ROOT: ${{ runner.temp }}/observed-runtime-composition-work/kairos_p76
          BASE: ${{ runner.temp }}/observed-runtime-composition-base
          WORK: ${{ runner.temp }}/observed-runtime-composition-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_CANDIDATE
          path: KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Binance Home observed-runtime composition'
          git push origin HEAD:main
