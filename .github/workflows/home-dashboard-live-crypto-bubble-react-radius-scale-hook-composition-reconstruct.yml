name: Kairos Home Dashboard Live Crypto Bubble React Radius Scale Hook Composition Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify Home Bubble React radius-scale hook composition from Gate365 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_VIEW_MODEL_FOUNDATION_CANDIDATE_2026-09-11.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          WORK="$RUNNER_TEMP/home-bubble-react-radius-scale-hook-composition-work"
          BASE="$RUNNER_TEMP/home-bubble-react-radius-scale-hook-composition-base"

          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1698058"
          echo "09123bb0172535aac5191a5c642541e2b7e6976020a0bb3609ee30e0f546439c  $BASE_ZIP" | sha256sum -c -

          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts"
          test -f "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel.ts"
          test -f "$ROOT/src/app/useHomeDashboardLiveCryptoBubblePresentationObservedRuntime.ts"
          test ! -e "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts"
          test ! -e "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md"
          grep -Fq 'verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation' "$ROOT/package.json"

          cat > "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md" <<'EOF'
          # KAIROS Home Dashboard Live Crypto Bubble React Radius-Scale Hook Composition Foundation Report

          Date: 2026-09-11
          Base: canonical Gate365 Home Live Crypto Bubble React radius-scale view-model foundation.

          ## Responsibility

          This candidate adds one thin React composition seam between the released Gate355 area-weight hook and the released Gate365 radius-scale view-model projector.

          `useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(...)` accepts the exact caller-owned observed-at source, evaluation-time source and Gate351 runtime-binding options. It calls `useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel(...)` exactly once with those exact references, passes the exact returned area-weight view-model reference once to `projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(...)`, and returns that released Gate365 result unchanged.

          ## Semantics

          - Caller-owned runtime inputs remain unchanged; this layer chooses no provider, universe, lifecycle, product or rendering defaults.
          - Gate351 remains the React runtime lifecycle/state owner through the already released area-weight hook chain.
          - Gate354 remains the area-weight React view-model owner.
          - Gate364 remains the normalized radius-scale arithmetic owner.
          - Gate365 remains the pure area-weight-view-model-to-radius-scale-view-model owner.
          - This hook adds no second retained state/effect owner, cache, timer, observer, provider call or error taxonomy.
          - The exact Gate365 result is returned without reshaping its runtime, area-weight or radius-scale evidence.

          ## Ownership / non-scope

          This seam owns no request/acquisition/retry, provider, universe, ranking, Top-N, stablecoin exclusion, movement, freshness, clock, persistence or market-truth behavior. It performs no Decimal arithmetic and no radius arithmetic.

          Pixel min/max radius, viewport breakpoints, collision/packing/layout, labels, interaction, theme palette/tokens, CSS, stale/expired opacity, animation and visible Bubble rendering remain later presentation responsibilities. `HomeRoute` wiring remains unchanged. Live Crypto Bubble Map and Your Trades Bubble Map remain separate truth domains.

          ## Verification intent

          Dedicated regression proves exact caller-input delegation, exactly one released area-weight-hook call per render, exact returned area-weight view-model delegation into Gate365, no second app-level radius-scale state owner across rerenders, and unchanged return of released Gate365 evidence. Static verification rejects state/effect ownership, clocks/timers, transport/provider/product-policy logic, arithmetic, styling, DOM/JSX, `HomeRoute`, persistence and Your Trades ownership.
          EOF
          sed -i 's/^          //' "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md"

          cat > "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts" <<'EOF'
          import type { BinanceSpot24hPublicRestBaselineObservedAtSource } from '../services/market-data';
          import type { HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource } from '../application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge';
          import {
            projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel,
            type HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel,
          } from './homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';
          import { useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel } from './useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel';
          import type { HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions } from './useHomeDashboardLiveCryptoBubblePresentationObservedRuntime';

          /**
           * Thin React composition from the released area-weight hook to the
           * released Gate365 radius-scale view model. Adds no state, effects,
           * clocks, provider/product policy, pixel geometry, styling or route ownership.
           */
          export function useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
            readEvaluationTimeMs: HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource,
            options: HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions,
          ): HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel {
            const areaWeightViewModel = useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel(
              readObservedAt,
              readEvaluationTimeMs,
              options,
            );

            return projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(areaWeightViewModel);
          }
          EOF
          sed -i 's/^          //' "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts"

          cat > "$ROOT/tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts" <<'EOF'
          import { beforeEach, describe, expect, it, vi } from 'vitest';
          import { renderHook } from '@testing-library/react';
          import type { HomeDashboardLiveCryptoBubbleReactAreaWeightViewModel } from '../src/app/homeDashboardLiveCryptoBubbleReactAreaWeightViewModel';
          import type { HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel } from '../src/app/homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';

          const mocks = vi.hoisted(() => ({
            useAreaWeightViewModel: vi.fn(),
            projectRadiusScaleViewModel: vi.fn(),
          }));

          vi.mock('../src/app/useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel', async (importOriginal) => {
            const actual = await importOriginal<typeof import('../src/app/useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel')>();
            return {
              ...actual,
              useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel: mocks.useAreaWeightViewModel,
            };
          });

          vi.mock('../src/app/homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel', async (importOriginal) => {
            const actual = await importOriginal<typeof import('../src/app/homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel')>();
            return {
              ...actual,
              projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel: mocks.projectRadiusScaleViewModel,
            };
          });

          import { useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel } from '../src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';

          function areaWeightViewModel(marker: string): HomeDashboardLiveCryptoBubbleReactAreaWeightViewModel {
            return {
              runtimeState: {
                status: 'running',
                latestObservation: null,
                lastError: null,
              },
              areaWeightProjection: { marker } as never,
            } as HomeDashboardLiveCryptoBubbleReactAreaWeightViewModel;
          }

          function radiusScaleViewModel(
            areaWeightViewModel: HomeDashboardLiveCryptoBubbleReactAreaWeightViewModel,
            marker: string,
          ): HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel {
            return {
              areaWeightViewModel,
              runtimeState: areaWeightViewModel.runtimeState,
              radiusScaleProjection: { marker } as never,
            };
          }

          describe('Home Dashboard Live Crypto Bubble React radius-scale hook composition foundation', () => {
            beforeEach(() => {
              mocks.useAreaWeightViewModel.mockReset();
              mocks.projectRadiusScaleViewModel.mockReset();
            });

            it('delegates caller-owned runtime inputs unchanged and projects the exact released area-weight view model once', () => {
              const readObservedAt = vi.fn();
              const readEvaluationTimeMs = vi.fn();
              const options = {
                universe: { excludedStablecoinSymbols: new Set(['USDCUSDT']), limit: 30 },
                lifecycle: { visibleIntervalMs: 5000 },
                presentationPolicy: { neutralMaxAbsoluteMovementPercent: '0.25' },
              } as never;
              const areaViewModel = areaWeightViewModel('first-area');
              const radiusViewModel = radiusScaleViewModel(areaViewModel, 'first-radius');
              mocks.useAreaWeightViewModel.mockReturnValue(areaViewModel);
              mocks.projectRadiusScaleViewModel.mockReturnValue(radiusViewModel);

              const { result } = renderHook(() => useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(
                readObservedAt,
                readEvaluationTimeMs,
                options,
              ));

              expect(mocks.useAreaWeightViewModel).toHaveBeenCalledTimes(1);
              expect(mocks.useAreaWeightViewModel).toHaveBeenCalledWith(readObservedAt, readEvaluationTimeMs, options);
              expect(mocks.projectRadiusScaleViewModel).toHaveBeenCalledTimes(1);
              expect(mocks.projectRadiusScaleViewModel).toHaveBeenCalledWith(areaViewModel);
              expect(result.current).toBe(radiusViewModel);
            });

            it('does not retain a second app-level radius-scale state owner across rerenders', () => {
              const readObservedAt = vi.fn();
              const readEvaluationTimeMs = vi.fn();
              const options = { universe: {}, lifecycle: {}, presentationPolicy: {} } as never;
              const firstArea = areaWeightViewModel('first-area');
              const secondArea = areaWeightViewModel('second-area');
              const firstRadius = radiusScaleViewModel(firstArea, 'first-radius');
              const secondRadius = radiusScaleViewModel(secondArea, 'second-radius');
              mocks.useAreaWeightViewModel.mockReturnValueOnce(firstArea).mockReturnValueOnce(secondArea);
              mocks.projectRadiusScaleViewModel.mockImplementation((value) => value === firstArea ? firstRadius : secondRadius);

              const { result, rerender } = renderHook(() => useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(
                readObservedAt,
                readEvaluationTimeMs,
                options,
              ));
              expect(result.current).toBe(firstRadius);

              rerender();

              expect(mocks.useAreaWeightViewModel).toHaveBeenCalledTimes(2);
              expect(mocks.projectRadiusScaleViewModel).toHaveBeenCalledTimes(2);
              expect(mocks.projectRadiusScaleViewModel).toHaveBeenNthCalledWith(2, secondArea);
              expect(result.current).toBe(secondRadius);
            });

            it('returns the exact released Gate365 radius-scale view-model result unchanged', () => {
              const readObservedAt = vi.fn();
              const readEvaluationTimeMs = vi.fn();
              const options = { universe: {}, lifecycle: {}, presentationPolicy: {} } as never;
              const areaViewModel = areaWeightViewModel('exact-area');
              const exactRadiusProjection = { ok: false, reason: 'area-weight-projection-invalid' } as never;
              const projected = {
                areaWeightViewModel: areaViewModel,
                runtimeState: areaViewModel.runtimeState,
                radiusScaleProjection: exactRadiusProjection,
              } as HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel;
              mocks.useAreaWeightViewModel.mockReturnValue(areaViewModel);
              mocks.projectRadiusScaleViewModel.mockReturnValue(projected);

              const { result } = renderHook(() => useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(
                readObservedAt,
                readEvaluationTimeMs,
                options,
              ));

              expect(result.current).toBe(projected);
              expect(result.current.areaWeightViewModel).toBe(areaViewModel);
              expect(result.current.runtimeState).toBe(areaViewModel.runtimeState);
              expect(result.current.radiusScaleProjection).toBe(exactRadiusProjection);
            });
          });
          EOF
          sed -i 's/^          //' "$ROOT/tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts"

          cat > "$ROOT/scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs" <<'EOF'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts', 'utf8');
          const test = readFileSync('tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts', 'utf8');
          const report = readFileSync('KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md', 'utf8');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));

          for (const token of [
            'useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel',
            'useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel(',
            'projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(areaWeightViewModel)',
            'readObservedAt',
            'readEvaluationTimeMs',
            'options: HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions',
          ]) {
            if (!source.includes(token)) throw new Error(`React radius-scale hook composition evidence missing: ${token}`);
          }

          if ((source.match(/useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel\(/g) ?? []).length !== 1) {
            throw new Error('React radius-scale hook must delegate to the released area-weight hook exactly once');
          }
          if ((source.match(/projectHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel\(areaWeightViewModel\)/g) ?? []).length !== 1) {
            throw new Error('React radius-scale hook must delegate the exact area-weight view model to Gate365 exactly once');
          }

          for (const forbidden of [
            'useEffect', 'useState', 'useMemo', 'useRef', 'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(',
            'fetch(', 'XMLHttpRequest', 'WebSocket(', 'startBinanceHomeDashboard', 'createHomeDashboard',
            '.sort(', '.filter(', '.reverse(', 'decimalAdd(', 'decimalSubtract(', 'decimalMultiply(', 'decimalDivide(',
            'parseDecimalString(', 'Math.sqrt(', 'Math.pow(', 'areaWeight =', 'radiusScale =', 'borderRadius',
            'minRadius', 'maxRadius', 'className=', '<div', '<svg', 'HomeRoute', 'indexedDB',
          ]) {
            if (source.includes(forbidden)) throw new Error(`React radius-scale hook composition broadened ownership: ${forbidden}`);
          }

          for (const token of [
            'delegates caller-owned runtime inputs unchanged and projects the exact released area-weight view model once',
            'does not retain a second app-level radius-scale state owner across rerenders',
            'returns the exact released Gate365 radius-scale view-model result unchanged',
          ]) {
            if (!test.includes(token)) throw new Error(`Missing React radius-scale hook regression: ${token}`);
          }

          for (const token of [
            'one thin React composition seam',
            'calls `useHomeDashboardLiveCryptoBubbleReactAreaWeightViewModel(...)` exactly once',
            'passes the exact returned area-weight view-model reference once',
            'adds no second retained state/effect owner',
            'Pixel min/max radius, viewport breakpoints, collision/packing/layout',
            'Live Crypto Bubble Map and Your Trades Bubble Map remain separate truth domains',
          ]) {
            if (!report.includes(token)) throw new Error(`React radius-scale hook report evidence missing: ${token}`);
          }

          const verifyName = 'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation';
          if (pkg.scripts?.[verifyName] !== 'node scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs') {
            throw new Error('React radius-scale hook composition verifier registration mismatch');
          }

          console.log('PASS: Home Live Crypto Bubble React radius-scale hook composes released area-weight hook output with Gate365 without adding state, pixels, or market truth.');
          EOF
          sed -i 's/^          //' "$ROOT/scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs"

          python - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['ROOT'])/'package.json'
          s=p.read_text()
          needle='    "verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation": "node scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation.mjs"'
          replacement=needle+',\n    "verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation": "node scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs"'
          assert s.count(needle)==1, 'expected exact Gate365 verifier registration once'
          p.write_text(s.replace(needle,replacement))
          PY

          cd "$ROOT"
          git diff --check --no-index "$BASE/kairos_p76" "$ROOT" || test "$?" = "1"

          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-area-weight-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation
          npm run verify:home-dashboard-live-crypto-bubble-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-area-weight-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-runtime-binding-foundation
          npm run verify:binance-home-dashboard-live-crypto-bubble-presentation-observed-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation
          npm run verify:live-crypto-bubble-metric-input-projection-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation

          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-area-weight-view-model-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-radius-scale-projection-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.test.tsx \
            tests/router.test.tsx
          npm test

          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(pkg.scripts||{}).filter((x)=>x.startsWith('verify:')).sort();
          const required=[
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-area-weight-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation',
            'verify:home-dashboard-live-crypto-bubble-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-text-evidence-presentation-foundation',
            'verify:home-dashboard-live-crypto-bubble-area-weight-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-runtime-binding-foundation',
            'verify:binance-home-dashboard-live-crypto-bubble-presentation-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation',
            'verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation',
            'verify:live-crypto-bubble-metric-input-projection-foundation',
            'verify:p21:1-home-dashboard-route-ownership-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1'
          ];
          for(const name of required) if(!scripts.includes(name)){console.error('Missing '+name);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs',
            'src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts',
            'tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          assert not (set(x)-set(y)), f'unexpected removals: {sorted(set(x)-set(y))}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
