name: Kairos P21.1 Home Dashboard Route Ownership Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-1-home-route-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P20_5_SAVED_ANALYSIS_SYSTEM_CLOSURE_CANDIDATE_2026-09-07.zip
      OUT_ZIP: KAIROS_P21_1_HOME_DASHBOARD_ROUTE_OWNERSHIP_FOUNDATION_CANDIDATE_2026-09-07.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.1 from canonical P20.5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          test -f "$ROOT/src/app/routes.tsx"
          test -f "$ROOT/src/app/AppShell.tsx"
          test -f "$ROOT/src/app/PlaceholderRoute.tsx"
          test -f "$ROOT/package.json"

          cat > "$ROOT/src/app/HomeRoute.tsx" <<'TSX'
          export function HomeRoute() {
            return (
              <section className="kairos-route" aria-labelledby="kairos-route-home" data-kairos-home-dashboard="foundation">
                <header>
                  <h1 id="kairos-route-home">Home</h1>
                  <p>Your Kairos dashboard lives here.</p>
                </header>
                <section aria-labelledby="kairos-home-dashboard-heading">
                  <h2 id="kairos-home-dashboard-heading">Dashboard</h2>
                  <p>No dashboard insights are connected yet.</p>
                </section>
              </section>
            );
          }
          TSX

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/app/routes.tsx')
          s=p.read_text()
          old="import { MoreRoute } from './MoreRoute';\nimport { PlaceholderRoute } from './PlaceholderRoute';"
          new="import { HomeRoute } from './HomeRoute';\nimport { MoreRoute } from './MoreRoute';\nimport { PlaceholderRoute } from './PlaceholderRoute';"
          if old not in s:
              raise SystemExit('expected canonical route import boundary not found')
          s=s.replace(old,new,1)
          old_route='{ index: true, element: <PlaceholderRoute title="Home" /> }'
          if old_route not in s:
              raise SystemExit('expected canonical Home placeholder route not found')
          s=s.replace(old_route,'{ index: true, element: <HomeRoute /> }',1)
          p.write_text(s)
          PY

          cat > "$ROOT/scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const routes = readFileSync(new URL('../src/app/routes.tsx', import.meta.url), 'utf8');
          const home = readFileSync(new URL('../src/app/HomeRoute.tsx', import.meta.url), 'utf8');
          const shell = readFileSync(new URL('../src/app/AppShell.tsx', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_1_HOME_DASHBOARD_ROUTE_OWNERSHIP_FOUNDATION_REPORT_2026-09-07.md', import.meta.url), 'utf8');

          for (const token of [
            "import { HomeRoute } from './HomeRoute';",
            '{ index: true, element: <HomeRoute /> }',
          ]) if (!routes.includes(token)) throw new Error(`P21.1 route wiring missing: ${token}`);
          if (routes.includes('<PlaceholderRoute title="Home" />')) throw new Error('P21.1 must remove only the Home placeholder ownership');

          for (const token of [
            'export function HomeRoute()',
            'className="kairos-route"',
            'aria-labelledby="kairos-route-home"',
            'id="kairos-route-home">Home</h1>',
            'data-kairos-home-dashboard="foundation"',
            'id="kairos-home-dashboard-heading">Dashboard</h2>',
            'No dashboard insights are connected yet.',
          ]) if (!home.includes(token)) throw new Error(`P21.1 HomeRoute foundation evidence missing: ${token}`);

          for (const forbidden of [
            'indexedDB', 'SavedAnalysisRepository', 'TradeRepository', 'lightweight-charts', 'createChart(',
            'fetch(', 'WebSocket', 'EventSource', 'PnL', 'profit', 'loss', 'riskReward', 'goal', 'discipline',
          ]) if (home.includes(forbidden)) throw new Error(`P21.1 HomeRoute broadened into forbidden owner/scope: ${forbidden}`);

          if (!shell.includes('<Outlet />')) throw new Error('P21.1 must retain AppShell outlet ownership');

          for (const token of [
            '# KAIROS P21.1 — Home Dashboard Route Ownership Foundation',
            'P20.5',
            'existing `/` index route',
            'No bubble-map algorithm or geometry',
            'No new persistence, query, calculation, provider, or navigation owner',
          ]) if (!report.includes(token)) throw new Error(`P21.1 report evidence missing: ${token}`);

          console.log('P21.1 Home Dashboard route ownership foundation verification passed.');
          JS

          cat > "$ROOT/KAIROS_P21_1_HOME_DASHBOARD_ROUTE_OWNERSHIP_FOUNDATION_REPORT_2026-09-07.md" <<'MD'
          # KAIROS P21.1 — Home Dashboard Route Ownership Foundation

          ## Authority
          Base: canonical P20.5 Saved Analysis SYSTEM CLOSURE, `Kairos Controlled Roadmap Gate` #285 / run `34059034331`.

          ## Responsibility
          P21.1 establishes one dedicated `HomeRoute` presentation owner on the existing `/` index route. It replaces the generic Home placeholder while preserving P8 `AppShell`, navigation, safe-area, theme/design-system, route-error, and outlet ownership.

          The Home route exposes only a stable semantic dashboard composition and explicit empty-state boundary. It does not invent dashboard metrics or data flows.

          ## Non-scope
          - No bubble-map algorithm or geometry.
          - No live market-data subscription or provider rendering.
          - No new persistence, query, calculation, provider, or navigation owner.
          - No direct IndexedDB access, schema/index changes, Saved Analysis CRUD expansion, P&L/R/FX truth, Goals/Discipline behavior, or P40 motion ownership.
          - No replacement of P8 shell/navigation truth and no giant dashboard implementation.

          ## Canonical requirement
          P21.1 becomes authoritative only after the exact candidate receives full PASS from `Kairos Controlled Roadmap Gate` / `verify-current-candidate` and publishes both canonical artifacts.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:1-home-dashboard-route-ownership-foundation']='node scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_1_HOME_DASHBOARD_ROUTE_OWNERSHIP_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs',
            'src/app/HomeRoute.tsx',
            'src/app/routes.tsx',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.1 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run typecheck
          npm run build
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p8:navigation-shell
          npm run verify:p1
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const required of ['verify:p20:5-saved-analysis-system-closure','verify:p21:1-home-dashboard-route-ownership-foundation']) if(!s.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
          npm run verify:static

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_1_HOME_DASHBOARD_ROUTE_OWNERSHIP_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs',
            'src/app/HomeRoute.tsx',
            'src/app/routes.tsx',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p21candidate/kairos_p76')
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): raise SystemExit(f'forbidden generated directory remains: {name}')
          PY

      - name: Package and commit P21.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P21.1 Home dashboard route ownership candidate'
          git push
