name: Kairos Live Market Summary Freshness Evaluation Projection Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-summary-freshness-evaluation-projection-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-live-market-summary-freshness-evaluation-projection-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify freshness evaluation projection from Gate337 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_BINANCE_HOME_DASHBOARD_LIVE_MARKET_RUNTIME_BOOTSTRAP_FOUNDATION_CANDIDATE_2026-09-09.zip
          OUT_ZIP=KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_CANDIDATE_2026-09-09.zip
          WORK="$RUNNER_TEMP/freshness-evaluation-work"
          BASE="$RUNNER_TEMP/freshness-evaluation-base"
          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1569620"
          echo "95fb5c314b856e41c06e6ae8282af320f0aa643a7d7f716825c66d101ad909c3  $BASE_ZIP" | sha256sum -c -
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFreshnessClassificationPolicy.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFactSemantics.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryScopedStateSnapshot.ts"
          test -f "$ROOT/src/services/market-data/index.ts"
          test ! -e "$ROOT/src/services/market-data/liveMarketSummaryFreshnessEvaluationProjection.ts"

          cat > "$ROOT/src/services/market-data/liveMarketSummaryFreshnessEvaluationProjection.ts" <<'TS'
          import {
            LIVE_MARKET_SUMMARY_FRESHNESS_CLASSIFICATION_POLICY_V1,
            classifyLiveMarketSummaryObservationAge,
            type LiveMarketSummaryFreshnessClassification,
            type LiveMarketSummaryFreshnessClassificationPolicy,
          } from './liveMarketSummaryFreshnessClassificationPolicy';
          import { validateLiveMarketSummaryFact } from './liveMarketSummaryFactSemantics';
          import type {
            LiveMarketSummaryFact,
            MarketDataInstrument,
          } from './marketDataTypes';
          import type { LiveMarketSummaryScopedStateSnapshotEntry } from './liveMarketSummaryScopedStateSnapshot';

          export interface LiveMarketSummaryFreshnessEvaluationProjectionEntry {
            readonly instrument: MarketDataInstrument;
            readonly fact: LiveMarketSummaryFact | null;
            readonly ageMs: number | null;
            readonly freshness: LiveMarketSummaryFreshnessClassification | null;
          }

          export type LiveMarketSummaryFreshnessEvaluationProjectionResult =
            | {
                readonly ok: true;
                readonly evaluationTimeMs: number;
                readonly entries: readonly LiveMarketSummaryFreshnessEvaluationProjectionEntry[];
              }
            | {
                readonly ok: false;
                readonly reason:
                  | 'evaluation-time-invalid'
                  | 'fact-invalid'
                  | 'observation-after-evaluation';
              };

          /**
           * Provider-neutral freshness evaluation over an already-released scoped snapshot.
           * The caller owns evaluation time. Missing facts remain explicit missing values.
           * Present facts keep exact identity and delegate only age classification to the
           * released freshness policy owner.
           */
          export function evaluateLiveMarketSummaryScopedSnapshotFreshness(
            scopedSnapshot: readonly LiveMarketSummaryScopedStateSnapshotEntry[],
            evaluationTimeMs: number,
            policy: LiveMarketSummaryFreshnessClassificationPolicy = LIVE_MARKET_SUMMARY_FRESHNESS_CLASSIFICATION_POLICY_V1,
          ): LiveMarketSummaryFreshnessEvaluationProjectionResult {
            if (!Number.isFinite(evaluationTimeMs) || evaluationTimeMs < 0) {
              return { ok: false, reason: 'evaluation-time-invalid' };
            }

            const entries: LiveMarketSummaryFreshnessEvaluationProjectionEntry[] = [];
            for (const entry of scopedSnapshot) {
              if (entry.fact === null) {
                entries.push({
                  instrument: entry.instrument,
                  fact: null,
                  ageMs: null,
                  freshness: null,
                });
                continue;
              }

              const validation = validateLiveMarketSummaryFact(entry.fact);
              if (!validation.ok) return { ok: false, reason: 'fact-invalid' };

              const observedAtMs = Date.parse(entry.fact.observedAt);
              if (observedAtMs > evaluationTimeMs) {
                return { ok: false, reason: 'observation-after-evaluation' };
              }

              const ageMs = evaluationTimeMs - observedAtMs;
              entries.push({
                instrument: entry.instrument,
                fact: entry.fact,
                ageMs,
                freshness: classifyLiveMarketSummaryObservationAge(ageMs, policy),
              });
            }

            return { ok: true, evaluationTimeMs, entries };
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'freshness-evaluation-work'/'kairos_p76'/'src/services/market-data/index.ts'
          s=p.read_text()
          line="export * from './liveMarketSummaryFreshnessEvaluationProjection';\n"
          if line in s: raise SystemExit('freshness evaluation export already exists unexpectedly')
          anchor="export * from './liveMarketSummaryFreshnessClassificationPolicy';\n"
          if anchor not in s: raise SystemExit('released freshness classification export boundary not found')
          p.write_text(s.replace(anchor, anchor+line, 1))
          PY

          cat > "$ROOT/tests/live-market-summary-freshness-evaluation-projection-foundation.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import type { DecimalString } from '../src/domain/trades';
          import {
            evaluateLiveMarketSummaryScopedSnapshotFreshness,
            type LiveMarketSummaryFact,
            type LiveMarketSummaryScopedStateSnapshotEntry,
            type MarketDataInstrument,
          } from '../src/services/market-data';

          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const eth: MarketDataInstrument = { venue: 'binance-spot', symbol: 'ETHUSDT' };

          function fact(instrument: MarketDataInstrument, observedAt: string): LiveMarketSummaryFact {
            return {
              instrument,
              lastPrice: '100' as DecimalString,
              open24h: '99' as DecimalString,
              high24h: '101' as DecimalString,
              low24h: '98' as DecimalString,
              baseVolume24h: '10' as DecimalString,
              quoteVolume24h: '1000' as DecimalString,
              observedAt,
              sourceTimestamp: null,
            };
          }

          describe('Live Market Summary Freshness Evaluation Projection Foundation', () => {
            it('computes deterministic ages and delegates the released V1 freshness boundaries exactly', () => {
              const evaluationTimeMs = Date.parse('2026-09-09T00:01:00.001Z');
              const snapshot: readonly LiveMarketSummaryScopedStateSnapshotEntry[] = [
                { instrument: btc, fact: fact(btc, '2026-09-09T00:00:45.001Z') },
                { instrument: eth, fact: fact(eth, '2026-09-09T00:00:45.000Z') },
                { instrument: btc, fact: fact(btc, '2026-09-09T00:00:00.001Z') },
                { instrument: eth, fact: fact(eth, '2026-09-09T00:00:00.000Z') },
              ];

              const result = evaluateLiveMarketSummaryScopedSnapshotFreshness(snapshot, evaluationTimeMs);
              expect(result.ok).toBe(true);
              if (!result.ok) return;
              expect(result.entries.map((entry) => [entry.ageMs, entry.freshness])).toEqual([
                [15_000, 'fresh'],
                [15_001, 'stale'],
                [60_000, 'stale'],
                [60_001, 'expired'],
              ]);
            });

            it('preserves exact instrument/fact association and keeps missing facts explicitly unclassified', () => {
              const btcFact = fact(btc, '2026-09-09T00:00:00.000Z');
              const snapshot: readonly LiveMarketSummaryScopedStateSnapshotEntry[] = [
                { instrument: btc, fact: btcFact },
                { instrument: eth, fact: null },
              ];

              const result = evaluateLiveMarketSummaryScopedSnapshotFreshness(
                snapshot,
                Date.parse('2026-09-09T00:00:01.000Z'),
              );
              expect(result.ok).toBe(true);
              if (!result.ok) return;
              expect(result.entries[0]?.instrument).toBe(btc);
              expect(result.entries[0]?.fact).toBe(btcFact);
              expect(result.entries[1]).toEqual({ instrument: eth, fact: null, ageMs: null, freshness: null });
              expect(snapshot[0]?.fact).toBe(btcFact);
            });

            it('rejects invalid caller evaluation time rather than inventing a clock', () => {
              const snapshot = [{ instrument: btc, fact: fact(btc, '2026-09-09T00:00:00.000Z') }] as const;
              expect(evaluateLiveMarketSummaryScopedSnapshotFreshness(snapshot, Number.NaN)).toEqual({
                ok: false,
                reason: 'evaluation-time-invalid',
              });
              expect(evaluateLiveMarketSummaryScopedSnapshotFreshness(snapshot, -1)).toEqual({
                ok: false,
                reason: 'evaluation-time-invalid',
              });
            });

            it('rejects a future observation instead of silently converting negative age into current truth', () => {
              const snapshot = [{ instrument: btc, fact: fact(btc, '2026-09-09T00:00:01.001Z') }] as const;
              expect(evaluateLiveMarketSummaryScopedSnapshotFreshness(
                snapshot,
                Date.parse('2026-09-09T00:00:01.000Z'),
              )).toEqual({ ok: false, reason: 'observation-after-evaluation' });
            });

            it('delegates caller-supplied released policy configuration without hard-coding thresholds', () => {
              const snapshot = [{ instrument: btc, fact: fact(btc, '2026-09-09T00:00:00.000Z') }] as const;
              const result = evaluateLiveMarketSummaryScopedSnapshotFreshness(
                snapshot,
                Date.parse('2026-09-09T00:00:02.000Z'),
                { freshMaxAgeMs: 1_000, staleMaxAgeMs: 1_500 },
              );
              expect(result.ok).toBe(true);
              if (!result.ok) return;
              expect(result.entries[0]?.freshness).toBe('expired');
            });

            it('rejects invalid fact input only through the released fact validator', () => {
              const invalid = { ...fact(btc, 'not-an-instant') };
              expect(evaluateLiveMarketSummaryScopedSnapshotFreshness(
                [{ instrument: btc, fact: invalid }],
                Date.parse('2026-09-09T00:00:02.000Z'),
              )).toEqual({ ok: false, reason: 'fact-invalid' });
            });
          });
          TS

          cat > "$ROOT/KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # Live Market Summary Freshness Evaluation Projection Foundation

          ## Authority
          Base: exact canonical Gate337 Home live-market runtime-bootstrap candidate, promoted by `Kairos Controlled Roadmap Gate` #337 / run `34399961306`.

          ## Source-proven responsibility
          Released scoped-state snapshots preserve exact caller-requested instrument associations and represent a missing current fact explicitly as `null`. Released `LiveMarketSummaryFact` validates canonical caller-owned `observedAt` as a UTC instant. Released freshness classification owns only mapping an already-computed non-negative age to `fresh | stale | expired` and explicitly reserves observation-age computation for a later owner. Gate337 now creates the Home live-market runtime below presentation, but fresh source inspection finds no production consumer of that classification owner.

          This slice therefore adds one provider-neutral deterministic freshness-evaluation projection below presentation. It accepts an already-released scoped snapshot plus an explicit caller-owned evaluation time expressed as epoch milliseconds, computes age only for present validated facts, delegates classification to the released policy, and preserves exact instrument/fact association.

          ## Edge semantics
          - Missing `fact: null` stays missing with `ageMs: null` and `freshness: null`; missing is never reinterpreted as zero, fresh, stale, or expired.
          - Non-finite or negative caller evaluation time returns `evaluation-time-invalid`; this owner never creates its own clock.
          - Present facts are validated only through the released fact validator; failure returns `fact-invalid`.
          - If canonical `observedAt` is after the caller evaluation time, return `observation-after-evaluation` rather than clamping a negative age to zero or allowing it to masquerade as current truth.
          - Thresholds are not duplicated here; caller-supplied released policy configuration is forwarded unchanged to `classifyLiveMarketSummaryObservationAge(...)`.

          ## Explicit non-scope
          No acquisition, provider/Binance transport, request/response mapping, polling/cadence/visibility/lifecycle/retry/cancellation, universe/ranking/Top-N/stablecoin policy, internal `Date.now()`/`new Date()` clock ownership, state/session mutation, persistence/IndexedDB, React/Home rendering, stale dimming or expired visuals, Bubble geometry/size/color/interactions, Your Trades/journal, chart/navigation/Saved Analysis/transitions.

          This foundation intentionally stops at deterministic freshness projection. Later presentation wiring must consume the released projection without owning thresholds, acquisition truth, or observation-time semantics.
          MD

          cat > "$ROOT/scripts/verify-live-market-summary-freshness-evaluation-projection-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/liveMarketSummaryFreshnessEvaluationProjection.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_REPORT_2026-09-09.md', import.meta.url), 'utf8');

          for (const token of [
            'evaluateLiveMarketSummaryScopedSnapshotFreshness',
            'readonly fact: LiveMarketSummaryFact | null',
            'readonly ageMs: number | null',
            'readonly freshness: LiveMarketSummaryFreshnessClassification | null',
            "'evaluation-time-invalid'",
            "'fact-invalid'",
            "'observation-after-evaluation'",
            'validateLiveMarketSummaryFact(entry.fact)',
            'Date.parse(entry.fact.observedAt)',
            'const ageMs = evaluationTimeMs - observedAtMs',
            'classifyLiveMarketSummaryObservationAge(ageMs, policy)',
          ]) if (!source.includes(token)) throw new Error(`freshness evaluation evidence missing: ${token}`);

          if (!index.includes("export * from './liveMarketSummaryFreshnessEvaluationProjection';")) throw new Error('freshness evaluation public export missing');
          for (const forbidden of [
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'fetch(', 'XMLHttpRequest', 'WebSocket(',
            'document.', 'visibilityState', 'React', 'useEffect', 'useState', 'indexedDB', 'AbortController',
            '.sort(', '.filter(', '.reduce(', '15_000', '60_000',
          ]) if (source.includes(forbidden)) throw new Error(`freshness evaluation broadened or duplicated policy: ${forbidden}`);
          for (const token of [
            'provider-neutral deterministic freshness-evaluation projection below presentation',
            'Missing `fact: null` stays missing',
            'observation-after-evaluation',
            'Thresholds are not duplicated here',
            'No acquisition, provider/Binance transport',
          ]) if (!report.includes(token)) throw new Error(`freshness evaluation report evidence missing: ${token}`);
          console.log('Live Market Summary freshness evaluation projection verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p=process.env.RUNNER_TEMP+'/freshness-evaluation-work/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:live-market-summary-freshness-evaluation-projection-foundation']='node scripts/verify-live-market-summary-freshness-evaluation-projection-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          npm --prefix "$ROOT" ci
          test "$(node -p "require('$ROOT/node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm --prefix "$ROOT" run verify:live-market-summary-freshness-evaluation-projection-foundation
          npm --prefix "$ROOT" run verify:live-market-summary-freshness-classification-policy-foundation
          npm --prefix "$ROOT" run typecheck
          npm --prefix "$ROOT" run build
          cd "$ROOT"
          npx vitest run \
            tests/live-market-summary-freshness-evaluation-projection-foundation.test.ts \
            tests/live-market-summary-freshness-classification-policy-foundation.test.ts \
            tests/live-market-summary-scoped-state-snapshot-foundation.test.ts \
            tests/binance-home-dashboard-live-market-runtime-bootstrap-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:live-market-summary-freshness-evaluation-projection-foundation',
            'verify:live-market-summary-freshness-classification-policy-foundation',
            'verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete
          cd "$WORK"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['RUNNER_TEMP'])/'freshness-evaluation-base'/'kairos_p76'
          work=Path(os.environ['RUNNER_TEMP'])/'freshness-evaluation-work'/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-live-market-summary-freshness-evaluation-projection-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/liveMarketSummaryFreshnessEvaluationProjection.ts',
            'tests/live-market-summary-freshness-evaluation-projection-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          PY
          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_CANDIDATE_2026-09-09.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_CANDIDATE
          path: KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_CANDIDATE_2026-09-09.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_CANDIDATE_2026-09-09.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add live-market freshness evaluation projection'
          git push origin HEAD:main
