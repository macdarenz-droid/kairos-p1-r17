name: Kairos Binance Spot Exchange Info Public REST Request Execution Boundary Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-spot-exchange-info-public-rest-request-execution-boundary-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_DESCRIPTOR_FOUNDATION_CANDIDATE_2026-09-08.zip
      OUT_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_EXECUTION_BOUNDARY_FOUNDATION_CANDIDATE_2026-09-08.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct exact execution-boundary slice from canonical exchangeInfo descriptor GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .candidate .package
          mkdir .candidate
          unzip -q "$BASE_ZIP" -d .candidate
          ROOT=.candidate/kairos_p76
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequest.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hPublicRestBaselineRequestExecution.ts"
          test -f "$ROOT/src/services/market-data/index.ts"

          cat > "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution.ts" <<'TS'
          import type { BinanceSpotExchangeInfoPublicRestRequestDescriptor } from './binanceSpotExchangeInfoPublicRestRequest';

          export interface BinanceSpotExchangeInfoPublicRestExecutionOptions {
            readonly signal?: AbortSignal;
          }

          /**
           * Injected execution seam only. Concrete network and response representation
           * remain owned by the caller-supplied connector. Optional caller cancellation
           * is forwarded unchanged; this owner does not create or interpret it.
           */
          export type BinanceSpotExchangeInfoPublicRestRequestConnector<TResult> = (
            request: BinanceSpotExchangeInfoPublicRestRequestDescriptor,
            options?: BinanceSpotExchangeInfoPublicRestExecutionOptions,
          ) => Promise<TResult>;

          /**
           * Executes exactly one already-described exchangeInfo request. Existing
           * no-options callers retain the exact one-argument connector invocation;
           * supplied options are forwarded unchanged.
           */
          export function executeBinanceSpotExchangeInfoPublicRestRequest<TResult>(
            request: BinanceSpotExchangeInfoPublicRestRequestDescriptor,
            connect: BinanceSpotExchangeInfoPublicRestRequestConnector<TResult>,
            options?: BinanceSpotExchangeInfoPublicRestExecutionOptions,
          ): Promise<TResult> {
            if (options === undefined) return connect(request);
            return connect(request, options);
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          anchor="export * from './providers/binance/binanceSpotExchangeInfoPublicRestRequest';\n"
          addition="export * from './providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution';\n"
          if anchor not in s:
              raise SystemExit('canonical exchangeInfo request export anchor not found')
          if addition not in s:
              p.write_text(s.replace(anchor, anchor+addition, 1))
          PY

          cat > "$ROOT/tests/binance-spot-exchange-info-public-rest-request-execution.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import {
            describeBinanceSpotExchangeInfoPublicRestRequest,
            executeBinanceSpotExchangeInfoPublicRestRequest,
          } from '../src/services/market-data';

          describe('Binance Spot exchangeInfo public REST request execution boundary foundation', () => {
            it('invokes an injected connector exactly once with the exact request when options are absent', async () => {
              const request = describeBinanceSpotExchangeInfoPublicRestRequest();
              const result = { body: 'provider-owned' } as const;
              const connect = vi.fn(async () => result);

              await expect(executeBinanceSpotExchangeInfoPublicRestRequest(request, connect)).resolves.toBe(result);
              expect(connect).toHaveBeenCalledTimes(1);
              expect(connect).toHaveBeenCalledWith(request);
            });

            it('forwards caller-owned execution options unchanged', async () => {
              const request = describeBinanceSpotExchangeInfoPublicRestRequest();
              const controller = new AbortController();
              const options = { signal: controller.signal } as const;
              const connect = vi.fn(async () => 'ok');

              await expect(executeBinanceSpotExchangeInfoPublicRestRequest(request, connect, options)).resolves.toBe('ok');
              expect(connect).toHaveBeenCalledTimes(1);
              expect(connect).toHaveBeenCalledWith(request, options);
            });

            it('returns the exact connector Promise', () => {
              const request = describeBinanceSpotExchangeInfoPublicRestRequest();
              const promise = Promise.resolve('exact');
              const connect = vi.fn(() => promise);
              expect(executeBinanceSpotExchangeInfoPublicRestRequest(request, connect)).toBe(promise);
            });

            it('does not translate connector rejection', async () => {
              const request = describeBinanceSpotExchangeInfoPublicRestRequest();
              const failure = new Error('connector-failure');
              const connect = vi.fn(() => Promise.reject(failure));
              await expect(executeBinanceSpotExchangeInfoPublicRestRequest(request, connect)).rejects.toBe(failure);
            });
          });
          TS

          cat > "$ROOT/KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_EXECUTION_BOUNDARY_FOUNDATION_REPORT_2026-09-08.md" <<'MD'
          # Binance Spot Exchange Info Public REST Request Execution Boundary Foundation

          ## Authority
          Base: canonical Binance Spot Exchange Information Public REST Request Descriptor Foundation, `Kairos Controlled Roadmap Gate` #314 / run `34195620691`.

          ## Responsibility
          Canonical #314 describes the public Binance Spot `GET /api/v3/exchangeInfo` request but deliberately owns no execution. Existing released Binance REST architecture already separates request description from an injected execution boundary. This slice applies that same proven ownership pattern to exchangeInfo: accept one already-described request plus an externally supplied connector, invoke the connector exactly once, return its Promise/result unchanged, and forward optional caller-owned `signal?: AbortSignal` options unchanged without creating or interpreting cancellation policy.

          ## Explicit non-scope
          - No concrete fetch/XHR/WebSocket/browser transport or Response acquisition.
          - No HTTP status/header/body interpretation.
          - No JSON parsing or exchangeInfo response decode.
          - No mapping to `LiveMarketUniverseInstrumentMetadataFact`.
          - No cache/polling/refresh/retry/backoff/request-weight/rate-limit policy.
          - No USDT eligibility filtering, stablecoin exclusion, ranking, sorting, symbol tie-break or Top-N policy.
          - No freshness changes, Home React wiring, stale presentation or Bubble rendering.
          - No Your Trades/journal, persistence/IndexedDB, Saved Analysis, chart/navigation or transition ownership.
          MD

          cat > "$ROOT/scripts/verify-binance-spot-exchange-info-public-rest-request-execution-boundary-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_EXECUTION_BOUNDARY_FOUNDATION_REPORT_2026-09-08.md', import.meta.url), 'utf8');

          for (const token of [
            'BinanceSpotExchangeInfoPublicRestRequestDescriptor',
            'BinanceSpotExchangeInfoPublicRestExecutionOptions',
            'signal?: AbortSignal',
            'BinanceSpotExchangeInfoPublicRestRequestConnector',
            'executeBinanceSpotExchangeInfoPublicRestRequest',
            'return connect(request)',
            'return connect(request, options)',
          ]) if (!source.includes(token)) throw new Error(`exchangeInfo execution evidence missing: ${token}`);

          if (!index.includes("export * from './providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution';")) {
            throw new Error('exchangeInfo execution barrel export missing');
          }

          for (const forbidden of [
            'fetch(', 'XMLHttpRequest', 'WebSocket(', 'Response', 'JSON.parse(', 'baseAsset:', 'quoteAsset:', 'tradingEnabled:',
            'USDT', 'stablecoin', '.sort(', 'Top 30', 'topN', 'setTimeout(', 'setInterval(', 'indexedDB', 'new AbortController',
          ]) if (source.includes(forbidden)) throw new Error(`execution boundary broadened into forbidden scope: ${forbidden}`);

          for (const token of [
            'No concrete fetch/XHR/WebSocket/browser transport',
            'No HTTP status/header/body interpretation',
            'No JSON parsing',
            'No mapping to `LiveMarketUniverseInstrumentMetadataFact`',
            'No cache/polling/refresh/retry',
            'No USDT eligibility filtering',
            'No freshness changes',
            'No Your Trades/journal',
          ]) if (!report.includes(token)) throw new Error(`execution report evidence missing: ${token}`);

          console.log('Binance Spot exchangeInfo public REST request execution boundary verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:binance-spot-exchange-info-public-rest-request-execution-boundary-foundation']='node scripts/verify-binance-spot-exchange-info-public-rest-request-execution-boundary-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          import tempfile, zipfile
          root=Path('.candidate/kairos_p76')
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile('KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_DESCRIPTOR_FOUNDATION_CANDIDATE_2026-09-08.zip') as z:
                  z.extractall(td)
              base=Path(td)/'kairos_p76'
              a={str(p.relative_to(base)):p.read_bytes() for p in base.rglob('*') if p.is_file()}
              b={str(p.relative_to(root)):p.read_bytes() for p in root.rglob('*') if p.is_file()}
              changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_BINANCE_SPOT_EXCHANGE_INFO_PUBLIC_REST_REQUEST_EXECUTION_BOUNDARY_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-binance-spot-exchange-info-public-rest-request-execution-boundary-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRequestExecution.ts',
            'tests/binance-spot-exchange-info-public-rest-request-execution.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed execution boundary before packaging
        working-directory: .candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:binance-spot-exchange-info-public-rest-request-execution-boundary-foundation
          npm run verify:binance-spot-exchange-info-public-rest-request-descriptor-foundation
          npm run verify:live-market-universe-instrument-metadata-fact-contract-foundation
          npm run verify:live-market-summary-freshness-classification-policy-foundation
          npm run typecheck
          npm run build
          npx vitest run tests/binance-spot-exchange-info-public-rest-request-execution.test.ts
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .package
          mkdir .package
          cp -a "$ROOT" .package/kairos_p76
          rm -f "$OUT_ZIP"
          (cd .package && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | head -n1 | cut -d/ -f1)" = 'kairos_p76'
          sha256sum "$OUT_ZIP"

          rm -rf .verify-extract
          unzip -q "$OUT_ZIP" -d .verify-extract
          cd .verify-extract/kairos_p76
          node scripts/verify-binance-spot-exchange-info-public-rest-request-execution-boundary-foundation.mjs
          cd ../..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_ZIP"
          if git diff --cached --quiet; then
            echo 'Candidate already present unchanged.'
          else
            git commit -m 'Add Binance Spot exchangeInfo request execution boundary candidate'
            git push
          fi
