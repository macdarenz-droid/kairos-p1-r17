name: Kairos Gate 319 Primary Architecture Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate319-primary-architecture-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact pre-reconciliation authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fde4243efc2a00cac82c300e1a9311259cb8927a HEAD
          test "$(git rev-parse HEAD^{tree})" != ""
          test "$(git rev-parse HEAD:docs/KAIROS_ARCHITECTURE_MAP.md)" = "7a72f493fbd511ca946cfb243a344c33ecec5298"
          test "$(git rev-parse HEAD:docs/KAIROS_FAST_WORKER_MASTER_READ_FIRST_2026-09-09.txt)" = "e42ce5959beba8bb8d02a1b2c6982cdcde8f67fc"
      - name: Append exact Gate 318 and Gate 319 architecture checkpoints
        shell: bash
        env:
          APPEND_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("docs/KAIROS_ARCHITECTURE_MAP.md")
          before = path.read_bytes()
          append = base64.b64decode(os.environ["APPEND_B64"])
          assert b"Canonical Binance Spot exchangeInfo instrument metadata fact response mapping checkpoint" not in before
          path.write_bytes(before + append)
          PY
      - name: Verify append-only architecture scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/KAIROS_ARCHITECTURE_MAP.md"
          git diff --check
          git diff --numstat | grep -E '^[0-9]+[[:space:]]+0[[:space:]]+docs/KAIROS_ARCHITECTURE_MAP.md$'
          grep -F "gate #318" docs/KAIROS_ARCHITECTURE_MAP.md
          grep -F "gate #319" docs/KAIROS_ARCHITECTURE_MAP.md
          grep -F "10059654951" docs/KAIROS_ARCHITECTURE_MAP.md
          grep -F "81a49eefd9b941e9127f890ea326bd1f4e23f323de11a3fab85d1271bfcbbea7" docs/KAIROS_ARCHITECTURE_MAP.md
      - name: Commit architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kairos-autonomous"
          git config user.email "actions@users.noreply.github.com"
          git add docs/KAIROS_ARCHITECTURE_MAP.md
          git commit -m "docs: reconcile canonical gates 318 and 319"
          git push
