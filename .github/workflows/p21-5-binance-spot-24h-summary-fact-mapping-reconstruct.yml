name: Kairos P21.5 Binance Spot 24h Summary Fact Mapping Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-5-binance-spot-24h-summary-fact-mapping-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_4_LIVE_MARKET_SUMMARY_BASELINE_ACQUISITION_PORT_FOUNDATION_CANDIDATE_2026-09-07.zip
      OUT_ZIP: KAIROS_P21_5_BINANCE_SPOT_24H_SUMMARY_FACT_MAPPING_FOUNDATION_CANDIDATE_2026-09-07.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.5 from canonical P21.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotTradeObservation.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFactSemantics.ts"
          test -f "$ROOT/src/services/market-data/index.ts"

          cat > "$ROOT/src/services/market-data/providers/binance/binanceSpot24hSummaryFact.ts" <<'TS'
          import type { DecimalString } from '../../../../domain/trades';
          import { validateLiveMarketSummaryFact } from '../../liveMarketSummaryFactSemantics';
          import type { LiveMarketSummaryFact } from '../../marketDataTypes';
          import { BINANCE_SPOT_VENUE } from './binanceSpotTradeStream';

          export type BinanceSpot24hSummaryFactResult =
            | { readonly ok: true; readonly fact: LiveMarketSummaryFact }
            | {
                readonly ok: false;
                readonly reason:
                  | 'payload-invalid'
                  | 'symbol-invalid'
                  | 'last-price-invalid'
                  | 'open-price-invalid'
                  | 'high-price-invalid'
                  | 'low-price-invalid'
                  | 'base-volume-invalid'
                  | 'quote-volume-invalid'
                  | 'close-time-invalid'
                  | 'observed-at-invalid';
              };

          type UnknownRecord = Readonly<Record<string, unknown>>;

          function isRecord(value: unknown): value is UnknownRecord {
            return typeof value === 'object' && value !== null && !Array.isArray(value);
          }

          function toIsoUtcInstant(epochMs: number): string | null {
            if (!Number.isSafeInteger(epochMs) || epochMs < 0) return null;
            const instant = new Date(epochMs);
            return Number.isNaN(instant.getTime()) ? null : instant.toISOString();
          }

          /** Maps one decoded Binance Spot 24h ticker entry into canonical P21.2 fact truth. */
          export function mapBinanceSpot24hSummaryFact(
            payload: unknown,
            observedAt: string,
          ): BinanceSpot24hSummaryFactResult {
            if (!isRecord(payload)) return { ok: false, reason: 'payload-invalid' };
            if (typeof payload.symbol !== 'string' || !payload.symbol.trim()) return { ok: false, reason: 'symbol-invalid' };
            for (const key of ['lastPrice', 'openPrice', 'highPrice', 'lowPrice', 'volume', 'quoteVolume'] as const) {
              if (typeof payload[key] !== 'string') return { ok: false, reason: 'payload-invalid' };
            }
            if (typeof payload.closeTime !== 'number') return { ok: false, reason: 'close-time-invalid' };
            const sourceTimestamp = toIsoUtcInstant(payload.closeTime);
            if (sourceTimestamp === null) return { ok: false, reason: 'close-time-invalid' };

            const fact: LiveMarketSummaryFact = {
              instrument: { venue: BINANCE_SPOT_VENUE, symbol: payload.symbol },
              lastPrice: payload.lastPrice as DecimalString,
              open24h: payload.openPrice as DecimalString,
              high24h: payload.highPrice as DecimalString,
              low24h: payload.lowPrice as DecimalString,
              baseVolume24h: payload.volume as DecimalString,
              quoteVolume24h: payload.quoteVolume as DecimalString,
              observedAt,
              sourceTimestamp,
            };
            const validated = validateLiveMarketSummaryFact(fact);
            if (!validated.ok) {
              const reasons = {
                'instrument-required': 'symbol-invalid',
                'last-price-invalid': 'last-price-invalid',
                'open-24h-invalid': 'open-price-invalid',
                'high-24h-invalid': 'high-price-invalid',
                'low-24h-invalid': 'low-price-invalid',
                'base-volume-24h-invalid': 'base-volume-invalid',
                'quote-volume-24h-invalid': 'quote-volume-invalid',
                'observed-at-invalid': 'observed-at-invalid',
                'source-timestamp-invalid': 'close-time-invalid',
              } as const;
              return { ok: false, reason: reasons[validated.reason] };
            }
            return { ok: true, fact: validated.fact };
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          anchor="export * from './providers/binance/binanceSpotTradeObservation';\n"
          addition="export * from './providers/binance/binanceSpot24hSummaryFact';\n"
          if anchor not in s: raise SystemExit('P16 Binance mapping export anchor not found')
          p.write_text(s.replace(anchor, anchor+addition, 1))
          PY

          cat > "$ROOT/tests/binance-spot-24h-summary-fact.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import { mapBinanceSpot24hSummaryFact } from '../src/services/market-data';

          const payload = {
            symbol: 'BTCUSDT',
            openPrice: '62000.00000000',
            highPrice: '65000.00000000',
            lowPrice: '61000.00000000',
            lastPrice: '64000.50000000',
            volume: '1234.50000000',
            quoteVolume: '78000000.25000000',
            openTime: 1672429382136,
            closeTime: 1672515782136,
          };

          describe('P21.5 Binance Spot 24h summary fact mapping foundation', () => {
            it('maps one valid provider entry into canonical P21.2 market-summary fact truth', () => {
              expect(mapBinanceSpot24hSummaryFact(payload, '2023-01-01T00:03:02.200Z')).toEqual({
                ok: true,
                fact: {
                  instrument: { venue: 'binance-spot', symbol: 'BTCUSDT' },
                  lastPrice: '64000.50000000',
                  open24h: '62000.00000000',
                  high24h: '65000.00000000',
                  low24h: '61000.00000000',
                  baseVolume24h: '1234.50000000',
                  quoteVolume24h: '78000000.25000000',
                  observedAt: '2023-01-01T00:03:02.200Z',
                  sourceTimestamp: '2022-12-31T19:43:02.136Z',
                },
              });
            });

            it('has no BTC-specific mapping and accepts zero 24h volume', () => {
              const result = mapBinanceSpot24hSummaryFact(
                { ...payload, symbol: 'ETHUSDT', lastPrice: '2500.10', volume: '0', quoteVolume: '0' },
                '2023-01-01T00:03:02.200Z',
              );
              expect(result.ok).toBe(true);
              if (result.ok) {
                expect(result.fact.instrument.symbol).toBe('ETHUSDT');
                expect(result.fact.baseVolume24h).toBe('0');
              }
            });

            it('rejects invalid provider price and volume fields through canonical fact validation', () => {
              expect(mapBinanceSpot24hSummaryFact({ ...payload, lastPrice: '0' }, '2023-01-01T00:03:02.200Z'))
                .toEqual({ ok: false, reason: 'last-price-invalid' });
              expect(mapBinanceSpot24hSummaryFact({ ...payload, volume: '-1' }, '2023-01-01T00:03:02.200Z'))
                .toEqual({ ok: false, reason: 'base-volume-invalid' });
            });

            it('keeps receipt time caller-owned and validates provider closeTime separately', () => {
              expect(mapBinanceSpot24hSummaryFact({ ...payload, closeTime: -1 }, '2023-01-01T00:03:02.200Z'))
                .toEqual({ ok: false, reason: 'close-time-invalid' });
              expect(mapBinanceSpot24hSummaryFact(payload, 'not-a-time'))
                .toEqual({ ok: false, reason: 'observed-at-invalid' });
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_5_BINANCE_SPOT_24H_SUMMARY_FACT_MAPPING_FOUNDATION_REPORT_2026-09-07.md" <<'MD'
          # KAIROS P21.5 — Binance Spot 24h Summary Fact Mapping Foundation

          ## Authority
          Base: canonical P21.4 Live Market Summary Baseline Acquisition Port Foundation, `Kairos Controlled Roadmap Gate` #289 / run `34072260372`.

          ## Responsibility
          P16 already separates provider payload mapping from endpoint and browser transport. P21.5 adds only the missing pure Binance Spot 24h ticker-entry mapper into canonical P21.2 `LiveMarketSummaryFact` truth. Caller-owned `observedAt` remains outside provider mapping clock ownership.

          ## Mapping
          `symbol` -> instrument symbol at existing `BINANCE_SPOT_VENUE`; `lastPrice` -> `lastPrice`; `openPrice` -> `open24h`; `highPrice` -> `high24h`; `lowPrice` -> `low24h`; `volume` -> `baseVolume24h`; `quoteVolume` -> `quoteVolume24h`; valid `closeTime` -> ISO `sourceTimestamp`. Canonical P21.2 fact validation is reused before success.

          ## Explicit non-scope
          - No HTTP/fetch, REST URL/query construction, endpoint selection, symbol batching, or request-weight policy.
          - No P21.4 acquisition-port implementation, polling, subscription, retry, reconnect, credentials, or rate-limit policy.
          - No market-universe selection/ranking or accumulator/state/freshness/reset ownership.
          - No Bubble Map metric/color/grouping/filtering/geometry/interactions or Home wiring.
          - No persistence, journal/Your-Trades semantics, direct IndexedDB UI access, or dashboard transition motion.
          MD

          cat > "$ROOT/scripts/verify-p21-5-binance-spot-24h-summary-fact-mapping-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const mapper = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hSummaryFact.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_5_BINANCE_SPOT_24H_SUMMARY_FACT_MAPPING_FOUNDATION_REPORT_2026-09-07.md', import.meta.url), 'utf8');
          for (const token of [
            'export type BinanceSpot24hSummaryFactResult =',
            'export function mapBinanceSpot24hSummaryFact(',
            'validateLiveMarketSummaryFact(fact)',
            'BINANCE_SPOT_VENUE',
            'payload.lastPrice', 'payload.openPrice', 'payload.highPrice', 'payload.lowPrice',
            'payload.volume', 'payload.quoteVolume', 'payload.closeTime',
          ]) if (!mapper.includes(token)) throw new Error(`P21.5 mapper evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpot24hSummaryFact';")) throw new Error('P21.5 mapper barrel export missing');
          for (const forbidden of ['fetch(', 'WebSocket', 'EventSource', 'indexedDB', '/api/v3/', 'acquireBaseline(', 'createChart(', 'bubbleSize', 'marketCap']) {
            if (mapper.includes(forbidden)) throw new Error(`P21.5 broadened into forbidden implementation scope: ${forbidden}`);
          }
          for (const token of ['# KAIROS P21.5 — Binance Spot 24h Summary Fact Mapping Foundation', 'No HTTP/fetch', 'No P21.4 acquisition-port implementation', 'No market-universe selection/ranking', 'No Bubble Map metric', 'No persistence']) {
            if (!report.includes(token)) throw new Error(`P21.5 report evidence missing: ${token}`);
          }
          console.log('P21.5 Binance Spot 24h summary fact mapping verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:5-binance-spot-24h-summary-fact-mapping-foundation']='node scripts/verify-p21-5-binance-spot-24h-summary-fact-mapping-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_5_BINANCE_SPOT_24H_SUMMARY_FACT_MAPPING_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-5-binance-spot-24h-summary-fact-mapping-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpot24hSummaryFact.ts',
            'tests/binance-spot-24h-summary-fact.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P21.5 before packaging
        working-directory: .p21candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:5-binance-spot-24h-summary-fact-mapping-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .p21package
          mkdir .p21package
          cp -a "$ROOT" .p21package/kairos_p76
          rm -f "$OUT_ZIP"
          (cd .p21package && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | head -n1 | cut -d/ -f1)" = "kairos_p76"
          cp "$OUT_ZIP" /tmp/p21-5.zip
          git config user.name 'kairos-p21-5-helper'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git diff --cached --quiet && exit 0
          git commit -m 'Package P21.5 Binance Spot 24h summary fact mapping candidate'
          git push origin HEAD:main
