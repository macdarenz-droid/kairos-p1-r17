name: Kairos P19.7 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-7-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_6_RISK_REWARD_CHART_LOGICAL_OBJECT_PROJECTION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P19.7 from canonical P19.6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p19base .p19candidate
          mkdir .p19base .p19candidate
          unzip -q "$BASE_ZIP" -d .p19base
          cp -a .p19base/. .p19candidate/
          ROOT=.p19candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/riskRewardChartObjectProjection.ts"
          test -f docs/KAIROS_ARCHITECTURE_MAP.md

          # Use the current, canonically reconciled living architecture map as the closure document base.
          cp docs/KAIROS_ARCHITECTURE_MAP.md "$ROOT/docs/KAIROS_ARCHITECTURE_MAP.md"

          python - <<'PY'
          from pathlib import Path
          p=Path('.p19candidate/kairos_p76/docs/KAIROS_ARCHITECTURE_MAP.md')
          s=p.read_text()
          old='| Risk/Reward semantics + provider-neutral logical chart-object composition | P19 (canonical through P19.6) | `src/application/risk-reward/`, `src/app/riskRewardChartStyleProjection.ts`, `src/app/riskRewardChartPlacementProjection.ts`, `src/app/riskRewardChartObjectProjection.ts` | Owns RR meaning, semantic roles/zones, token-reference projection, logical placement, and logical object composition only; no P18 provider machinery, P11 calculation truth, P14 journal writes, P20 persistence, DOM/UI, or pixel geometry |'
          new='| Risk/Reward Tool — semantics + provider-neutral logical chart-object composition | P19 (SYSTEM CLOSED through P19.7) | `src/application/risk-reward/`, `src/app/riskRewardChartStyleProjection.ts`, `src/app/riskRewardChartPlacementProjection.ts`, `src/app/riskRewardChartObjectProjection.ts` | P19 owns RR meaning and provider-neutral logical composition only. Closure adds no runtime owner. P18 retains generic provider/interaction machinery; P11 calculations; P14 journal/execution truth; P20 Saved Analysis persistence; P2/P3 token values; later UI owns DOM/pixel presentation. |'
          if old not in s:
              raise SystemExit('expected current P19 architecture row not found')
          s=s.replace(old,new,1)
          s += '''\n\n---\n\n## P19 Risk/Reward Tool System Closure — canonical P19.7\n\nP19 closes only the roadmap-owned **Risk/Reward Tool semantic and provider-neutral logical composition boundary**. Canonical P19.1–P19.6 already establish analysis identity/side/prices, risk/reward zones, chart semantics, semantic token-reference projection, logical time placement, and logical chart-object composition. P19.7 adds **no production runtime behavior and no new production owner**.\n\nClosure boundary:\n\n- P19 owns Risk/Reward semantic truth and provider-neutral logical chart-object composition.\n- P18 remains the sole generic chart drawing / provider / interaction machinery owner; P19 does not widen P18.\n- P11 remains calculation truth; P14 remains journal/execution truth.\n- P20 owns later Saved Analysis persistence; P19 closure implements no persistence.\n- P2/P3 retain semantic token values; P19 only references established semantic tokens.\n- DOM/UI/CSS, renderer-number conversion, Lightweight Charts production calls, and pixel/screen geometry remain outside this closure.\n\nCanonical phase rule: after P19.7 receives a full canonical PASS, P19 is closed. Any later Risk/Reward amendment must be a new controlled amendment from the latest GOLDEN and must preserve these ownership boundaries.\n'''
          p.write_text(s)
          PY

          cat > "$ROOT/scripts/verify-p19-7-risk-reward-tool-system-closure.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          const architecture = readFileSync(new URL('../docs/KAIROS_ARCHITECTURE_MAP.md', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_REPORT_2026-09-06.md', import.meta.url), 'utf8');

          const requiredScripts = [
            'verify:p19:1-risk-reward-analysis-contract-foundation',
            'verify:p19:2-risk-reward-zone-semantics-projection',
            'verify:p19:3-risk-reward-chart-composition-semantic-contract',
            'verify:p19:4-risk-reward-chart-semantic-style-projection',
            'verify:p19:5-risk-reward-chart-logical-placement-projection',
            'verify:p19:6-risk-reward-chart-logical-object-projection',
          ];
          for (const name of requiredScripts) {
            if (typeof pkg.scripts?.[name] !== 'string') throw new Error(`P19.7 closure missing retained verifier registration: ${name}`);
          }

          for (const token of [
            'P19 (SYSTEM CLOSED through P19.7)',
            '## P19 Risk/Reward Tool System Closure — canonical P19.7',
            'P19.7 adds **no production runtime behavior and no new production owner**',
            'P18 remains the sole generic chart drawing / provider / interaction machinery owner',
            'P20 owns later Saved Analysis persistence',
            'renderer-number conversion, Lightweight Charts production calls, and pixel/screen geometry remain outside this closure',
          ]) {
            if (!architecture.includes(token)) throw new Error(`P19.7 architecture closure evidence missing: ${token}`);
          }

          for (const token of [
            '# KAIROS P19.7 — Risk/Reward Tool System Closure',
            'No production runtime source changes',
            'P19.1 through P19.6',
            'P20 retains Saved Analysis persistence',
            'P18 retains generic chart drawing, provider, and interaction machinery',
          ]) {
            if (!report.includes(token)) throw new Error(`P19.7 closure report evidence missing: ${token}`);
          }

          console.log('P19.7 Risk/Reward Tool system closure verification passed.');
          JS

          cat > "$ROOT/KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P19.7 — Risk/Reward Tool System Closure

          ## Authority
          Base: canonical P19.6 Risk/Reward Chart Logical Object Projection, `Kairos Controlled Roadmap Gate` run #279 / `34018858400`.

          ## Closure result
          P19.1 through P19.6 already provide the complete roadmap-owned Risk/Reward semantic and provider-neutral logical composition chain. P19.7 closes that system boundary. No production runtime source changes are introduced by this closure.

          ## Retained ownership
          P19 owns Risk/Reward analysis identity/side/prices, semantic risk/reward zones, chart semantics, semantic token-reference projection, logical time placement, and provider-neutral logical chart-object composition.

          P18 retains generic chart drawing, provider, and interaction machinery. P11 retains calculation truth. P14 retains journal/execution truth. P20 retains Saved Analysis persistence. P2/P3 retain semantic token values. Later UI/presentation phases retain DOM/UI/CSS, provider rendering, numeric coordinate conversion, and pixel geometry.

          ## Non-scope
          No provider/Lightweight Charts production API, renderer-number conversion, pixels/screen geometry, P18 widening, DOM/UI/CSS, interaction/editing, P20 persistence implementation, P14 mutation, P11 math duplication, normalization/order validation, hard-coded colors, or duplicate P19.1-P19.6 owner.

          ## Canonical requirement
          This closure is authoritative only after the `Kairos Controlled Roadmap Gate` passes the exact P19.7 candidate and publishes both canonical artifacts.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p19candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p19:7-risk-reward-tool-system-closure']='node scripts/verify-p19-7-risk-reward-tool-system-closure.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_REPORT_2026-09-06.md',
            'docs/KAIROS_ARCHITECTURE_MAP.md',
            'package.json',
            'scripts/verify-p19-7-risk-reward-tool-system-closure.mjs',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P19.7 before packaging
        working-directory: .p19candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run typecheck
          npm run build
          npm run verify:p19:6-risk-reward-chart-logical-object-projection
          npm run verify:p19:5-risk-reward-chart-logical-placement-projection
          npm run verify:p19:4-risk-reward-chart-semantic-style-projection
          npm run verify:p19:3-risk-reward-chart-composition-semantic-contract
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1
          npx vitest run

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p19candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_REPORT_2026-09-06.md',
            'docs/KAIROS_ARCHITECTURE_MAP.md',
            'package.json',
            'scripts/verify-p19-7-risk-reward-tool-system-closure.mjs',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p19candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P19.7 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p19candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P19.7 Risk Reward Tool system closure candidate'
          git push
