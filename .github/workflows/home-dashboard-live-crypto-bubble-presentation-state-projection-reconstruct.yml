name: Kairos Home Dashboard Live Crypto Bubble Presentation State Projection Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-crypto-bubble-presentation-state-projection-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-crypto-bubble-presentation-state-projection-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify Home Bubble presentation-state projection from Gate345 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_BINANCE_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_OBSERVED_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-10.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_CANDIDATE_2026-09-10.zip
          PAYLOAD=.github/kairos-helper-payloads/home-bubble-presentation-state
          WORK="$RUNNER_TEMP/home-bubble-presentation-state-work"
          BASE="$RUNNER_TEMP/home-bubble-presentation-state-base"

          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1606330"
          echo "3cb6852aba0d5a2037f4e134254d2852585d3186acf5a6695c538323685ede49  $BASE_ZIP" | sha256sum -c -
          echo "5143ca0c954dbd439bae876f77d3ec490bab67c94cec312aad208196e52616ac  $PAYLOAD/report.md" | sha256sum -c -
          echo "a6e4e997b6b4481842e12e400ae599c1f372f186f2cb2cf012c938788a16641e  $PAYLOAD/verifier.mjs" | sha256sum -c -
          echo "28446451a6d635ae0920ff973955cd343b231c8310eb2ea314656af488dad5a7  $PAYLOAD/projection.ts" | sha256sum -c -
          echo "9c5639fe3577cbf95aa46b38261555501e11d908b032e50082d952edce266b6f  $PAYLOAD/test.ts" | sha256sum -c -

          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/binanceHomeDashboardLiveCryptoBubbleObservedRuntimeComposition.ts"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveCryptoBubbleMetricObservationBridge.ts"
          test ! -e "$ROOT/src/application/dashboard/homeDashboardLiveCryptoBubblePresentationStateProjection.ts"

          cp "$PAYLOAD/report.md" "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_REPORT_2026-09-10.md"
          cp "$PAYLOAD/verifier.mjs" "$ROOT/scripts/verify-home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.mjs"
          cp "$PAYLOAD/projection.ts" "$ROOT/src/application/dashboard/homeDashboardLiveCryptoBubblePresentationStateProjection.ts"
          cp "$PAYLOAD/test.ts" "$ROOT/tests/home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.test.ts"

          python - "$ROOT/package.json" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          old = '    "verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation": "node scripts/verify-binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation.mjs"\n  },'
          new = '    "verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation": "node scripts/verify-binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation.mjs",\n    "verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation": "node scripts/verify-home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.mjs"\n  },'
          if text.count(old) != 1:
              raise RuntimeError('exact package verifier insertion anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cd "$ROOT"
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation
          npm run verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation
          npm run verify:live-crypto-bubble-metric-input-projection-foundation
          npm run verify:live-market-summary-24h-percentage-movement-foundation
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation
          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.test.ts \
            tests/binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation.test.ts \
            tests/live-crypto-bubble-metric-input-projection-foundation.test.ts \
            tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(pkg.scripts||{}).filter((x)=>x.startsWith('verify:')).sort();
          const required=[
            'verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation',
            'verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation',
            'verify:live-crypto-bubble-metric-input-projection-foundation',
            'verify:live-market-summary-24h-percentage-movement-foundation',
            'verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation',
            'verify:live-market-summary-freshness-evaluation-projection-foundation',
            'verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation',
            'verify:p21:17-live-market-summary-baseline-state-orchestration-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1'
          ];
          for(const name of required) if(!scripts.includes(name)){console.error('Missing '+name);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_REPORT_2026-09-10.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.mjs',
            'src/application/dashboard/homeDashboardLiveCryptoBubblePresentationStateProjection.ts',
            'tests/home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_CANDIDATE_2026-09-10.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          BASE: ${{ runner.temp }}/home-bubble-presentation-state-base
          WORK: ${{ runner.temp }}/home-bubble-presentation-state-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_CANDIDATE
          path: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_CANDIDATE_2026-09-10.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git pull --rebase origin main
          git add KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_CANDIDATE_2026-09-10.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Home Bubble presentation-state projection'
          git push origin HEAD:main
