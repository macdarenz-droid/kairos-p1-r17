name: Kairos Gate320 Architecture Reconciliation

on:
  push:
    paths:
      - '.github/workflows/gate320-architecture-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact Gate320 base and architecture blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b895ebf3a2b1ba8ab3c78d835863b8cc9dbf0767"
          test "$(git rev-parse HEAD:docs/KAIROS_ARCHITECTURE_MAP.md)" = "14ccc80df01a97e05a43962e4c4a6c6faaacc4e7"
          test ! -e src/services/market-data/providers/binance/binanceSpotExchangeInfoPublicRestRoundTrip.ts
      - name: Append exact canonical Gate320 checkpoint and remove helper
        shell: bash
        env:
          APPEND_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path("docs/KAIROS_ARCHITECTURE_MAP.md")
          text = p.read_text()
          marker = "## Canonical Binance Spot exchangeInfo public REST response delivery composition checkpoint — gate #320"
          assert marker not in text
          p.write_text(text + base64.b64decode(os.environ["APPEND_B64"]).decode())
          PY
          git rm .github/workflows/gate320-architecture-reconcile.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/gate320-architecture-reconcile.yml' 'docs/KAIROS_ARCHITECTURE_MAP.md' | sort)"
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kairos-autonomous"
          git config user.email "kairos-autonomous@users.noreply.github.com"
          git add docs/KAIROS_ARCHITECTURE_MAP.md .github/workflows/gate320-architecture-reconcile.yml
          git commit -m "docs: reconcile canonical exchangeInfo response delivery"
          git push origin HEAD:main
