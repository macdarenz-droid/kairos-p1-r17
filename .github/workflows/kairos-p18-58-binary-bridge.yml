name: Kairos P18.58 Verified Candidate Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kairos-p18-58-binary-bridge.yml'

permissions:
  contents: write

env:
  BASE_ZIP: KAIROS_P18_57_LIGHTWEIGHT_CHARTS_V5_TREND_LINE_EDIT_ENDPOINT_CLICK_COORDINATION_CANDIDATE_2026-09-05.zip
  CANDIDATE_ZIP: KAIROS_P18_58_LIGHTWEIGHT_CHARTS_V5_TREND_LINE_EDIT_ENDPOINT_CLICK_LIFECYCLE_COMPOSITION_CANDIDATE_2026-09-06.zip
  PATCH_SHA256: 0fb852deb78e2c8a6a53d8bab138d3d73cc85d2e6fd4dc6ea50344cee4310146
  PATCH_GZIP_B64: 

jobs:
  materialize-verified-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm bridge preconditions
        run: |
          test -f "$BASE_ZIP"
          test ! -e "$CANDIDATE_ZIP"
          test -f .github/workflows/kairos-p18-58-binary-bridge.yml

      - name: Reconstruct exact reviewed P18.58 source delta
        run: |
          rm -rf .bridge && mkdir -p .bridge/base .bridge/candidate
          printf '%s' "$PATCH_GZIP_B64" | base64 -d | gzip -d > .bridge/p18-58.patch
          echo "$PATCH_SHA256  .bridge/p18-58.patch" | sha256sum -c -
          unzip -q "$BASE_ZIP" -d .bridge/base
          unzip -q "$BASE_ZIP" -d .bridge/candidate
          test -f .bridge/candidate/kairos_p76/package.json
          patch -s -p1 -d .bridge/candidate/kairos_p76 < .bridge/p18-58.patch

      - name: Confirm exact seven-file scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.bridge/base/kairos_p76'); c=Path('.bridge/candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_P18_58_LIGHTWEIGHT_CHARTS_V5_TREND_LINE_EDIT_ENDPOINT_CLICK_LIFECYCLE_COMPOSITION_REPORT_2026-09-06.md',
            'docs/KAIROS_ARCHITECTURE_MAP.md',
            'package.json',
            'scripts/verify-p18-58-lightweight-charts-v5-trend-line-edit-endpoint-click-lifecycle-composition.mjs',
            'src/features/chart/index.ts',
            'src/features/chart/lightweightChartsV5TrendLineDraftInteractionComposition.ts',
            'tests/lightweight-charts-v5-trend-line-edit-endpoint-click-lifecycle-composition.test.ts',
          }
          print('\n'.join(sorted(changed)))
          if changed != expected:
            print('bridge scope mismatch', file=sys.stderr)
            print('Unexpected:', sorted(changed-expected), file=sys.stderr)
            print('Missing:', sorted(expected-changed), file=sys.stderr)
            sys.exit(1)
          PY

      - name: Run static ownership and historical compatibility evidence
        working-directory: .bridge/candidate/kairos_p76
        run: |
          node scripts/verify-p18-58-lightweight-charts-v5-trend-line-edit-endpoint-click-lifecycle-composition.mjs
          node scripts/verify-p18-57-lightweight-charts-v5-trend-line-edit-endpoint-click-coordination.mjs
          node scripts/verify-p18-42-lightweight-charts-v5-drawing-selection-click-lifecycle-composition.mjs
          node scripts/verify-p18-40-lightweight-charts-v5-drawing-click-evidence-fanout.mjs
          node scripts/verify-p18-30-lightweight-charts-v5-trend-line-draft-interaction-composition.mjs
          node scripts/verify-p18-27-lightweight-charts-v5-drawing-click-binding-composition.mjs
          node scripts/verify-p18-26-lightweight-charts-v5-drawing-click-subscription.mjs
          node scripts/verify-p18-24-chart-drawing-interaction-port.mjs
          npm run verify:toolchain
          npm run verify:static
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>/^verify:p18:/.test(x));
          for(const x of s){const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          console.log('P18 verifier count:',s.length)
          NODE

      - name: Package candidate without generated residue
        run: |
          test ! -d .bridge/candidate/kairos_p76/node_modules
          test ! -d .bridge/candidate/kairos_p76/dist
          test ! -d .bridge/candidate/kairos_p76/coverage
          find .bridge/candidate/kairos_p76 -name '*.tsbuildinfo' -o -name '*.log' | grep . && exit 1 || true
          (cd .bridge/candidate && zip -X -qr -9 "../../$CANDIDATE_ZIP" kairos_p76)
          unzip -tq "$CANDIDATE_ZIP"
          test "$(unzip -Z1 "$CANDIDATE_ZIP" | head -1 | cut -d/ -f1)" = "kairos_p76"
          sha256sum "$CANDIDATE_ZIP"
          stat -c '%n %s bytes' "$CANDIDATE_ZIP"

      - name: Commit exact binary candidate and remove temporary bridge
        run: |
          git config user.name 'Kairos Candidate Bridge'
          git config user.email 'kairos-bridge@users.noreply.github.com'
          git add "$CANDIDATE_ZIP"
          git rm .github/workflows/kairos-p18-58-binary-bridge.yml
          git commit -m 'Upload P18.58 candidate via verified binary bridge'
          git push origin HEAD:main
