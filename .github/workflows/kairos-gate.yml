# KAIROS P13.19 GATE — BASE P13.18 — CANDIDATE P13.19
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches:
      - main
    paths:
      - 'KAIROS_P13_19_CUMULATIVE_REALIZED_PNL_PRESENTATION_CANDIDATE_2026-09-02.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P13_18_CUMULATIVE_REALIZED_PNL_SEMANTICS_CANDIDATE_2026-09-02.zip
  CANDIDATE_ZIP: KAIROS_P13_19_CUMULATIVE_REALIZED_PNL_PRESENTATION_CANDIDATE_2026-09-02.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use locked Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P13.19 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          base=Path('.gate-base/kairos_p76'); cand=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P13_19_CUMULATIVE_REALIZED_PNL_PRESENTATION_REPORT_2026-09-02.md',
            'package.json',
            'scripts/verify-p13-19-cumulative-realized-pnl-presentation.mjs',
            'src/app/JournalDailyResults.tsx',
            'src/app/VisualPnlCumulativeProgress.tsx',
            'src/app/journalRoute.css',
            'tests/visual-pnl-cumulative-progress-presentation.test.tsx',
          }
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          b={str(p.relative_to(base)):digest(p) for p in base.rglob('*') if p.is_file()}
          c={str(p.relative_to(cand)):digest(p) for p in cand.rglob('*') if p.is_file()}
          changed={p for p in b.keys()|c.keys() if b.get(p)!=c.get(p)}
          print('Changed files:'); [print(' -',p) for p in sorted(changed)]
          if changed-required: print('Unexpected changes:',sorted(changed-required),file=sys.stderr); sys.exit(1)
          if required-changed: print('Required changes missing:',sorted(required-changed),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P13.19
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs'); const { spawnSync } = require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const scripts=Object.keys(pkg.scripts||{}).filter(n=>n.startsWith('verify:p'));
          for (const required of ['verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence','verify:p10:manual-trade-journal-route','verify:p11:calculation-brain-closure','verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance','verify:p13:visual-pnl-outcome-projection','verify:p13:journal-visual-pnl-projection','verify:p13:journal-visual-pnl-presentation','verify:p13:3r1-fixture-contract','verify:p13:3r2-scoped-outcome-selector','verify:p13:visual-pnl-aggregation-eligibility','verify:p13:4r1-empty-amounts-tuple','verify:p13:5-visual-pnl-aggregation-summary','verify:p13:5r1-decimalstring-fixture-contract','verify:p13:6-visual-pnl-day-bucket-semantics','verify:p13:7-visual-pnl-daily-summary-composition','verify:p13:8-journal-daily-summary-query-wiring','verify:p13:9-visual-pnl-calendar-presentation','verify:p13:10r1-visual-pnl-time-zone-metadata-ownership','verify:p13:11r1-journal-daily-results-boundary','verify:p13:12-explicit-time-zone-settings','verify:p13:12r2-accessible-name-test-contract','verify:p13:13-daily-streak-semantics','verify:p13:14-streak-presentation','verify:p13:15-daily-performance-summary','verify:p13:16-performance-summary-presentation','verify:p13:17r1-progress-series-empty-points-contract','verify:p13:18-cumulative-realized-pnl-semantics','verify:p13:19-cumulative-realized-pnl-presentation']) {
            if (!scripts.includes(required)) { console.error(`Missing ${required}`); process.exit(1); }
          }
          for (const script of scripts) { console.log(`\n=== ${script} ===`); const r=spawnSync('npm',['run',script],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE
      - name: P13.19 cumulative realized P&L presentation verification
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p13:19-cumulative-realized-pnl-presentation
      - name: P13.19 cumulative realized P&L presentation runtime tests
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-cumulative-progress-presentation.test.tsx
      - name: P13.18 cumulative realized P&L semantics regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-cumulative-realized-pnl.test.ts
      - name: P13.17R1 progress-series runtime regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-progress-series.test.ts
      - name: P13.16 performance summary presentation regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-performance-summary-presentation.test.tsx
      - name: Historical P10 Journal route regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p10:manual-trade-journal-route
      - name: Historical P1 ownership verifier regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:static
      - name: P13.11R1 Journal child-boundary regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-daily-results-boundary.test.tsx
      - name: P13.9 calendar presentation regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-calendar-presentation.test.tsx
      - name: Journal History route regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-route.test.tsx
      - name: Journal History closure integration
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-closure.test.tsx
      - name: USER_HEAVY timing canary
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-performance.test.tsx
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P13_19_CUMULATIVE_REALIZED_PNL_PRESENTATION_REPORT_2026-09-02.md
          if-no-files-found: error