# KAIROS HOME DASHBOARD LIVE CRYPTO BUBBLE CONFIGURED BROWSER PIXEL RADIUS TEXT EVIDENCE RUNTIME COMPOSITION FOUNDATION GATE — AUTHORITATIVE BASE GATE 380
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_PIXEL_RADIUS_TEXT_EVIDENCE_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
  CANDIDATE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_PIXEL_RADIUS_TEXT_EVIDENCE_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Verify exact uploaded archive identity and integrity
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          for key, size, digest in [
            ('BASE_ZIP', 1766211, 'a4530878e81b8683f90a523652066170c284a6ea7d9fd4610e1763cf1968785e'),
            ('CANDIDATE_ZIP', 1771967, 'abe1a5c5e937cc2671d08daeb7131075e9bf9f625973dea009e2c53c98e2151c'),
          ]:
            p = Path(os.environ[key])
            data = p.read_bytes()
            assert len(data) == size, f'{key}: byte size mismatch'
            assert hashlib.sha256(data).hexdigest() == digest, f'{key}: SHA-256 mismatch'
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, f'{key}: ZIP integrity failure'
              assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}, f'{key}: wrong ZIP root'
              for i in z.infolist():
                parts = PurePosixPath(i.filename)
                assert not parts.is_absolute() and '..' not in parts.parts, f'{key}: invalid archive path'
                assert ((i.external_attr >> 16) & 0o170000) != 0o120000, f'{key}: unexpected symbolic link'
          PY

      - name: Extract authoritative Gate380 base and candidate
        run: |
          set -euo pipefail
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json

      - name: Confirm exact controlled configured browser pixel-radius text-evidence runtime composition foundation scope from Gate380
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          b = Path('.gate-base/kairos_p76')
          c = Path('.gate-candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x = {str(p.relative_to(b)): h(p) for p in b.rglob('*') if p.is_file()}
          y = {str(p.relative_to(c)): h(p) for p in c.rglob('*') if p.is_file()}
          changed = {p for p in x.keys() | y.keys() if x.get(p) != y.get(p)}
          expected = {
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_PIXEL_RADIUS_TEXT_EVIDENCE_RUNTIME_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation.mjs',
            'src/app/HomeDashboardLiveCryptoBubbleConfiguredBrowserPixelRadiusTextEvidenceRuntime.tsx',
            'tests/home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation.test.tsx',
          }
          removed = set(x) - set(y)
          if changed != expected or removed:
            print('Configured browser pixel-radius text-evidence runtime composition foundation exact scope mismatch', file=sys.stderr)
            print('Unexpected:', sorted(changed - expected), file=sys.stderr)
            print('Missing:', sorted(expected - changed), file=sys.stderr)
            print('Removed:', sorted(removed), file=sys.stderr)
            sys.exit(1)
          PY

      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci

      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck

      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build

      - name: Dedicated configured browser pixel-radius text-evidence runtime composition foundation verifier
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation

      - name: Focused configured browser pixel-radius text-evidence runtime composition foundation regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation.test.tsx \
            tests/home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-pixel-radius-text-evidence-presentation-foundation.test.tsx \
            tests/home-dashboard-live-crypto-bubble-pixel-radius-projection-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation.test.tsx
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation

      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test

      - name: Full controlled roadmap regression through current candidate
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync} = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const p = JSON.parse(readFileSync('package.json'));
          const scripts = Object.keys(p.scripts || {}).filter(x => x.startsWith('verify:')).sort();
          for (const required of [
            'verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-pixel-radius-text-evidence-presentation-foundation',
            'verify:home-dashboard-live-crypto-bubble-pixel-radius-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation',
            'verify:p21:1-home-dashboard-route-ownership-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation',
            'verify:p20:5-saved-analysis-system-closure',
            'verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure',
            'verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure',
            'verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure',
            'verify:p13:20-visual-pnl-system-closure',
            'verify:p12:journal-history-closure',
            'verify:p11:calculation-brain-closure',
            'verify:p10:manual-trade-journal-route',
            'verify:p9:trade-persistence',
            'verify:p8:navigation-shell',
            'verify:p1',
            'verify:static',
          ]) {
            if (!scripts.includes(required)) {
              console.error('Missing ' + required);
              process.exit(1);
            }
          }
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], {stdio: 'inherit'});
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          # Re-run every registered verifier after unit and controlled-roadmap regression.
          node - <<'NODE'
          const {readFileSync} = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const p = JSON.parse(readFileSync('package.json'));
          const scripts = Object.keys(p.scripts || {}).filter(x => x.startsWith('verify:')).sort();
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], {stdio: 'inherit'});
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_PIXEL_RADIUS_TEXT_EVIDENCE_RUNTIME_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md
          if-no-files-found: error
