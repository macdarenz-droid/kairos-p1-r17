# KAIROS P16.17R2 GATE — AUTHORITATIVE BASE P16.16 — CANDIDATE P16.17R2
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P16_17R2_BINANCE_SPOT_BROWSER_WEBSOCKET_TEST_DOUBLE_REPAIR_CANDIDATE_2026-09-03.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P16_16_BINANCE_SPOT_BROWSER_PUBLIC_TRADE_SUBSCRIPTION_CANDIDATE_2026-09-03.zip
  CANDIDATE_ZIP: KAIROS_P16_17R2_BINANCE_SPOT_BROWSER_WEBSOCKET_TEST_DOUBLE_REPAIR_CANDIDATE_2026-09-03.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate && mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P16.17R2 scope from authoritative P16.16
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          allowed={
            'KAIROS_P16_17R2_BINANCE_SPOT_BROWSER_WEBSOCKET_TEST_DOUBLE_REPAIR_REPORT_2026-09-03.md',
            'package.json',
            'scripts/verify-p16-17-binance-spot-browser-public-trade-reconnect-subscription.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpotBrowserPublicTradeReconnectSubscription.ts',
            'tests/binance-spot-browser-public-trade-reconnect-subscription.test.ts'
          }
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          if changed != allowed:
            print('Expected:',sorted(allowed),file=sys.stderr)
            print('Actual:',sorted(changed),file=sys.stderr)
            sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P16.17R2
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          const required=[
            'verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence',
            'verify:p10:manual-trade-journal-route','verify:p11:calculation-brain-closure',
            'verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance',
            'verify:p13:20-visual-pnl-system-closure','verify:p14:9-trade-visualizer-system-closure',
            'verify:p15:14-market-data-adapter-system-closure',
            'verify:p16:1-binance-spot-trade-stream','verify:p16:2-binance-spot-trade-observation',
            'verify:p16:3-binance-spot-public-stream-endpoint','verify:p16:4-binance-spot-public-stream-connection',
            'verify:p16:5-binance-spot-public-stream-message-decode','verify:p16:6-binance-spot-public-stream-event',
            'verify:p16:7-binance-spot-public-stream-trade-message','verify:p16:8-binance-spot-public-stream-trade-delivery',
            'verify:p16:9-binance-spot-public-trade-subscription','verify:p16:10-execution-market-reference-truth',
            'verify:p16:11-p1-browser-transport-compatibility','verify:p16:12-binance-spot-browser-stream-connector',
            'verify:p16:13-binance-spot-public-stream-lifecycle-connector',
            'verify:p16:14-binance-spot-server-shutdown-reconnect-cause',
            'verify:p16:15-binance-spot-server-shutdown-reconnect-execution',
            'verify:p16:16-binance-spot-browser-public-trade-subscription',
            'verify:p16:17-binance-spot-browser-public-trade-reconnect-subscription'
          ];
          for(const r of required) if(!s.includes(r)){console.error('Missing '+r);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: P16.17R2 reconnect subscription verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:17-binance-spot-browser-public-trade-reconnect-subscription
          npx vitest run tests/binance-spot-browser-public-trade-reconnect-subscription.test.ts
      - name: P16.16 browser public trade subscription regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:16-binance-spot-browser-public-trade-subscription
          npx vitest run tests/binance-spot-browser-public-trade-subscription.test.ts
      - name: P16.15 serverShutdown reconnect-execution regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:15-binance-spot-server-shutdown-reconnect-execution
          npx vitest run tests/binance-spot-server-shutdown-reconnect-execution.test.ts
      - name: P16.14 serverShutdown reconnect-cause regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:14-binance-spot-server-shutdown-reconnect-cause
          npx vitest run tests/binance-spot-server-shutdown-reconnect-cause.test.ts
      - name: P16.13 lifecycle connector regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:13-binance-spot-public-stream-lifecycle-connector
          npx vitest run tests/binance-spot-public-stream-lifecycle-connector.test.ts
      - name: P16.12 browser connector regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:12-binance-spot-browser-stream-connector
          npx vitest run tests/binance-spot-browser-stream-connector.test.ts
      - name: P16.11 compatibility regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:11-p1-browser-transport-compatibility
          npm run verify:p1
          npm run verify:static
      - name: P16.10 truth contract regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:10-execution-market-reference-truth
          npx vitest run tests/execution-market-reference-truth.test.ts
      - name: P16.9 through P16.1 regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:9-binance-spot-public-trade-subscription
          npx vitest run tests/binance-spot-public-trade-subscription.test.ts
          npm run verify:p16:8-binance-spot-public-stream-trade-delivery
          npx vitest run tests/binance-spot-public-stream-trade-delivery.test.ts
          npm run verify:p16:7-binance-spot-public-stream-trade-message
          npx vitest run tests/binance-spot-public-stream-trade-message.test.ts
          npm run verify:p16:6-binance-spot-public-stream-event
          npm run verify:p16:5-binance-spot-public-stream-message-decode
          npm run verify:p16:4-binance-spot-public-stream-connection
          npm run verify:p16:3-binance-spot-public-stream-endpoint
          npm run verify:p16:2-binance-spot-trade-observation
          npm run verify:p16:1-binance-spot-trade-stream
      - name: P15 and historical closure regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p10:manual-trade-journal-route
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P16_17R2_BINANCE_SPOT_BROWSER_WEBSOCKET_TEST_DOUBLE_REPAIR_REPORT_2026-09-03.md
          if-no-files-found: error
