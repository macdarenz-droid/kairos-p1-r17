# KAIROS P13.10 GATE — BASE P13.9 — CANDIDATE P13.10
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches:
      - main
    paths:
      - 'KAIROS_P13_10_VISUAL_PNL_TIME_ZONE_PREFERENCE_CANDIDATE_2026-09-02.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P13_9_VISUAL_PNL_CALENDAR_PRESENTATION_CONTRACT_CANDIDATE_2026-09-02.zip
  CANDIDATE_ZIP: KAIROS_P13_10_VISUAL_PNL_TIME_ZONE_PREFERENCE_CANDIDATE_2026-09-02.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use locked Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P13.10 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          base=Path('.gate-base/kairos_p76'); cand=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P13_10_VISUAL_PNL_TIME_ZONE_PREFERENCE_REPORT_2026-09-02.md',
            'package.json',
            'scripts/verify-p13-10-visual-pnl-time-zone-preference.mjs',
            'src/application/visual-pnl/index.ts',
            'src/application/visual-pnl/timeZonePreference.ts',
            'tests/visual-pnl-time-zone-preference.test.ts',
          }
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          b={str(p.relative_to(base)):digest(p) for p in base.rglob('*') if p.is_file()}
          c={str(p.relative_to(cand)):digest(p) for p in cand.rglob('*') if p.is_file()}
          changed={p for p in b.keys()|c.keys() if b.get(p)!=c.get(p)}
          print('Changed files:'); [print(' -',p) for p in sorted(changed)]
          if changed-required: print('Unexpected changes:',sorted(changed-required),file=sys.stderr); sys.exit(1)
          if required-changed: print('Required changes missing:',sorted(required-changed),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P13.10
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs'); const { spawnSync } = require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const scripts=Object.keys(pkg.scripts||{}).filter(n=>n.startsWith('verify:p'));
          for (const required of ['verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence','verify:p11:calculation-brain-closure','verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance','verify:p13:visual-pnl-outcome-projection','verify:p13:journal-visual-pnl-projection','verify:p13:journal-visual-pnl-presentation','verify:p13:3r1-fixture-contract','verify:p13:3r2-scoped-outcome-selector','verify:p13:visual-pnl-aggregation-eligibility','verify:p13:4r1-empty-amounts-tuple','verify:p13:5-visual-pnl-aggregation-summary','verify:p13:5r1-decimalstring-fixture-contract','verify:p13:6-visual-pnl-day-bucket-semantics','verify:p13:7-visual-pnl-daily-summary-composition','verify:p13:8-journal-daily-summary-query-wiring','verify:p13:9-visual-pnl-calendar-presentation','verify:p13:10-visual-pnl-time-zone-preference']) {
            if (!scripts.includes(required)) { console.error(`Missing ${required}`); process.exit(1); }
          }
          for (const script of scripts) { console.log(`\n=== ${script} ===`); const r=spawnSync('npm',['run',script],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE
      - name: P13.10 timezone preference verification
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p13:10-visual-pnl-time-zone-preference
      - name: P13.10 timezone preference tests
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-time-zone-preference.test.ts
      - name: P13.9 calendar presentation regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-calendar-presentation.test.tsx
      - name: P13.8 Journal daily summary query regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-visual-pnl-daily-summary-query.test.ts
      - name: P13.7 daily summary composition regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-daily-summary.test.ts
      - name: P13.6 day-bucket semantics regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-day-bucket.test.ts
      - name: P13.5R1 DecimalString fixture regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p13:5r1-decimalstring-fixture-contract
      - name: P13.5 aggregation summary regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-aggregation-summary.test.ts
      - name: P13.4 aggregation eligibility regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-aggregation-eligibility.test.ts
      - name: P13.3R2 presentation regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-visual-pnl-presentation.test.tsx
      - name: P13.2 journal projection regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-visual-pnl-projection.test.ts
      - name: P13.1R3 outcome projection regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/visual-pnl-outcome-projection.test.ts
      - name: Journal History closure integration
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-closure.test.tsx
      - name: USER_HEAVY timing canary
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-performance.test.tsx
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P13_10_VISUAL_PNL_TIME_ZONE_PREFERENCE_REPORT_2026-09-02.md
          if-no-files-found: error