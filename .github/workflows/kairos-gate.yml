name: Kairos Controlled Roadmap Gate — Analysis Historical Candles UI R1

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_ANALYSIS_HISTORICAL_CANDLES_UI_R1_CANDIDATE_2026-09-12.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_BINANCE_SPOT_CANDLE_HISTORY_FOUNDATION_CANDIDATE_2026-09-12.zip
  CANDIDATE_ZIP: KAIROS_ANALYSIS_HISTORICAL_CANDLES_UI_R1_CANDIDATE_2026-09-12.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Verify exact uploaded archive identity and integrity
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile

          for key, size, digest in [
            ('BASE_ZIP', 3500259, '25673f82dca0dd8b529f3b2d5330af48c5aa7c3ed6c656f7a8201bef038d9c5d'),
            ('CANDIDATE_ZIP', 3527586, '33b8c48474dbd4d0eabef905900a9f043716c4726bda4b675ccbea7391e67505'),
          ]:
            p = Path(os.environ[key])
            data = p.read_bytes()
            assert len(data) == size, f'{key}: byte size mismatch'
            assert hashlib.sha256(data).hexdigest() == digest, f'{key}: SHA-256 mismatch'
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, f'{key}: ZIP integrity failure'
              assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}, f'{key}: wrong ZIP root'
              for i in z.infolist():
                parts = PurePosixPath(i.filename)
                assert not parts.is_absolute() and '..' not in parts.parts, f'{key}: invalid archive path'
                assert ((i.external_attr >> 16) & 0o170000) != 0o120000, f'{key}: unexpected symbolic link'
          PY

      - name: Extract authoritative base and candidate
        run: |
          set -euo pipefail
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json

      - name: Confirm exact historical Analysis UI scope from Gate406
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys

          def hashes(root):
            return {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}

          x = hashes(Path('.gate-base/kairos_p76'))
          y = hashes(Path('.gate-candidate/kairos_p76'))
          changed = {p for p in x.keys() | y.keys() if x.get(p) != y.get(p)}
          removed = set(x) - set(y)
          expected = {
            'docs/KAIROS_ANALYSIS_HISTORICAL_CANDLES_UI_AMENDMENT.md',
            'docs/KAIROS_ARCHITECTURE_MAP.md',
            'docs/KAIROS_BINANCE_SPOT_CANDLE_HISTORY_FOUNDATION.md',
            'docs/KAIROS_CHART_WORKSPACE_INTEGRATION_PLAN.md',
            'docs/KAIROS_CONTINUATION_APPROVAL_CONTROL.md',
            'docs/KAIROS_TIME_BASED_TRADE_SNAPSHOT_FEASIBILITY.md',
            'package.json',
            'scripts/test-analysis-history-browser.mjs',
            'scripts/verify-analysis-history-workspace.mjs',
            'src/app/AnalysisCandleCanvas.tsx',
            'src/app/AnalysisHistoryWorkspace.tsx',
            'src/app/AnalysisRoute.tsx',
            'src/app/analysisHistory.css',
            'src/app/analysisHistoryPorts.ts',
            'src/design-system/tokens.css',
            'src/design-system/tokens/geometry.ts',
            'src/features/chart/lightweightChartsV5ModuleAdapter.ts',
            'src/features/chart/lightweightChartsV5ProductionRenderer.ts',
            'tests/analysis-chart-presentation.test.ts',
            'tests/analysis-history-workspace.test.tsx',
            'tests/fixtures/analysisHistoryBrowser.tsx',
          }
          if changed != expected or removed:
            print('Historical Analysis UI scope mismatch', file=sys.stderr)
            print('Unexpected:', sorted(changed - expected), file=sys.stderr)
            print('Missing:', sorted(expected - changed), file=sys.stderr)
            print('Removed:', sorted(removed), file=sys.stderr)
            sys.exit(1)
          PY

      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci

      - name: Enforce design-system token ownership repair
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p2:design-system
          node scripts/verify-journal-theme-tokens.mjs
          node scripts/verify-p13-14-streak-presentation.mjs
          node scripts/verify-p13-16-performance-summary-presentation.mjs
          node scripts/verify-p14-6-journal-trade-map-marker-semantics.mjs
          node scripts/verify-p14-7-journal-trade-map-execution-time.mjs

      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

      - name: Your Trades saved-data ownership and view-switch regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-home-dashboard-your-trades.mjs
          npx vitest run tests/home-dashboard-your-trades.test.tsx tests/home-dashboard-view-switch.test.tsx

      - name: Journal execution-entry ownership and saved-result regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-journal-execution-entry.mjs
          npx vitest run tests/journal-execution-entry.test.tsx tests/manual-trade-draft.test.ts tests/manual-trade-save-command.test.ts tests/manual-trade-journal-route.test.tsx

      - name: Existing open-trade append and close ownership regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-journal-open-trade-update.mjs
          npx vitest run tests/journal-open-trade-update.test.tsx

      - name: Explicit saved currency and fee-result regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-journal-pnl-currency.mjs
          npx vitest run tests/journal-pnl-currency.test.tsx

      - name: Saved trade review exact identity and readonly regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-trade-review.mjs
          npx vitest run tests/trade-review.test.tsx

      - name: Journal currency input and missing-fill guidance regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-journal-currency-guidance.mjs
          node scripts/verify-p10-manual-trade-journal-route.mjs
          node scripts/verify-p13-11r1-journal-daily-results-boundary.mjs
          npx vitest run tests/journal-currency-guidance.test.tsx

      - name: Dashboard hold drag bounce and input ownership regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-home-dashboard-bubble-drag.mjs
          npx vitest run tests/home-dashboard-glass-drag.test.ts tests/home-dashboard-glass-drag-motion.test.ts tests/home-dashboard-glass-drag-lifecycle.test.tsx tests/home-dashboard-glass-motion.test.ts tests/home-dashboard-glass-bubble-map.test.tsx

      - name: Your Trades profit sizing and decimal ownership regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          node scripts/verify-home-dashboard-your-trades-sizing.mjs
          npx vitest run tests/home-dashboard-your-trades-sizing.test.tsx

      - name: Historical candle acquisition scope precision cancellation and HTTP regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:binance-spot-candle-history
          mkdir -p .candle-history-evidence
          npx vitest run tests/binance-spot-candle-history.test.ts --reporter=default --reporter=json --outputFile=.candle-history-evidence/tests.json

      - name: Historical Analysis UI identity cancellation and presentation regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:analysis-history-workspace
          mkdir -p .analysis-history-evidence
          npx vitest run tests/analysis-history-workspace.test.tsx tests/analysis-chart-presentation.test.ts --reporter=default --reporter=json --outputFile=.analysis-history-evidence/tests.json

      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck

      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build

      - name: Dedicated Binance 100-symbol request-limit regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p21:13-binance-spot-24h-public-rest-baseline-acquisition-adapter-foundation
          npm run verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation
          npx vitest run \
            tests/binance-spot-browser-live-market-universe-acquisition-binding-foundation.test.ts \
            tests/binance-home-dashboard-live-market-runtime-bootstrap-foundation.test.ts

      - name: Re-run released dashboard composition verifiers
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:home-dashboard-live-crypto-bubble-layout-bounds-policy-contract-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-runtime-lifecycle-stability-repair
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-options-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation

      - name: Focused released presentation regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:home-dashboard-glass-bubble-presentation-amendment
          npx vitest run \
            tests/home-dashboard-glass-bubble-map.test.tsx \
            tests/home-dashboard-glass-viewport-layout.test.ts \
            tests/home-dashboard-glass-motion.test.ts \
            tests/home-dashboard-live-crypto-bubble-layout-bounds-policy-contract-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-configured-runtime-lifecycle-stability.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-runtime-binding-foundation.test.tsx

      - name: Real browser glass transparency themes motion and screenshot evidence
        working-directory: .gate-candidate/kairos_p76
        env:
          KAIROS_BROWSER_PACKAGE_DIR: ${{ runner.temp }}/kairos-glass-browser
        run: |
          npm install --prefix "$KAIROS_BROWSER_PACKAGE_DIR" --no-save --package-lock=false playwright@1.62.1
          node "$KAIROS_BROWSER_PACKAGE_DIR/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/test-home-dashboard-glass-browser.mjs
          node scripts/test-home-dashboard-bubble-drag-browser.mjs
          node scripts/test-home-dashboard-your-trades-sizing-browser.mjs
          node scripts/test-journal-execution-browser.mjs
          node scripts/test-journal-open-trade-browser.mjs
          node scripts/test-journal-pnl-currency-browser.mjs
          node scripts/test-journal-theme-browser.mjs
          node scripts/test-trade-review-browser.mjs
          node scripts/test-journal-currency-guidance-browser.mjs
          node scripts/test-analysis-history-browser.mjs

      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test

      - name: Full controlled roadmap regression through current candidate
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync} = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const p = JSON.parse(readFileSync('package.json'));
          const scripts = Object.keys(p.scripts || {}).filter(x => x.startsWith('verify:')).sort();
          for (const required of [
            'verify:analysis-history-workspace',
            'verify:binance-spot-candle-history',
            'verify:p21:13-binance-spot-24h-public-rest-baseline-acquisition-adapter-foundation',
            'verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation',
            'verify:home-dashboard-glass-bubble-presentation-amendment',
            'verify:home-dashboard-live-crypto-bubble-layout-bounds-policy-contract-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-runtime-lifecycle-stability-repair',
            'verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation',
            'verify:p20:5-saved-analysis-system-closure',
            'verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure',
            'verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure',
            'verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure',
            'verify:p13:20-visual-pnl-system-closure',
            'verify:p12:journal-history-closure',
            'verify:p11:calculation-brain-closure',
            'verify:p10:manual-trade-journal-route',
            'verify:p9:trade-persistence',
            'verify:p8:navigation-shell',
            'verify:p1',
            'verify:static',
          ]) if (!scripts.includes(required)) {
            console.error('Missing ' + required);
            process.exit(1);
          }
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], {stdio: 'inherit'});
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync} = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const p = JSON.parse(readFileSync('package.json'));
          const scripts = Object.keys(p.scripts || {}).filter(x => x.startsWith('verify:')).sort();
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], {stdio: 'inherit'});
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          include-hidden-files: true
          path: |
            .gate-candidate/kairos_p76/docs/KAIROS_ANALYSIS_HISTORICAL_CANDLES_UI_AMENDMENT.md
            .gate-candidate/kairos_p76/.analysis-history-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_BINANCE_SPOT_CANDLE_HISTORY_FOUNDATION.md
            .gate-candidate/kairos_p76/.candle-history-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_YOUR_TRADES_PROFIT_SIZE_AMENDMENT.md
            .gate-candidate/kairos_p76/docs/KAIROS_CHART_WORKSPACE_INTEGRATION_PLAN.md
            .gate-candidate/kairos_p76/.your-trades-sizing-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_DASHBOARD_BUBBLE_DRAG_UI_AMENDMENT.md
            .gate-candidate/kairos_p76/.bubble-drag-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_JOURNAL_CURRENCY_GUIDANCE_REPAIR.md
            .gate-candidate/kairos_p76/.currency-guidance-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_SAVED_TRADE_REVIEW_AMENDMENT.md
            .gate-candidate/kairos_p76/.trade-review-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_JOURNAL_THEME_TOKEN_REPAIR.md
            .gate-candidate/kairos_p76/.journal-theme-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_JOURNAL_PNL_CURRENCY_AMENDMENT.md
            .gate-candidate/kairos_p76/.pnl-currency-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_OPEN_TRADE_UPDATE_AMENDMENT.md
            .gate-candidate/kairos_p76/.open-trade-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_JOURNAL_EXECUTION_ENTRY_AMENDMENT.md
            .gate-candidate/kairos_p76/docs/KAIROS_CONTINUATION_APPROVAL_CONTROL.md
            .gate-candidate/kairos_p76/.execution-evidence/
            .gate-candidate/kairos_p76/docs/KAIROS_HOME_YOUR_TRADES_V1.md
            .gate-candidate/kairos_p76/.glass-evidence/
          if-no-files-found: warn
