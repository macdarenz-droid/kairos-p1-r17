# KAIROS P17.13R2 GATE — AUTHORITATIVE BASE P17.12 — REPAIR CANDIDATE P17.13R2
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P17_13R2_CHART_VISIBLE_RANGE_TYPED_MOCK_REPAIR_CANDIDATE_2026-09-03.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P17_12_INCREMENTAL_CHART_ENGINE_DRIVER_COMPOSITION_CANDIDATE_2026-09-03.zip
  CANDIDATE_ZIP: KAIROS_P17_13R2_CHART_VISIBLE_RANGE_TYPED_MOCK_REPAIR_CANDIDATE_2026-09-03.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate && mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm exact controlled P17.13R2 scope from authoritative P17.12
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          expected={
            'KAIROS_P17_13R2_CHART_VISIBLE_RANGE_TYPED_MOCK_REPAIR_REPORT_2026-09-03.md',
            'package.json',
            'scripts/verify-p17-13-chart-visible-range-boundary.mjs',
            'src/features/chart/chartVisibleRange.ts',
            'src/features/chart/index.ts',
            'src/features/chart/lightweightChartsV5ModuleAdapter.ts',
            'src/features/chart/lightweightChartsV5VisibleRange.ts',
            'tests/chart-engine-driver-incremental.test.ts',
            'tests/lightweight-charts-v5-module-adapter.test.ts',
            'tests/lightweight-charts-v5-responsive-sizing.test.ts',
            'tests/lightweight-charts-v5-visible-range.test.ts',
          }
          if changed != expected:
            print('P17.13R2 exact scope mismatch',file=sys.stderr)
            print('Unexpected:',sorted(changed-expected),file=sys.stderr)
            print('Missing:',sorted(expected-changed),file=sys.stderr)
            sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck
      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Dedicated P17.13R2 visible range verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p17:13-chart-visible-range-boundary
          npx vitest run tests/lightweight-charts-v5-visible-range.test.ts tests/lightweight-charts-v5-module-adapter.test.ts tests/lightweight-charts-v5-responsive-sizing.test.ts tests/chart-engine-driver-incremental.test.ts
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression through P17.13R2
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const required of ['verify:p1','verify:p15:14-market-data-adapter-system-closure','verify:p16:18-crypto-live-feed-system-closure','verify:p17:13-chart-visible-range-boundary']) if(!s.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: P17.12 through P17.1 runtime regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p17:12-incremental-chart-engine-driver
          npx vitest run tests/chart-engine-driver-incremental.test.ts tests/chart-engine-driver.test.ts tests/lightweight-charts-v5-incremental-update.test.ts
          npm run verify:p17:11-responsive-chart-sizing
          npx vitest run tests/lightweight-charts-v5-responsive-sizing.test.ts
          npm run verify:p17:10-lightweight-charts-v5-production-renderer
          npx vitest run tests/lightweight-charts-v5-production-renderer.test.ts
          npm run verify:p17:9-lightweight-charts-v5-package
          npx vitest run tests/lightweight-charts-v5-package.test.ts
          npm run verify:p17:8-lightweight-charts-v5-incremental-update
          npx vitest run tests/lightweight-charts-v5-incremental-update.test.ts
          npm run verify:p17:7-chart-incremental-update-contract
          npx vitest run tests/chart-incremental-update.test.ts
          npm run verify:p17:6-lightweight-charts-v5-module-adapter
          npx vitest run tests/lightweight-charts-v5-module-adapter.test.ts
          npm run verify:p17:5-chart-engine-driver-adapter
          npx vitest run tests/chart-engine-driver.test.ts
          npm run verify:p17:4-projected-chart-renderer-composition
          npx vitest run tests/projected-chart-renderer.test.ts
          npm run verify:p17:3-chart-series-projection-boundary
          npx vitest run tests/chart-series-projection.test.ts
          npm run verify:p17:2-chart-renderer-lifecycle-boundary
          npx vitest run tests/chart-renderer-lifecycle.test.ts
          npm run verify:p17:1-chart-render-contract-foundation
          npx vitest run tests/chart-render-contract.test.ts
      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p16:10-execution-market-reference-truth
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p12:journal-history-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:p9:trade-persistence
          npm run verify:p1
          npm run verify:static
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P17_13R2_CHART_VISIBLE_RANGE_TYPED_MOCK_REPAIR_REPORT_2026-09-03.md
          if-no-files-found: error
