# KAIROS HOME DASHBOARD LIVE CRYPTO BUBBLE PRESENTATION STATE OBSERVATION BRIDGE GATE — AUTHORITATIVE BASE GATE 346
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-10.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_PROJECTION_FOUNDATION_CANDIDATE_2026-09-10.zip
  CANDIDATE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-10.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Verify exact uploaded archive identity and integrity
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          for key, size, digest in [
            ('BASE_ZIP', 1613187, '7541f423e42df50968dc1e49dbe019ab6aff6825d7ad3d98b7ff21df92d990c8'),
            ('CANDIDATE_ZIP', 1618538, 'e75cada42f3578cf03f7218f0005f181db7313dd0b024050cb89a27420bc43aa'),
          ]:
            p=Path(os.environ[key]); data=p.read_bytes()
            assert len(data)==size, f'{key}: byte size mismatch'
            assert hashlib.sha256(data).hexdigest()==digest, f'{key}: SHA-256 mismatch'
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, f'{key}: ZIP integrity failure'
              assert {i.filename.split('/')[0] for i in z.infolist()}=={'kairos_p76'}, f'{key}: wrong ZIP root'
              for i in z.infolist():
                parts=PurePosixPath(i.filename)
                assert not parts.is_absolute() and '..' not in parts.parts, f'{key}: invalid archive path'
                assert ((i.external_attr >> 16) & 0o170000) != 0o120000, f'{key}: unexpected symbolic link'
          PY

      - name: Extract authoritative Gate346 base and candidate
        run: |
          set -euo pipefail
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json

      - name: Confirm exact controlled Home Bubble presentation-state observation bridge scope from Gate346
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_OBSERVATION_BRIDGE_FOUNDATION_REPORT_2026-09-10.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation.mjs',
            'src/application/dashboard/homeDashboardLiveCryptoBubblePresentationStateObservationBridge.ts',
            'tests/home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation.test.ts',
          }
          if changed != expected:
            print('Home Bubble presentation-state observation bridge exact scope mismatch',file=sys.stderr)
            print('Unexpected:',sorted(changed-expected),file=sys.stderr)
            print('Missing:',sorted(expected-changed),file=sys.stderr)
            sys.exit(1)
          PY

      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci

      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck

      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build

      - name: Dedicated Home Bubble presentation-state observation bridge verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation
          npm run verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation
          npm run verify:live-crypto-bubble-metric-input-projection-foundation
          npm run verify:live-market-summary-24h-percentage-movement-foundation
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation
          npm run verify:live-market-summary-freshness-evaluation-projection-foundation
          npm run verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation
          npm run verify:p21:17-live-market-summary-baseline-state-orchestration-foundation

      - name: Focused Home Bubble presentation-state observation bridge regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-presentation-state-projection-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation.test.ts \
            tests/binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation.test.ts \
            tests/live-crypto-bubble-metric-input-projection-foundation.test.ts \
            tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts \
            tests/live-market-summary-24h-percentage-movement-foundation.test.ts \
            tests/live-market-summary-freshness-evaluation-projection-foundation.test.ts \
            tests/live-market-summary-fact-contract.test.ts \
            tests/percentage-calculator.test.ts \
            tests/decimal-kernel.test.ts
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation
          npm run verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation
          npm run verify:live-crypto-bubble-metric-input-projection-foundation
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation

      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test

      - name: Full controlled roadmap regression through current candidate
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation',
            'verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation',
            'verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation',
            'verify:live-crypto-bubble-metric-input-projection-foundation',
            'verify:live-market-summary-24h-percentage-movement-foundation',
            'verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation',
            'verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation',
            'verify:live-market-summary-freshness-evaluation-projection-foundation',
            'verify:live-market-summary-freshness-classification-policy-foundation',
            'verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation',
            'verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation',
            'verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation',
            'verify:p21:17-live-market-summary-baseline-state-orchestration-foundation',
            'verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation',
            'verify:p21:19-live-market-summary-state-session-foundation',
            'verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation',
            'verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation',
            'verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation',
            'verify:live-market-universe-acquisition-orchestration-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){ const r=spawnSync('npm',['run',name],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE

      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-observation-bridge-foundation
          npm run verify:home-dashboard-live-crypto-bubble-presentation-state-projection-foundation
          npm run verify:binance-home-dashboard-live-crypto-bubble-observed-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-metric-observation-bridge-foundation
          npm run verify:live-crypto-bubble-metric-input-projection-foundation
          npm run verify:live-market-summary-24h-percentage-movement-foundation
          npm run verify:binance-home-dashboard-live-market-observed-runtime-composition-foundation
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation
          npm run verify:live-market-summary-freshness-evaluation-projection-foundation
          npm run verify:live-market-summary-freshness-classification-policy-foundation
          npm run verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation
          npm run verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation
          npm run verify:live-market-universe-acquisition-orchestration-foundation
          npm run verify:live-market-universe-composition-foundation
          npm run verify:live-market-universe-top-n-selection-policy-foundation
          npm run verify:live-market-universe-quote-volume-ordering-policy-foundation
          npm run verify:live-market-universe-instrument-eligibility-policy-foundation
          npm run verify:live-market-universe-instrument-metadata-acquisition-port-contract-foundation
          npm run verify:p21:19-live-market-summary-state-session-foundation
          npm run verify:p21:17-live-market-summary-baseline-state-orchestration-foundation
          npm run verify:p21:4-live-market-summary-baseline-acquisition-port-foundation
          npm run verify:p21:7-binance-spot-24h-public-rest-baseline-request-descriptor-foundation
          npm run verify:home-dashboard-live-market-summary-browser-lifecycle-adapter-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation
          npm run verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation
          npm run verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation
          npm run verify:p21:23-live-market-summary-browser-state-session-scoped-snapshot-acquisition-composition-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p12:journal-history-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:p9:trade-persistence
          npm run verify:p8:navigation-shell
          npm run verify:p1
          npm run verify:static

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_PRESENTATION_STATE_OBSERVATION_BRIDGE_FOUNDATION_REPORT_2026-09-10.md
          if-no-files-found: error
