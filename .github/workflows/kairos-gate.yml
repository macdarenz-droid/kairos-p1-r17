# KAIROS P14.7R2 GATE — BASE P14.6R2 — CANDIDATE P14.7R2
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P14_7R2_JOURNAL_TRADE_MAP_HISTORICAL_PRESENTATION_SELECTOR_REPAIR_CANDIDATE_2026-09-03.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P14_6R2_JOURNAL_TRADE_MAP_ACCESSIBLE_NAME_SELECTOR_REPAIR_CANDIDATE_2026-09-03.zip
  CANDIDATE_ZIP: KAIROS_P14_7R2_JOURNAL_TRADE_MAP_HISTORICAL_PRESENTATION_SELECTOR_REPAIR_CANDIDATE_2026-09-03.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0 }
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate && mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P14.7R2 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P14_7R2_JOURNAL_TRADE_MAP_HISTORICAL_PRESENTATION_SELECTOR_REPAIR_CANDIDATE_REPORT_2026-09-03.md',
            'package.json',
            'scripts/verify-p14-7-journal-trade-map-execution-time.mjs',
            'src/app/JournalTradeMap.tsx',
            'src/app/journalRoute.css',
            'tests/journal-trade-map-execution-time.test.tsx',
            'tests/journal-trade-map-presentation.test.tsx',
          }
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}; y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          if changed != required:
            print('Expected:',sorted(required),file=sys.stderr); print('Actual:',sorted(changed),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P14.7R2
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process'); const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const r of ['verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence','verify:p10:manual-trade-journal-route','verify:p11:calculation-brain-closure','verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance','verify:p13:20-visual-pnl-system-closure','verify:p14:1r1-trade-visualizer-fixture-contract','verify:p14:2-trade-visualizer-display-semantics','verify:p14:3-journal-trade-visualizer-projection','verify:p14:4-journal-trade-map-presentation','verify:p14:5-journal-trade-map-svg-shell','verify:p14:6-journal-trade-map-marker-semantics','verify:p14:7-journal-trade-map-execution-time']) if(!s.includes(r)){console.error('Missing '+r);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: P14.7R2 execution time verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:7-journal-trade-map-execution-time
          npx vitest run tests/journal-trade-map-execution-time.test.tsx
      - name: P14.6R2 regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:6-journal-trade-map-marker-semantics
          npx vitest run tests/journal-trade-map-marker-semantics.test.tsx
      - name: P14.5R2 through P14.1R1 regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:5-journal-trade-map-svg-shell && npx vitest run tests/journal-trade-map-graphic.test.tsx
          npm run verify:p14:4-journal-trade-map-presentation && npx vitest run tests/journal-trade-map-presentation.test.tsx
          npm run verify:p14:3-journal-trade-visualizer-projection && npx vitest run tests/journal-trade-visualizer-projection.test.ts
          npm run verify:p14:2-trade-visualizer-display-semantics && npx vitest run tests/trade-visualizer-display-model.test.ts
          npm run verify:p14:1r1-trade-visualizer-fixture-contract && npx vitest run tests/trade-visualizer-facts.test.ts
      - name: Historical closure regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:static
          npx vitest run tests/journal-history-closure.test.tsx
          npx vitest run tests/journal-history-performance.test.tsx
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with: { name: KAIROS_CURRENT_CANDIDATE, path: '${{ env.CANDIDATE_ZIP }}', if-no-files-found: error }
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: KAIROS_GATE_EVIDENCE, path: '.gate-candidate/kairos_p76/KAIROS_P14_7R2_JOURNAL_TRADE_MAP_HISTORICAL_PRESENTATION_SELECTOR_REPAIR_CANDIDATE_REPORT_2026-09-03.md', if-no-files-found: error }
