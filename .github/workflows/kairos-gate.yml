# KAIROS BINANCE SPOT EXCHANGE INFO INSTRUMENT METADATA FACT COLLECTION MAPPING GATE — AUTHORITATIVE BASE GATE 317
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_BINANCE_SPOT_EXCHANGE_INFO_INSTRUMENT_METADATA_FACT_COLLECTION_MAPPING_FOUNDATION_CANDIDATE_2026-09-08.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_INSTRUMENT_METADATA_FACT_MAPPING_FOUNDATION_CANDIDATE_2026-09-08.zip
  CANDIDATE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_INSTRUMENT_METADATA_FACT_COLLECTION_MAPPING_FOUNDATION_CANDIDATE_2026-09-08.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Verify exact uploaded archive identity and integrity
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          for key, size, digest in [
            ('BASE_ZIP', 1491120, '38a829e28f574e8cf7ce65ab450437732d5e9cdb4b7be0a2257e74db0c99ec81'),
            ('CANDIDATE_ZIP', 1496451, '352fe93a5c255f906e86d6d6f8aae29e6da8d0af1c112f7c70325258920079d0'),
          ]:
            p=Path(os.environ[key]); data=p.read_bytes()
            assert len(data)==size, f'{key}: byte size mismatch'
            assert hashlib.sha256(data).hexdigest()==digest, f'{key}: SHA-256 mismatch'
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, f'{key}: ZIP integrity failure'
              assert {i.filename.split('/')[0] for i in z.infolist()}=={'kairos_p76'}, f'{key}: wrong ZIP root'
              for i in z.infolist():
                parts=PurePosixPath(i.filename)
                assert not parts.is_absolute() and '..' not in parts.parts, f'{key}: invalid archive path'
                assert ((i.external_attr >> 16) & 0o170000) != 0o120000, f'{key}: unexpected symbolic link'
            print(key, len(data), digest, 'integrity PASS')
          PY

      - name: Extract authoritative base and candidate
        run: |
          set -euo pipefail
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json

      - name: Confirm exact controlled Binance Spot exchangeInfo instrument metadata fact collection scope from Gate 317
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          expected={
            'KAIROS_BINANCE_SPOT_EXCHANGE_INFO_INSTRUMENT_METADATA_FACT_COLLECTION_MAPPING_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-binance-spot-exchange-info-instrument-metadata-fact-collection-mapping-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpotExchangeInfoInstrumentMetadataFactCollection.ts',
            'tests/binance-spot-exchange-info-instrument-metadata-fact-collection.test.ts',
          }
          if changed != expected:
            print('Binance Spot exchangeInfo instrument metadata fact collection exact scope mismatch',file=sys.stderr)
            print('Unexpected:',sorted(changed-expected),file=sys.stderr)
            print('Missing:',sorted(expected-changed),file=sys.stderr)
            sys.exit(1)
          PY

      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci

      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck

      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build

      - name: Dedicated Binance Spot exchangeInfo instrument metadata fact collection verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:binance-spot-exchange-info-instrument-metadata-fact-collection-mapping-foundation
          npm run verify:binance-spot-exchange-info-instrument-metadata-fact-mapping-foundation
          npm run verify:binance-spot-exchange-info-public-rest-response-decode-foundation
          npm run verify:binance-spot-exchange-info-public-rest-request-execution-boundary-foundation
          npm run verify:binance-spot-exchange-info-public-rest-request-descriptor-foundation
          npm run verify:live-market-universe-instrument-metadata-fact-contract-foundation
          npm run verify:live-market-summary-freshness-classification-policy-foundation
          npm run verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation
          npm run verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation
          npm run verify:p21:23-live-market-summary-browser-state-session-scoped-snapshot-acquisition-composition-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p8:navigation-shell
          npm run verify:p1

      - name: Focused instrument metadata fact collection regression
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/binance-spot-exchange-info-instrument-metadata-fact-collection.test.ts tests/binance-spot-exchange-info-instrument-metadata-fact.test.ts

      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test

      - name: Full controlled roadmap regression through canonical P21.23 plus Home port, Binance adapter, freshness, universe metadata, exchangeInfo descriptor, execution boundary, response decode, metadata mapping and metadata collection mapping
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:binance-spot-exchange-info-instrument-metadata-fact-collection-mapping-foundation',
            'verify:binance-spot-exchange-info-instrument-metadata-fact-mapping-foundation',
            'verify:binance-spot-exchange-info-public-rest-response-decode-foundation',
            'verify:binance-spot-exchange-info-public-rest-request-execution-boundary-foundation',
            'verify:binance-spot-exchange-info-public-rest-request-descriptor-foundation',
            'verify:live-market-universe-instrument-metadata-fact-contract-foundation',
            'verify:live-market-summary-freshness-classification-policy-foundation',
            'verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation',
            'verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation',
            'verify:p21:23-live-market-summary-browser-state-session-scoped-snapshot-acquisition-composition-foundation',
            'verify:p20:5-saved-analysis-system-closure',
            'verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure',
            'verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure',
            'verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure',
            'verify:p11:calculation-brain-closure',
            'verify:p8:navigation-shell',
            'verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){
            console.log('\n=== '+name+' ===');
            const r=spawnSync('npm',['run',name],{stdio:'inherit'});
            if(r.status!==0) process.exit(r.status||1);
          }
          NODE

      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:binance-spot-exchange-info-instrument-metadata-fact-collection-mapping-foundation
          npm run verify:binance-spot-exchange-info-instrument-metadata-fact-mapping-foundation
          npm run verify:binance-spot-exchange-info-public-rest-response-decode-foundation
          npm run verify:binance-spot-exchange-info-public-rest-request-execution-boundary-foundation
          npm run verify:binance-spot-exchange-info-public-rest-request-descriptor-foundation
          npm run verify:live-market-universe-instrument-metadata-fact-contract-foundation
          npm run verify:live-market-summary-freshness-classification-policy-foundation
          npm run verify:binance-home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-adapter-foundation
          npm run verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation
          npm run verify:p21:23-live-market-summary-browser-state-session-scoped-snapshot-acquisition-composition-foundation
          npm run verify:p21:22-live-market-summary-state-session-scoped-snapshot-binding-foundation
          npm run verify:p21:21-live-market-summary-scoped-state-snapshot-foundation
          npm run verify:p21:20-live-market-summary-browser-state-session-binding-foundation
          npm run verify:p21:19-live-market-summary-state-session-foundation
          npm run verify:p21:18-binance-spot-24h-browser-public-rest-baseline-state-binding-foundation
          npm run verify:p21:17-live-market-summary-baseline-state-orchestration-foundation
          npm run verify:p21:16-live-market-summary-delivery-state-foundation
          npm run verify:p21:15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation
          npm run verify:p21:14-binance-spot-24h-browser-public-rest-baseline-connector-foundation
          npm run verify:p21:13-binance-spot-24h-public-rest-baseline-acquisition-adapter-foundation
          npm run verify:p21:12-binance-spot-24h-public-rest-baseline-caller-cancellation-propagation-foundation
          npm run verify:p21:11-binance-spot-24h-public-rest-baseline-round-trip-composition-foundation
          npm run verify:p21:10-binance-spot-24h-public-rest-baseline-response-delivery-composition-foundation
          npm run verify:p21:9-binance-spot-24h-public-rest-baseline-response-decode-foundation
          npm run verify:p21:8-binance-spot-24h-public-rest-baseline-request-execution-boundary-foundation
          npm run verify:p21:7-binance-spot-24h-public-rest-baseline-request-descriptor-foundation
          npm run verify:p21:6-binance-spot-24h-baseline-delivery-mapping-foundation
          npm run verify:p21:5-binance-spot-24h-summary-fact-mapping-foundation
          npm run verify:p21:4-live-market-summary-baseline-acquisition-port-foundation
          npm run verify:p21:3-live-market-summary-delivery-completeness-contract-foundation
          npm run verify:p21:2-live-market-summary-fact-contract-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p20:4-saved-analysis-application-load
          npm run verify:p20:3-saved-analysis-application-save
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p12:journal-history-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:p9:trade-persistence
          npm run verify:p8:navigation-shell
          npm run verify:p1
          npm run verify:static

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_BINANCE_SPOT_EXCHANGE_INFO_INSTRUMENT_METADATA_FACT_COLLECTION_MAPPING_FOUNDATION_REPORT_2026-09-08.md
          if-no-files-found: error
