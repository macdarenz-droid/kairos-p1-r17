# KAIROS P15.1 GATE — BASE P14.9 — CANDIDATE P15.1
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P15_1_MARKET_DATA_ADAPTER_INTERFACE_FOUNDATION_CANDIDATE_2026-09-03.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P14_9_TRADE_VISUALIZER_SYSTEM_CLOSURE_CANDIDATE_2026-09-03.zip
  CANDIDATE_ZIP: KAIROS_P15_1_MARKET_DATA_ADAPTER_INTERFACE_FOUNDATION_CANDIDATE_2026-09-03.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0 }
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate && mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P15.1 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P15_1_MARKET_DATA_ADAPTER_INTERFACE_FOUNDATION_REPORT_2026-09-03.md',
            'package.json',
            'scripts/verify-p15-1-market-data-adapter-interface.mjs',
            'src/services/market-data/MarketDataAdapter.ts',
            'src/services/market-data/index.ts',
            'src/services/market-data/marketDataTypes.ts',
            'tests/market-data-adapter-contract.test.ts',
          }
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}; y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          if changed != required:
            print('Expected:',sorted(required),file=sys.stderr); print('Actual:',sorted(changed),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P15.1
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process'); const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const r of ['verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence','verify:p10:manual-trade-journal-route','verify:p11:calculation-brain-closure','verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance','verify:p13:20-visual-pnl-system-closure','verify:p14:9-trade-visualizer-system-closure','verify:p15:1-market-data-adapter-interface']) if(!s.includes(r)){console.error('Missing '+r);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: P15.1 adapter interface verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p15:1-market-data-adapter-interface
          npx vitest run tests/market-data-adapter-contract.test.ts
      - name: P14 closure regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p14:8-journal-trade-map-motion-semantics
          npx vitest run tests/journal-trade-map-motion-semantics.test.tsx
          npm run verify:p14:7-journal-trade-map-execution-time
          npx vitest run tests/journal-trade-map-execution-time.test.tsx
      - name: Historical closure regressions
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:static
          npx vitest run tests/journal-history-closure.test.tsx
          npx vitest run tests/journal-history-performance.test.tsx
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with: { name: KAIROS_CURRENT_CANDIDATE, path: '${{ env.CANDIDATE_ZIP }}', if-no-files-found: error }
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: KAIROS_GATE_EVIDENCE, path: '.gate-candidate/kairos_p76/KAIROS_P15_1_MARKET_DATA_ADAPTER_INTERFACE_FOUNDATION_REPORT_2026-09-03.md', if-no-files-found: error }
