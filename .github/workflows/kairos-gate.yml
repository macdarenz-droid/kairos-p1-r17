# KAIROS P12.3 GATE — BASE P12.2R1 — CANDIDATE P12.3
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches:
      - main
    paths:
      - 'KAIROS_P12_3_JOURNAL_HISTORY_ROUTE_CANDIDATE_2026-09-02.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P12_2R1_INDEXED_BOUNDED_JOURNAL_HISTORY_QUERY_REPAIR_CANDIDATE_2026-09-02.zip
  CANDIDATE_ZIP: KAIROS_P12_3_JOURNAL_HISTORY_ROUTE_CANDIDATE_2026-09-02.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use locked Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled patch scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          base=Path('.gate-base/kairos_p76')
          cand=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P12_3_JOURNAL_HISTORY_ROUTE_CANDIDATE_REPORT_2026-09-02.md',
            'package.json',
            'scripts/verify-p12-journal-history-route.mjs',
            'src/app/JournalHistoryList.tsx',
            'src/app/JournalRoute.tsx',
            'src/app/journalRoute.css',
            'tests/journal-history-route.test.tsx',
          }
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          b={str(p.relative_to(base)):digest(p) for p in base.rglob('*') if p.is_file()}
          c={str(p.relative_to(cand)):digest(p) for p in cand.rglob('*') if p.is_file()}
          changed={p for p in b.keys()|c.keys() if b.get(p)!=c.get(p)}
          unexpected=changed-required
          missing=required-changed
          print('Changed files:')
          for p in sorted(changed): print(' -',p)
          if unexpected:
            print('Unexpected changes:',sorted(unexpected),file=sys.stderr); sys.exit(1)
          if missing:
            print('Required changes missing:',sorted(missing),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P12.3
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => name.startsWith('verify:p'));
          for (const required of ['verify:p11:calculation-brain-closure','verify:p12:journal-history-query-scope-repair','verify:p12:journal-history-indexed-bound','verify:p12:journal-history-route']) {
            if (!scripts.includes(required)) { console.error(`Missing ${required}`); process.exit(1); }
          }
          for (const script of scripts) {
            console.log(`\n=== ${script} ===`);
            const result = spawnSync('npm', ['run', script], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status || 1);
          }
          NODE
      - name: P12.3 Journal history route verification
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p12:journal-history-route
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P12_3_JOURNAL_HISTORY_ROUTE_CANDIDATE_REPORT_2026-09-02.md
          if-no-files-found: error
