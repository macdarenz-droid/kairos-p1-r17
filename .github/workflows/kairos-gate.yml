# KAIROS P14.5 GATE — BASE P14.4R1 — CANDIDATE P14.5
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P14_5_JOURNAL_TRADE_MAP_ACCESSIBLE_SVG_SHELL_CANDIDATE_2026-09-02.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P14_4R1_JOURNAL_TRADE_MAP_FIXTURE_CONTRACT_REPAIR_CANDIDATE_2026-09-02.zip
  CANDIDATE_ZIP: KAIROS_P14_5_JOURNAL_TRADE_MAP_ACCESSIBLE_SVG_SHELL_CANDIDATE_2026-09-02.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use locked Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate
          mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm controlled P14.5 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          base=Path('.gate-base/kairos_p76'); cand=Path('.gate-candidate/kairos_p76')
          required={
            'KAIROS_P14_5_JOURNAL_TRADE_MAP_ACCESSIBLE_SVG_SHELL_CANDIDATE_REPORT_2026-09-02.md',
            'package.json',
            'scripts/verify-p14-5-journal-trade-map-svg-shell.mjs',
            'src/app/JournalTradeMap.tsx',
            'src/app/JournalTradeMapGraphic.tsx',
            'src/app/journalRoute.css',
            'tests/journal-trade-map-graphic.test.tsx',
          }
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          b={str(p.relative_to(base)):digest(p) for p in base.rglob('*') if p.is_file()}
          c={str(p.relative_to(cand)):digest(p) for p in cand.rglob('*') if p.is_file()}
          changed={p for p in b.keys()|c.keys() if b.get(p)!=c.get(p)}
          print('Changed files:'); [print(' -',p) for p in sorted(changed)]
          if changed-required: print('Unexpected changes:',sorted(changed-required),file=sys.stderr); sys.exit(1)
          if required-changed: print('Required changes missing:',sorted(required-changed),file=sys.stderr); sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression P1 through P14.5
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs'); const { spawnSync } = require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const scripts=Object.keys(pkg.scripts||{}).filter(n=>n.startsWith('verify:p'));
          for (const required of ['verify:p1','verify:p5:database-kernel','verify:p9:trade-persistence','verify:p10:manual-trade-journal-route','verify:p11:calculation-brain-closure','verify:p12:journal-history-closure','verify:p12:journal-history-heavy-performance','verify:p13:20-visual-pnl-system-closure','verify:p14:1r1-trade-visualizer-fixture-contract','verify:p14:2-trade-visualizer-display-semantics','verify:p14:3-journal-trade-visualizer-projection','verify:p14:4-journal-trade-map-presentation','verify:p14:5-journal-trade-map-svg-shell']) {
            if (!scripts.includes(required)) { console.error(`Missing ${required}`); process.exit(1); }
          }
          for (const script of scripts) { console.log(`\n=== ${script} ===`); const r=spawnSync('npm',['run',script],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE
      - name: P14.5 Journal Trade Map SVG shell verification
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p14:5-journal-trade-map-svg-shell
      - name: P14.5 Journal Trade Map SVG runtime tests
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-trade-map-graphic.test.tsx
      - name: P14.4R1 Journal Trade Map presentation regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:4-journal-trade-map-presentation
          npx vitest run tests/journal-trade-map-presentation.test.tsx
      - name: P14.3 projection regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:3-journal-trade-visualizer-projection
          npx vitest run tests/journal-trade-visualizer-projection.test.ts
      - name: P14.2 display semantics regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:2-trade-visualizer-display-semantics
          npx vitest run tests/trade-visualizer-display-model.test.ts
      - name: P14.1R1 facts boundary regression
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p14:1r1-trade-visualizer-fixture-contract
          npx vitest run tests/trade-visualizer-facts.test.ts
      - name: P13 closure regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p13:20-visual-pnl-system-closure
      - name: Historical P10 Journal route regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:p10:manual-trade-journal-route
      - name: Historical P1 ownership verifier regression
        working-directory: .gate-candidate/kairos_p76
        run: npm run verify:static
      - name: Journal History closure integration
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-closure.test.tsx
      - name: USER_HEAVY timing canary
        working-directory: .gate-candidate/kairos_p76
        run: npx vitest run tests/journal-history-performance.test.tsx
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P14_5_JOURNAL_TRADE_MAP_ACCESSIBLE_SVG_SHELL_CANDIDATE_REPORT_2026-09-02.md
          if-no-files-found: error