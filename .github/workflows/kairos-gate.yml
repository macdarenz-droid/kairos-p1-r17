# KAIROS P21.4 GATE — AUTHORITATIVE BASE P21.3 — CANDIDATE P21.4 LIVE MARKET SUMMARY BASELINE ACQUISITION PORT FOUNDATION
name: Kairos Controlled Roadmap Gate

on:
  push:
    branches: [main]
    paths:
      - 'KAIROS_P21_4_LIVE_MARKET_SUMMARY_BASELINE_ACQUISITION_PORT_FOUNDATION_CANDIDATE_2026-09-07.zip'
      - '.github/workflows/kairos-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_ZIP: KAIROS_P21_3_LIVE_MARKET_SUMMARY_DELIVERY_COMPLETENESS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-07.zip
  CANDIDATE_ZIP: KAIROS_P21_4_LIVE_MARKET_SUMMARY_BASELINE_ACQUISITION_PORT_FOUNDATION_CANDIDATE_2026-09-07.zip

jobs:
  verify-current-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify npm version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Extract authoritative base and candidate
        run: |
          rm -rf .gate-base .gate-candidate && mkdir .gate-base .gate-candidate
          unzip -q "$BASE_ZIP" -d .gate-base
          unzip -q "$CANDIDATE_ZIP" -d .gate-candidate
          test -f .gate-base/kairos_p76/package.json
          test -f .gate-candidate/kairos_p76/package.json
      - name: Confirm exact controlled P21.4 scope from authoritative P21.3
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.gate-base/kairos_p76'); c=Path('.gate-candidate/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          expected={
            'KAIROS_P21_4_LIVE_MARKET_SUMMARY_BASELINE_ACQUISITION_PORT_FOUNDATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p21-4-live-market-summary-baseline-acquisition-port-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/LiveMarketSummaryBaselineAcquisitionPort.ts',
            'src/services/market-data/liveMarketSummaryBaselineAcquisitionSemantics.ts',
            'tests/live-market-summary-baseline-acquisition-port-foundation.test.ts',
          }
          if changed != expected:
            print('P21.4 exact scope mismatch',file=sys.stderr)
            print('Unexpected:',sorted(changed-expected),file=sys.stderr)
            print('Missing:',sorted(expected-changed),file=sys.stderr)
            sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .gate-candidate/kairos_p76
        run: npm ci
      - name: Prove real Lightweight Charts dependency remains exact
        working-directory: .gate-candidate/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
      - name: Production TypeScript compilation
        working-directory: .gate-candidate/kairos_p76
        run: npm run typecheck
      - name: Production build
        working-directory: .gate-candidate/kairos_p76
        run: npm run build
      - name: Dedicated P21.4 Live Market Summary baseline-acquisition-port verifier/runtime
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p21:4-live-market-summary-baseline-acquisition-port-foundation
          npm run verify:p21:3-live-market-summary-delivery-completeness-contract-foundation
          npm run verify:p21:2-live-market-summary-fact-contract-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p20:4-saved-analysis-application-load
          npm run verify:p20:3-saved-analysis-application-save
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p8:navigation-shell
          npm run verify:p1
      - name: Full unit regression
        working-directory: .gate-candidate/kairos_p76
        run: npm test
      - name: Full controlled roadmap regression through P21.4
        working-directory: .gate-candidate/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const required of ['verify:p1','verify:p15:14-market-data-adapter-system-closure','verify:p16:18-crypto-live-feed-system-closure','verify:p17:16-chart-engine-system-closure','verify:p18:60-drawing-tools-system-closure','verify:p19:7-risk-reward-tool-system-closure','verify:p20:1-saved-analysis-contract-foundation','verify:p20:2-saved-analysis-persistence-foundation','verify:p20:3-saved-analysis-application-save','verify:p20:4-saved-analysis-application-load','verify:p20:5-saved-analysis-system-closure','verify:p21:1-home-dashboard-route-ownership-foundation','verify:p21:2-live-market-summary-fact-contract-foundation','verify:p21:3-live-market-summary-delivery-completeness-contract-foundation','verify:p21:4-live-market-summary-baseline-acquisition-port-foundation']) if(!s.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: Historical closures
        working-directory: .gate-candidate/kairos_p76
        run: |
          npm run verify:p21:4-live-market-summary-baseline-acquisition-port-foundation
          npm run verify:p21:3-live-market-summary-delivery-completeness-contract-foundation
          npm run verify:p21:2-live-market-summary-fact-contract-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:p20:5-saved-analysis-system-closure
          npm run verify:p20:4-saved-analysis-application-load
          npm run verify:p20:3-saved-analysis-application-save
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p17:16-chart-engine-system-closure
          npm run verify:p16:18-crypto-live-feed-system-closure
          npm run verify:p15:14-market-data-adapter-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p13:20-visual-pnl-system-closure
          npm run verify:p12:journal-history-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p10:manual-trade-journal-route
          npm run verify:p9:trade-persistence
          npm run verify:p8:navigation-shell
          npm run verify:p1
          npm run verify:static
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_CURRENT_CANDIDATE
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_GATE_EVIDENCE
          path: .gate-candidate/kairos_p76/KAIROS_P21_4_LIVE_MARKET_SUMMARY_BASELINE_ACQUISITION_PORT_FOUNDATION_REPORT_2026-09-07.md
          if-no-files-found: error
