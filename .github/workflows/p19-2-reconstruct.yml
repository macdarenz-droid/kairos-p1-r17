name: Kairos P19.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_1_RISK_REWARD_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P19_2_RISK_REWARD_ZONE_SEMANTICS_PROJECTION_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P19.2 from canonical P19.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p19base .p19candidate
          mkdir .p19base .p19candidate
          unzip -q "$BASE_ZIP" -d .p19base
          cp -a .p19base/. .p19candidate/
          ROOT=.p19candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/risk-reward/riskRewardAnalysisContract.ts"

          cat > "$ROOT/src/application/risk-reward/riskRewardZoneSemantics.ts" <<'TS'
          import type { DecimalString } from '../../domain/trades';
          import type { RiskRewardAnalysis } from './riskRewardAnalysisContract';

          export type RiskRewardZoneRole = 'risk' | 'reward';

          export interface RiskRewardSemanticPriceZone {
            readonly role: RiskRewardZoneRole;
            readonly from: DecimalString;
            readonly to: DecimalString;
          }

          export interface RiskRewardZoneSemantics {
            readonly risk: RiskRewardSemanticPriceZone;
            readonly reward: RiskRewardSemanticPriceZone;
          }

          export function projectRiskRewardZoneSemantics(
            analysis: RiskRewardAnalysis,
          ): RiskRewardZoneSemantics {
            return {
              risk: {
                role: 'risk',
                from: analysis.levels.entry,
                to: analysis.levels.stop,
              },
              reward: {
                role: 'reward',
                from: analysis.levels.entry,
                to: analysis.levels.target,
              },
            };
          }
          TS

          cat > "$ROOT/src/application/risk-reward/index.ts" <<'TS'
          export * from './riskRewardAnalysisContract';
          export * from './riskRewardZoneSemantics';
          TS

          cat > "$ROOT/tests/risk-reward-zone-semantics.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import {
            projectRiskRewardZoneSemantics,
            type RiskRewardAnalysis,
          } from '../src/application/risk-reward';
          import { parsePositiveDecimalString } from '../src/domain/trades';

          function decimal(value: string) {
            const parsed = parsePositiveDecimalString(value);
            if (!parsed.ok) throw new Error(`invalid test decimal: ${value}`);
            return parsed.value;
          }

          function analysis(side: 'long' | 'short', entry: string, stop: string, target: string): RiskRewardAnalysis {
            return {
              id: `risk-reward-${side}`,
              side,
              levels: {
                entry: decimal(entry),
                stop: decimal(stop),
                target: decimal(target),
              },
            };
          }

          describe('P19.2 Risk/Reward zone semantics projection', () => {
            it('projects long analysis into semantic risk and reward price zones without calculation ownership', () => {
              expect(projectRiskRewardZoneSemantics(analysis('long', '100', '90', '120'))).toEqual({
                risk: { role: 'risk', from: decimal('100'), to: decimal('90') },
                reward: { role: 'reward', from: decimal('100'), to: decimal('120') },
              });
            });

            it('preserves short-side price ordering rather than normalizing or validating it', () => {
              expect(projectRiskRewardZoneSemantics(analysis('short', '100', '110', '80'))).toEqual({
                risk: { role: 'risk', from: decimal('100'), to: decimal('110') },
                reward: { role: 'reward', from: decimal('100'), to: decimal('80') },
              });
            });
          });
          TS

          cat > "$ROOT/scripts/verify-p19-2-risk-reward-zone-semantics-projection.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../src/application/risk-reward/riskRewardZoneSemantics.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/application/risk-reward/index.ts', import.meta.url), 'utf8');
          const test = readFileSync(new URL('../tests/risk-reward-zone-semantics.test.ts', import.meta.url), 'utf8');

          for (const token of [
            "export type RiskRewardZoneRole = 'risk' | 'reward'",
            'export interface RiskRewardSemanticPriceZone',
            'readonly from: DecimalString',
            'readonly to: DecimalString',
            'export interface RiskRewardZoneSemantics',
            'readonly risk: RiskRewardSemanticPriceZone',
            'readonly reward: RiskRewardSemanticPriceZone',
            'export function projectRiskRewardZoneSemantics',
            "role: 'risk'",
            'from: analysis.levels.entry',
            'to: analysis.levels.stop',
            "role: 'reward'",
            'to: analysis.levels.target',
          ]) {
            if (!source.includes(token)) throw new Error(`P19.2 zone semantics missing: ${token}`);
          }
          for (const forbidden of [
            'lightweight-charts', 'ChartDrawing', 'IndexedDB', 'Dexie', 'fetch(', 'WebSocket',
            'calculateTradeMetrics', 'calculateRisk', 'calculateRMultiple', 'Decimal(',
            'Math.min', 'Math.max', 'riskZone:', 'rewardZone:', 'color:', 'fill:',
            'TradeExecutionRecord', 'TradePlanRecord', 'TradeRecord', 'timestamp', 'time:',
          ]) {
            if (source.includes(forbidden)) throw new Error(`P19.2 zone semantics owns forbidden concern: ${forbidden}`);
          }
          if (!index.includes("from './riskRewardZoneSemantics'")) throw new Error('P19.2 risk-reward barrel does not export zone semantics');
          for (const token of [
            "analysis('long', '100', '90', '120')",
            "risk: { role: 'risk'",
            "reward: { role: 'reward'",
            "analysis('short', '100', '110', '80')",
            'preserves short-side price ordering rather than normalizing or validating it',
          ]) {
            if (!test.includes(token)) throw new Error(`P19.2 focused test missing: ${token}`);
          }
          console.log('P19.2 Risk/Reward zone semantics projection verification passed.');
          JS

          cat > "$ROOT/KAIROS_P19_2_RISK_REWARD_ZONE_SEMANTICS_PROJECTION_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P19.2 — Risk/Reward Zone Semantics Projection

          ## Authority
          Base: canonical P19.1 Risk/Reward Analysis Semantic Contract Foundation, `Kairos Controlled Roadmap Gate` run #274 / `34010682979`.

          ## Scope
          Adds one provider-neutral P19-owned semantic projection from a Risk/Reward analysis into exactly two immutable price-bound zones:
          - `risk`: entry to stop
          - `reward`: entry to target

          Zone roles are semantic only. P2/P3 remain styling/color owners.

          ## Non-scope
          No ratio/R math, price-order or side validation, price normalization, chart-time/span geometry, rendering/provider API, P18 `ChartDrawing` expansion, editing lifecycle, P20 persistence, P14 journal/execution writes, or hard-coded visual colors.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p19candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p19:2-risk-reward-zone-semantics-projection']='node scripts/verify-p19-2-risk-reward-zone-semantics-projection.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_2_RISK_REWARD_ZONE_SEMANTICS_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-2-risk-reward-zone-semantics-projection.mjs',
            'src/application/risk-reward/index.ts',
            'src/application/risk-reward/riskRewardZoneSemantics.ts',
            'tests/risk-reward-zone-semantics.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P19.2 before packaging
        working-directory: .p19candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npx vitest run tests/risk-reward-zone-semantics.test.ts tests/risk-reward-analysis-contract.test.ts
          npm run typecheck
          npm run build
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p19candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_2_RISK_REWARD_ZONE_SEMANTICS_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-2-risk-reward-zone-semantics-projection.mjs',
            'src/application/risk-reward/index.ts',
            'src/application/risk-reward/riskRewardZoneSemantics.ts',
            'tests/risk-reward-zone-semantics.test.ts',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p19candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P19.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p19candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P19.2 Risk Reward zone semantics projection candidate'
          git push
