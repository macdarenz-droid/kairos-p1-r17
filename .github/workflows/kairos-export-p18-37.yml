name: Kairos Temporary P18.37 Manual Download Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kairos-export-p18-37.yml'

permissions:
  contents: read

jobs:
  export-p18-37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact P18.37 candidate exists
        run: |
          test -f KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip
          echo "sha256=$(sha256sum KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip | awk '{print $1}')"
      - name: Export exact candidate as artifact
        uses: actions/upload-artifact@v4
        with:
          name: P18_37_MANUAL_DOWNLOAD
          path: KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip
          if-no-files-found: error
