name: Kairos P20.1 Contract Inspection Helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-1-contract-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract P19.7 canonical-root candidate
        run: |
          rm -rf .inspect && mkdir .inspect
          unzip -q KAIROS_P19_7_RISK_REWARD_TOOL_SYSTEM_CLOSURE_CANDIDATE_2026-09-06.zip -d .inspect
          test -f .inspect/kairos_p76/package.json
      - name: Print exact relevant source paths and contracts
        run: |
          cd .inspect/kairos_p76
          echo '=== RELEVANT PATHS ==='
          find src -type f | sort | grep -E 'chart|risk-reward|riskReward|domain|application' | head -n 400
          echo '=== SYMBOL LOCATIONS ==='
          grep -RInE 'createChartDrawingId|ChartDrawingId|ChartDrawingCollectionSession|type ChartDrawing|interface ChartDrawing|ChartMarketReference|RiskRewardAnalysis|RiskRewardChartTimeExtent|RiskRewardChartPlacementProjection|crypto\.randomUUID|createTradeDomainId' src | head -n 500 || true
          echo '=== CANDIDATE CONTRACT FILE CONTENTS ==='
          for f in $(grep -RIlE 'createChartDrawingId|ChartDrawingCollectionSession|ChartMarketReference|RiskRewardAnalysis|RiskRewardChartTimeExtent|createTradeDomainId' src | sort -u); do
            echo "--- $f ---"
            sed -n '1,260p' "$f"
          done
          echo '=== INDEX EXPORTS NEAR APPLICATION/CHART ==='
          find src -type f -name 'index.ts' | sort | while read f; do
            if grep -qE 'chart|risk-reward|RiskReward|ChartDrawing|ChartMarketReference' "$f"; then
              echo "--- $f ---"
              sed -n '1,220p' "$f"
            fi
          done
