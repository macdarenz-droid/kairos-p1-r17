name: Kairos P19.5 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-5-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_4_RISK_REWARD_CHART_SEMANTIC_STYLE_PROJECTION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P19_5_RISK_REWARD_CHART_LOGICAL_PLACEMENT_PROJECTION_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P19.5 from canonical P19.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p19base .p19candidate
          mkdir .p19base .p19candidate
          unzip -q "$BASE_ZIP" -d .p19base
          cp -a .p19base/. .p19candidate/
          ROOT=.p19candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/risk-reward/riskRewardChartSemantics.ts"
          test -f "$ROOT/src/app/riskRewardChartStyleProjection.ts"
          test -f "$ROOT/src/features/chart/chartRenderContract.ts"
          test -f "$ROOT/src/features/chart/index.ts"
          test ! -f "$ROOT/src/app/index.ts"

          cat > "$ROOT/src/app/riskRewardChartPlacementProjection.ts" <<'TS'
          import type { RiskRewardChartSemantics } from '../application/risk-reward';
          import type { ChartTimestamp } from '../features/chart';

          export interface RiskRewardChartTimeExtent {
            readonly start: ChartTimestamp;
            readonly end: ChartTimestamp;
          }

          export interface RiskRewardChartPlacementProjection {
            readonly id: RiskRewardChartSemantics['id'];
            readonly start: ChartTimestamp;
            readonly end: ChartTimestamp;
          }

          export function projectRiskRewardChartPlacement(
            semantics: RiskRewardChartSemantics,
            extent: RiskRewardChartTimeExtent,
          ): RiskRewardChartPlacementProjection {
            return {
              id: semantics.id,
              start: extent.start,
              end: extent.end,
            };
          }
          TS

          cat > "$ROOT/tests/risk-reward-chart-placement-projection.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import type { RiskRewardChartSemantics } from '../src/application/risk-reward';
          import {
            projectRiskRewardChartPlacement,
            type RiskRewardChartTimeExtent,
          } from '../src/app/riskRewardChartPlacementProjection';
          import { parsePositiveDecimalString } from '../src/domain/trades';

          function decimal(value: string) {
            const parsed = parsePositiveDecimalString(value);
            if (!parsed.ok) throw new Error(`invalid test decimal: ${value}`);
            return parsed.value;
          }

          const semantics: RiskRewardChartSemantics = {
            id: 'risk-reward-placement-projection',
            side: 'long',
            levels: {
              entry: { role: 'entry', price: decimal('100') },
              stop: { role: 'stop', price: decimal('90') },
              target: { role: 'target', price: decimal('120') },
            },
            zones: {
              risk: { role: 'risk', from: decimal('100'), to: decimal('90') },
              reward: { role: 'reward', from: decimal('100'), to: decimal('120') },
            },
          };

          describe('P19.5 Risk/Reward chart logical placement projection', () => {
            it('preserves analysis identity and caller-supplied logical start/end timestamps', () => {
              const extent: RiskRewardChartTimeExtent = {
                start: '2026-09-06T10:00:00Z',
                end: '2026-09-06T11:00:00Z',
              };

              expect(projectRiskRewardChartPlacement(semantics, extent)).toEqual({
                id: 'risk-reward-placement-projection',
                start: extent.start,
                end: extent.end,
              });
            });

            it('does not validate, reorder, or normalize the caller-owned logical extent', () => {
              const extent: RiskRewardChartTimeExtent = {
                start: '2026-09-06T11:00:00Z',
                end: '2026-09-06T10:00:00Z',
              };

              expect(projectRiskRewardChartPlacement(semantics, extent)).toEqual({
                id: semantics.id,
                start: extent.start,
                end: extent.end,
              });
            });
          });
          TS

          cat > "$ROOT/scripts/verify-p19-5-risk-reward-chart-logical-placement-projection.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../src/app/riskRewardChartPlacementProjection.ts', import.meta.url), 'utf8');
          const test = readFileSync(new URL('../tests/risk-reward-chart-placement-projection.test.ts', import.meta.url), 'utf8');
          const chartContract = readFileSync(new URL('../src/features/chart/chartRenderContract.ts', import.meta.url), 'utf8');
          const chartIndex = readFileSync(new URL('../src/features/chart/index.ts', import.meta.url), 'utf8');

          for (const token of [
            "import type { RiskRewardChartSemantics } from '../application/risk-reward'",
            "import type { ChartTimestamp } from '../features/chart'",
            'export interface RiskRewardChartTimeExtent',
            'readonly start: ChartTimestamp',
            'readonly end: ChartTimestamp',
            'export interface RiskRewardChartPlacementProjection',
            "readonly id: RiskRewardChartSemantics['id']",
            'export function projectRiskRewardChartPlacement',
            'id: semantics.id',
            'start: extent.start',
            'end: extent.end',
          ]) {
            if (!source.includes(token)) throw new Error(`P19.5 placement projection missing: ${token}`);
          }

          if (!chartContract.includes('export type ChartTimestamp = string')) {
            throw new Error('P19.5 requires the established generic ChartTimestamp owner');
          }
          if (!chartIndex.includes('ChartTimestamp')) {
            throw new Error('P19.5 requires ChartTimestamp to remain exported by the generic chart feature boundary');
          }

          for (const forbidden of [
            'lightweight-charts', 'ChartDrawing', 'IndexedDB', 'Dexie', 'localStorage',
            'fetch(', 'WebSocket', 'calculateTradeMetrics', 'calculateRisk', 'calculateRMultiple',
            'Math.min', 'Math.max', 'new Date(', 'Date.parse', '.sort(', 'localeCompare(',
            'parseInt(', 'parseFloat(', 'Number(', 'document.', 'window.', '.applyOptions(',
            'addSeries(', 'createChart(', 'setData(', 'update(', 'priceToCoordinate(',
          ]) {
            if (source.includes(forbidden)) throw new Error(`P19.5 placement projection owns forbidden concern: ${forbidden}`);
          }
          if (/(#[0-9a-fA-F]{3,8}\b|rgba?\(|hsla?\()/.test(source)) {
            throw new Error('P19.5 placement projection hard-codes a visual color value');
          }

          for (const token of [
            'preserves analysis identity and caller-supplied logical start/end timestamps',
            'does not validate, reorder, or normalize the caller-owned logical extent',
            'start: extent.start',
            'end: extent.end',
          ]) {
            if (!test.includes(token)) throw new Error(`P19.5 focused test missing: ${token}`);
          }

          console.log('P19.5 Risk/Reward chart logical placement projection verification passed.');
          JS

          cat > "$ROOT/KAIROS_P19_5_RISK_REWARD_CHART_LOGICAL_PLACEMENT_PROJECTION_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P19.5 — Risk/Reward Chart Logical Placement Projection

          ## Authority
          Base: canonical P19.4 Risk/Reward Chart Semantic Style Projection, `Kairos Controlled Roadmap Gate` run #277 / `34015419305`.

          ## Scope
          Adds one app-boundary pure projection that combines authoritative P19 Risk/Reward semantics with caller-supplied logical horizontal extent using the already-owned generic `ChartTimestamp` type. The projection preserves Risk/Reward analysis identity plus logical `start` and `end` only.

          ## Ownership
          P19 application semantics remain free of chart-feature dependencies. `ChartTimestamp` remains owned/exported by generic chart infrastructure. Horizontal extent is ephemeral presentation input during P19; P20 may later persist equivalent logical timestamps under Saved Analysis without P19 implementing persistence.

          ## Non-scope
          No timestamp order validation or normalization, Risk/Reward or price math, provider/Lightweight Charts production APIs, pixel/screen geometry, P18 contract widening, DOM/UI/CSS, edit/drag/delete behavior, P20 persistence, P14 journal/execution mutation, P11 calculation duplication, semantic styling ownership, or hard-coded colors.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p19candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p19:5-risk-reward-chart-logical-placement-projection']='node scripts/verify-p19-5-risk-reward-chart-logical-placement-projection.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_5_RISK_REWARD_CHART_LOGICAL_PLACEMENT_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-5-risk-reward-chart-logical-placement-projection.mjs',
            'src/app/riskRewardChartPlacementProjection.ts',
            'tests/risk-reward-chart-placement-projection.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P19.5 before packaging
        working-directory: .p19candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p19:5-risk-reward-chart-logical-placement-projection
          npx vitest run tests/risk-reward-chart-placement-projection.test.ts tests/risk-reward-chart-style-projection.test.ts tests/risk-reward-chart-semantics.test.ts tests/risk-reward-zone-semantics.test.ts tests/risk-reward-analysis-contract.test.ts
          npm run typecheck
          npm run build
          npm run verify:p19:4-risk-reward-chart-semantic-style-projection
          npm run verify:p19:3-risk-reward-chart-composition-semantic-contract
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p19candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_5_RISK_REWARD_CHART_LOGICAL_PLACEMENT_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-5-risk-reward-chart-logical-placement-projection.mjs',
            'src/app/riskRewardChartPlacementProjection.ts',
            'tests/risk-reward-chart-placement-projection.test.ts',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p19candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P19.5 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p19candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P19.5 Risk Reward chart logical placement projection candidate'
          git push
