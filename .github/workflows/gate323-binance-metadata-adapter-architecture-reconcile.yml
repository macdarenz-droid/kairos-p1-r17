name: Kairos Gate323 Binance Metadata Adapter Architecture Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate323-binance-metadata-adapter-architecture-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      ARCH_B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile Gate323 ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p = Path('docs/KAIROS_ARCHITECTURE_MAP.md')
          s = p.read_text()
          marker = '## Canonical Binance Spot exchangeInfo instrument metadata acquisition adapter checkpoint — gate #323'
          if marker not in s:
              block = base64.b64decode(os.environ['ARCH_B64']).decode()
              p.write_text(s.rstrip() + '\n\n' + block)
          PY
          grep -Fq 'gate #323' docs/KAIROS_ARCHITECTURE_MAP.md
          grep -Fq 'Binance Spot exchangeInfo browser public REST connector' docs/KAIROS_ARCHITECTURE_MAP.md
      - name: Commit reconciliation and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous'
          git config user.email 'kairos-autonomous@users.noreply.github.com'
          git rm .github/workflows/gate323-binance-metadata-adapter-architecture-reconcile.yml
          git add docs/KAIROS_ARCHITECTURE_MAP.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'docs: reconcile Gate323 metadata adapter ownership'
          git push origin HEAD:main
