name: Kairos P19.4 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-4-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P19_3_RISK_REWARD_CHART_COMPOSITION_SEMANTIC_CONTRACT_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P19_4_RISK_REWARD_CHART_SEMANTIC_STYLE_PROJECTION_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P19.4 from canonical P19.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p19base .p19candidate
          mkdir .p19base .p19candidate
          unzip -q "$BASE_ZIP" -d .p19base
          cp -a .p19base/. .p19candidate/
          ROOT=.p19candidate/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/risk-reward/riskRewardChartSemantics.ts"
          test -f "$ROOT/src/design-system/tokens/semantic.ts"
          test -d "$ROOT/src/app"
          test ! -f "$ROOT/src/app/index.ts"

          cat > "$ROOT/src/app/riskRewardChartStyleProjection.ts" <<'TS'
          import type { RiskRewardChartSemantics } from '../application/risk-reward';
          import { semanticTokens } from '../design-system/tokens/semantic';

          export interface RiskRewardChartStyleRoleProjection<Role extends string> {
            readonly role: Role;
            readonly token: string;
          }

          export interface RiskRewardChartStyleProjection {
            readonly entry: RiskRewardChartStyleRoleProjection<'entry'>;
            readonly stop: RiskRewardChartStyleRoleProjection<'stop'>;
            readonly target: RiskRewardChartStyleRoleProjection<'target'>;
            readonly risk: RiskRewardChartStyleRoleProjection<'risk'>;
            readonly reward: RiskRewardChartStyleRoleProjection<'reward'>;
          }

          export function projectRiskRewardChartStyle(
            semantics: RiskRewardChartSemantics,
          ): RiskRewardChartStyleProjection {
            return {
              entry: { role: semantics.levels.entry.role, token: semanticTokens.trade.entry },
              stop: { role: semantics.levels.stop.role, token: semanticTokens.trade.stop },
              target: { role: semantics.levels.target.role, token: semanticTokens.trade.target },
              risk: { role: semantics.zones.risk.role, token: semanticTokens.trade.riskZone },
              reward: { role: semantics.zones.reward.role, token: semanticTokens.trade.rewardZone },
            };
          }
          TS

          cat > "$ROOT/tests/risk-reward-chart-style-projection.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import type { RiskRewardChartSemantics } from '../src/application/risk-reward';
          import { projectRiskRewardChartStyle } from '../src/app/riskRewardChartStyleProjection';
          import { semanticTokens } from '../src/design-system/tokens/semantic';
          import { parsePositiveDecimalString } from '../src/domain/trades';

          function decimal(value: string) {
            const parsed = parsePositiveDecimalString(value);
            if (!parsed.ok) throw new Error(`invalid test decimal: ${value}`);
            return parsed.value;
          }

          const semantics: RiskRewardChartSemantics = {
            id: 'risk-reward-style-projection',
            side: 'long',
            levels: {
              entry: { role: 'entry', price: decimal('100') },
              stop: { role: 'stop', price: decimal('90') },
              target: { role: 'target', price: decimal('120') },
            },
            zones: {
              risk: { role: 'risk', from: decimal('100'), to: decimal('90') },
              reward: { role: 'reward', from: decimal('100'), to: decimal('120') },
            },
          };

          describe('P19.4 Risk/Reward chart semantic style projection', () => {
            it('maps all five P19.3 semantic roles to existing P2/P3 trade token references', () => {
              expect(projectRiskRewardChartStyle(semantics)).toEqual({
                entry: { role: 'entry', token: semanticTokens.trade.entry },
                stop: { role: 'stop', token: semanticTokens.trade.stop },
                target: { role: 'target', token: semanticTokens.trade.target },
                risk: { role: 'risk', token: semanticTokens.trade.riskZone },
                reward: { role: 'reward', token: semanticTokens.trade.rewardZone },
              });
            });

            it('returns CSS-variable semantic references instead of hard-coded visual values', () => {
              for (const style of Object.values(projectRiskRewardChartStyle(semantics))) {
                expect(style.token).toMatch(/^var\(--kairos-/);
                expect(style.token).not.toMatch(/^(#|rgb|hsl)/);
              }
            });
          });
          TS

          cat > "$ROOT/scripts/verify-p19-4-risk-reward-chart-semantic-style-projection.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../src/app/riskRewardChartStyleProjection.ts', import.meta.url), 'utf8');
          const test = readFileSync(new URL('../tests/risk-reward-chart-style-projection.test.ts', import.meta.url), 'utf8');
          const semantic = readFileSync(new URL('../src/design-system/tokens/semantic.ts', import.meta.url), 'utf8');

          for (const token of [
            "import type { RiskRewardChartSemantics } from '../application/risk-reward'",
            "import { semanticTokens } from '../design-system/tokens/semantic'",
            'export interface RiskRewardChartStyleRoleProjection',
            'export interface RiskRewardChartStyleProjection',
            "readonly entry: RiskRewardChartStyleRoleProjection<'entry'>",
            "readonly stop: RiskRewardChartStyleRoleProjection<'stop'>",
            "readonly target: RiskRewardChartStyleRoleProjection<'target'>",
            "readonly risk: RiskRewardChartStyleRoleProjection<'risk'>",
            "readonly reward: RiskRewardChartStyleRoleProjection<'reward'>",
            'export function projectRiskRewardChartStyle',
            'role: semantics.levels.entry.role, token: semanticTokens.trade.entry',
            'role: semantics.levels.stop.role, token: semanticTokens.trade.stop',
            'role: semantics.levels.target.role, token: semanticTokens.trade.target',
            'role: semantics.zones.risk.role, token: semanticTokens.trade.riskZone',
            'role: semantics.zones.reward.role, token: semanticTokens.trade.rewardZone',
          ]) {
            if (!source.includes(token)) throw new Error(`P19.4 style projection missing: ${token}`);
          }
          for (const token of [
            "entry: role('trade-entry')",
            "stop: role('trade-stop')",
            "target: role('trade-target')",
            "riskZone: role('trade-risk-zone')",
            "rewardZone: role('trade-reward-zone')",
          ]) {
            if (!semantic.includes(token)) throw new Error(`P19.4 required semantic token missing: ${token}`);
          }
          for (const forbidden of [
            'lightweight-charts', 'ChartDrawing', 'IndexedDB', 'Dexie', 'localStorage',
            'fetch(', 'WebSocket', 'calculateTradeMetrics', 'calculateRisk', 'calculateRMultiple',
            'Math.min', 'Math.max', 'timestamp', 'document.', 'window.', '.applyOptions(',
            'addSeries(', 'createChart(', 'setData(', 'update(', 'priceToCoordinate(',
          ]) {
            if (source.includes(forbidden)) throw new Error(`P19.4 style projection owns forbidden concern: ${forbidden}`);
          }
          if (/(#[0-9a-fA-F]{3,8}\b|rgba?\(|hsla?\()/.test(source)) {
            throw new Error('P19.4 style projection hard-codes a visual color value');
          }
          for (const token of [
            'semanticTokens.trade.entry',
            'semanticTokens.trade.stop',
            'semanticTokens.trade.target',
            'semanticTokens.trade.riskZone',
            'semanticTokens.trade.rewardZone',
            'CSS-variable semantic references',
            'not.toMatch(/^(#|rgb|hsl)/)',
          ]) {
            if (!test.includes(token)) throw new Error(`P19.4 focused test missing: ${token}`);
          }
          console.log('P19.4 Risk/Reward chart semantic style projection verification passed.');
          JS

          cat > "$ROOT/KAIROS_P19_4_RISK_REWARD_CHART_SEMANTIC_STYLE_PROJECTION_REPORT_2026-09-06.md" <<'MD'
          # KAIROS P19.4 — Risk/Reward Chart Semantic Style Projection

          ## Authority
          Base: canonical P19.3 Risk/Reward Chart Composition Semantic Contract, `Kairos Controlled Roadmap Gate` run #276 / `34013463627`.

          ## Scope
          Adds one presentation-boundary projection in `src/app` that maps the five P19.3 Risk/Reward semantic roles (`entry`, `stop`, `target`, `risk`, `reward`) to the existing P2/P3 semantic trade-token CSS-variable references. It does not own token values and does not change Risk/Reward business semantics.

          ## Ownership
          P19 application semantics remain presentation-agnostic. P2/P3 remain semantic token/theme value owners. P17/P18 remain generic provider/drawing infrastructure. The app layer composes P19 semantics with existing design-system token references without reversing dependencies.

          ## Non-scope
          No ratio/R or price math, price normalization, chart timestamp/span/screen geometry, provider or Lightweight Charts production APIs, P18 `ChartDrawing` widening, DOM/UI component/CSS work, edit/drag/delete lifecycle, P20 persistence, P14 journal/execution mutation, P11 calculation duplication, or hard-coded visual colors.
          MD

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p19candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p19:4-risk-reward-chart-semantic-style-projection']='node scripts/verify-p19-4-risk-reward-chart-semantic-style-projection.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_4_RISK_REWARD_CHART_SEMANTIC_STYLE_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-4-risk-reward-chart-semantic-style-projection.mjs',
            'src/app/riskRewardChartStyleProjection.ts',
            'tests/risk-reward-chart-style-projection.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed P19.4 before packaging
        working-directory: .p19candidate/kairos_p76
        run: |
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p19:4-risk-reward-chart-semantic-style-projection
          npx vitest run tests/risk-reward-chart-style-projection.test.ts tests/risk-reward-chart-semantics.test.ts tests/risk-reward-zone-semantics.test.ts tests/risk-reward-analysis-contract.test.ts
          npm run typecheck
          npm run build
          npm run verify:p19:3-risk-reward-chart-composition-semantic-contract
          npm run verify:p19:2-risk-reward-zone-semantics-projection
          npm run verify:p19:1-risk-reward-analysis-contract-foundation
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1

      - name: Restore clean package boundary after verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p19candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p19base/kairos_p76'))):p.read_bytes() for p in Path('.p19base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p19candidate/kairos_p76'))):p.read_bytes() for p in Path('.p19candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P19_4_RISK_REWARD_CHART_SEMANTIC_STYLE_PROJECTION_REPORT_2026-09-06.md',
            'package.json',
            'scripts/verify-p19-4-risk-reward-chart-semantic-style-projection.mjs',
            'src/app/riskRewardChartStyleProjection.ts',
            'tests/risk-reward-chart-style-projection.test.ts',
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          root=Path('.p19candidate/kairos_p76')
          forbidden=[]
          for name in ['node_modules','dist','coverage','.vite']:
            if any(p.name==name for p in root.rglob('*')): forbidden.append(name)
          if forbidden: raise SystemExit(f'forbidden generated directories remain: {forbidden}')
          PY

      - name: Package and commit P19.4 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p19candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P19.4 Risk Reward chart semantic style projection candidate'
          git push
