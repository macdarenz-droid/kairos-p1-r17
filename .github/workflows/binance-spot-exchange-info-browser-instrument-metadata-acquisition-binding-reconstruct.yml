name: Kairos Binance Spot exchangeInfo Browser Instrument Metadata Acquisition Binding Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_PUBLIC_REST_CONNECTOR_FOUNDATION_CANDIDATE_2026-09-09.zip
      OUT_ZIP: KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_INSTRUMENT_METADATA_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct browser instrument metadata acquisition binding from canonical Gate324
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bindingbase .bindingcandidate
          mkdir .bindingbase .bindingcandidate
          unzip -q "$BASE_ZIP" -d .bindingbase
          cp -a .bindingbase/. .bindingcandidate/
          ROOT=.bindingcandidate/kairos_p76
          BINDING="$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/LiveMarketUniverseInstrumentMetadataAcquisitionPort.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoInstrumentMetadataAcquisitionAdapter.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpotExchangeInfoBrowserPublicRestConnector.ts"
          test -f "$INDEX"

          cat > "$BINDING" <<'TS'
          import type { LiveMarketUniverseInstrumentMetadataAcquisitionPort } from '../../LiveMarketUniverseInstrumentMetadataAcquisitionPort';
          import { createBinanceSpotExchangeInfoInstrumentMetadataAcquisitionPort } from './binanceSpotExchangeInfoInstrumentMetadataAcquisitionAdapter';
          import { connectBinanceSpotExchangeInfoBrowserPublicRestRequest } from './binanceSpotExchangeInfoBrowserPublicRestConnector';

          /**
           * Browser-ready composition of the released Binance Spot exchangeInfo
           * metadata acquisition adapter and browser public REST connector.
           * Universe policy, freshness/cadence, state, and UI remain separate owners.
           */
          export function createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort():
            LiveMarketUniverseInstrumentMetadataAcquisitionPort {
            return createBinanceSpotExchangeInfoInstrumentMetadataAcquisitionPort(
              connectBinanceSpotExchangeInfoBrowserPublicRestRequest,
            );
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.bindingcandidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding';\n"
          if line not in s:
              anchor="export * from './providers/binance/binanceSpotExchangeInfoBrowserPublicRestConnector';\n"
              if anchor not in s: raise SystemExit('Gate324 browser connector export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding.test.ts" <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort } from '../src/services/market-data';

          const originalFetch = globalThis.fetch;
          const payload = JSON.stringify({ symbols: [
            { symbol: 'BTCUSDT', status: 'TRADING', baseAsset: 'BTC', quoteAsset: 'USDT' },
            { symbol: 'ETHUSDT', status: 'TRADING', baseAsset: 'ETH', quoteAsset: 'USDT' },
          ] });

          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.restoreAllMocks();
          });

          describe('Binance Spot exchangeInfo browser instrument metadata acquisition binding foundation', () => {
            it('composes the released metadata adapter with the released browser connector', async () => {
              const text = vi.fn(async () => payload);
              const fetchMock = vi.fn(async () => ({ text })) as unknown as typeof fetch;
              globalThis.fetch = fetchMock;
              const port = createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort();

              const result = await port.acquireInstrumentMetadata();

              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(text).toHaveBeenCalledTimes(1);
              expect(result.ok).toBe(true);
              if (result.ok) expect(result.facts).toHaveLength(2);
            });

            it('preserves exact caller-owned cancellation through the composed chain', async () => {
              const controller = new AbortController();
              const fetchMock = vi.fn(async () => ({ text: async () => JSON.stringify({ symbols: [] }) })) as unknown as typeof fetch;
              globalThis.fetch = fetchMock;
              const port = createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort();

              await expect(port.acquireInstrumentMetadata({ signal: controller.signal })).resolves.toEqual({ ok: true, facts: [] });
              const [, init] = fetchMock.mock.calls[0] ?? [];
              expect(init?.signal).toBe(controller.signal);
            });

            it('preserves the released acquisition-failed mapping for native browser rejection', async () => {
              globalThis.fetch = vi.fn(async () => { throw new Error('native-fetch-failure'); }) as unknown as typeof fetch;
              const port = createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort();
              await expect(port.acquireInstrumentMetadata()).resolves.toEqual({ ok: false, reason: 'acquisition-failed' });
            });

            it('preserves the released acquisition-failed mapping for invalid provider payload', async () => {
              globalThis.fetch = vi.fn(async () => ({ text: async () => '{"symbols":' })) as unknown as typeof fetch;
              const port = createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort();
              await expect(port.acquireInstrumentMetadata()).resolves.toEqual({ ok: false, reason: 'acquisition-failed' });
            });
          });
          TS

          cat > "$ROOT/KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_INSTRUMENT_METADATA_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # KAIROS — Binance Spot exchangeInfo Browser Instrument Metadata Acquisition Binding Foundation

          ## Authority
          Base: canonical Gate #324 Binance Spot exchangeInfo Browser Public REST Connector Foundation, run `34279358453`.

          ## Source-proven responsibility
          Gate #323 owns the Binance Spot implementation of the provider-neutral instrument metadata acquisition port but deliberately receives its exchangeInfo request connector from the caller. Gate #324 owns the concrete browser connector but deliberately does not compose acquisition. The released P21.15 24h browser acquisition binding establishes the dependency direction for one narrow browser-ready provider entry point. Therefore the smallest dependency-safe next responsibility is composition only: bind the released Gate #323 acquisition adapter to the released Gate #324 browser connector.

          ## Contract
          - Export one factory returning the existing `LiveMarketUniverseInstrumentMetadataAcquisitionPort`.
          - Compose only `createBinanceSpotExchangeInfoInstrumentMetadataAcquisitionPort` with `connectBinanceSpotExchangeInfoBrowserPublicRestRequest`.
          - Preserve optional caller-owned `AbortSignal` forwarding through the existing port/adapter/connector chain.
          - Preserve successful authoritative metadata facts and the existing single `acquisition-failed` result unchanged.
          - Add no new network, provider decode/mapping, universe, freshness, state, persistence, or UI owner.

          ## Explicit non-scope
          - No endpoint/path/query ownership, additional fetch/XHR/WebSocket transport, HTTP status/header/error taxonomy, credentials, timeout, retry/backoff/rate/request-weight policy.
          - No JSON decode, exchangeInfo response mapping, symbol fact mapping, or provider validation changes.
          - No USDT eligibility, stablecoin exclusion, 24h quote-volume ranking, symbol tie-break, Top 30, batching, or universe policy.
          - No observedAt/freshness thresholds, 5-second cadence, visibility/resume/session lifecycle, cache, accumulator, state, or persistence.
          - No Home/Live Crypto Bubble Map UI and no Your Trades/journal/Saved Analysis/chart/navigation/transitions.
          MD

          cat > "$ROOT/scripts/verify-binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const binding = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_INSTRUMENT_METADATA_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md', import.meta.url), 'utf8');
          for (const token of [
            'createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort()',
            'LiveMarketUniverseInstrumentMetadataAcquisitionPort',
            'createBinanceSpotExchangeInfoInstrumentMetadataAcquisitionPort(',
            'connectBinanceSpotExchangeInfoBrowserPublicRestRequest,',
          ]) if (!binding.includes(token)) throw new Error(`binding evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding';")) throw new Error('binding export missing');
          for (const forbidden of [
            'globalThis.fetch(', 'fetch(', 'XMLHttpRequest', 'WebSocket(', 'Response(', 'JSON.parse(',
            'Date.now(', 'new Date(', 'new AbortController(', 'AbortSignal.any(', 'AbortSignal.timeout(',
            'setTimeout(', 'setInterval(', 'indexedDB', 'createChart(', 'USDT', 'quoteVolume', 'Top 30',
          ]) if (binding.includes(forbidden)) throw new Error(`binding broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'Gate #323 owns the Binance Spot implementation of the provider-neutral instrument metadata acquisition port',
            'Gate #324 owns the concrete browser connector',
            'released P21.15 24h browser acquisition binding establishes the dependency direction',
            'No USDT eligibility, stablecoin exclusion, 24h quote-volume ranking',
            'No observedAt/freshness thresholds, 5-second cadence',
            'No Home/Live Crypto Bubble Map UI',
          ]) if (!report.includes(token)) throw new Error(`report evidence missing: ${token}`);
          console.log('Binance Spot exchangeInfo browser instrument metadata acquisition binding verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.bindingcandidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation']='node scripts/verify-binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.bindingbase/kairos_p76'))):p.read_bytes() for p in Path('.bindingbase/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.bindingcandidate/kairos_p76'))):p.read_bytes() for p in Path('.bindingcandidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_BINANCE_SPOT_EXCHANGE_INFO_BROWSER_INSTRUMENT_METADATA_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding.ts',
            'tests/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding.test.ts',
          }
          print('\n'.join(sorted(changed)))
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          PY

      - name: Verify reconstructed browser metadata acquisition binding before packaging
        working-directory: .bindingcandidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation
          npx vitest run tests/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding.test.ts tests/binance-spot-exchange-info-instrument-metadata-acquisition-adapter.test.ts tests/binance-spot-exchange-info-browser-public-rest-connector.test.ts tests/binance-spot-exchange-info-public-rest-round-trip.test.ts
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => /^verify:p\d/.test(name));
          for (const name of scripts) {
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary, package candidate, and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.bindingcandidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -rf .packagecheck
          mkdir .packagecheck
          (cd .bindingcandidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -q "$OUT_ZIP" -d .packagecheck
          test -d .packagecheck/kairos_p76
          test ! -e .packagecheck/kairos_p76/node_modules
          test ! -e .packagecheck/kairos_p76/dist
          test "$(find .packagecheck -mindepth 1 -maxdepth 1 -printf '%f\n')" = "kairos_p76"
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git add "$OUT_ZIP"
          git rm .github/workflows/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-reconstruct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Binance Spot exchangeInfo browser metadata acquisition binding candidate'
          git push
