name: Kairos Home Dashboard Live Market Summary Acquisition Cadence Policy Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-market-summary-acquisition-cadence-policy-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_ZIP: KAIROS_LIVE_MARKET_UNIVERSE_TOP_N_SELECTION_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
  CANDIDATE_ZIP: KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_ACQUISITION_CADENCE_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
  HELPER_PATH: .github/workflows/home-dashboard-live-market-summary-acquisition-cadence-policy-reconstruct.yml

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Reconstruct cadence-policy candidate directly from Gate328 GOLDEN
        run: |
          set -euo pipefail
          test -f "$BASE_ZIP"
          rm -rf .cadence-work
          mkdir -p .cadence-work
          unzip -q "$BASE_ZIP" -d .cadence-work
          ROOT=.cadence-work/kairos_p76
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFreshnessClassificationPolicy.ts"

          cat > "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionCadencePolicy.ts" <<'TS'
          export const HOME_DASHBOARD_LIVE_MARKET_SUMMARY_VISIBLE_ACQUISITION_INTERVAL_MS = 5_000 as const;

          export type HomeDashboardLiveMarketSummaryAcquisitionCadenceTrigger =
            | 'entry'
            | 'resume'
            | 'periodic';

          export type HomeDashboardLiveMarketSummaryVisibility = 'visible' | 'hidden';

          export interface HomeDashboardLiveMarketSummaryAcquisitionCadenceDecision {
            readonly acquireNow: boolean;
            readonly nextVisibleAcquisitionAfterMs: number | null;
          }

          export function decideHomeDashboardLiveMarketSummaryAcquisitionCadence(
            visibility: HomeDashboardLiveMarketSummaryVisibility,
            trigger: HomeDashboardLiveMarketSummaryAcquisitionCadenceTrigger,
          ): HomeDashboardLiveMarketSummaryAcquisitionCadenceDecision {
            if (visibility === 'hidden') {
              return {
                acquireNow: false,
                nextVisibleAcquisitionAfterMs: null,
              };
            }

            switch (trigger) {
              case 'entry':
              case 'resume':
              case 'periodic':
                return {
                  acquireNow: true,
                  nextVisibleAcquisitionAfterMs:
                    HOME_DASHBOARD_LIVE_MARKET_SUMMARY_VISIBLE_ACQUISITION_INTERVAL_MS,
                };
            }
          }
          TS

          cat > "$ROOT/tests/home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import {
            HOME_DASHBOARD_LIVE_MARKET_SUMMARY_VISIBLE_ACQUISITION_INTERVAL_MS,
            decideHomeDashboardLiveMarketSummaryAcquisitionCadence,
          } from '../src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionCadencePolicy';

          describe('Home Dashboard live-market acquisition cadence policy', () => {
            it('owns the approved visible acquisition interval of exactly five seconds', () => {
              expect(HOME_DASHBOARD_LIVE_MARKET_SUMMARY_VISIBLE_ACQUISITION_INTERVAL_MS).toBe(5000);
            });

            it.each(['entry', 'resume', 'periodic'] as const)(
              'acquires immediately for visible %s and schedules the next visible acquisition after five seconds',
              (trigger) => {
                expect(decideHomeDashboardLiveMarketSummaryAcquisitionCadence('visible', trigger)).toEqual({
                  acquireNow: true,
                  nextVisibleAcquisitionAfterMs: 5000,
                });
              },
            );

            it.each(['entry', 'resume', 'periodic'] as const)(
              'suspends %s acquisition while hidden',
              (trigger) => {
                expect(decideHomeDashboardLiveMarketSummaryAcquisitionCadence('hidden', trigger)).toEqual({
                  acquireNow: false,
                  nextVisibleAcquisitionAfterMs: null,
                });
              },
            );
          });
          TS

          cat > "$ROOT/scripts/verify-home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';

          const sourcePath = 'src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionCadencePolicy.ts';
          const source = readFileSync(sourcePath, 'utf8');
          const test = readFileSync('tests/home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.test.ts', 'utf8');

          const requiredSource = [
            'HOME_DASHBOARD_LIVE_MARKET_SUMMARY_VISIBLE_ACQUISITION_INTERVAL_MS = 5_000',
            "'entry'",
            "'resume'",
            "'periodic'",
            "'visible' | 'hidden'",
            'acquireNow: false',
            'nextVisibleAcquisitionAfterMs: null',
            'acquireNow: true',
          ];
          for (const token of requiredSource) {
            if (!source.includes(token)) throw new Error(`missing cadence-policy evidence: ${token}`);
          }

          const forbidden = [
            'setInterval(', 'setTimeout(', 'document.', 'visibilityState', 'addEventListener(',
            'fetch(', 'WebSocket', 'Date.now(', 'new Date(', 'React', 'useEffect(', 'useState(',
            'Binance', 'quoteVolume24h', 'stablecoin', 'TopN', 'FRESH', 'STALE', 'EXPIRED',
          ];
          for (const token of forbidden) {
            if (source.includes(token)) throw new Error(`cadence policy leaked forbidden ownership: ${token}`);
          }

          if (!test.includes("toBe(5000)")) throw new Error('missing exact five-second policy test');
          if (!test.includes("'hidden'")) throw new Error('missing hidden-suspension test');
          console.log('Home Dashboard live-market acquisition cadence policy foundation verifier PASS');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.cadence-work/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts={...(j.scripts||{}),
            'verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation':'node scripts/verify-home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.mjs'
          };
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          NODE

          cat > "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_ACQUISITION_CADENCE_POLICY_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # Kairos Home Dashboard Live Market Summary Acquisition Cadence Policy Foundation

          Base authority: Gate328 Top-N canonical GOLDEN.

          Responsibility: provider-neutral deterministic Home Dashboard live-market acquisition cadence policy only.

          Released product semantics proposed by this candidate:
          - visible entry => acquire immediately;
          - visible resume => acquire immediately;
          - visible periodic cadence => acquire and schedule next visible acquisition after exactly 5000 ms;
          - hidden => suspend acquisition and schedule no periodic acquisition.

          The policy is intentionally pure. It does not own browser timers, DOM/page visibility listeners, provider transport, session state, observedAt generation, freshness classification, eligibility, stablecoin exclusion, ordering, Top-N selection, persistence, React/Home presentation, Bubble rendering, journal truth, chart/navigation, or transitions.

          A later lifecycle/scheduler adapter may consume this deterministic policy together with the already-released one-shot Home acquisition port; this candidate does not preempt that ownership.
          MD

      - name: Prove exact five-file Gate328-to-cadence candidate scope
        run: |
          set -euo pipefail
          rm -rf .cadence-base
          mkdir .cadence-base
          unzip -q "$BASE_ZIP" -d .cadence-base
          python - <<'PY'
          from pathlib import Path
          import hashlib,sys
          b=Path('.cadence-base/kairos_p76'); c=Path('.cadence-work/kairos_p76')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          print('\n'.join(sorted(changed)))
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_ACQUISITION_CADENCE_POLICY_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.mjs',
            'src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionCadencePolicy.ts',
            'tests/home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.test.ts',
          }
          if changed != expected:
            print('cadence-policy exact scope mismatch', file=sys.stderr)
            print('Unexpected:', sorted(changed-expected), file=sys.stderr)
            print('Missing:', sorted(expected-changed), file=sys.stderr)
            sys.exit(1)
          PY
      - name: Install candidate deterministically
        working-directory: .cadence-work/kairos_p76
        run: npm ci
      - name: Prove pinned Lightweight Charts dependency
        working-directory: .cadence-work/kairos_p76
        run: |
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
      - name: Dedicated cadence policy verifier
        working-directory: .cadence-work/kairos_p76
        run: npm run verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation
      - name: Focused cadence and dependency regression
        working-directory: .cadence-work/kairos_p76
        run: |
          npx vitest run tests/home-dashboard-live-market-summary-acquisition-cadence-policy-foundation.test.ts
          npm run verify:p21:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-foundation
          npm run verify:live-market-summary-freshness-classification-policy-foundation
          npm run verify:live-market-universe-top-n-selection-policy-foundation
      - name: Typecheck and build
        working-directory: .cadence-work/kairos_p76
        run: |
          npm run typecheck
          npm run build
      - name: Full unit regression
        working-directory: .cadence-work/kairos_p76
        run: npm test
      - name: Full registered verifier regression
        working-directory: .cadence-work/kairos_p76
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json','utf8'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:home-dashboard-live-market-summary-acquisition-cadence-policy-foundation',
            'verify:p21:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-foundation',
            'verify:live-market-summary-freshness-classification-policy-foundation',
            'verify:live-market-universe-top-n-selection-policy-foundation',
            'verify:p20:5-saved-analysis-system-closure',
            'verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure',
            'verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure',
            'verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure',
            'verify:p11:calculation-brain-closure',
            'verify:p8:navigation-shell','verify:p1'
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
      - name: Clean and package verified candidate
        run: |
          set -euo pipefail
          ROOT=.cadence-work/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$CANDIDATE_ZIP"
          (cd .cadence-work && zip -qr "../$CANDIDATE_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,zipfile,os
          p=Path(os.environ['CANDIDATE_ZIP']); data=p.read_bytes()
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}
            for i in z.infolist():
              parts=PurePosixPath(i.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE',len(data))
          print('CANDIDATE_SHA256',hashlib.sha256(data).hexdigest())
          PY
      - name: Upload verified NON-CANONICAL candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_LIVE_MARKET_ACQUISITION_CADENCE_CANDIDATE_NONCANONICAL
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
      - name: Place verified candidate at repository root and self-clean helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CANDIDATE_ZIP"
          git rm "$HELPER_PATH"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'candidate: place verified Home live market acquisition cadence policy'
          git push origin HEAD:main
