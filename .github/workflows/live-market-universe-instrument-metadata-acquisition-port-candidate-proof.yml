name: Kairos Live Market Universe Instrument Metadata Acquisition Port Candidate Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-universe-instrument-metadata-acquisition-port-candidate-proof.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    env:
      TARGET_ZIP: KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_METADATA_ACQUISITION_PORT_CONTRACT_FOUNDATION_CANDIDATE_2026-09-09.zip
    steps:
      - uses: actions/checkout@v4
      - id: proof
        name: Prove exact candidate identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TARGET_ZIP"
          test "$(stat -c '%s' "$TARGET_ZIP")" = '1512294'
          unzip -t "$TARGET_ZIP"
          test "$(unzip -Z1 "$TARGET_ZIP" | head -n1)" = 'kairos_p76/'
          python - <<'PY'
          from pathlib import PurePosixPath
          import os, zipfile
          p=os.environ['TARGET_ZIP']
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert {i.filename.split('/')[0] for i in z.infolist()} == {'kairos_p76'}
            for i in z.infolist():
              parts=PurePosixPath(i.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          PY
          sha="$(sha256sum "$TARGET_ZIP" | awk '{print $1}')"
          test "${#sha}" = '64'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'filename=%s\nsize=1512294\nsha256=%s\nroot=kairos_p76/\nintegrity=PASS\n' "$TARGET_ZIP" "$sha" > candidate-proof.txt
          cat candidate-proof.txt
      - name: Upload exact candidate proof
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_METADATA_PORT_CANDIDATE_PROOF_${{ steps.proof.outputs.sha }}
          path: candidate-proof.txt
          if-no-files-found: error
      - name: Remove temporary proof helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous'
          git config user.email 'kairos-autonomous@users.noreply.github.com'
          git rm .github/workflows/live-market-universe-instrument-metadata-acquisition-port-candidate-proof.yml
          git commit -m 'cleanup: remove metadata port candidate proof helper'
          git push origin HEAD:main
