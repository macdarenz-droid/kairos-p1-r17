name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /app/
          sparse-checkout-cone-mode: false

      - name: Changes stay inside app/
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin ${{ github.event.pull_request.base.sha }}
          bad=$(git diff --no-renames --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep -vE '^(app/|CLAUDE[.]md$|README[.]md$|[.]ignore$|[.]gitignore$|[.]github/workflows/ci[.]yml$|[.]claude/)' || true)
          if [ -n "$bad" ]; then echo "Files outside app/ changed:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run build

  e2e:
    name: real-app smoke (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /app/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
