name: Kairos Home Dashboard Live Crypto Bubble Browser Pixel Radius Hook Composition Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify browser pixel-radius hook composition from Gate378 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          PATCH="$RUNNER_TEMP/home-bubble-browser-pixel-radius-hook-composition.patch"
          WORK="$RUNNER_TEMP/home-bubble-browser-pixel-radius-hook-composition-work"
          BASE="$RUNNER_TEMP/home-bubble-browser-pixel-radius-hook-composition-base"

          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1755402"
          echo "5590d98e7b4beafc594e226bbd97254e825fa130a8e05081042388a626a967ee  $BASE_ZIP" | sha256sum -c -

          cat > "$RUNNER_TEMP/patch.b64" <<'PATCH64'
          
          PATCH64
          sed -i 's/^          //' "$RUNNER_TEMP/patch.b64"
          base64 -d "$RUNNER_TEMP/patch.b64" | gzip -dc > "$PATCH"
          test "$(stat -c%s "$PATCH")" = "14912"
          test "$(git hash-object "$PATCH")" = "d1134b003600c2304fa75d735e86d97ce7598ed9"
          echo "04a236613f5363b402deefd3fd2185bc383598bc11841ac62b246e248c5949dd  $PATCH" | sha256sum -c -

          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactPixelRadiusViewModel.ts"
          test -f "$ROOT/src/app/homeDashboardLiveCryptoBubbleBrowserWallClock.ts"
          test ! -e "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleBrowserPixelRadiusViewModel.ts"
          test ! -e "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md"

          cd "$ROOT"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check --no-index "$BASE/kairos_p76" "$ROOT" || test "$?" = "1"

          python - <<'PY_SCOPE'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'; work=Path(os.environ['WORK'])/'kairos_p76'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.mjs',
            'src/app/useHomeDashboardLiveCryptoBubbleBrowserPixelRadiusViewModel.ts',
            'tests/home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          assert not (set(x)-set(y)), f'unexpected removals: {sorted(set(x)-set(y))}'
          PY_SCOPE

          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation
          npm run verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation
          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          const required=[
            'verify:home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-pixel-radius-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-pixel-radius-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-wall-clock-sources-foundation',
            'verify:home-dashboard-live-crypto-bubble-pixel-radius-policy-contract-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1'
          ];
          for(const name of required) if(!scripts.includes(name)){console.error('Missing '+name);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY_CLEAN'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'; work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.mjs',
            'src/app/useHomeDashboardLiveCryptoBubbleBrowserPixelRadiusViewModel.ts',
            'tests/home-dashboard-live-crypto-bubble-browser-pixel-radius-hook-composition-foundation.test.ts',
          }
          assert changed==expected
          assert not (set(x)-set(y))
          PY_CLEAN

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY_ZIP'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY_ZIP
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          BASE: ${{ runner.temp }}/home-bubble-browser-pixel-radius-hook-composition-base
          WORK: ${{ runner.temp }}/home-bubble-browser-pixel-radius-hook-composition-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE
          path: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git pull --rebase origin main
          git add KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_PIXEL_RADIUS_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add browser pixel-radius hook composition foundation'
          git push origin HEAD:main
