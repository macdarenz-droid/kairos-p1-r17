name: Kairos Home Dashboard Live Crypto Bubble Browser Radius Scale Hook Composition Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify browser radius-scale hook composition from Gate366 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_REACT_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          WORK="$RUNNER_TEMP/home-bubble-browser-radius-scale-hook-composition-work"
          BASE="$RUNNER_TEMP/home-bubble-browser-radius-scale-hook-composition-base"

          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1703684"
          echo "7a117e395785cb6abadf28473eb6a600071df509d8613727765bfbca950435b1  $BASE_ZIP" | sha256sum -c -

          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel.ts"
          test -f "$ROOT/src/app/homeDashboardLiveCryptoBubbleBrowserWallClock.ts"
          test ! -e "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel.ts"
          test ! -e "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md"
          grep -Fq 'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation' "$ROOT/package.json"

          cat > "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md" <<'EOF'
          # KAIROS Home Dashboard Live Crypto Bubble Browser Radius-Scale Hook Composition Foundation Report

          Date: 2026-09-11
          Base: canonical Gate366 Home Live Crypto Bubble React radius-scale hook composition foundation.

          ## Responsibility

          This candidate adds one thin browser-specific React composition seam immediately above Gate366. `useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel(...)` accepts one exact caller-owned `HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions` reference, injects the already released Gate358 browser observation-time and freshness-evaluation-time sources unchanged into Gate366, and returns the exact Gate366 radius-scale view-model result unchanged.

          ## Semantics

          - Gate358 remains the concrete browser wall-clock owner; this seam performs no current-time read itself.
          - Gate366 remains the React radius-scale hook owner and is called exactly once per render.
          - The exact caller-owned runtime-options reference is forwarded unchanged.
          - The exact Gate366 result is returned without cloning, filtering, sorting, reinterpreting or retaining a second state owner.
          - No provider, universe, product-policy, freshness, radius arithmetic, pixel geometry or visible rendering rule is added here.

          ## Ownership / non-scope

          This seam owns no state/effect/memo/cache, Date/time implementation, timers, provider transport, acquisition/retry, universe/ranking/Top-N/stablecoin policy, movement/freshness policy, Decimal or radius arithmetic, pixel min/max radius, viewport/collision/layout, labels, palette/theme/CSS/motion, HomeRoute, persistence or Your Trades truth.

          Live Crypto Bubble Map and Your Trades Bubble Map remain separate authoritative truth domains.

          ## Verification intent

          Dedicated regression proves the exact two Gate358 source-function references and exact caller options are passed once into Gate366, the exact Gate366 view model is returned, and rerenders do not introduce a second retained result owner. Static verification rejects state/effects, local clock reads, timers, provider/product logic, arithmetic, styling/DOM, route, persistence and Your Trades ownership.
          EOF
          sed -i 's/^          //' "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md"

          cat > "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel.ts" <<'EOF'
          import {
            readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs,
            readHomeDashboardLiveCryptoBubbleBrowserObservedAt,
          } from './homeDashboardLiveCryptoBubbleBrowserWallClock';
          import type { HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel } from './homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';
          import { useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel } from './useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';
          import type { HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions } from './useHomeDashboardLiveCryptoBubblePresentationObservedRuntime';

          /**
           * Browser-clock injection edge for the released Gate366 radius-scale hook.
           * Owns no clock implementation, state, provider/product policy, geometry or route behavior.
           */
          export function useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel(
            options: HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions,
          ): HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel {
            return useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(
              readHomeDashboardLiveCryptoBubbleBrowserObservedAt,
              readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs,
              options,
            );
          }
          EOF
          sed -i 's/^          //' "$ROOT/src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel.ts"

          cat > "$ROOT/tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts" <<'EOF'
          import { beforeEach, describe, expect, it, vi } from 'vitest';
          import { renderHook } from '@testing-library/react';
          import type { HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel } from '../src/app/homeDashboardLiveCryptoBubbleReactRadiusScaleViewModel';

          const mocks = vi.hoisted(() => ({
            useReactRadiusScaleViewModel: vi.fn(),
          }));

          vi.mock('../src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel', async (importOriginal) => {
            const actual = await importOriginal<typeof import('../src/app/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel')>();
            return {
              ...actual,
              useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel: mocks.useReactRadiusScaleViewModel,
            };
          });

          import {
            readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs,
            readHomeDashboardLiveCryptoBubbleBrowserObservedAt,
          } from '../src/app/homeDashboardLiveCryptoBubbleBrowserWallClock';
          import { useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel } from '../src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel';

          function viewModel(marker: string): HomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel {
            return {
              areaWeightViewModel: { marker: `area-${marker}` },
              runtimeState: { marker: `runtime-${marker}` },
              radiusScaleProjection: { marker: `radius-${marker}` },
            } as never;
          }

          describe('Home Dashboard Live Crypto Bubble browser radius-scale hook composition foundation', () => {
            beforeEach(() => {
              mocks.useReactRadiusScaleViewModel.mockReset();
            });

            it('injects the exact released Gate358 browser clock sources and caller options into Gate366 once', () => {
              const options = {
                universe: { excludedStablecoinBaseAssets: new Set(['USDC']) },
                presentationPolicy: { neutralMaxAbsoluteMovementPercent: '0.25' },
              } as never;
              const expected = viewModel('exact');
              mocks.useReactRadiusScaleViewModel.mockReturnValue(expected);

              const { result } = renderHook(() => useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel(options));

              expect(mocks.useReactRadiusScaleViewModel).toHaveBeenCalledTimes(1);
              expect(mocks.useReactRadiusScaleViewModel).toHaveBeenCalledWith(
                readHomeDashboardLiveCryptoBubbleBrowserObservedAt,
                readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs,
                options,
              );
              expect(result.current).toBe(expected);
            });

            it('returns the exact released Gate366 result unchanged', () => {
              const options = { universe: {}, presentationPolicy: {} } as never;
              const expected = viewModel('unchanged');
              mocks.useReactRadiusScaleViewModel.mockReturnValue(expected);

              const { result } = renderHook(() => useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel(options));

              expect(result.current).toBe(expected);
            });

            it('does not retain a second browser radius-scale result owner across rerenders', () => {
              const options = { universe: {}, presentationPolicy: {} } as never;
              const first = viewModel('first');
              const second = viewModel('second');
              mocks.useReactRadiusScaleViewModel.mockReturnValueOnce(first).mockReturnValueOnce(second);

              const { result, rerender } = renderHook(() => useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel(options));
              expect(result.current).toBe(first);
              rerender();
              expect(mocks.useReactRadiusScaleViewModel).toHaveBeenCalledTimes(2);
              expect(result.current).toBe(second);
            });
          });
          EOF
          sed -i 's/^          //' "$ROOT/tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts"

          cat > "$ROOT/scripts/verify-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.mjs" <<'EOF'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel.ts', 'utf8');
          const test = readFileSync('tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts', 'utf8');
          const report = readFileSync('KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md', 'utf8');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));

          for (const token of [
            'useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel',
            'readHomeDashboardLiveCryptoBubbleBrowserObservedAt',
            'readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs',
            'useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel(',
            'options: HomeDashboardLiveCryptoBubbleReactRuntimeBindingOptions',
          ]) {
            if (!source.includes(token)) throw new Error(`Browser radius-scale hook evidence missing: ${token}`);
          }

          if ((source.match(/useHomeDashboardLiveCryptoBubbleReactRadiusScaleViewModel\(/g) ?? []).length !== 1) {
            throw new Error('Browser radius-scale hook must delegate to Gate366 exactly once');
          }
          if (!source.includes('readHomeDashboardLiveCryptoBubbleBrowserObservedAt,\n    readHomeDashboardLiveCryptoBubbleBrowserEvaluationTimeMs,\n    options,')) {
            throw new Error('Browser radius-scale hook must forward exact Gate358 sources and exact options in order');
          }

          for (const forbidden of [
            'useEffect', 'useState', 'useMemo', 'useRef', 'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(',
            'fetch(', 'XMLHttpRequest', 'WebSocket(', 'startBinanceHomeDashboard', '.sort(', '.filter(', '.reverse(',
            'decimalAdd(', 'decimalSubtract(', 'decimalMultiply(', 'decimalDivide(', 'parseDecimalString(',
            'Math.sqrt(', 'Math.pow(', 'radiusScale =', 'minRadius', 'maxRadius', 'borderRadius',
            'className=', '<div', '<svg', 'HomeRoute', 'indexedDB', 'YourTrades',
          ]) {
            if (source.includes(forbidden)) throw new Error(`Browser radius-scale hook broadened ownership: ${forbidden}`);
          }

          for (const token of [
            'injects the exact released Gate358 browser clock sources and caller options into Gate366 once',
            'returns the exact released Gate366 result unchanged',
            'does not retain a second browser radius-scale result owner across rerenders',
          ]) {
            if (!test.includes(token)) throw new Error(`Missing browser radius-scale hook regression: ${token}`);
          }

          for (const token of [
            'thin browser-specific React composition seam',
            'Gate358 remains the concrete browser wall-clock owner',
            'exact caller-owned runtime-options reference is forwarded unchanged',
            'Live Crypto Bubble Map and Your Trades Bubble Map remain separate authoritative truth domains',
          ]) {
            if (!report.includes(token)) throw new Error(`Browser radius-scale hook report evidence missing: ${token}`);
          }

          const verifyName = 'verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation';
          if (pkg.scripts?.[verifyName] !== 'node scripts/verify-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.mjs') {
            throw new Error('Browser radius-scale hook verifier registration mismatch');
          }

          console.log('PASS: browser radius-scale hook injects released Gate358 clocks into Gate366 without adding state, market policy, pixels, or route truth.');
          EOF
          sed -i 's/^          //' "$ROOT/scripts/verify-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.mjs"

          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['ROOT'])/'package.json'
          s=p.read_text()
          needle='    "verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation": "node scripts/verify-home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.mjs"'
          replacement=needle+',\n    "verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation": "node scripts/verify-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.mjs"'
          assert s.count(needle)==1, 'expected Gate366 verifier registration exactly once'
          p.write_text(s.replace(needle,replacement))
          PY

          cd "$ROOT"
          git diff --check --no-index "$BASE/kairos_p76" "$ROOT" || test "$?" = "1"

          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-area-weight-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation

          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-radius-scale-projection-foundation.test.ts \
            tests/router.test.tsx
          npm test

          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(pkg.scripts||{}).filter((x)=>x.startsWith('verify:')).sort();
          const required=[
            'verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-area-weight-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-area-weight-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation',
            'verify:p21:1-home-dashboard-route-ownership-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1'
          ];
          for(const name of required) if(!scripts.includes(name)){console.error('Missing '+name);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_REPORT_2026-09-11.md',
            'package.json',
            'scripts/verify-home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.mjs',
            'src/app/useHomeDashboardLiveCryptoBubbleBrowserRadiusScaleViewModel.ts',
            'tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          assert not (set(x)-set(y)), f'unexpected removals: {sorted(set(x)-set(y))}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          ROOT: ${{ runner.temp }}/home-bubble-browser-radius-scale-hook-composition-work/kairos_p76
          BASE: ${{ runner.temp }}/home-bubble-browser-radius-scale-hook-composition-base
          WORK: ${{ runner.temp }}/home-bubble-browser-radius-scale-hook-composition-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_CANDIDATE
          path: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git pull --rebase origin main
          git add KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_BROWSER_RADIUS_SCALE_HOOK_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Home Bubble browser radius-scale hook composition'
          git push origin HEAD:main
