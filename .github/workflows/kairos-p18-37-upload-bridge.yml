name: Kairos Temporary Binary Candidate Upload Bridge

on:
  push:
    branches: [main]
    paths:
      - '.kairos-bridge/p18_37/READY'

permissions:
  contents: write

jobs:
  upload-p18-37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and prove P18.37 candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE='KAIROS_P18_36_CHART_DRAWING_COLLECTION_PROJECTION_CANDIDATE_2026-09-05.zip'
          CANDIDATE='KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip'
          EXPECTED_SHA='db6fe4d6fd5b169f8f7273a73c43f9493e4b3fcbe9e0aad3199db7999a986b60'
          rm -rf .bridge-work "$CANDIDATE"
          mkdir -p .bridge-work
          unzip -q "$BASE" -d .bridge-work
          ROOT='.bridge-work/kairos_p76'
          test -f "$ROOT/package.json"
          cp .kairos-bridge/p18_37/production.ts "$ROOT/src/features/chart/chartDrawingCollectionPresentationCoordination.ts"
          cp .kairos-bridge/p18_37/verifier.mjs "$ROOT/scripts/verify-p18-37-chart-drawing-collection-presentation-coordination.mjs"
          cp .kairos-bridge/p18_37/test.ts "$ROOT/tests/chart-drawing-collection-presentation-coordination.test.ts"
          cp .kairos-bridge/p18_37/report.md "$ROOT/KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_REPORT_2026-09-05.md"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.bridge-work/kairos_p76')
          p=root/'package.json'
          data=json.loads(p.read_text())
          data.setdefault('scripts',{})['verify:p18:37-chart-drawing-collection-presentation-coordination']='node scripts/verify-p18-37-chart-drawing-collection-presentation-coordination.mjs'
          p.write_text(json.dumps(data,indent=2)+'\n')
          idx=root/'src/features/chart/index.ts'
          idx.write_text(idx.read_text()+"export { replaceChartDrawingPresentationFromCollection } from './chartDrawingCollectionPresentationCoordination';\n")
          PY
          (cd "$ROOT" && npm run verify:p18:37-chart-drawing-collection-presentation-coordination)
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          root=Path('.bridge-work/kairos_p76')
          out=Path('KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip')
          with ZipFile(out,'w',compression=ZIP_STORED) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel='kairos_p76/'+p.relative_to(root).as_posix()
                  info=ZipInfo(rel,date_time=(2026,9,5,0,0,0))
                  info.compress_type=ZIP_STORED
                  info.create_system=3
                  info.external_attr=(0o100644 << 16)
                  z.writestr(info,p.read_bytes())
          PY
          echo "$EXPECTED_SHA  $CANDIDATE" | sha256sum -c -
          unzip -tq "$CANDIDATE"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, shutil, sys, tempfile
          base=Path('KAIROS_P18_36_CHART_DRAWING_COLLECTION_PROJECTION_CANDIDATE_2026-09-05.zip')
          cand=Path('KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip')
          with tempfile.TemporaryDirectory() as td:
              td=Path(td); b=td/'b'; c=td/'c'; b.mkdir(); c.mkdir()
              with ZipFile(base) as z: z.extractall(b)
              with ZipFile(cand) as z: z.extractall(c)
              b=b/'kairos_p76'; c=c/'kairos_p76'
              def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
              x={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
              y={str(p.relative_to(c)):h(p) for p in c.rglob('*') if p.is_file()}
              changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
              expected={
                'KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_REPORT_2026-09-05.md',
                'package.json',
                'scripts/verify-p18-37-chart-drawing-collection-presentation-coordination.mjs',
                'src/features/chart/chartDrawingCollectionPresentationCoordination.ts',
                'src/features/chart/index.ts',
                'tests/chart-drawing-collection-presentation-coordination.test.ts',
              }
              print('\n'.join(sorted(changed)))
              if changed != expected:
                  print('P18.37 bridge exact scope mismatch',file=sys.stderr)
                  sys.exit(1)
          PY
      - name: Commit candidate and remove temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add KAIROS_P18_37_CHART_DRAWING_COLLECTION_PRESENTATION_COORDINATION_CANDIDATE_2026-09-05.zip
          git rm -r .kairos-bridge
          git rm .github/workflows/kairos-p18-37-upload-bridge.yml
          git commit -m 'Upload P18.37 chart drawing collection presentation coordination candidate'
          git push origin HEAD:main
