name: Kairos P20.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-p20-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
      PATCH_GZ_SHA256: 8adeb8b9a3a988280675cfa1df3c241de945097f66deb40af90c087868da8c05
      PATCH_SHA256: 960d85f15cfad6ca5c8c6c5495c0d612465ca3e00043276c3dfe51924afcaac6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct exact direct P20.2 delta from canonical P20.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20candidate /tmp/p20_2.patch /tmp/p20_2.patch.gz /tmp/p20_2.patch.gz.b64
          mkdir .p20candidate
          cat \
            .github/kairos-p20-2-direct/chunk-0.txt \
            .github/kairos-p20-2-direct/chunk-1.txt \
            .github/kairos-p20-2-direct/chunk-2.txt \
            .github/kairos-p20-2-direct/chunk-3.txt \
            .github/kairos-p20-2-direct/chunk-4.txt \
            > /tmp/p20_2.patch.gz.b64
          test "$(wc -c < /tmp/p20_2.patch.gz.b64 | tr -d ' ')" = "24384"
          base64 -d /tmp/p20_2.patch.gz.b64 > /tmp/p20_2.patch.gz
          echo "$PATCH_GZ_SHA256  /tmp/p20_2.patch.gz" | sha256sum -c -
          gunzip -c /tmp/p20_2.patch.gz > /tmp/p20_2.patch
          echo "$PATCH_SHA256  /tmp/p20_2.patch" | sha256sum -c -
          test "$(wc -c < /tmp/p20_2.patch | tr -d ' ')" = "98903"

          unzip -q "$BASE_ZIP" -d .p20candidate
          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
            git apply --check /tmp/p20_2.patch
            git apply /tmp/p20_2.patch
            CHANGED="$(git status --short | wc -l | tr -d ' ')"
            test "$CHANGED" = "35"
            git status --short
          )

      - name: Verify reconstructed P20.2 before packaging
        working-directory: .p20candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json')); const s=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const required of ['verify:p1','verify:p15:14-market-data-adapter-system-closure','verify:p16:18-crypto-live-feed-system-closure','verify:p17:16-chart-engine-system-closure','verify:p18:60-drawing-tools-system-closure','verify:p19:7-risk-reward-tool-system-closure','verify:p20:1-saved-analysis-contract-foundation','verify:p20:2-saved-analysis-persistence-foundation']) if(!s.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const x of s){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
          npm run verify:static

      - name: Restore clean package boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          test "$(cd "$ROOT" && git status --short | wc -l | tr -d ' ')" = "35"
          if find "$ROOT" -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vite \) -print -quit | grep -q .; then
            echo 'forbidden generated directory remains'
            exit 1
          fi
          rm -rf "$ROOT/.git"
          test ! -e "$ROOT/.git"

      - name: Package and commit P20.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | sed -n '1p' | cut -d/ -f1)" = "kairos_p76"
          if unzip -Z1 "$OUT_ZIP" | grep -Eq '(^|/)(node_modules|dist|coverage|\.vite|\.git)(/|$)|\.tsbuildinfo$'; then
            echo 'forbidden package residue detected'
            exit 1
          fi
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.2 Saved Analysis persistence foundation candidate'
          git push
