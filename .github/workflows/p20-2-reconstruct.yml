name: Kairos P20.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-p20-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
      PATCH_SOURCE_COMMIT: 7a113ee7febb53e1d04a1a6c7182099fcf5f3eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Recover and apply exact P20.2 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20base .p20candidate /tmp/p20_2.patch /tmp/p20_2.source.yml /tmp/p20_2.try.patch
          mkdir .p20base .p20candidate
          unzip -q "$BASE_ZIP" -d .p20base
          cp -a .p20base/. .p20candidate/

          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
          )

          git cat-file -e "$PATCH_SOURCE_COMMIT^{commit}"
          git show "$PATCH_SOURCE_COMMIT:.github/workflows/p20-2-reconstruct.yml" > /tmp/p20_2.source.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess

          source = Path('/tmp/p20_2.source.yml').read_text()
          marker = "cat > /tmp/p20_2.patch.b64 <<'PATCH64'"
          start = source.find(marker)
          if start < 0:
              raise SystemExit('PATCH64 start marker not found')
          start = source.find('\n', start) + 1
          if start <= 0:
              raise SystemExit('PATCH64 payload start newline not found')
          end_match = re.search(r'^\s*PATCH64\s*$', source[start:], re.M)
          raw = source[start:start + end_match.start()] if end_match else source[start:]
          b64chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          allowed = set(b64chars)
          compact = ''.join(ch for ch in raw if ch in allowed)
          print('PATCH64 recovery boundary=' + ('terminator' if end_match else 'EOF'))
          print(f'PATCH64 raw_chars={len(raw)} compact_chars={len(compact)} compact_modulo={len(compact) % 4}')

          # R8 exhaustively tried restoring one character at every position
          # evidenced by non-base64 formatting and found zero applyable patches.
          # The compact stream length is 22,713 (mod 4 = 1); a distinct possible
          # corruption class is exactly one extra base64 character. Test deletion
          # of each compact character. Accept only one uniquely proven candidate
          # that strict-decodes, is UTF-8 git patch text with exactly 31 file
          # headers, and passes git apply --check against exact P20.1 GOLDEN.
          root = Path('.p20candidate/kairos_p76').resolve()
          try_path = Path('/tmp/p20_2.try.patch')
          winners = []
          structural = 0
          for pos in range(len(compact)):
              candidate = compact[:pos] + compact[pos + 1:]
              padded = candidate + ('=' * ((-len(candidate)) % 4))
              try:
                  decoded = base64.b64decode(padded, validate=True)
                  text = decoded.decode('utf-8')
              except Exception:
                  continue
              if not text.startswith('diff --git '):
                  continue
              if text.count('diff --git ') != 31:
                  continue
              structural += 1
              try_path.write_bytes(decoded)
              check = subprocess.run(
                  ['git', 'apply', '--check', str(try_path)],
                  cwd=root,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if check.returncode == 0:
                  winners.append((pos, compact[pos], decoded))
                  print(f'candidate PASS delete_pos={pos} char={compact[pos]!r} bytes={len(decoded)} sha256={hashlib.sha256(decoded).hexdigest()}')

          print(f'PATCH64 deletion attempts={len(compact)} structural_candidates={structural} unique_applyable_candidates={len(winners)}')
          if len(winners) != 1:
              raise SystemExit(f'PATCH64 deletion recovery is not uniquely proven: winners={len(winners)}')
          pos, removed, decoded = winners[0]
          Path('/tmp/p20_2.patch').write_bytes(decoded)
          print(f'PATCH64 unique deletion pos={pos} removed={removed!r} patch_sha256={hashlib.sha256(decoded).hexdigest()}')
          PY
          test -s /tmp/p20_2.patch

          (
            cd "$ROOT"
            git apply --check /tmp/p20_2.patch
            git apply /tmp/p20_2.patch
            CHANGED="$(git status --short | wc -l | tr -d ' ')"
            test "$CHANGED" = "31"
            git status --short
          )

      - name: Verify reconstructed P20.2 before packaging
        working-directory: .p20candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run typecheck
          npm run build
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1
          npx vitest run

      - name: Restore clean package boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          test "$(cd "$ROOT" && git status --short | wc -l | tr -d ' ')" = "31"
          if find "$ROOT" -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vite \) -print -quit | grep -q .; then
            echo 'forbidden generated directory remains'
            exit 1
          fi

      - name: Package and commit P20.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.2 Saved Analysis persistence foundation candidate'
          git push
