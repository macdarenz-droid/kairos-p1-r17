name: Kairos P20.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-p20-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Recover and apply exact P20.2 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20base .p20candidate /tmp/p20_2.patch /tmp/p20_2.patch.b64
          mkdir .p20base .p20candidate
          unzip -q "$BASE_ZIP" -d .p20base
          cp -a .p20base/. .p20candidate/

          git show HEAD^:.github/workflows/p20-2-reconstruct.yml \
            | awk "/<<'PATCH64'/{flag=1;next} /^[[:space:]]*PATCH64[[:space:]]*$/{flag=0} flag" \
            | tr -d '[:space:]' > /tmp/p20_2.patch.b64
          test -s /tmp/p20_2.patch.b64
          base64 -d /tmp/p20_2.patch.b64 > /tmp/p20_2.patch
          test -s /tmp/p20_2.patch

          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
            git apply --check /tmp/p20_2.patch
            git apply /tmp/p20_2.patch
            CHANGED="$(git status --short | wc -l | tr -d ' ')"
            test "$CHANGED" = "31"
            git status --short
          )

      - name: Verify reconstructed P20.2 before packaging
        working-directory: .p20candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run typecheck
          npm run build
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1
          npx vitest run

      - name: Restore clean package boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          test "$(cd "$ROOT" && git status --short | wc -l | tr -d ' ')" = "31"
          if find "$ROOT" -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vite \) -print -quit | grep -q .; then
            echo 'forbidden generated directory remains'
            exit 1
          fi

      - name: Package and commit P20.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.2 Saved Analysis persistence foundation candidate'
          git push
