name: Kairos P20.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-p20-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
      PATCH_SOURCE_COMMIT: 7a113ee7febb53e1d04a1a6c7182099fcf5f3eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Recover and apply exact P20.2 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20base .p20candidate /tmp/p20_2.patch /tmp/p20_2.source.yml
          mkdir .p20base .p20candidate
          unzip -q "$BASE_ZIP" -d .p20base
          cp -a .p20base/. .p20candidate/

          git cat-file -e "$PATCH_SOURCE_COMMIT^{commit}"
          git show "$PATCH_SOURCE_COMMIT:.github/workflows/p20-2-reconstruct.yml" > /tmp/p20_2.source.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          text = Path('/tmp/p20_2.source.yml').read_text()
          marker = "cat > /tmp/p20_2.patch.b64 <<'PATCH64'"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('PATCH64 start marker not found')
          start = text.find('\n', start) + 1
          end_match = re.search(r'^\s*PATCH64\s*$', text[start:], re.M)
          if not end_match:
              raise SystemExit('PATCH64 end marker not found')

          raw = text[start:start + end_match.start()]
          # The original helper payload was embedded in YAML and acquired
          # formatting contamination. Recover only the base64 alphabet from
          # the exact bounded heredoc body, discard inherited '=' padding,
          # then restore canonical terminal padding. Safety is enforced below
          # by patch signature, git apply --check and exact 31-file scope.
          alphabet = ''.join(re.findall(r'[A-Za-z0-9+/]', raw))
          if not alphabet:
              raise SystemExit('PATCH64 contains no recoverable base64 payload')
          normalized = alphabet + ('=' * ((-len(alphabet)) % 4))
          removed = len(raw) - len(alphabet)
          print(f'PATCH64 raw_chars={len(raw)} normalized_alphabet={len(alphabet)} removed_formatting_chars={removed} modulo={len(alphabet) % 4}')

          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(f'PATCH64 normalized decode failed: {exc}')
          if not decoded.startswith(b'diff --git '):
              raise SystemExit('decoded payload is not a git patch')
          Path('/tmp/p20_2.patch').write_bytes(decoded)
          print(f'decoded patch bytes={len(decoded)} sha256={hashlib.sha256(decoded).hexdigest()}')
          PY
          test -s /tmp/p20_2.patch

          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
            git apply --check /tmp/p20_2.patch
            git apply /tmp/p20_2.patch
            CHANGED="$(git status --short | wc -l | tr -d ' ')"
            test "$CHANGED" = "31"
            git status --short
          )

      - name: Verify reconstructed P20.2 before packaging
        working-directory: .p20candidate/kairos_p76
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run typecheck
          npm run build
          npm run verify:p20:1-saved-analysis-contract-foundation
          npm run verify:p19:7-risk-reward-tool-system-closure
          npm run verify:p18:60-drawing-tools-system-closure
          npm run verify:p14:9-trade-visualizer-system-closure
          npm run verify:p11:calculation-brain-closure
          npm run verify:p1
          npx vitest run

      - name: Restore clean package boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          test "$(cd "$ROOT" && git status --short | wc -l | tr -d ' ')" = "31"
          if find "$ROOT" -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vite \) -print -quit | grep -q .; then
            echo 'forbidden generated directory remains'
            exit 1
          fi

      - name: Package and commit P20.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.2 Saved Analysis persistence foundation candidate'
          git push
