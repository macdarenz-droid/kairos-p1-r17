name: Kairos P20.2 Deterministic Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-2-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-p20-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_ZIP: KAIROS_P20_1_SAVED_ANALYSIS_CONTRACT_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
      EXPECTED_PATCH_SHA256: ff80815703fa53724ed6b8f0864c0aa1138f9439d890f4b58debe444ff8762f1
      EXPECTED_CHANGED: '39'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct owner-derived P20.2 from canonical P20.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20candidate /tmp/reconstruct-p20-2.py /tmp/p20_2.patch
          mkdir .p20candidate
          unzip -q "$BASE_ZIP" -d .p20candidate
          ROOT=.p20candidate/kairos_p76
          test -f "$ROOT/package.json"
          cat .github/kairos-p20-2-owner-derived/chunk-*.txt > /tmp/reconstruct-p20-2.py
          test "$(wc -l < /tmp/reconstruct-p20-2.py | tr -d ' ')" = "282"
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
            python3 /tmp/reconstruct-p20-2.py
            git add -A
            git diff --cached --check
            git diff --cached --binary > /tmp/p20_2.patch
            test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "$EXPECTED_CHANGED"
            python3 - <<'PY'
          from pathlib import Path
          expected = {
          'KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_REPORT_2026-09-06.md','package.json',
          'scripts/verify-p12-journal-history-status-index-backup-regression-repair.mjs','scripts/verify-p12-journal-history-status-index-verifier-compatibility-repair.mjs','scripts/verify-p12-journal-history-status-index.mjs','scripts/verify-p20-2-saved-analysis-persistence-foundation.mjs','scripts/verify-p5-database-kernel.mjs','scripts/verify-p5-transactions.mjs','scripts/verify-p6-backup-envelope.mjs','scripts/verify-p6-backup-snapshot.mjs','scripts/verify-p6-restore-replacement.mjs','scripts/verify-p9-trade-persistence.mjs',
          'src/data/backup/backupEnvelope.ts','src/data/backup/backupFormat.ts','src/data/backup/backupSerialization.ts','src/data/backup/backupSnapshot.ts','src/data/backup/backupValidation.ts','src/data/backup/restorePreflight.ts','src/data/backup/restoreReplacement.ts','src/data/backup/restoreVerification.ts','src/data/database/KairosDatabase.ts','src/data/database/index.ts','src/data/database/integrity.ts','src/data/database/migrations.ts','src/data/database/schema.ts','src/data/database/transactions.ts','src/data/repositories/SavedAnalysisRepository.ts','src/data/repositories/index.ts',
          'tests/backup-envelope.test.ts','tests/backup-snapshot.test.ts','tests/database-kernel.test.ts','tests/database-migrations.test.ts','tests/database-transactions.test.ts','tests/metadata-repository.test.ts','tests/restore-preflight.test.ts','tests/restore-replacement.test.ts','tests/restore-verification.test.ts','tests/saved-analysis-persistence.test.ts','tests/trade-persistence.test.ts'}
          actual=set(Path('/tmp/changed.txt').read_text().splitlines())
          if actual != expected:
              raise SystemExit(f'P20.2 exact scope mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          print(f'P20.2 exact scope verified: {len(actual)} files')
          PY
          )
        env:
          EXPECTED_CHANGED: '39'

      - name: Prove reconstructed patch identity and scope
        working-directory: .p20candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --name-only | sort > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "$EXPECTED_CHANGED"
          echo "$EXPECTED_PATCH_SHA256  /tmp/p20_2.patch" | sha256sum -c -
          git diff --cached --check
          cp /tmp/changed.txt /tmp/changed-final.txt

      - name: Verify reconstructed P20.2
        working-directory: .p20candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:2-saved-analysis-persistence-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json')); const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const required of ['verify:p1','verify:p15:14-market-data-adapter-system-closure','verify:p16:18-crypto-live-feed-system-closure','verify:p17:16-chart-engine-system-closure','verify:p18:60-drawing-tools-system-closure','verify:p19:7-risk-reward-tool-system-closure','verify:p20:1-saved-analysis-contract-foundation','verify:p20:2-saved-analysis-persistence-foundation']) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const x of scripts){console.log('\n=== '+x+' ===');const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
          npm run verify:static

      - name: Restore clean package boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          test "$(cd "$ROOT" && git diff --cached --name-only | wc -l | tr -d ' ')" = "$EXPECTED_CHANGED"
          rm -rf "$ROOT/.git"
          if find "$ROOT" -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vite -o -name .git \) -print -quit | grep -q .; then
            echo 'forbidden generated directory remains'
            exit 1
          fi

      - name: Package and commit P20.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | sed -n '1p' | cut -d/ -f1)" = "kairos_p76"
          if unzip -Z1 "$OUT_ZIP" | grep -Eq '(^|/)(node_modules|dist|coverage|\.vite|\.git)(/|$)|\.tsbuildinfo$'; then
            echo 'forbidden package residue detected'
            exit 1
          fi
          git config user.name 'kairos-autonomous-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_ZIP"
          git commit -m 'Build P20.2 Saved Analysis persistence foundation candidate'
          git push
