name: Kairos Binance Spot Browser Live Market Universe Acquisition Binding Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-spot-browser-live-market-universe-acquisition-binding-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-binance-spot-browser-live-market-universe-acquisition-binding-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct Binance browser universe acquisition binding candidate from Gate335 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_LIVE_MARKET_UNIVERSE_ACQUISITION_ORCHESTRATION_FOUNDATION_CANDIDATE_2026-09-09.zip
          OUT_ZIP=KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip
          WORK="$RUNNER_TEMP/binance-browser-universe-binding-work"
          BASE="$RUNNER_TEMP/binance-browser-universe-binding-base"
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          test -f "$BASE_ZIP"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          test -f "$WORK/kairos_p76/package.json"
          test -f "$BASE/kairos_p76/package.json"
          cd "$WORK/kairos_p76"

          test -f src/services/market-data/liveMarketUniverseAcquisitionOrchestration.ts
          test -f src/services/market-data/providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding.ts
          test -f src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding.ts
          test -f src/services/market-data/index.ts

          cat > src/services/market-data/providers/binance/binanceSpotBrowserLiveMarketUniverseAcquisitionBinding.ts <<'TS'
          import {
            acquireLiveMarketUniverseOnce,
            type LiveMarketUniverseAcquisitionOptions,
            type LiveMarketUniverseAcquisitionResult,
          } from '../../liveMarketUniverseAcquisitionOrchestration';
          import type { BinanceSpot24hPublicRestBaselineObservedAtSource } from './binanceSpot24hPublicRestBaselineAcquisitionAdapter';
          import { createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort } from './binanceSpot24hBrowserPublicRestBaselineAcquisitionBinding';
          import { createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort } from './binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding';

          /**
           * Binance Spot browser-ready dependency binding for the released provider-neutral
           * one-shot Live Market Universe acquisition orchestration. The lower browser
           * acquisition bindings keep transport/mapping ownership; Gate335 keeps universe
           * orchestration/policy delegation; observation time remains caller-owned.
           */
          export function acquireBinanceSpotBrowserLiveMarketUniverseOnce(
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
            options: LiveMarketUniverseAcquisitionOptions,
          ): Promise<LiveMarketUniverseAcquisitionResult> {
            return acquireLiveMarketUniverseOnce(
              createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort(),
              createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt),
              options,
            );
          }
          TS

          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/services/market-data/index.ts')
          s=p.read_text()
          anchor="export * from './providers/binance/binanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionBinding';\n"
          line="export * from './providers/binance/binanceSpotBrowserLiveMarketUniverseAcquisitionBinding';\n"
          assert anchor in s, 'Gate335 Binance metadata browser binding export boundary missing'
          assert line not in s, 'unexpected pre-existing Binance browser universe acquisition binding export'
          p.write_text(s.replace(anchor, anchor+line, 1))

          p=Path('package.json')
          d=json.loads(p.read_text())
          key='verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation'
          assert key not in d['scripts'], 'unexpected pre-existing Binance browser universe acquisition binding verifier'
          scripts={}
          inserted=False
          for k,v in d['scripts'].items():
              scripts[k]=v
              if k=='verify:live-market-universe-acquisition-orchestration-foundation':
                  scripts[key]='node scripts/verify-binance-spot-browser-live-market-universe-acquisition-binding-foundation.mjs'
                  inserted=True
          assert inserted, 'Gate335 universe acquisition verifier registration boundary missing'
          d['scripts']=scripts
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

          cat > tests/binance-spot-browser-live-market-universe-acquisition-binding-foundation.test.ts <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { acquireBinanceSpotBrowserLiveMarketUniverseOnce } from '../src/services/market-data';

          const originalFetch = globalThis.fetch;
          const observedAt = '2026-09-09T17:00:00.000Z';
          const exchangeInfoPayload = JSON.stringify({ symbols: [
            { symbol: 'BTCUSDT', status: 'TRADING', baseAsset: 'BTC', quoteAsset: 'USDT' },
            { symbol: 'USDCUSDT', status: 'TRADING', baseAsset: 'USDC', quoteAsset: 'USDT' },
            { symbol: 'SOLUSDT', status: 'BREAK', baseAsset: 'SOL', quoteAsset: 'USDT' },
            { symbol: 'ETHFDUSD', status: 'TRADING', baseAsset: 'ETH', quoteAsset: 'FDUSD' },
          ] });
          const btc24hPayload = JSON.stringify({
            symbol: 'BTCUSDT', openPrice: '62000', highPrice: '65000', lowPrice: '61000',
            lastPrice: '64000', volume: '1234', quoteVolume: '78000000', closeTime: 1770000000000,
          });

          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.restoreAllMocks();
          });

          describe('Binance Spot browser Live Market Universe acquisition binding foundation', () => {
            it('composes the released browser metadata and baseline ports through Gate335 without duplicating universe policy', async () => {
              const fetchMock = vi.fn(async (input: RequestInfo | URL) => {
                const url = String(input);
                if (url.includes('/api/v3/exchangeInfo')) return { text: async () => exchangeInfoPayload };
                if (url.includes('/api/v3/ticker/24hr')) return { text: async () => btc24hPayload };
                throw new Error(`unexpected URL: ${url}`);
              });
              globalThis.fetch = fetchMock as unknown as typeof fetch;
              const readObservedAt = vi.fn(() => observedAt);

              await expect(acquireBinanceSpotBrowserLiveMarketUniverseOnce(readObservedAt, {
                excludedStablecoinBaseAssets: new Set(['USDC']),
                topNCount: 1,
              })).resolves.toEqual({
                ok: true,
                instruments: [{ venue: 'binance-spot', symbol: 'BTCUSDT' }],
              });
              expect(fetchMock).toHaveBeenCalledTimes(2);
              expect(readObservedAt).toHaveBeenCalledTimes(1);
            });

            it('forwards the exact caller-owned AbortSignal through both released browser acquisition chains', async () => {
              const controller = new AbortController();
              const capturedSignals: Array<AbortSignal | null | undefined> = [];
              const fetchMock = vi.fn(async (input: RequestInfo | URL, init?: RequestInit) => {
                capturedSignals.push(init?.signal);
                const url = String(input);
                if (url.includes('/api/v3/exchangeInfo')) return { text: async () => JSON.stringify({ symbols: [
                  { symbol: 'BTCUSDT', status: 'TRADING', baseAsset: 'BTC', quoteAsset: 'USDT' },
                ] }) };
                if (url.includes('/api/v3/ticker/24hr')) return { text: async () => btc24hPayload };
                throw new Error(`unexpected URL: ${url}`);
              });
              globalThis.fetch = fetchMock as unknown as typeof fetch;

              await expect(acquireBinanceSpotBrowserLiveMarketUniverseOnce(() => observedAt, {
                excludedStablecoinBaseAssets: new Set(),
                signal: controller.signal,
              })).resolves.toMatchObject({ ok: true });
              expect(capturedSignals).toEqual([controller.signal, controller.signal]);
            });

            it('preserves Gate335 metadata acquisition failure and does not call the baseline browser chain', async () => {
              const fetchMock = vi.fn(async (input: RequestInfo | URL) => {
                if (String(input).includes('/api/v3/exchangeInfo')) throw new Error('metadata-native-failure');
                throw new Error('baseline must not run');
              });
              globalThis.fetch = fetchMock as unknown as typeof fetch;
              const readObservedAt = vi.fn(() => observedAt);

              await expect(acquireBinanceSpotBrowserLiveMarketUniverseOnce(readObservedAt, {
                excludedStablecoinBaseAssets: new Set(),
              })).resolves.toEqual({ ok: false, reason: 'acquisition-failed' });
              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(readObservedAt).not.toHaveBeenCalled();
            });

            it('preserves Gate335 empty eligible-scope short circuit without baseline request or observation time', async () => {
              const fetchMock = vi.fn(async () => ({ text: async () => JSON.stringify({ symbols: [
                { symbol: 'USDCUSDT', status: 'TRADING', baseAsset: 'USDC', quoteAsset: 'USDT' },
              ] }) }));
              globalThis.fetch = fetchMock as unknown as typeof fetch;
              const readObservedAt = vi.fn(() => observedAt);

              await expect(acquireBinanceSpotBrowserLiveMarketUniverseOnce(readObservedAt, {
                excludedStablecoinBaseAssets: new Set(['USDC']),
              })).resolves.toEqual({ ok: true, instruments: [] });
              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(readObservedAt).not.toHaveBeenCalled();
            });

            it('preserves Gate335 baseline acquisition failure unchanged', async () => {
              const fetchMock = vi.fn(async (input: RequestInfo | URL) => {
                const url = String(input);
                if (url.includes('/api/v3/exchangeInfo')) return { text: async () => JSON.stringify({ symbols: [
                  { symbol: 'BTCUSDT', status: 'TRADING', baseAsset: 'BTC', quoteAsset: 'USDT' },
                ] }) };
                if (url.includes('/api/v3/ticker/24hr')) throw new Error('baseline-native-failure');
                throw new Error(`unexpected URL: ${url}`);
              });
              globalThis.fetch = fetchMock as unknown as typeof fetch;

              await expect(acquireBinanceSpotBrowserLiveMarketUniverseOnce(() => observedAt, {
                excludedStablecoinBaseAssets: new Set(),
              })).resolves.toEqual({ ok: false, reason: 'acquisition-failed' });
              expect(fetchMock).toHaveBeenCalledTimes(2);
            });
          });
          TS

          cat > scripts/verify-binance-spot-browser-live-market-universe-acquisition-binding-foundation.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpotBrowserLiveMarketUniverseAcquisitionBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md', import.meta.url), 'utf8');

          for (const token of [
            'acquireLiveMarketUniverseOnce',
            'LiveMarketUniverseAcquisitionOptions',
            'LiveMarketUniverseAcquisitionResult',
            'BinanceSpot24hPublicRestBaselineObservedAtSource',
            'createBinanceSpotExchangeInfoBrowserInstrumentMetadataAcquisitionPort()',
            'createBinanceSpot24hBrowserPublicRestBaselineAcquisitionPort(readObservedAt)',
            'options,',
          ]) if (!source.includes(token)) throw new Error(`Binance browser universe binding evidence missing: ${token}`);

          if (!index.includes("export * from './providers/binance/binanceSpotBrowserLiveMarketUniverseAcquisitionBinding';")) {
            throw new Error('Binance browser universe acquisition binding public export missing');
          }

          for (const forbidden of [
            "quoteAsset === 'USDT'", 'tradingEnabled', 'quoteVolume24h', '.sort(', '.slice(',
            'DEFAULT_LIVE_MARKET_UNIVERSE_TOP_N_COUNT', '= 30', 'JSON.parse(', 'setInterval(',
            'setTimeout(', 'Date.now(', 'new Date(', 'indexedDB', 'createChart(', 'React',
            'useEffect', 'bubbleSize', 'marketCap', 'retry', 'WebSocket(',
          ]) if (source.includes(forbidden)) throw new Error(`Binance browser universe binding duplicated/broadened ownership: ${forbidden}`);

          for (const token of [
            'Binance Spot browser Live Market Universe acquisition binding',
            'Gate335 one-shot provider-neutral orchestration',
            'browser-ready metadata acquisition port',
            'browser-ready baseline acquisition port',
            'caller-owned readObservedAt',
            'caller-owned options and AbortSignal',
            'No universe-policy duplication',
            'No freshness/cadence/lifecycle ownership',
            'No state/session/persistence ownership',
            'No React/Home/Bubble presentation ownership',
          ]) if (!report.includes(token)) throw new Error(`Binance browser universe binding report evidence missing: ${token}`);

          console.log('Binance Spot browser Live Market Universe acquisition binding verification passed.');
          JS

          cat > KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md <<'MD'
          # KAIROS Binance Spot Browser Live Market Universe Acquisition Binding Foundation

          Base: exact canonical Gate #335 GOLDEN Live Market Universe acquisition-orchestration candidate.

          This slice owns one Binance Spot browser Live Market Universe acquisition binding responsibility only. It composes the already-released browser-ready metadata acquisition port from the Binance Spot exchangeInfo chain, the already-released browser-ready baseline acquisition port from the Binance Spot 24h chain, and Gate335 one-shot provider-neutral orchestration.

          The binding creates the two released concrete Binance browser ports and delegates them unchanged to `acquireLiveMarketUniverseOnce(...)`. The caller-owned readObservedAt source and caller-owned options and AbortSignal remain upstream inputs. `readObservedAt` is passed only to the released baseline browser binding. Gate335 options, including stablecoin-exclusion configuration and optional Top-N count, are passed unchanged to Gate335. The returned Gate335 result is returned unchanged.

          Ownership constraints:
          - No universe-policy duplication: active/exact-USDT/stablecoin eligibility, quote-volume ordering, symbol tie-break and Top-N remain released policy/composition owners.
          - No provider request/transport/decode/mapping changes: the existing Binance browser metadata and 24h baseline chains remain authoritative.
          - No observation-time or freshness ownership: `readObservedAt` stays caller-owned and existing lower boundaries continue to stamp authoritative facts.
          - No freshness/cadence/lifecycle ownership: no visibility, timers, 5-second cadence, polling, retry or race semantics.
          - No state/session/persistence ownership.
          - No React/Home/Bubble presentation ownership.
          - No Your Trades/journal/chart/navigation/transitions ownership.

          Verification covers successful end-to-end dependency composition through mocked browser fetch, exact caller AbortSignal propagation across both lower browser acquisition chains, metadata failure short circuit, empty eligible-scope short circuit without baseline/observedAt use, baseline failure preservation, exact public export, exact controlled file scope, production typecheck/build, full unit regression and all registered verifier regressions.
          MD

          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run typecheck
          npm run build
          npm run verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation
          npm run verify:live-market-universe-acquisition-orchestration-foundation
          npm run verify:p21:binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation
          npm run verify:p21:15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation
          npm run verify:live-market-universe-instrument-eligibility-policy-foundation
          npm run verify:live-market-universe-composition-foundation

          npx vitest run \
            tests/binance-spot-browser-live-market-universe-acquisition-binding-foundation.test.ts \
            tests/live-market-universe-acquisition-orchestration-foundation.test.ts \
            tests/binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding.test.ts \
            tests/binance-spot-24h-browser-public-rest-baseline-acquisition-binding.test.ts \
            tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts \
            tests/live-market-universe-composition-foundation.test.ts

          npm test

          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:binance-spot-browser-live-market-universe-acquisition-binding-foundation',
            'verify:live-market-universe-acquisition-orchestration-foundation',
            'verify:p21:binance-spot-exchange-info-browser-instrument-metadata-acquisition-binding-foundation',
            'verify:p21:15-binance-spot-24h-browser-public-rest-baseline-acquisition-binding-foundation',
            'verify:live-market-universe-composition-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){ const r=spawnSync('npm',['run',name],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          cd "$WORK"
          python - <<'PY'
          from pathlib import Path
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          root=Path('kairos_p76')
          assert root.is_dir()
          for p in root.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden package residue: {p}'
            assert not p.name.endswith('.tsbuildinfo'), f'tsbuildinfo residue: {p}'
            assert not p.name.endswith('.log'), f'log residue: {p}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          test -f "$RUNNER_TEMP/$OUT_ZIP"

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          base=Path(os.environ['RUNNER_TEMP'])/'binance-browser-universe-binding-base'/'kairos_p76'
          work=Path(os.environ['RUNNER_TEMP'])/'binance-browser-universe-binding-work'/'kairos_p76'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-binance-spot-browser-live-market-universe-acquisition-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpotBrowserLiveMarketUniverseAcquisitionBinding.ts',
            'tests/binance-spot-browser-live-market-universe-acquisition-binding-foundation.test.ts',
          }
          assert changed==expected, f'exact candidate scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              parts=PurePosixPath(i.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY

          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_CANDIDATE
          path: KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add KAIROS_BINANCE_SPOT_BROWSER_LIVE_MARKET_UNIVERSE_ACQUISITION_BINDING_FOUNDATION_CANDIDATE_2026-09-09.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Binance browser universe acquisition binding'
          git push origin HEAD:main
