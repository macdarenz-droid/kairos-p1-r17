name: Kairos P20.3 Deterministic Reconstruction Bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p20-3-reconstruct.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct-p20-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_ZIP: KAIROS_P20_2_SAVED_ANALYSIS_PERSISTENCE_FOUNDATION_CANDIDATE_2026-09-06.zip
      OUT_ZIP: KAIROS_P20_3_SAVED_ANALYSIS_APPLICATION_SAVE_ORCHESTRATION_CANDIDATE_2026-09-07.zip
      EXPECTED_PATCH_SHA256: faa5063502f3c255cc064fb0e23cb88be9906ee1914e8c290642dd202501a721
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install -g npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Reconstruct exact P20.3 from canonical P20.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p20candidate /tmp/p20_3.patch /tmp/changed.txt
          mkdir .p20candidate
          unzip -q "$BASE_ZIP" -d .p20candidate
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root=Path('.p20candidate/kairos_p76')
          files={
            'src/application/saved-analysis/saveSavedAnalysis.ts': '',
            'src/application/saved-analysis/index.ts': 'ZXhwb3J0ICogZnJvbSAnLi9zYXZlU2F2ZWRBbmFseXNpcyc7Cg==',
            'tests/saved-analysis-save-command.test.ts': '',
            'scripts/verify-p20-3-saved-analysis-application-save.mjs': '',
            'KAIROS_P20_3_SAVED_ANALYSIS_APPLICATION_SAVE_ORCHESTRATION_REPORT_2026-09-07.md': '',
          }
          for rel,data in files.items():
              p=root/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(data))
          p=root/'package.json'
          s=p.read_text()
          old='"verify:p20:2-saved-analysis-persistence-foundation": "node scripts/verify-p20-2-saved-analysis-persistence-foundation.mjs"'
          new=old+',\n    "verify:p20:3-saved-analysis-application-save": "node scripts/verify-p20-3-saved-analysis-application-save.mjs"'
          if old not in s or 'verify:p20:3-saved-analysis-application-save' in s: raise SystemExit('package script anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          ROOT=.p20candidate/kairos_p76
          (
            cd "$ROOT"
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm reconstructed
          )
          rm -rf .p20baseline
          mkdir .p20baseline
          unzip -q "$BASE_ZIP" -d .p20baseline
          (
            cd .p20baseline/kairos_p76
            git init -q
            git config user.name kairos-helper
            git config user.email actions@users.noreply.github.com
            git add -A
            git commit -qm baseline
          )
          diff -ruN --exclude=.git .p20baseline/kairos_p76 "$ROOT" > /tmp/p20_3.rawdiff || true
          (
            cd .p20baseline/kairos_p76
            git diff --no-index --binary . "../../$ROOT" > /tmp/p20_3.patch || test $? = 1
          )
          python3 - <<'PY'
          from pathlib import Path
          base=Path('.p20baseline/kairos_p76'); cur=Path('.p20candidate/kairos_p76')
          expected={
            'KAIROS_P20_3_SAVED_ANALYSIS_APPLICATION_SAVE_ORCHESTRATION_REPORT_2026-09-07.md',
            'package.json',
            'scripts/verify-p20-3-saved-analysis-application-save.mjs',
            'src/application/saved-analysis/index.ts',
            'src/application/saved-analysis/saveSavedAnalysis.ts',
            'tests/saved-analysis-save-command.test.ts',
          }
          actual=set()
          for p in cur.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel=p.relative_to(cur)
                  q=base/rel
                  if not q.exists() or p.read_bytes()!=q.read_bytes(): actual.add(str(rel))
          for p in base.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel=p.relative_to(base)
                  if not (cur/rel).exists(): actual.add(str(rel))
          if actual != expected: raise SystemExit(f'scope mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          Path('/tmp/changed.txt').write_text('\n'.join(sorted(actual))+'\n')
          print('P20.3 exact scope verified:',len(actual))
          PY
      - name: Verify reconstructed P20.3
        working-directory: .p20candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p20:3-saved-analysis-application-save
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:p'));
          for(const req of ['verify:p20:1-saved-analysis-contract-foundation','verify:p20:2-saved-analysis-persistence-foundation','verify:p20:3-saved-analysis-application-save']) if(!scripts.includes(req)) process.exit(1);
          for(const x of scripts){const r=spawnSync('npm',['run',x],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
          npm run verify:static
      - name: Package and commit P20.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p20candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite" "$ROOT/.git"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$OUT_ZIP"
          (cd .p20candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP"
          test "$(unzip -Z1 "$OUT_ZIP" | sed -n '1p' | cut -d/ -f1)" = "kairos_p76"
          if unzip -Z1 "$OUT_ZIP" | grep -Eq '(^|/)(node_modules|dist|coverage|\.vite|\.git)(/|$)|\.tsbuildinfo$'; then exit 1; fi
          sha256sum "$OUT_ZIP"
          git config user.name kairos-autonomous-bridge
          git config user.email actions@users.noreply.github.com
          git add "$OUT_ZIP"
          git commit -m 'Build P20.3 Saved Analysis application save orchestration candidate'
          git push
