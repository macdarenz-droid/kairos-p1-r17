name: Kairos Temporary P18.39 Truncated Upload Repair Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kairos-p18-39-upload-repair-bridge.yml'

permissions:
  contents: write

jobs:
  repair-p18-39-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact P18.39 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, shutil, zipfile, zlib
          base=Path('KAIROS_P18_38_CHART_DRAWING_SELECTION_INTERACTION_SEMANTICS_CANDIDATE_2026-09-05.zip')
          target=Path('KAIROS_P18_39_LIGHTWEIGHT_CHARTS_V5_DRAWING_SELECTION_PROJECTION_CANDIDATE_2026-09-05.zip')
          stage=Path('.p18-39-repair')
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir()
          with zipfile.ZipFile(base) as z: z.extractall(stage)
          packed=''
          payload=json.loads(zlib.decompress(base64.b64decode(packed)))
          for name,encoded in payload.items():
              p=stage/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))

          pkg=stage/'kairos_p76/package.json'
          text=pkg.read_text()
          old='    "verify:p18:38-chart-drawing-selection-interaction-semantics": "node scripts/verify-p18-38-chart-drawing-selection-interaction-semantics.mjs"\n'
          new='    "verify:p18:38-chart-drawing-selection-interaction-semantics": "node scripts/verify-p18-38-chart-drawing-selection-interaction-semantics.mjs",\n    "verify:p18:39-lightweight-charts-v5-drawing-selection-projection": "node scripts/verify-p18-39-lightweight-charts-v5-drawing-selection-projection.mjs"\n'
          if text.count(old)!=1: raise SystemExit('P18.38 package script anchor mismatch')
          pkg.write_text(text.replace(old,new),newline='')

          idx=stage/'kairos_p76/src/features/chart/index.ts'
          export_block=("export {\n"
                        "  projectLightweightChartsV5DrawingSelection,\n"
                        "  type LightweightChartsV5DrawingSelectionHoveredInfo,\n"
                        "  type LightweightChartsV5DrawingSelectionMouseEvent,\n"
                        "  type ChartDrawingSelectionProjection,\n"
                        "} from './lightweightChartsV5DrawingSelectionProjection';\n")
          text=idx.read_text()
          if export_block in text: raise SystemExit('P18.39 index export already present')
          idx.write_text(text+export_block,newline='')

          def walk(d):
              for child in sorted(d.iterdir(),key=lambda p:p.name):
                  if child.is_dir(): yield from walk(child)
                  elif child.is_file(): yield child

          repaired=Path(str(target)+'.repaired')
          with zipfile.ZipFile(repaired,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in walk(stage):
                  arc=str(p.relative_to(stage)).replace(os.sep,'/')
                  info=zipfile.ZipInfo(arc,date_time=(2026,9,5,0,0,0))
                  info.create_system=3
                  info.external_attr=(0o100644<<16)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)

          data=repaired.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          if len(data)!=1134312: raise SystemExit(f'wrong repaired size {len(data)}')
          if sha!='a1d72e3262ed4f215a696eb10a6af5ddd54b9f7450617c80f1c9315ab4cfc0b6': raise SystemExit(f'wrong repaired sha {sha}')
          with zipfile.ZipFile(repaired) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'CRC failure {bad}')
          repaired.replace(target)
          shutil.rmtree(stage)
          print('restored exact P18.39',len(data),sha)
          PY
      - name: Commit repaired candidate and remove bridge
        run: |
          test "$(stat -c%s KAIROS_P18_39_LIGHTWEIGHT_CHARTS_V5_DRAWING_SELECTION_PROJECTION_CANDIDATE_2026-09-05.zip)" = "1134312"
          test "$(sha256sum KAIROS_P18_39_LIGHTWEIGHT_CHARTS_V5_DRAWING_SELECTION_PROJECTION_CANDIDATE_2026-09-05.zip | awk '{print $1}')" = "a1d72e3262ed4f215a696eb10a6af5ddd54b9f7450617c80f1c9315ab4cfc0b6"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KAIROS_P18_39_LIGHTWEIGHT_CHARTS_V5_DRAWING_SELECTION_PROJECTION_CANDIDATE_2026-09-05.zip
          git rm .github/workflows/kairos-p18-39-upload-repair-bridge.yml
          git commit -m "Repair truncated P18.39 candidate upload"
          git push origin HEAD:main
