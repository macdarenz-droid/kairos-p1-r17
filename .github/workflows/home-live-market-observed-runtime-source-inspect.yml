name: Kairos Home Live Market Observed Runtime Source Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-live-market-observed-runtime-source-inspect.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-live-market-observed-runtime-source-inspect
  cancel-in-progress: false

jobs:
  inspect-gate340-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Gate340 GOLDEN and materialize exact composition source report
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip
          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1580635"
          echo "04b95a7cc3103fae230153af07e53fa12fea566f9990c3b090a1c99055f2e117  $BASE_ZIP" | sha256sum -c -
          WORK="$RUNNER_TEMP/gate340-source"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE_ZIP" -d "$WORK"
          ROOT="$WORK/kairos_p76"
          test -d "$ROOT/src"
          REPORT="$GITHUB_WORKSPACE/docs/KAIROS_TEMP_OBSERVED_RUNTIME_SOURCE_INSPECTION.txt"
          : > "$REPORT"
          for needle in \
            startBinanceHomeDashboardLiveMarketRuntime \
            createHomeDashboardLiveMarketSummaryFreshnessObservationObserver \
            createHomeDashboardLiveMarketSummaryBrowserLifecycleAdapter \
            createHomeDashboardLiveMarketSummaryAcquisitionLifecycleScheduler; do
            mapfile -t matches < <(grep -RIl --include='*.ts' --include='*.tsx' "$needle" "$ROOT/src" | sort -u)
            if [ "${#matches[@]}" -eq 0 ]; then
              printf 'MISSING SYMBOL: %s\n' "$needle" >> "$REPORT"
              continue
            fi
            for f in "${matches[@]}"; do
              rel="${f#"$ROOT/"}"
              printf '\n===== BEGIN %s =====\n' "$rel" >> "$REPORT"
              cat "$f" >> "$REPORT"
              printf '\n===== END %s =====\n' "$rel" >> "$REPORT"
            done
          done
          test -s "$REPORT"
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add docs/KAIROS_TEMP_OBSERVED_RUNTIME_SOURCE_INSPECTION.txt
          git commit -m 'helper: record exact Gate340 observed-runtime source'
          git push origin HEAD:main
