name: Kairos Home Dashboard Live Crypto Bubble Home Route Radius Scale Text Runtime Integration Amendment Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-crypto-bubble-home-route-radius-scale-text-runtime-integration-amendment-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-crypto-bubble-home-route-radius-scale-text-runtime-integration-amendment-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify HomeRoute radius-scale text-runtime integration amendment from Gate372 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_CONFIGURED_BROWSER_RADIUS_SCALE_TEXT_EVIDENCE_RUNTIME_COMPOSITION_FOUNDATION_CANDIDATE_2026-09-11.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_CANDIDATE_2026-09-11.zip
          PAYLOAD=.github/kairos-helper-payloads/home-bubble-home-route-radius-scale-text-runtime-integration-amendment.patch.gz.b64
          PATCH="$RUNNER_TEMP/home-bubble-home-route-radius-scale-text-runtime-integration-amendment.patch"
          WORK="$RUNNER_TEMP/home-bubble-home-route-radius-scale-text-runtime-integration-amendment-work"
          BASE="$RUNNER_TEMP/home-bubble-home-route-radius-scale-text-runtime-integration-amendment-base"

          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1724390"
          echo "4189c15eb44908c46a1010108c873b838939cfc24322525c3b8b06e99983160a  $BASE_ZIP" | sha256sum -c -

          test -f "$PAYLOAD"
          test "$(stat -c%s "$PAYLOAD")" = "5821"
          test "$(git hash-object "$PAYLOAD")" = "5f8b347cef11a89dd8c3c98e3c48aba87b27029e"
          echo "e23336b9646f0165c2fb90082713868e0e08722ee99f1fc70c46947381d4ea01  $PAYLOAD" | sha256sum -c -
          base64 -d "$PAYLOAD" | gzip -dc > "$PATCH"
          test "$(stat -c%s "$PATCH")" = "17207"
          test "$(git hash-object "$PATCH")" = "4e8a39904874358d72318de352bd10e0bf5b12ce"
          echo "410c43482b26be8b0c6688e5c9e7a78acd0fc17b92fd2bf9e86bb1be563ea8f6  $PATCH" | sha256sum -c -

          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/HomeRoute.tsx"
          test -f "$ROOT/src/app/HomeDashboardLiveCryptoBubbleConfiguredBrowserRadiusScaleTextEvidenceRuntime.tsx"
          test ! -e "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_REPORT_2026-09-11.md"

          cd "$ROOT"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check --no-index "$BASE/kairos_p76" "$ROOT" || test "$?" = "1"

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_REPORT_2026-09-11.md',
            'scripts/verify-home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.mjs',
            'scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs',
            'src/app/HomeRoute.tsx',
            'tests/home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.test.tsx',
            'tests/router.test.tsx',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          assert not (set(x)-set(y)), f'unexpected removals: {sorted(set(x)-set(y))}'
          PY

          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0

          npm run verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation
          npm run verify:p21:1-home-dashboard-route-ownership-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation
          npm run verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation
          npm run verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation
          npm run verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation
          npm run verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation

          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.test.tsx \
            tests/home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation.test.tsx \
            tests/home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation.test.tsx \
            tests/home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation.test.ts \
            tests/home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation.test.ts \
            tests/router.test.tsx
          npm test

          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const pkg=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(pkg.scripts||{}).filter((x)=>x.startsWith('verify:')).sort();
          const required=[
            'verify:home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation',
            'verify:p21:1-home-dashboard-route-ownership-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-text-evidence-runtime-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-radius-scale-text-evidence-presentation-foundation',
            'verify:home-dashboard-live-crypto-bubble-configured-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-browser-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-hook-composition-foundation',
            'verify:home-dashboard-live-crypto-bubble-react-radius-scale-view-model-foundation',
            'verify:home-dashboard-live-crypto-bubble-radius-scale-projection-foundation',
            'verify:home-dashboard-live-crypto-bubble-runtime-product-policy-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1'
          ];
          for(const name of required) if(!scripts.includes(name)){console.error('Missing '+name);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete

          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['BASE'])/'kairos_p76'
          work=Path(os.environ['WORK'])/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_REPORT_2026-09-11.md',
            'scripts/verify-home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.mjs',
            'scripts/verify-p21-1-home-dashboard-route-ownership-foundation.mjs',
            'src/app/HomeRoute.tsx',
            'tests/home-dashboard-live-crypto-bubble-home-route-text-runtime-integration-foundation.test.tsx',
            'tests/router.test.tsx',
          }
          assert changed==expected, f'exact post-clean scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          assert not (set(x)-set(y)), f'unexpected removals: {sorted(set(x)-set(y))}'
          PY

          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_CANDIDATE_2026-09-11.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"
        env:
          BASE: ${{ runner.temp }}/home-bubble-home-route-radius-scale-text-runtime-integration-amendment-base
          WORK: ${{ runner.temp }}/home-bubble-home-route-radius-scale-text-runtime-integration-amendment-work

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_CANDIDATE
          path: KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_CANDIDATE_2026-09-11.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git pull --rebase origin main
          git add KAIROS_HOME_DASHBOARD_LIVE_CRYPTO_BUBBLE_HOME_ROUTE_RADIUS_SCALE_TEXT_RUNTIME_INTEGRATION_AMENDMENT_CANDIDATE_2026-09-11.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add HomeRoute radius-scale text runtime amendment'
          git push origin HEAD:main
