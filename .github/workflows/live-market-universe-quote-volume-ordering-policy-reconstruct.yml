name: Kairos Live Market Universe Quote Volume Ordering Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-universe-quote-volume-ordering-policy-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-live-market-universe-quote-volume-ordering-policy-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Reconstruct exact ordering candidate from Gate326 GOLDEN
        shell: bash
        env:
          PAYLOAD_JSON: '{"KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_REPORT_2026-09-09.md": "## Responsibility
This foundation owns deterministic ordering for an already-eligible Live Crypto universe only:
- descending exact 24h `quoteVolume24h`
- equal-volume tie-break by instrument symbol ordering
- return a sorted copy without mutating caller-owned input order

Exact decimal comparison routes through the released Decimal calculation kernel.

## Explicit non-scope
- no instrument eligibility, USDT filtering, or stablecoin exclusion
- no provider response mapping or request execution
- no Top-N / Top-30 selection or count ownership
- no acquisition cadence or freshness
- no state or persistence
- no Home/Bubble UI, sizing, color, navigation, chart, or transitions

## Verification
- dedicated static ordering verifier
- focused exact-decimal descending-order test
- focused equal-volume symbol tie-break test
- focused caller-order immutability test
- typecheck / production build / full unit regression / registered verifier regression required before candidate acceptance
", "scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs": "aW1wb3J0IHsgcmVhZEZpbGVT>8J+RkQ==", "src/services/market-data/liveMarketUniverseQuoteVolumeOrderingPolicy.ts": "", "tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts": ""}'
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
          WORK="$RUNNER_TEMP/ordering-work"
          BASE="$RUNNER_TEMP/ordering-base"
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          test -d "$WORK/kairos_p76"
          cd "$WORK/kairos_p76"
          python - <<'PY2'
          from pathlib import Path
          import base64, json, os
          payload=json.loads(os.environ['PAYLOAD_JSON'])
          for path,data in payload.items():
              p=Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(base64.b64decode(data))
          pkg=json.loads(Path('package.json').read_text())
          pkg['scripts']['verify:live-market-universe-quote-volume-ordering-policy-foundation']='node scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs'
          Path('package.json').write_text(json.dumps(pkg, indent=2)+'\n')
          index=Path('src/services/market-data/index.ts'); text=index.read_text(); export="export * from './liveMarketUniverseQuoteVolumeOrderingPolicy';\n"
          if export not in text: text += ('\n' if text and not text.endswith('\n') else '') + export
          index.write_text(text)
          PY2
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Prove exact six-file scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          base=Path('${{ env.BASE }}')/'kairos_p76'; work=Path('${{ env.WORK }}')/'kairos_p76'
          allp=set()
          for r in (base,work):
              for p in r.rglob('*'):
                  if p.is_file(): allp.add(p.relative_to(r).as_posix())
          changed=[rel for rel in sorted(allp) if not (base/rel).exists() or not (work/rel).exists() or (base/rel).read_bytes()!=(work/rel).read_bytes()]
          expected=sorted(['KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_REPORT_2026-09-09.md','package.json','scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs','src/services/market-data/index.ts','src/services/market-data/liveMarketUniverseQuoteVolumeOrderingPolicy.ts','tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts'])
          print('CHANGED\n'+'\n'.join(changed))
          assert changed==expected, (changed,expected)
          PY2
      - name: Install candidate deterministically
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned lightweight-charts
        working-directory: ${{ env.WORK }}/kairos_p76
        run: node -e "const p=require('./node_modules/lightweight-charts/package.json'); if(p.version!=='5.2.1') process.exit(1); console.log(p.version)"
      - name: Run dedicated ordering verifier
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npm run verify:live-market-universe-quote-volume-ordering-policy-foundation
      - name: Run focused ordering regressions
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npx vitest run tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts tests/p21-2-live-market-summary-fact-contract-foundation.test.ts
      - name: Typecheck
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npm run typecheck
      - name: Production build
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: ${{ env.WORK }}/kairos_p76
        run: npm test
      - name: Full registered verification regression
        working-directory: ${{ env.WORK }}/kairos_p76
        run: |
          node - <<'NODE'
          const {spawnSync}=require('child_process'); const scripts=require('./package.json').scripts||{};
          for(const name of Object.keys(scripts).filter(n=>n.startsWith('verify:')).sort()) { const r=spawnSync('npm',['run',name],{stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE
      - name: Clean, package, verify identity and self-remove
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ env.WORK }}/kairos_p76"
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          CANDIDATE=KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
          (cd "${{ env.WORK }}" && zip -qr "$GITHUB_WORKSPACE/$CANDIDATE" kairos_p76)
          unzip -tq "$CANDIDATE"
          python - <<'PY2'
          from pathlib import Path
          import zipfile,hashlib
          z=Path('KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip')
          with zipfile.ZipFile(z) as f:
              for i in f.infolist():
                  n=i.filename
                  assert n.startswith('kairos_p76/') and not n.startswith('/') and '..' not in Path(n).parts
                  assert ((i.external_attr>>16)&0o170000)!=0o120000
          print('SIZE',z.stat().st_size); print('SHA256',hashlib.sha256(z.read_bytes()).hexdigest())
          PY2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CANDIDATE"
          git rm .github/workflows/live-market-universe-quote-volume-ordering-policy-reconstruct.yml
          git commit -m 'candidate: live market universe quote-volume ordering policy foundation'
          git push origin HEAD:main
