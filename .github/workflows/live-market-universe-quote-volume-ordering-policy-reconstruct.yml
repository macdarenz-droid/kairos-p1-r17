name: Kairos Live Market Universe Quote Volume Ordering Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market-universe-quote-volume-ordering-policy-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-live-market-universe-quote-volume-ordering-policy-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Reconstruct ordering candidate from Gate326 GOLDEN without encoded payload transfer
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_LIVE_MARKET_UNIVERSE_INSTRUMENT_ELIGIBILITY_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
          WORK="$RUNNER_TEMP/ordering-work"
          BASE="$RUNNER_TEMP/ordering-base"
          rm -rf "$WORK" "$BASE"; mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"; unzip -q "$BASE_ZIP" -d "$BASE"
          cd "$WORK/kairos_p76"
          cat > src/services/market-data/liveMarketUniverseQuoteVolumeOrderingPolicy.ts <<'EOF'
          import { decimalSubtract } from '../../domain/calculations';
          import type { LiveMarketSummaryFact } from './marketDataTypes';
          function compareInstrumentSymbols(left: string, right: string): number { if (left < right) return -1; if (left > right) return 1; return 0; }
          export function orderLiveMarketUniverseByQuoteVolume(facts: readonly LiveMarketSummaryFact[]): readonly LiveMarketSummaryFact[] {
            return [...facts].sort((left, right) => {
              const difference = decimalSubtract(left.quoteVolume24h, right.quoteVolume24h);
              if (!difference.ok) throw new Error('live-market-universe-quote-volume-invalid');
              if (difference.value === '0') return compareInstrumentSymbols(left.instrument.symbol, right.instrument.symbol);
              return difference.value.startsWith('-') ? 1 : -1;
            });
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/services/market-data/index.ts'); s=p.read_text(); n="export * from './liveMarketUniverseInstrumentEligibilityPolicy';\n"; assert n in s; p.write_text(s.replace(n,n+"export * from './liveMarketUniverseQuoteVolumeOrderingPolicy';\n"))
          p=Path('package.json'); d=json.loads(p.read_text()); d['scripts']['verify:live-market-universe-quote-volume-ordering-policy-foundation']='node scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs'; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cat > tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { parseDecimalString, type DecimalString } from '../src/domain/trades';
          import { orderLiveMarketUniverseByQuoteVolume, type LiveMarketSummaryFact } from '../src/services/market-data';
          function decimal(value:string):DecimalString { const p=parseDecimalString(value); if(!p.ok) throw new Error('bad decimal'); return p.value; }
          function fact(symbol:string,q:string):LiveMarketSummaryFact { return {instrument:{venue:'binance-spot',symbol},lastPrice:decimal('1'),open24h:decimal('1'),high24h:decimal('1'),low24h:decimal('1'),baseVolume24h:decimal('1'),quoteVolume24h:decimal(q),observedAt:'2026-09-09T00:00:00.000Z',sourceTimestamp:null}; }
          describe('quote-volume ordering policy',()=>{
            it('orders exact descending quote volume',()=>{const a=[fact('ETHUSDT','99999999999999999999999.9999'),fact('BTCUSDT','100000000000000000000000.0001'),fact('SOLUSDT','100000000000000000000000')]; expect(orderLiveMarketUniverseByQuoteVolume(a).map(x=>x.instrument.symbol)).toEqual(['BTCUSDT','SOLUSDT','ETHUSDT']);});
            it('ties by symbol',()=>{const a=[fact('XRPUSDT','42'),fact('ADAUSDT','42'),fact('BTCUSDT','42')]; expect(orderLiveMarketUniverseByQuoteVolume(a).map(x=>x.instrument.symbol)).toEqual(['ADAUSDT','BTCUSDT','XRPUSDT']);});
            it('does not mutate caller order',()=>{const a=[fact('LOWUSDT','1'),fact('HIGHUSDT','2')]; const b=orderLiveMarketUniverseByQuoteVolume(a); expect(b.map(x=>x.instrument.symbol)).toEqual(['HIGHUSDT','LOWUSDT']); expect(a.map(x=>x.instrument.symbol)).toEqual(['LOWUSDT','HIGHUSDT']); expect(b).not.toBe(a);});
          });
          EOF
          cat > scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          const s=readFileSync(new URL('../src/services/market-data/liveMarketUniverseQuoteVolumeOrderingPolicy.ts',import.meta.url),'utf8'); const i=readFileSync(new URL('../src/services/market-data/index.ts',import.meta.url),'utf8');
          for(const t of ['decimalSubtract','LiveMarketSummaryFact','orderLiveMarketUniverseByQuoteVolume(','[...facts].sort(','difference.value === \'0\'','compareInstrumentSymbols(left.instrument.symbol, right.instrument.symbol)']) if(!s.includes(t)) throw new Error('missing '+t);
          if(!i.includes("export * from './liveMarketUniverseQuoteVolumeOrderingPolicy';")) throw new Error('missing export');
          for(const t of ['slice(0','Top 30','excludedStablecoinBaseAssets','fetch(','setInterval(','Date.now(','indexedDB','createChart(','React']) if(s.includes(t)) throw new Error('broadened '+t);
          console.log('Live Market Universe quote-volume ordering policy verification passed.');
          EOF
          cat > KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_REPORT_2026-09-09.md <<'EOF'
          # Kairos P21 Live Market Universe Quote-Volume Ordering Policy Foundation
          Base: canonical Gate 326 GOLDEN. Owns deterministic ordering for already-eligible LiveMarketSummaryFact facts only: descending exact quoteVolume24h, equal-volume symbol tie-break, sorted copy. Decimal comparison uses released Decimal kernel. No eligibility, provider transport/mapping, Top-N/Top-30 selection, cadence/freshness, state/persistence, Home/Bubble UI, chart/navigation/transitions.
          EOF
          python - <<'PY'
          from pathlib import Path
          A=Path("$BASE/kairos_p76"); B=Path('.')
          changed=[]
          for p in set(x.relative_to(A) for x in A.rglob('*') if x.is_file())|set(x.relative_to(B) for x in B.rglob('*') if x.is_file()):
            a=A/p; b=B/p
            if not a.exists() or not b.exists() or a.read_bytes()!=b.read_bytes(): changed.append(str(p))
          expected=sorted(['KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_REPORT_2026-09-09.md','package.json','scripts/verify-live-market-universe-quote-volume-ordering-policy-foundation.mjs','src/services/market-data/index.ts','src/services/market-data/liveMarketUniverseQuoteVolumeOrderingPolicy.ts','tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts'])
          assert sorted(changed)==expected,(changed,expected)
          print('exact six-file ordering scope PASS')
          PY
      - name: Install candidate deterministically
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npm ci
      - name: Verify pinned Lightweight Charts
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: node -e "const p=require('./node_modules/lightweight-charts/package.json'); if(p.version!=='5.2.1') process.exit(1)"
      - name: Verify ordering policy
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npm run verify:live-market-universe-quote-volume-ordering-policy-foundation
      - name: Focused ordering and upstream regressions
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npx vitest run tests/live-market-universe-quote-volume-ordering-policy-foundation.test.ts tests/live-market-universe-instrument-eligibility-policy-foundation.test.ts tests/live-market-summary-fact-semantics.test.ts
      - name: TypeScript compilation
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npm run typecheck
      - name: Production build
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npm run build
      - name: Full unit regression
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: npm test -- --run
      - name: Full registered verifier regression
        working-directory: ${{ runner.temp }}/ordering-work/kairos_p76
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./package.json'); const {spawnSync}=require('node:child_process');
          for(const [k,v] of Object.entries(p.scripts).filter(([k])=>k.startsWith('verify:'))){ const r=spawnSync(v,{shell:true,stdio:'inherit'}); if(r.status!==0) process.exit(r.status||1); }
          NODE
      - name: Package clean candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ordering-work/kairos_p76"
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite"
          find "$ROOT" -name '*.tsbuildinfo' -delete
          cd "$RUNNER_TEMP/ordering-work"
          zip -qr "$GITHUB_WORKSPACE/KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip" kairos_p76
          unzip -tq "$GITHUB_WORKSPACE/KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip"
          sha256sum "$GITHUB_WORKSPACE/KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip"
      - name: Upload non-canonical candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_ORDERING_CANDIDATE_NONCANONICAL
          path: KAIROS_LIVE_MARKET_UNIVERSE_QUOTE_VOLUME_ORDERING_POLICY_FOUNDATION_CANDIDATE_2026-09-09.zip
          if-no-files-found: error
