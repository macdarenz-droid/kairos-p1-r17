name: Kairos Home Dashboard Live Market Summary Freshness Observation Bridge Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-dashboard-live-market-summary-freshness-observation-bridge-reconstruct.yml'

permissions:
  contents: write

concurrency:
  group: kairos-home-dashboard-live-market-summary-freshness-observation-bridge-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct and verify freshness observation bridge from Gate338 GOLDEN
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP=KAIROS_LIVE_MARKET_SUMMARY_FRESHNESS_EVALUATION_PROJECTION_FOUNDATION_CANDIDATE_2026-09-09.zip
          OUT_ZIP=KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip
          WORK="$RUNNER_TEMP/freshness-observation-bridge-work"
          BASE="$RUNNER_TEMP/freshness-observation-bridge-base"
          test -f "$BASE_ZIP"
          test "$(stat -c%s "$BASE_ZIP")" = "1575134"
          echo "6579e55613bccc80cc2d910c97b676111750f52d9d1115f88141ab854dfb2d1c  $BASE_ZIP" | sha256sum -c -
          rm -rf "$WORK" "$BASE"
          mkdir -p "$WORK" "$BASE"
          unzip -q "$BASE_ZIP" -d "$WORK"
          unzip -q "$BASE_ZIP" -d "$BASE"
          ROOT="$WORK/kairos_p76"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryAcquisitionLifecycleScheduler.ts"
          test -f "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryFreshnessEvaluationProjection.ts"
          test ! -e "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge.ts"

          cat > "$ROOT/src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge.ts" <<'TS'
          import {
            evaluateLiveMarketSummaryScopedSnapshotFreshness,
            type LiveMarketSummaryFreshnessEvaluationProjectionResult,
          } from '../../services/market-data';
          import type { HomeDashboardLiveMarketSummaryAcquisitionLifecycleObserver } from './homeDashboardLiveMarketSummaryAcquisitionLifecycleScheduler';
          import type { HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult } from './homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort';

          /** Caller-owned evaluation-time dependency. This bridge reads it once per resolved lifecycle result. */
          export type HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource = () => number;

          export interface HomeDashboardLiveMarketSummaryFreshnessObservation {
            readonly acquisitionResult: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult;
            readonly freshnessEvaluation: LiveMarketSummaryFreshnessEvaluationProjectionResult;
          }

          export interface HomeDashboardLiveMarketSummaryFreshnessObservationSink {
            readonly onObservation?: (
              observation: HomeDashboardLiveMarketSummaryFreshnessObservation,
            ) => void;
            readonly onError?: (error: unknown) => void;
          }

          /**
           * Provider-neutral bridge from the released Home acquisition lifecycle observer
           * to the released freshness-evaluation projection. Acquisition/session status and
           * per-fact freshness remain separate fields and are never reinterpreted here.
           */
          export function createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
            readEvaluationTimeMs: HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource,
            sink: HomeDashboardLiveMarketSummaryFreshnessObservationSink = {},
          ): HomeDashboardLiveMarketSummaryAcquisitionLifecycleObserver {
            return {
              onResult(result) {
                let evaluationTimeMs: number;
                try {
                  evaluationTimeMs = readEvaluationTimeMs();
                } catch (error) {
                  sink.onError?.(error);
                  return;
                }

                const freshnessEvaluation = evaluateLiveMarketSummaryScopedSnapshotFreshness(
                  result.scopedSnapshot,
                  evaluationTimeMs,
                );
                sink.onObservation?.({
                  acquisitionResult: result,
                  freshnessEvaluation,
                });
              },
              onError(error) {
                sink.onError?.(error);
              },
            };
          }
          TS

          cat > "$ROOT/tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import type { DecimalString } from '../src/domain/trades';
          import { createLiveMarketSummaryDeliveryState } from '../src/services/market-data/liveMarketSummaryDeliveryState';
          import type {
            LiveMarketSummaryFact,
            MarketDataInstrument,
          } from '../src/services/market-data/marketDataTypes';
          import type { HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult } from '../src/application/dashboard/homeDashboardLiveMarketSummaryScopedSnapshotAcquisitionPort';
          import {
            createHomeDashboardLiveMarketSummaryFreshnessObservationObserver,
            type HomeDashboardLiveMarketSummaryFreshnessObservation,
          } from '../src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge';

          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const eth: MarketDataInstrument = { venue: 'binance-spot', symbol: 'ETHUSDT' };

          function fact(instrument: MarketDataInstrument, observedAt: string): LiveMarketSummaryFact {
            return {
              instrument,
              lastPrice: '100' as DecimalString,
              open24h: '99' as DecimalString,
              high24h: '101' as DecimalString,
              low24h: '98' as DecimalString,
              baseVolume24h: '10' as DecimalString,
              quoteVolume24h: '1000' as DecimalString,
              observedAt,
              sourceTimestamp: null,
            };
          }

          describe('Home Dashboard Live Market Summary Freshness Observation Bridge Foundation', () => {
            it('reads caller evaluation time once, evaluates the exact scoped snapshot, and preserves the acquisition result unchanged', () => {
              const result: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult = {
                orchestrationResult: { ok: true, state: createLiveMarketSummaryDeliveryState() },
                scopedSnapshot: [
                  { instrument: btc, fact: fact(btc, '2026-09-09T00:00:40.000Z') },
                  { instrument: eth, fact: null },
                ],
              };
              const readEvaluationTimeMs = vi.fn(() => Date.parse('2026-09-09T00:01:00.000Z'));
              const observations: HomeDashboardLiveMarketSummaryFreshnessObservation[] = [];
              const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
                readEvaluationTimeMs,
                { onObservation: (observation) => observations.push(observation) },
              );

              observer.onResult?.(result);

              expect(readEvaluationTimeMs).toHaveBeenCalledTimes(1);
              expect(observations).toHaveLength(1);
              expect(observations[0]?.acquisitionResult).toBe(result);
              expect(observations[0]?.freshnessEvaluation).toEqual({
                ok: true,
                evaluationTimeMs: Date.parse('2026-09-09T00:01:00.000Z'),
                entries: [
                  { instrument: btc, fact: result.scopedSnapshot[0]?.fact, ageMs: 20_000, freshness: 'stale' },
                  { instrument: eth, fact: null, ageMs: null, freshness: null },
                ],
              });
            });

            it('keeps acquisition failure separate while still evaluating retained authoritative facts', () => {
              const retained = fact(btc, '2026-09-09T00:00:00.000Z');
              const result: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult = {
                orchestrationResult: {
                  ok: false,
                  reason: 'acquisition-failed',
                  state: createLiveMarketSummaryDeliveryState(),
                },
                scopedSnapshot: [{ instrument: btc, fact: retained }],
              };
              const observations: HomeDashboardLiveMarketSummaryFreshnessObservation[] = [];
              const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
                () => Date.parse('2026-09-09T00:01:01.000Z'),
                { onObservation: (observation) => observations.push(observation) },
              );

              observer.onResult?.(result);

              expect(observations[0]?.acquisitionResult).toBe(result);
              expect(observations[0]?.acquisitionResult.orchestrationResult).toBe(result.orchestrationResult);
              expect(observations[0]?.freshnessEvaluation).toEqual({
                ok: true,
                evaluationTimeMs: Date.parse('2026-09-09T00:01:01.000Z'),
                entries: [{ instrument: btc, fact: retained, ageMs: 61_000, freshness: 'expired' }],
              });
            });

            it('preserves deterministic evaluation failures as observation data rather than turning them into lifecycle errors', () => {
              const result: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult = {
                orchestrationResult: { ok: true, state: createLiveMarketSummaryDeliveryState() },
                scopedSnapshot: [{ instrument: btc, fact: fact(btc, '2026-09-09T00:00:00.000Z') }],
              };
              const observations: HomeDashboardLiveMarketSummaryFreshnessObservation[] = [];
              const errors: unknown[] = [];
              const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
                () => Number.NaN,
                {
                  onObservation: (observation) => observations.push(observation),
                  onError: (error) => errors.push(error),
                },
              );

              observer.onResult?.(result);

              expect(errors).toEqual([]);
              expect(observations[0]?.freshnessEvaluation).toEqual({
                ok: false,
                reason: 'evaluation-time-invalid',
              });
            });

            it('forwards a thrown caller evaluation-time source error without fabricating an observation', () => {
              const failure = new Error('clock source failed');
              const observations: HomeDashboardLiveMarketSummaryFreshnessObservation[] = [];
              const errors: unknown[] = [];
              const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
                () => { throw failure; },
                {
                  onObservation: (observation) => observations.push(observation),
                  onError: (error) => errors.push(error),
                },
              );
              const result: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult = {
                orchestrationResult: { ok: true, state: createLiveMarketSummaryDeliveryState() },
                scopedSnapshot: [],
              };

              observer.onResult?.(result);

              expect(observations).toEqual([]);
              expect(errors).toEqual([failure]);
            });

            it('forwards the existing lifecycle error channel unchanged', () => {
              const failure = new Error('acquisition rejected');
              const errors: unknown[] = [];
              const readEvaluationTimeMs = vi.fn(() => 0);
              const observer = createHomeDashboardLiveMarketSummaryFreshnessObservationObserver(
                readEvaluationTimeMs,
                { onError: (error) => errors.push(error) },
              );

              observer.onError?.(failure);

              expect(errors).toEqual([failure]);
              expect(readEvaluationTimeMs).not.toHaveBeenCalled();
            });
          });
          TS

          cat > "$ROOT/KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_REPORT_2026-09-09.md" <<'MD'
          # Home Dashboard Live Market Summary Freshness Observation Bridge Foundation

          ## Authority
          Base: exact canonical Gate338 freshness-evaluation projection candidate, promoted by `Kairos Controlled Roadmap Gate` #338 / run `34405539024`.

          ## Source-proven responsibility
          The released Home lifecycle observer already separates resolved acquisition results (`onResult`) from rejected/throwing acquisition work (`onError`). Each resolved scoped-snapshot acquisition result preserves both orchestration/session status and the exact scoped snapshot. Released baseline-state orchestration deliberately retains prior authoritative facts on acquisition failure. Gate338 separately owns deterministic fact freshness from exact scoped snapshot + explicit caller-owned evaluation time. No production owner yet composes these two released truths.

          This slice therefore adds one provider-neutral non-presentation observation bridge. For each lifecycle `onResult`, it reads the caller-owned evaluation-time source exactly once, delegates the exact `result.scopedSnapshot` unchanged to Gate338, and emits the original acquisition result and Gate338 freshness evaluation as separate fields. Acquisition/session failure is never reinterpreted as stale/expired; retained facts may still be independently evaluated. The existing lifecycle `onError` channel is forwarded unchanged.

          ## Error boundary
          - A deterministic Gate338 result such as `evaluation-time-invalid`, `fact-invalid`, or `observation-after-evaluation` remains observation data and is not converted into a lifecycle error.
          - If the injected evaluation-time source itself throws, the bridge forwards that exact error through its sink error channel and emits no observation for that lifecycle result.
          - The bridge does not catch or reinterpret sink callback failures; sink behavior remains caller ownership.

          ## Explicit non-scope
          No provider/Binance transport, request/decode/mapping, acquisition/session mutation, 5-second cadence/visibility/lifecycle scheduling, retry/cancellation, universe/ranking/Top-N/stablecoin policy, freshness thresholds, internal wall clock, persistence/IndexedDB, React/Home/Bubble rendering, stale/expired visual treatment, Bubble geometry/size/color/interactions, Your Trades/journal, chart/navigation/Saved Analysis/transitions.

          This foundation intentionally stops at a provider-neutral observation seam. Later Home runtime/presentation wiring may inject it into the already-released lifecycle observer option without moving acquisition or freshness truth into React.
          MD

          cat > "$ROOT/scripts/verify-home-dashboard-live-market-summary-freshness-observation-bridge-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_REPORT_2026-09-09.md', import.meta.url), 'utf8');

          for (const token of [
            'createHomeDashboardLiveMarketSummaryFreshnessObservationObserver',
            'HomeDashboardLiveMarketSummaryFreshnessEvaluationTimeSource = () => number',
            'readonly acquisitionResult: HomeDashboardLiveMarketSummaryScopedSnapshotAcquisitionResult',
            'readonly freshnessEvaluation: LiveMarketSummaryFreshnessEvaluationProjectionResult',
            'evaluationTimeMs = readEvaluationTimeMs()',
            'evaluateLiveMarketSummaryScopedSnapshotFreshness(',
            'result.scopedSnapshot,',
            'acquisitionResult: result,',
            'freshnessEvaluation,',
            'sink.onError?.(error)',
          ]) if (!source.includes(token)) throw new Error(`freshness observation bridge evidence missing: ${token}`);

          for (const forbidden of [
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'fetch(', 'XMLHttpRequest', 'WebSocket(',
            'document.', 'visibilityState', 'React', 'useEffect', 'useState', 'indexedDB', 'AbortController',
            '.sort(', '.filter(', '.reduce(', '15_000', '60_000', 'freshMaxAgeMs', 'staleMaxAgeMs',
          ]) if (source.includes(forbidden)) throw new Error(`freshness observation bridge broadened ownership: ${forbidden}`);

          for (const token of [
            'provider-neutral non-presentation observation bridge',
            'original acquisition result and Gate338 freshness evaluation as separate fields',
            'Acquisition/session failure is never reinterpreted as stale/expired',
            'evaluation-time source itself throws',
            'No provider/Binance transport',
            'No provider/Binance transport',
          ]) if (!report.includes(token)) throw new Error(`freshness observation bridge report evidence missing: ${token}`);

          console.log('Home Dashboard Live Market Summary Freshness Observation Bridge Foundation verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const key='verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation';
          if (p.scripts[key]) throw new Error('freshness observation bridge verifier already registered unexpectedly');
          p.scripts[key]='node scripts/verify-home-dashboard-live-market-summary-freshness-observation-bridge-foundation.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE

          cd "$ROOT"
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm ls lightweight-charts --depth=0
          npm run verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation
          npm run verify:live-market-summary-freshness-evaluation-projection-foundation
          npm run verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation
          npm run verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation
          npm run verify:p21:17-live-market-summary-baseline-state-orchestration-foundation
          npm run verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation
          npm run typecheck
          npm run build
          npx vitest run \
            tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts \
            tests/live-market-summary-freshness-evaluation-projection-foundation.test.ts \
            tests/home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation.test.ts \
            tests/home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation.test.ts \
            tests/live-market-summary-baseline-state-orchestration-foundation.test.ts \
            tests/binance-home-dashboard-live-market-runtime-bootstrap-foundation.test.ts
          npm test
          node - <<'NODE'
          const {readFileSync}=require('node:fs'),{spawnSync}=require('node:child_process');
          const p=JSON.parse(readFileSync('package.json'));
          const scripts=Object.keys(p.scripts||{}).filter(x=>x.startsWith('verify:')).sort();
          for(const required of [
            'verify:home-dashboard-live-market-summary-freshness-observation-bridge-foundation',
            'verify:live-market-summary-freshness-evaluation-projection-foundation',
            'verify:home-dashboard-live-market-summary-acquisition-lifecycle-scheduler-foundation',
            'verify:home-dashboard-live-market-summary-scoped-snapshot-acquisition-port-contract-foundation',
            'verify:p21:17-live-market-summary-baseline-state-orchestration-foundation',
            'verify:binance-home-dashboard-live-market-runtime-bootstrap-foundation',
            'verify:p20:5-saved-analysis-system-closure','verify:p19:7-risk-reward-tool-system-closure',
            'verify:p18:60-drawing-tools-system-closure','verify:p17:16-chart-engine-system-closure',
            'verify:p16:18-crypto-live-feed-system-closure','verify:p15:14-market-data-adapter-system-closure',
            'verify:p14:9-trade-visualizer-system-closure','verify:p11:calculation-brain-closure','verify:p8:navigation-shell','verify:p1',
          ]) if(!scripts.includes(required)){console.error('Missing '+required);process.exit(1)}
          for(const name of scripts){const r=spawnSync('npm',['run',name],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE

          rm -rf node_modules dist coverage .vite .cache
          find . -name '*.tsbuildinfo' -delete
          find . -name '*.log' -delete
          cd "$WORK"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          base=Path(os.environ['RUNNER_TEMP'])/'freshness-observation-bridge-base'/'kairos_p76'
          work=Path(os.environ['RUNNER_TEMP'])/'freshness-observation-bridge-work'/'kairos_p76'
          forbidden={'node_modules','dist','coverage','.vite','.cache'}
          for p in work.rglob('*'):
            assert not any(part in forbidden for part in p.parts), f'forbidden residue: {p}'
            assert not p.name.endswith('.tsbuildinfo') and not p.name.endswith('.log'), f'forbidden file residue: {p}'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          x={str(p.relative_to(base)):h(p) for p in base.rglob('*') if p.is_file()}
          y={str(p.relative_to(work)):h(p) for p in work.rglob('*') if p.is_file()}
          changed={p for p in x.keys()|y.keys() if x.get(p)!=y.get(p)}
          expected={
            'KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_REPORT_2026-09-09.md',
            'package.json',
            'scripts/verify-home-dashboard-live-market-summary-freshness-observation-bridge-foundation.mjs',
            'src/application/dashboard/homeDashboardLiveMarketSummaryFreshnessObservationBridge.ts',
            'tests/home-dashboard-live-market-summary-freshness-observation-bridge-foundation.test.ts',
          }
          assert changed==expected, f'exact scope mismatch: unexpected={sorted(changed-expected)} missing={sorted(expected-changed)}'
          PY
          cd "$RUNNER_TEMP"
          rm -f "$OUT_ZIP"
          (cd "$WORK" && zip -qr "$RUNNER_TEMP/$OUT_ZIP" kairos_p76)
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          z=Path(os.environ['RUNNER_TEMP'])/'KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip'
          data=z.read_bytes()
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None
            assert {i.filename.split('/')[0] for i in a.infolist()}=={'kairos_p76'}
            for i in a.infolist():
              p=PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts
              assert ((i.external_attr >> 16) & 0o170000) != 0o120000
          print('CANDIDATE_SIZE='+str(len(data)))
          print('CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          cp "$RUNNER_TEMP/$OUT_ZIP" "$GITHUB_WORKSPACE/$OUT_ZIP"

      - name: Upload verified non-canonical candidate
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_CANDIDATE
          path: KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip
          if-no-files-found: error

      - name: Place verified candidate at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kairos-autonomous-worker'
          git config user.email 'kairos-autonomous-worker@users.noreply.github.com'
          git add KAIROS_HOME_DASHBOARD_LIVE_MARKET_SUMMARY_FRESHNESS_OBSERVATION_BRIDGE_FOUNDATION_CANDIDATE_2026-09-09.zip
          if git diff --cached --quiet; then
            echo 'Candidate already present with identical bytes.'
            exit 0
          fi
          git commit -m 'candidate: add Home freshness observation bridge'
          git push origin HEAD:main
