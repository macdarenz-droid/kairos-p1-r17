name: Kairos P21.22 Live Market Summary State Session Scoped Snapshot Binding Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-22-live-market-summary-state-session-scoped-snapshot-binding-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_21_LIVE_MARKET_SUMMARY_SCOPED_STATE_SNAPSHOT_FOUNDATION_CANDIDATE_2026-09-08.zip
      OUT_ZIP: KAIROS_P21_22_LIVE_MARKET_SUMMARY_STATE_SESSION_SCOPED_SNAPSHOT_BINDING_FOUNDATION_CANDIDATE_2026-09-08.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.22 from canonical P21.21
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          BINDING="$ROOT/src/services/market-data/liveMarketSummaryStateSessionScopedSnapshotBinding.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryStateSession.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryScopedStateSnapshot.ts"
          test -f "$INDEX"

          cat > "$BINDING" <<'TS'
          import type { MarketDataInstrument } from './marketDataTypes';
          import type { LiveMarketSummaryStateSession } from './liveMarketSummaryStateSession';
          import {
            readLiveMarketSummaryScopedStateSnapshot,
            type LiveMarketSummaryScopedStateSnapshotEntry,
          } from './liveMarketSummaryScopedStateSnapshot';

          /**
           * Pure binding from the released P21.19 state-session snapshot seam to
           * the released P21.21 caller-scoped read projection. One invocation
           * observes the session exactly once and adds no lifecycle or UI policy.
           */
          export function readLiveMarketSummaryStateSessionScopedSnapshot(
            session: LiveMarketSummaryStateSession,
            scope: readonly MarketDataInstrument[],
          ): readonly LiveMarketSummaryScopedStateSnapshotEntry[] {
            const state = session.getState();
            return readLiveMarketSummaryScopedStateSnapshot(state, scope);
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './liveMarketSummaryStateSessionScopedSnapshotBinding';\n"
          if line not in s:
              anchor="export * from './liveMarketSummaryScopedStateSnapshot';\n"
              if anchor not in s: raise SystemExit('P21.21 scoped snapshot export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/live-market-summary-state-session-scoped-snapshot-binding-foundation.test.ts" <<'TS'
          import { describe, expect, it, vi } from 'vitest';
          import {
            createLiveMarketSummaryDeliveryState,
            readLiveMarketSummaryStateSessionScopedSnapshot,
            type LiveMarketSummaryFact,
            type LiveMarketSummaryStateSession,
            type MarketDataInstrument,
          } from '../src/services/market-data';

          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const eth: MarketDataInstrument = { venue: 'binance-spot', symbol: 'ETHUSDT' };
          const missing: MarketDataInstrument = { venue: 'binance-spot', symbol: 'SOLUSDT' };
          const btcFact = { instrument: btc } as LiveMarketSummaryFact;
          const ethFact = { instrument: eth } as LiveMarketSummaryFact;

          function populatedState() {
            return {
              factsByInstrument: new Map([
                ['binance-spot::BTCUSDT', btcFact],
                ['binance-spot::ETHUSDT', ethFact],
              ]),
            };
          }

          describe('P21.22 Live Market Summary State Session Scoped Snapshot Binding Foundation', () => {
            it('reads the released session state exactly once and delegates caller scope unchanged', () => {
              const state = populatedState();
              const getState = vi.fn(() => state);
              const session = { getState } as unknown as LiveMarketSummaryStateSession;
              const scope = [eth, btc, missing] as const;

              const result = readLiveMarketSummaryStateSessionScopedSnapshot(session, scope);

              expect(getState).toHaveBeenCalledTimes(1);
              expect(result).toHaveLength(3);
              expect(result[0]?.instrument).toBe(eth);
              expect(result[0]?.fact).toBe(ethFact);
              expect(result[1]?.instrument).toBe(btc);
              expect(result[1]?.fact).toBe(btcFact);
              expect(result[2]?.instrument).toBe(missing);
              expect(result[2]?.fact).toBeNull();
            });

            it('preserves duplicate caller requests as associations and does not infer ranking or dedupe', () => {
              const state = populatedState();
              const session = { getState: () => state } as unknown as LiveMarketSummaryStateSession;
              const result = readLiveMarketSummaryStateSessionScopedSnapshot(session, [btc, eth, btc]);

              expect(result.map((entry) => entry.instrument)).toEqual([btc, eth, btc]);
              expect(result.map((entry) => entry.fact)).toEqual([btcFact, ethFact, btcFact]);
            });

            it('is read-only and does not invoke the released session transition seam', () => {
              const state = createLiveMarketSummaryDeliveryState();
              const transition = vi.fn();
              const session = {
                getState: vi.fn(() => state),
                transition,
              } as unknown as LiveMarketSummaryStateSession;

              const result = readLiveMarketSummaryStateSessionScopedSnapshot(session, [btc]);

              expect(result).toEqual([{ instrument: btc, fact: null }]);
              expect(transition).not.toHaveBeenCalled();
              expect(session.getState).toHaveBeenCalledTimes(1);
              expect(state.factsByInstrument.size).toBe(0);
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_22_LIVE_MARKET_SUMMARY_STATE_SESSION_SCOPED_SNAPSHOT_BINDING_FOUNDATION_REPORT_2026-09-08.md" <<'MD'
          # KAIROS P21.22 — Live Market Summary State Session Scoped Snapshot Binding Foundation

          ## Authority
          Base: canonical P21.21 Live Market Summary Scoped State Snapshot Foundation, canonical gate #306 / run `34158212484`.

          ## Source-proven responsibility
          Released P21.19 owns exactly one current released P21.16 state through `LiveMarketSummaryStateSession.getState()` plus explicit caller-driven transitions. Released P21.21 owns the pure caller-scoped read projection `readLiveMarketSummaryScopedStateSnapshot(state, scope)`. Exact canonical-source audit found no production owner composing those seams. Home remains presentation-only with no dashboard-insight wiring, while Journal/P12 remains separate journal-history truth. The smallest dependency-safe next responsibility is therefore a pure state-session-to-scoped-snapshot binding only.

          ## Contract
          - Accept an existing released `LiveMarketSummaryStateSession` plus explicit caller-owned instrument scope.
          - Read `session.getState()` exactly once per caller invocation.
          - Delegate that exact state and exact caller scope only to released `readLiveMarketSummaryScopedStateSnapshot(...)`.
          - Return the released scoped snapshot unchanged.
          - Add no state transition, acquisition, mutation, persistence, subscription, UI, ranking, universe, freshness, or provider semantics.

          ## Explicit non-scope
          - No universe/default-symbol/default-scope discovery and no ranking/filtering/grouping/sorting/top-N/popularity/market-cap policy.
          - No Bubble sizing/color/geometry/interactions/animation or Home wiring.
          - No provider/transport/network/acquisition policy and no Date/clock/freshness/TTL/stale eviction/polling/reconnect/scheduling/background work.
          - No session transition/cancellation/concurrency/coalescing/subscription framework.
          - No persistence/IndexedDB/repository/schema/backup/journal/Your Trades/Saved Analysis/chart/transitions.
          - No UI-reactivity framework choice and no duplication/reinterpretation of released P21.2/P21.3/P21.16/P21.18/P21.19/P21.20/P21.21 semantics.
          MD

          cat > "$ROOT/scripts/verify-p21-22-live-market-summary-state-session-scoped-snapshot-binding-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/liveMarketSummaryStateSessionScopedSnapshotBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_22_LIVE_MARKET_SUMMARY_STATE_SESSION_SCOPED_SNAPSHOT_BINDING_FOUNDATION_REPORT_2026-09-08.md', import.meta.url), 'utf8');
          for (const token of [
            'LiveMarketSummaryStateSession',
            'readLiveMarketSummaryScopedStateSnapshot',
            'readLiveMarketSummaryStateSessionScopedSnapshot(',
            'const state = session.getState()',
            'return readLiveMarketSummaryScopedStateSnapshot(state, scope)',
          ]) if (!source.includes(token)) throw new Error(`P21.22 binding evidence missing: ${token}`);
          if (!index.includes("export * from './liveMarketSummaryStateSessionScopedSnapshotBinding';")) throw new Error('P21.22 binding export missing');
          const getStateCalls = (source.match(/session\.getState\(\)/g) || []).length;
          if (getStateCalls !== 1) throw new Error(`P21.22 must read session state exactly once, found ${getStateCalls}`);
          for (const forbidden of [
            '.transition(', '.sort(', '.filter(', '.reduce(', 'new Map(', 'new Set(',
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'fetch(', 'XMLHttpRequest',
            'WebSocket(', 'indexedDB', 'AbortController', 'createChart(',
          ]) if (source.includes(forbidden)) throw new Error(`P21.22 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'no production owner composing those seams',
            'Read `session.getState()` exactly once per caller invocation',
            'Return the released scoped snapshot unchanged',
            'No universe/default-symbol/default-scope discovery',
            'No Bubble sizing/color/geometry/interactions/animation or Home wiring',
            'No persistence/IndexedDB/repository/schema/backup/journal/Your Trades/Saved Analysis/chart/transitions',
          ]) if (!report.includes(token)) throw new Error(`P21.22 report evidence missing: ${token}`);
          console.log('P21.22 Live Market Summary State Session Scoped Snapshot Binding verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:22-live-market-summary-state-session-scoped-snapshot-binding-foundation']='node scripts/verify-p21-22-live-market-summary-state-session-scoped-snapshot-binding-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_22_LIVE_MARKET_SUMMARY_STATE_SESSION_SCOPED_SNAPSHOT_BINDING_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-p21-22-live-market-summary-state-session-scoped-snapshot-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/liveMarketSummaryStateSessionScopedSnapshotBinding.ts',
            'tests/live-market-summary-state-session-scoped-snapshot-binding-foundation.test.ts',
          }
          print('P21.21 -> P21.22 changed files:', *sorted(changed), sep='\n- ')
          if changed != expected:
              raise SystemExit(f'exact P21.22 scope mismatch: {sorted(changed ^ expected)}')
          PY

      - name: Verify reconstructed P21.22 before packaging
        working-directory: .p21candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:22-live-market-summary-state-session-scoped-snapshot-binding-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => name.startsWith('verify:')).sort();
          for (const name of scripts) {
            console.log(`\n=== ${name} ===`);
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite" "$ROOT/.cache" "$ROOT/.turbo"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$OUT_ZIP"
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP" >/dev/null
          test "$(zipinfo -1 "$OUT_ZIP" | head -n1)" = 'kairos_p76/'
          test "$(zipinfo -1 "$OUT_ZIP" | grep -Ev '^kairos_p76/' | wc -l)" -eq 0
          git add -f "$OUT_ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add P21.22 live market summary state session scoped snapshot binding candidate'
          git push
