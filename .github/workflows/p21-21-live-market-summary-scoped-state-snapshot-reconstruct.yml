name: Kairos P21.21 Live Market Summary Scoped State Snapshot Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-21-live-market-summary-scoped-state-snapshot-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_20_LIVE_MARKET_SUMMARY_BROWSER_STATE_SESSION_BINDING_FOUNDATION_CANDIDATE_2026-09-08.zip
      OUT_ZIP: KAIROS_P21_21_LIVE_MARKET_SUMMARY_SCOPED_STATE_SNAPSHOT_FOUNDATION_CANDIDATE_2026-09-08.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.21 from canonical P21.20
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          SNAPSHOT="$ROOT/src/services/market-data/liveMarketSummaryScopedStateSnapshot.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryDeliveryState.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryStateSession.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding.ts"
          test -f "$INDEX"

          cat > "$SNAPSHOT" <<'TS'
          import type {
            LiveMarketSummaryFact,
            MarketDataInstrument,
          } from './marketDataTypes';
          import {
            getLiveMarketSummaryDeliveryStateFact,
            type LiveMarketSummaryDeliveryState,
          } from './liveMarketSummaryDeliveryState';

          /**
           * One caller-requested association in a provider-neutral state snapshot.
           * Entry order mirrors caller request order only; it is never ranking,
           * filtering, popularity, market-cap, or presentation truth.
           */
          export interface LiveMarketSummaryScopedStateSnapshotEntry {
            readonly instrument: MarketDataInstrument;
            readonly fact: LiveMarketSummaryFact | null;
          }

          /**
           * Pure scoped read projection over released P21.16 state semantics.
           * No universe discovery, acquisition, mutation, session transition,
           * freshness, completeness, persistence, or presentation policy is added.
           */
          export function readLiveMarketSummaryScopedStateSnapshot(
            state: LiveMarketSummaryDeliveryState,
            scope: readonly MarketDataInstrument[],
          ): readonly LiveMarketSummaryScopedStateSnapshotEntry[] {
            return scope.map((instrument) => ({
              instrument,
              fact: getLiveMarketSummaryDeliveryStateFact(state, instrument),
            }));
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './liveMarketSummaryScopedStateSnapshot';\n"
          if line not in s:
              anchor="export * from './liveMarketSummaryStateSession';\n"
              if anchor not in s: raise SystemExit('P21.19 state session export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/live-market-summary-scoped-state-snapshot-foundation.test.ts" <<'TS'
          import { describe, expect, it } from 'vitest';
          import {
            createLiveMarketSummaryDeliveryState,
            readLiveMarketSummaryScopedStateSnapshot,
            type LiveMarketSummaryDeliveryState,
            type LiveMarketSummaryFact,
            type MarketDataInstrument,
          } from '../src/services/market-data';

          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const eth: MarketDataInstrument = { venue: 'binance-spot', symbol: 'ETHUSDT' };
          const missing: MarketDataInstrument = { venue: 'binance-spot', symbol: 'SOLUSDT' };
          const btcFact = { instrument: btc } as LiveMarketSummaryFact;
          const ethFact = { instrument: eth } as LiveMarketSummaryFact;

          function populatedState(): LiveMarketSummaryDeliveryState {
            return {
              factsByInstrument: new Map([
                ['binance-spot::BTCUSDT', btcFact],
                ['binance-spot::ETHUSDT', ethFact],
              ]),
            };
          }

          describe('P21.21 Live Market Summary Scoped State Snapshot Foundation', () => {
            it('returns one association for every explicit caller request and preserves exact released fact identity', () => {
              const state = populatedState();
              const result = readLiveMarketSummaryScopedStateSnapshot(state, [eth, btc, missing]);

              expect(result).toHaveLength(3);
              expect(result[0]?.instrument).toBe(eth);
              expect(result[0]?.fact).toBe(ethFact);
              expect(result[1]?.instrument).toBe(btc);
              expect(result[1]?.fact).toBe(btcFact);
              expect(result[2]?.instrument).toBe(missing);
              expect(result[2]?.fact).toBeNull();
            });

            it('preserves duplicate caller requests as duplicate associations without dedupe or ranking policy', () => {
              const state = populatedState();
              const result = readLiveMarketSummaryScopedStateSnapshot(state, [btc, eth, btc]);

              expect(result.map((entry) => entry.instrument)).toEqual([btc, eth, btc]);
              expect(result.map((entry) => entry.fact)).toEqual([btcFact, ethFact, btcFact]);
            });

            it('is a pure read and leaves released state identity/content untouched', () => {
              const state = createLiveMarketSummaryDeliveryState();
              const facts = state.factsByInstrument;
              const result = readLiveMarketSummaryScopedStateSnapshot(state, [btc]);

              expect(result).toEqual([{ instrument: btc, fact: null }]);
              expect(state.factsByInstrument).toBe(facts);
              expect(state.factsByInstrument.size).toBe(0);
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_21_LIVE_MARKET_SUMMARY_SCOPED_STATE_SNAPSHOT_FOUNDATION_REPORT_2026-09-08.md" <<'MD'
          # KAIROS P21.21 — Live Market Summary Scoped State Snapshot Foundation

          ## Authority
          Base: canonical P21.20 Live Market Summary Browser State Session Binding Foundation, canonical gate #305 / run `34154165151`.

          ## Source-proven responsibility
          Released P21.16 owns provider-neutral current-summary state and the exact single-instrument getter, and its canonical contract states that backing Map iteration order is storage detail rather than ranking or presentation truth. Released P21.19 owns in-memory session lifecycle and released P21.20 owns explicit browser acquisition into that session. Exact canonical-source audit found no production owner for an explicit caller-scoped multi-fact read projection. The smallest dependency-safe next responsibility is therefore a pure scoped state snapshot only.

          ## Contract
          - Accept released `LiveMarketSummaryDeliveryState` plus explicit caller-owned instrument scope.
          - Return one association per caller request: requested instrument plus the exact released current fact or explicit `null`.
          - Resolve facts only through released `getLiveMarketSummaryDeliveryStateFact(...)`.
          - Preserve caller scope sequence only as request/association order; it is never ranking or presentation truth.
          - Infer no completeness, default universe, freshness, timestamps, provider metadata, or missing-data policy beyond explicit `null`.
          - Perform no state mutation, acquisition, session transition, persistence, or subscription work.

          ## Explicit non-scope
          - No universe/default-symbol/scope discovery and no ranking/filtering/grouping/sorting/top-N/popularity/market-cap policy.
          - No Bubble sizing/color/geometry/interactions/animation or Home wiring.
          - No provider/transport/network policy and no Date/clock/freshness/polling/reconnect/scheduling/background work.
          - No acquisition/session transitions/cancellation/concurrency/subscriptions.
          - No persistence/IndexedDB/journal/Your Trades/Saved Analysis/chart/transitions.
          - No duplication or reinterpretation of released P21.2/P21.3/P21.16/P21.18/P21.19/P21.20 semantics.
          MD

          cat > "$ROOT/scripts/verify-p21-21-live-market-summary-scoped-state-snapshot-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/liveMarketSummaryScopedStateSnapshot.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_21_LIVE_MARKET_SUMMARY_SCOPED_STATE_SNAPSHOT_FOUNDATION_REPORT_2026-09-08.md', import.meta.url), 'utf8');
          for (const token of [
            'LiveMarketSummaryScopedStateSnapshotEntry',
            'readLiveMarketSummaryScopedStateSnapshot(',
            'scope.map((instrument) => ({',
            'getLiveMarketSummaryDeliveryStateFact(state, instrument)',
            'LiveMarketSummaryFact | null',
          ]) if (!source.includes(token)) throw new Error(`P21.21 snapshot evidence missing: ${token}`);
          if (!index.includes("export * from './liveMarketSummaryScopedStateSnapshot';")) throw new Error('P21.21 snapshot export missing');
          for (const forbidden of [
            '.sort(', '.filter(', '.reduce(', 'new Map(', 'new Set(', 'Date.now(', 'new Date(',
            'setTimeout(', 'setInterval(', 'fetch(', 'XMLHttpRequest', 'WebSocket(', 'indexedDB',
            'transition(', 'applyLiveMarketSummaryDeliveryState(', 'createChart(',
          ]) if (source.includes(forbidden)) throw new Error(`P21.21 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'backing Map iteration order is storage detail rather than ranking or presentation truth',
            'no production owner for an explicit caller-scoped multi-fact read projection',
            'Resolve facts only through released `getLiveMarketSummaryDeliveryStateFact(...)`',
            'never ranking or presentation truth',
            'No universe/default-symbol/scope discovery',
            'No persistence/IndexedDB/journal/Your Trades/Saved Analysis/chart/transitions',
          ]) if (!report.includes(token)) throw new Error(`P21.21 report evidence missing: ${token}`);
          console.log('P21.21 Live Market Summary Scoped State Snapshot verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:21-live-market-summary-scoped-state-snapshot-foundation']='node scripts/verify-p21-21-live-market-summary-scoped-state-snapshot-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_21_LIVE_MARKET_SUMMARY_SCOPED_STATE_SNAPSHOT_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-p21-21-live-market-summary-scoped-state-snapshot-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/liveMarketSummaryScopedStateSnapshot.ts',
            'tests/live-market-summary-scoped-state-snapshot-foundation.test.ts',
          }
          print('P21.20 -> P21.21 changed files:', *sorted(changed), sep='\n- ')
          if changed != expected:
              raise SystemExit(f'exact P21.21 scope mismatch: {sorted(changed ^ expected)}')
          PY

      - name: Verify reconstructed P21.21 before packaging
        working-directory: .p21candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:21-live-market-summary-scoped-state-snapshot-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => name.startsWith('verify:')).sort();
          for (const name of scripts) {
            console.log(`\n=== ${name} ===`);
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite" "$ROOT/.cache" "$ROOT/.turbo"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$OUT_ZIP"
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP" >/dev/null
          test "$(zipinfo -1 "$OUT_ZIP" | head -n1)" = 'kairos_p76/'
          test "$(zipinfo -1 "$OUT_ZIP" | grep -Ev '^kairos_p76/' | wc -l)" -eq 0
          git add -f "$OUT_ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add P21.21 live market summary scoped state snapshot candidate'
          git push
