name: Kairos P21.20 Live Market Summary Browser State Session Binding Reconstruction Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p21-20-live-market-summary-browser-state-session-binding-reconstruct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    env:
      BASE_ZIP: KAIROS_P21_19_LIVE_MARKET_SUMMARY_STATE_SESSION_FOUNDATION_CANDIDATE_2026-09-08.zip
      OUT_ZIP: KAIROS_P21_20_LIVE_MARKET_SUMMARY_BROWSER_STATE_SESSION_BINDING_FOUNDATION_CANDIDATE_2026-09-08.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Reconstruct P21.20 from canonical P21.19
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p21base .p21candidate
          mkdir .p21base .p21candidate
          unzip -q "$BASE_ZIP" -d .p21base
          cp -a .p21base/. .p21candidate/
          ROOT=.p21candidate/kairos_p76
          BINDING="$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding.ts"
          INDEX="$ROOT/src/services/market-data/index.ts"
          test -f "$ROOT/src/services/market-data/liveMarketSummaryStateSession.ts"
          test -f "$ROOT/src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding.ts"
          test -f "$INDEX"

          cat > "$BINDING" <<'TS'
          import type { MarketDataInstrument } from '../../marketDataTypes';
          import type { LiveMarketSummaryBaselineStateOrchestrationResult } from '../../liveMarketSummaryBaselineStateOrchestration';
          import type { LiveMarketSummaryStateSession } from '../../liveMarketSummaryStateSession';
          import type { BinanceSpot24hPublicRestBaselineObservedAtSource } from './binanceSpot24hPublicRestBaselineAcquisitionAdapter';
          import { acquireBinanceSpot24hBrowserPublicRestBaselineIntoState } from './binanceSpot24hBrowserPublicRestBaselineStateBinding';

          /**
           * Explicit browser-ready composition of the released P21.18 one-shot
           * state binding with the released P21.19 provider-neutral state session.
           * This adds no universe, freshness, scheduling, concurrency, persistence,
           * presentation, or provider/transport policy.
           */
          export async function acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession(
            session: LiveMarketSummaryStateSession,
            readObservedAt: BinanceSpot24hPublicRestBaselineObservedAtSource,
            scope: readonly MarketDataInstrument[],
            options?: { readonly signal?: AbortSignal },
          ): Promise<LiveMarketSummaryBaselineStateOrchestrationResult> {
            let orchestrationResult: LiveMarketSummaryBaselineStateOrchestrationResult | undefined;

            await session.transition(async (state) => {
              const result = await acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(
                state,
                readObservedAt,
                scope,
                options,
              );
              orchestrationResult = result;
              return result.state;
            });

            if (orchestrationResult === undefined) {
              throw new Error('P21.20 invariant: explicit session transition completed without orchestration result');
            }
            return orchestrationResult;
          }
          TS

          python - <<'PY'
          from pathlib import Path
          p=Path('.p21candidate/kairos_p76/src/services/market-data/index.ts')
          s=p.read_text()
          line="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding';\n"
          if line not in s:
              anchor="export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineStateBinding';\n"
              if anchor not in s: raise SystemExit('P21.18 browser state binding export boundary not found')
              s=s.replace(anchor, anchor+line, 1)
          p.write_text(s)
          PY

          cat > "$ROOT/tests/live-market-summary-browser-state-session-binding-foundation.test.ts" <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import {
            acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession,
            createLiveMarketSummaryDeliveryState,
            createLiveMarketSummaryStateSession,
            getLiveMarketSummaryDeliveryStateFact,
            type MarketDataInstrument,
          } from '../src/services/market-data';

          const originalFetch = globalThis.fetch;
          const btc: MarketDataInstrument = { venue: 'binance-spot', symbol: 'BTCUSDT' };
          const scope = [btc] as const;
          const observedAt = '2026-09-08T04:30:00.000Z';
          const payload = JSON.stringify({
            symbol: 'BTCUSDT', openPrice: '62000', highPrice: '65000', lowPrice: '61000',
            lastPrice: '64000', volume: '1234', quoteVolume: '78000000', closeTime: 1770000000000,
          });

          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.restoreAllMocks();
          });

          describe('P21.20 Live Market Summary Browser State Session Binding Foundation', () => {
            it('executes exactly one explicit session transition and commits only released P21.18 result.state', async () => {
              const initial = createLiveMarketSummaryDeliveryState();
              const baseSession = createLiveMarketSummaryStateSession(initial);
              const transition = vi.spyOn(baseSession, 'transition');
              globalThis.fetch = vi.fn(async () => ({ text: async () => payload })) as unknown as typeof fetch;
              const readObservedAt = vi.fn(() => observedAt);

              const result = await acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession(
                baseSession,
                readObservedAt,
                scope,
              );

              expect(result.ok).toBe(true);
              expect(transition).toHaveBeenCalledTimes(1);
              expect(readObservedAt).toHaveBeenCalledTimes(1);
              expect(baseSession.getState()).toBe(result.state);
              expect(getLiveMarketSummaryDeliveryStateFact(baseSession.getState(), btc)?.observedAt).toBe(observedAt);
            });

            it('preserves released acquisition-failed result and exact prior session state', async () => {
              const initial = createLiveMarketSummaryDeliveryState();
              const session = createLiveMarketSummaryStateSession(initial);
              globalThis.fetch = vi.fn(async () => { throw new Error('native-fetch-failure'); }) as unknown as typeof fetch;

              const result = await acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession(
                session,
                () => observedAt,
                scope,
              );

              expect(result).toEqual({ ok: false, reason: 'acquisition-failed', state: initial });
              expect(result.state).toBe(initial);
              expect(session.getState()).toBe(initial);
            });

            it('forwards caller-owned acquisition options unchanged through released P21.18', async () => {
              const session = createLiveMarketSummaryStateSession();
              const controller = new AbortController();
              const fetchMock = vi.fn(async (_input: URL | RequestInfo, init?: RequestInit) => ({ text: async () => payload, init }));
              globalThis.fetch = fetchMock as unknown as typeof fetch;

              await expect(acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession(
                session,
                () => observedAt,
                scope,
                { signal: controller.signal },
              )).resolves.toMatchObject({ ok: true });

              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(fetchMock.mock.calls[0]?.[1]?.signal).toBe(controller.signal);
            });
          });
          TS

          cat > "$ROOT/KAIROS_P21_20_LIVE_MARKET_SUMMARY_BROWSER_STATE_SESSION_BINDING_FOUNDATION_REPORT_2026-09-08.md" <<'MD'
          # KAIROS P21.20 — Live Market Summary Browser State Session Binding Foundation

          ## Authority
          Base: canonical P21.19 Live Market Summary State Session Foundation, canonical gate #304 / run `34150339551`.

          ## Source-proven responsibility
          Released P21.18 owns the browser-ready one-shot `acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(state, readObservedAt, scope, options?)` operation and explicitly owns no long-lived state session. Released P21.19 owns `LiveMarketSummaryStateSession` with exact current-state access and explicit caller-driven transition semantics and explicitly owns no provider/browser acquisition. Exact current default-branch search found no production owner composing these released seams. The smallest dependency-safe next responsibility is therefore one explicit browser-state-session composition only.

          ## Contract
          - Accept an existing released `LiveMarketSummaryStateSession`, caller-owned `readObservedAt`, explicit caller-owned scope, and optional caller-owned acquisition options.
          - Execute exactly one explicit P21.19 session transition.
          - Inside that transition, delegate the exact current state only to released P21.18.
          - Commit only released P21.18 `result.state` through P21.19 transition semantics.
          - Surface the exact released P21.18 orchestration result while preserving `ok`, `acquisition-failed`, `delivery-invalid`, cancellation/options forwarding, and exact-prior-state behavior unchanged.
          - Add no new P21.16, P21.18, or P21.19 semantics.

          ## Explicit non-scope
          - No universe/default symbols/scope selection, ranking, filtering, grouping, sorting, Bubble metrics/colors/geometry/interactions, or Home wiring.
          - No new provider/transport/fetch/Response/endpoint/query/status/header/error/retry/rate-limit/credentials/timeout policy.
          - No Date/clock/observation-time acquisition/timestamp arbitration/freshness TTL/stale eviction/reset/polling/reconnect/scheduling/timers/randomness/background work.
          - No new AbortController/signal-combination/concurrency/coalescing policy beyond one explicit caller invocation and released option forwarding.
          - No persistence/IndexedDB/repository/schema/backup/journal/Your Trades/Saved Analysis/chart/transitions.
          - No UI reactivity/subscription framework choice and no duplication/reinterpretation of released validation/application/session semantics.
          MD

          cat > "$ROOT/scripts/verify-p21-20-live-market-summary-browser-state-session-binding-foundation.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const source = readFileSync(new URL('../src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding.ts', import.meta.url), 'utf8');
          const index = readFileSync(new URL('../src/services/market-data/index.ts', import.meta.url), 'utf8');
          const report = readFileSync(new URL('../KAIROS_P21_20_LIVE_MARKET_SUMMARY_BROWSER_STATE_SESSION_BINDING_FOUNDATION_REPORT_2026-09-08.md', import.meta.url), 'utf8');
          for (const token of [
            'LiveMarketSummaryStateSession',
            'acquireBinanceSpot24hBrowserPublicRestBaselineIntoSession(',
            'await session.transition(async (state) =>',
            'acquireBinanceSpot24hBrowserPublicRestBaselineIntoState(',
            'orchestrationResult = result',
            'return result.state',
            'return orchestrationResult',
          ]) if (!source.includes(token)) throw new Error(`P21.20 binding evidence missing: ${token}`);
          if (!index.includes("export * from './providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding';")) throw new Error('P21.20 browser state session binding export missing');
          for (const forbidden of [
            'globalThis.fetch(', 'fetch(', 'XMLHttpRequest', 'WebSocket(', 'Response(', 'JSON.parse(',
            'Date.now(', 'new Date(', 'setTimeout(', 'setInterval(', 'indexedDB', '.sort(', 'createChart(',
            'createLiveMarketSummaryStateSession(', 'applyLiveMarketSummaryDeliveryState(',
          ]) if (source.includes(forbidden)) throw new Error(`P21.20 broadened into forbidden scope: ${forbidden}`);
          for (const token of [
            'Released P21.18 owns the browser-ready one-shot',
            'Released P21.19 owns `LiveMarketSummaryStateSession`',
            'no production owner composing these released seams',
            'Execute exactly one explicit P21.19 session transition',
            'Commit only released P21.18 `result.state`',
            'No universe/default symbols/scope selection',
            'No persistence/IndexedDB/repository/schema/backup',
            'No UI reactivity/subscription framework choice',
          ]) if (!report.includes(token)) throw new Error(`P21.20 report evidence missing: ${token}`);
          console.log('P21.20 Live Market Summary Browser State Session Binding verification passed.');
          JS

          node - <<'NODE'
          const fs=require('node:fs');
          const p='.p21candidate/kairos_p76/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.scripts||={};
          j.scripts['verify:p21:20-live-market-summary-browser-state-session-binding-foundation']='node scripts/verify-p21-20-live-market-summary-browser-state-session-binding-foundation.mjs';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          a={str(p.relative_to(Path('.p21base/kairos_p76'))):p.read_bytes() for p in Path('.p21base/kairos_p76').rglob('*') if p.is_file()}
          b={str(p.relative_to(Path('.p21candidate/kairos_p76'))):p.read_bytes() for p in Path('.p21candidate/kairos_p76').rglob('*') if p.is_file()}
          changed={p for p in a.keys()|b.keys() if a.get(p)!=b.get(p)}
          expected={
            'KAIROS_P21_20_LIVE_MARKET_SUMMARY_BROWSER_STATE_SESSION_BINDING_FOUNDATION_REPORT_2026-09-08.md',
            'package.json',
            'scripts/verify-p21-20-live-market-summary-browser-state-session-binding-foundation.mjs',
            'src/services/market-data/index.ts',
            'src/services/market-data/providers/binance/binanceSpot24hBrowserPublicRestBaselineStateSessionBinding.ts',
            'tests/live-market-summary-browser-state-session-binding-foundation.test.ts',
          }
          print('P21.19 -> P21.20 changed files:', *sorted(changed), sep='\n- ')
          if changed != expected:
              raise SystemExit(f'exact P21.20 scope mismatch: {sorted(changed ^ expected)}')
          PY

      - name: Verify reconstructed P21.20 before packaging
        working-directory: .p21candidate/kairos_p76
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/lightweight-charts/package.json').version")" = "5.2.1"
          npm run verify:p21:20-live-market-summary-browser-state-session-binding-foundation
          npm run typecheck
          npm run build
          npm test
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const scripts = Object.keys(pkg.scripts || {}).filter((name) => name.startsWith('verify:')).sort();
          for (const name of scripts) {
            console.log(`\n=== ${name} ===`);
            const r = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (r.status !== 0) process.exit(r.status || 1);
          }
          NODE

      - name: Restore clean package boundary and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.p21candidate/kairos_p76
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.vite" "$ROOT/.cache" "$ROOT/.turbo"
          find "$ROOT" -type f \( -name '*.tsbuildinfo' -o -name '*.log' \) -delete
          rm -f "$OUT_ZIP"
          (cd .p21candidate && zip -qr "../$OUT_ZIP" kairos_p76)
          unzip -t "$OUT_ZIP" >/dev/null
          test "$(zipinfo -1 "$OUT_ZIP" | head -n1)" = 'kairos_p76/'
          test "$(zipinfo -1 "$OUT_ZIP" | grep -Ev '^kairos_p76/' | wc -l)" -eq 0
          git add -f "$OUT_ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add P21.20 live market summary browser state session binding candidate'
          git push
